      <span class="est ${cls}">${f.id && f.id!=='nuevo' && usados[f.id]>1 ? 'Sale ' + usados[f.id] + ' veces: se suman' : txt}</span></div>`; }).join('');
  $('#capa').innerHTML = `<div class="fondo${primera?'':' quieto'}" onclick="if(event.target===this)cerrarImportar()"><div class="dlg ancho" role="dialog" aria-modal="true" aria-labelledby="iTit">
    <div class="dlg-cab"><h2 id="iTit">Revisa antes de apuntar</h2><button class="cerrar" onclick="cerrarImportar()" aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <p class="muted" style="margin:0;font-size:14px">${esc(IMP.archivo)}</p>
      <div class="imp-ajustes">
        <label>Semana<input type="date" value="${IMP.lunes}" onchange="if(this.value){IMP.lunes=lunesDe(this.value);pintarImport()}"><span class="semtxt">Semana ${numSemana(IMP.lunes)} · ${fCorto(IMP.lunes)} – ${fCorto(sumaDias(IMP.lunes,6))} ${anioSemana(IMP.lunes)}${anioSemana(IMP.lunes)!==S.anio?` (cuenta en ${anioSemana(IMP.lunes)})`:''}</span></label>
        ${IMP.hojas.length>1 ? `<label>Hoja<select onchange="IMP.hoja=Number(this.value);IMP.filas=null;analizarHoja();pintarImport()">${IMP.hojas.map((h,i)=>`<option value="${i}" ${i===IMP.hoja?'selected':''}>${esc(h.nombre)}</option>`).join('')}</select></label>` : ''}
        <label>Nombres en la columna<select onchange="IMP.filas=null;analizarHoja(Number(this.value));pintarImport()">${Array.from({length:n},(_,c)=>`<option value="${c}" ${c===IMP.colNombre?'selected':''}>${esc(tit(c))}</option>`).join('')}</select></label>
        <div style="grid-column:1/-1"><label style="margin-bottom:6px">Horas de la semana${IMP.colsHoras.length>1?' (se suman las columnas marcadas)':''}</label>
          <div class="cols">${Array.from({length:n},(_,c)=>c).filter(c=>c!==IMP.colNombre && IMP.datos.some(i=>filas[i][c]!=='' && filas[i][c]!=null)).map(c=>`<label class="${IMP.colsHoras.includes(c)?'on':''}"><input type="checkbox" ${IMP.colsHoras.includes(c)?'checked':''} onchange="marcarColHoras(${c}, this.checked)">${esc(tit(c))}</label>`).join('')}</div></div>
      </div>
      <div class="imp-res"><span>${IMP.filas.length} filas</span>${ok?`<span class="est ok">${ok} emparejadas</span>`:''}${duda?`<span class="est duda">${duda} por revisar</span>`:''}${nuevos?`<span class="est nuevo">${nuevos} nuevas</span>`:''}${no?`<span class="est no">${no} sin apuntar</span>`:''}</div>
      ${!IMP.colsHoras.length ? '<p class="aviso" style="margin:0">Marca en qué columna están las horas</p>' : ''}
      ${yaTenian.size ? `<p class="muted" style="margin:0;font-size:14px">Esta semana ya tenía horas apuntadas para ${yaTenian.size} trabajador${yaTenian.size===1?'':'es'}: se sustituyen por las del archivo.</p>` : ''}
      <div class="imp-filas"><div class="imp-fila tit"><span>En el archivo</span><span style="text-align:right">Horas</span><span>Trabajador</span><span></span></div>${filasHTML}</div>
    </div>
    <div class="dlg-pie"><button class="btn" onclick="abrirImportar()">Otro archivo</button><button class="btn primario" ${apuntar.length?'':'disabled'} onclick="guardarImport()">Apuntar horas${apuntar.length?` (${new Set(apuntar.map((f,i)=>f.id==='nuevo'?'n'+i:f.id)).size})`:''}</button></div></div></div>`;
  document.querySelectorAll('#capa .imp-fila select').forEach((s,i)=>{ s.value = IMP.filas[i].id; });
  const d = document.querySelector('#capa .dlg'); if(d && !primera) d.scrollTop = sc;
}
function marcarColHoras(c, si){
  IMP.colsHoras = si ? [...new Set([...IMP.colsHoras, c])].sort((a,b)=>a-b) : IMP.colsHoras.filter(x=>x!==c);
  construirFilas(); pintarImport();
}
function guardarImport(){
  const filas = IMP.filas.filter(f=>f.id && f.horas!=null); if(!filas.length) return;
  const suma = {};
  filas.forEach(f=>{
    let id = f.id;
    if(id==='nuevo'){ const t = nuevoTrabajador({ id:uid(), nombre:f.nombre }); S.trabajadores.push(t); id = t.id; }
    else if(f.como==='posible' || f.como==='manual') S.alias[normNombre(f.nombre)] = id;   // la próxima vez se empareja solo
    suma[id] = (suma[id]||0) + f.horas;
  });
  Object.entries(suma).forEach(([id,h])=>{ const t = S.trabajadores.find(x=>x.id===id); if(t){ t.horas = t.horas || {}; t.horas[IMP.lunes] = r2(h); } });
  const n = Object.keys(suma).length, total = Object.values(suma).reduce((a,b)=>a+b,0), l = IMP.lunes;
  if(anioSemana(l)!==S.anio) S.anio = anioSemana(l);
  guardar(); cerrarImportar(); pintar();
  toast(`Semana ${numSemana(l)}: ${nh(total)} h apuntadas a ${n} trabajador${n===1?'':'es'}`);
}

/* ---------- año de cálculo ---------- */
function cambiarAnio(d){ S.anio += d; guardar(); pintar(); }
/* =========================================================
   Actualizaciones: aviso que bloquea y recorrido de novedades
   ========================================================= */
const masNueva = (a,b) => { const x=a.split('.').map(Number), y=b.split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0); } return false; };
let avisando = false;
async function comprobarVersion(){
  if(avisando || !/^https?:$/.test(location.protocol)) return;
  try { const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return; const v = await r.json();
    if(v && v.version && masNueva(v.version, APP_VERSION)) avisoActualizacion(v);
  } catch(e){ /* sin conexión: se vuelve a intentar */ }
}
function avisoActualizacion(v){
  avisando = true; cerrarFicha();
  const d = document.createElement('div'); d.className='bloqueo'; d.id='bloqueo';
  d.innerHTML = `<div class="caja" role="alertdialog" aria-modal="true" aria-labelledby="bTit"><div class="caja-cab"><small>Versión ${esc(v.version)}</small><h2 id="bTit">Hay una versión nueva</h2></div>
    <div class="caja-cuerpo"><p>Actualiza para seguir usando la app. Tus datos se quedan como están.</p>${(v.novedades||[]).length?`<ul>${v.novedades.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}</div>
    <div class="caja-pie"><span class="muted" style="font-size:13px">Tienes la ${APP_VERSION}</span><button class="btn primario" id="actBtn">Actualizar ahora</button></div></div>`;
  document.body.appendChild(d);
  const b = d.querySelector('#actBtn'); b.focus();
  b.onclick = () => { b.disabled = true; b.textContent = 'Actualizando…'; guardar(); location.replace(location.pathname + '?v=' + encodeURIComponent(v.version) + '&t=' + Date.now()); };
}
function recorrido(){
  const pasos = Object.keys(NOVEDADES).filter(v=>masNueva(v, S.versionVista||'0')).sort((a,b)=>masNueva(a,b)?1:-1).flatMap(v=>NOVEDADES[v].map(p=>({...p, v})));
  if(!pasos.length) return;
  let i = 0; const d = document.createElement('div'); d.className='bloqueo'; document.body.appendChild(d);
  const pinta = () => { const p = pasos[i], ult = i===pasos.length-1;
    d.innerHTML = `<div class="caja" role="dialog" aria-modal="true" aria-labelledby="rTit"><div class="caja-cab"><small>Novedades ${esc(p.v)} · ${esc(p.donde)}</small><h2 id="rTit">${esc(p.titulo)}</h2></div>
      <div class="caja-cuerpo"><p>${esc(p.texto)}</p></div>
      <div class="caja-pie"><span class="puntos">${pasos.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span><button class="btn primario" id="rSig">${ult?'Entendido':'Siguiente'}</button></div></div>`;
    const b = d.querySelector('#rSig'); b.focus();
    b.onclick = () => { if(ult){ S.versionVista = APP_VERSION; guardar(); d.remove(); } else { i++; pinta(); } }; };
  pinta();
}

/* ---------- arranque ---------- */
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#bloqueo') && $('#capa').innerHTML){ UI.edit=null; $('#capa').innerHTML=''; } });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
pintar(true);
if(masNueva(APP_VERSION, S.versionVista||'0')) recorrido();
comprobarVersion(); setInterval(comprobarVersion, 60*1000);
if(/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname);
</script>
</body>
