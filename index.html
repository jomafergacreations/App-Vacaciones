<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Planning</title>
<meta name="theme-color" content="#22262E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Control Planning">
<meta name="application-name" content="Control Planning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Control Planning — señalética de aeropuerto
   ========================================================= */
:root{
  --asfalto:#22262E; --hormigon:#ECEEF1; --papel:#FFFFFF; --senal:#F6C300; --senal-suave:#FFF4CC;
  --pista:#1F5FBF; --gris:#5F6775; --linea:#D9DDE3; --ok:#23864F; --mal:#C23B30;
  --c-completo:#1F5FBF; --c-parcial:#7A4FB5; --c-disc:#C46A12;
  --ctx:var(--pista);
  --cond:'Barlow Condensed',system-ui,sans-serif; --texto:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--hormigon);color:var(--asfalto);font-family:var(--texto);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
.muted{color:var(--gris)}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}

/* cabecera */
header{position:sticky;top:0;z-index:20;background:var(--asfalto);color:#fff}
.cab{display:flex;align-items:center;gap:14px;padding:10px clamp(14px,2vw,32px)}
.ver{margin-left:auto;border:1px solid #4A515E;background:#2E333D;color:#C9CED6;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s}
.ver:hover{border-color:var(--senal);color:#fff}
.ver b{color:var(--senal);font-family:var(--cond);font-size:15px;margin-left:3px}
.marca{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;cursor:pointer;padding:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--senal);display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:22px;height:22px}
.marca h1{font-size:24px;letter-spacing:.01em;white-space:nowrap}
.anio{display:flex;align-items:center;gap:4px;background:var(--asfalto);border-radius:10px;padding:4px}
.anio b{color:var(--senal);font-family:var(--cond);font-size:22px;min-width:52px;text-align:center}
.anio button{border:0;background:#3A404C;color:#fff;width:30px;height:32px;border-radius:7px;cursor:pointer}

main{padding:26px clamp(14px,2vw,32px) 60px}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--linea);background:var(--papel);border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{border-color:var(--asfalto)}
.btn:active{transform:scale(.97)}
.btn.primario{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.primario:hover{background:#000}
.btn.peligro{color:var(--mal);border-color:#E9B8B3}
.btn.peligro:hover{background:#FBE7E5;border-color:var(--mal)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--gris)}
input,select,textarea{border:1px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;font-size:15.5px;color:var(--asfalto);font-weight:500;width:100%}
textarea{font:inherit;min-height:140px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--asfalto);box-shadow:0 0 0 3px rgba(246,195,0,.45)}
.fila{display:flex;flex-wrap:wrap;gap:12px}
.fila>label{flex:1 1 180px}

/* portadas */
.portada{margin-bottom:22px}
.portada h2{font-size:52px;letter-spacing:-.005em}
.portada p{margin:8px 0 0;color:var(--gris);max-width:60ch}
.volver{border:0;background:none;color:var(--pista);font-weight:600;cursor:pointer;padding:0;margin-bottom:8px;font-size:15px}
   
/* globos del menú */
.globos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.globo{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:26px;padding:26px;min-height:250px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.globo:hover{transform:translateY(-4px);box-shadow:0 18px 36px -22px rgba(34,38,46,.55);border-color:color-mix(in srgb,var(--ctx) 40%,var(--linea))}
.globo .gi{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ctx) 12%,#fff);color:var(--ctx);transition:background .2s,color .2s}
.globo .gi svg{width:34px;height:34px}
.globo:hover .gi{background:var(--ctx);color:#fff}
.globo .gt{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.globo .gp{color:var(--gris);font-size:15px;max-width:36ch}
.globo .gd{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.globo .gd span{background:#F1F3F6;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}

/* Personal */
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.resumen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cifra{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.cifra b{display:block;font-family:var(--cond);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.cifra span{font-size:13.5px;color:var(--gris);font-weight:600}
.cifra::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc,var(--asfalto))}
.barra-herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.barra-herr .buscar{flex:1 1 240px;max-width:360px}
.seg{display:inline-flex;background:#DDE1E8;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 13px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--gris);white-space:nowrap}
.seg button.on{background:var(--papel);color:var(--asfalto);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.barra-herr .esp{flex:1}

table.plantilla{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.plantilla th{font-family:var(--cond);font-size:15px;font-weight:700;text-align:left;color:var(--gris);padding:10px 12px;border-bottom:2px solid var(--asfalto);white-space:nowrap}
.plantilla td{padding:12px;border-bottom:1px solid var(--linea);vertical-align:middle}
.plantilla .num{text-align:right;white-space:nowrap}
.plantilla tbody tr{cursor:pointer;transition:background .12s}
.plantilla tbody tr:hover{background:color-mix(in srgb,var(--ctx) 6%,#fff)}
.plantilla .nombre{font-weight:700;font-size:16px}
.plantilla .sub{font-size:13px;color:var(--gris)}
.plantilla .anual{font-family:var(--cond);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.completo{background:#E4ECF9;color:var(--c-completo)}
.chip.parcial{background:#EEE6F7;color:var(--c-parcial)}
.chip.discontinuo{background:#FBEBDC;color:var(--c-disc)}
.chip.reducida{background:var(--senal-suave);color:#7A5600}
.neg{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:700;color:#fff;letter-spacing:.01em;vertical-align:1px}
.neg.gh{background:#1F5FBF} .neg.rb{background:#E8650F}
.negocios{display:inline-flex;gap:8px;flex-wrap:wrap}
.imp-ajustes .negocios{flex-wrap:nowrap}
.negocios button{border:2px solid var(--nc);background:#fff;color:var(--nc);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;transition:background .15s,color .15s}
.negocios button.on{background:var(--nc);color:#fff}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--asfalto);font-size:14.5px;cursor:pointer}
.check input{width:18px;height:18px;margin:0}
.tm .l0{margin-top:6px;font-size:13px;color:var(--gris);font-weight:600}
.filtros2{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:-4px 0 14px}
.flab{font-family:var(--cond);font-weight:700;color:var(--gris);font-size:15px}
.flab+.seg{margin-right:10px}
.segj td.plan{color:#7A818D;font-style:italic;background:#F7F8FA}
.segj td.plan small{font-size:12px}
.leyj i.plan{background:#F7F8FA;border:1px solid #C9CED6}
.enlace{border:0;background:none;color:var(--pista);font-weight:700;cursor:pointer;padding:0 0 0 6px;font:inherit;text-decoration:underline}
.rot-cods{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.rot-cods span{border-radius:999px;padding:3px 10px;background:#F1F3F6;font-weight:600}
.rot-cods span.t{background:#DDF1E4;color:var(--ok)}
/* vacaciones */
.vbarra{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:0 0 12px}
.vmes b{min-width:150px}
.anio button:disabled{opacity:.35;cursor:default}
.vgrid-scroll{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--linea);border-radius:12px}
table.vgrid{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.vgrid.z-mes{width:100%}
.vgrid th,.vgrid td{border-bottom:1px solid #E6E9EE;border-right:1px solid #EEF0F3;text-align:center;padding:0}
.vgrid thead th{position:sticky;background:#F7F8FA;z-index:2;color:var(--asfalto)}
.vgrid thead tr:first-child th{top:0;height:30px;font-family:var(--cond);font-size:16px}
.vgrid thead tr:nth-child(2) th{top:30px;height:36px;font-weight:700}
.vgrid th.dia small{display:block;font-size:10px;color:var(--gris);font-weight:600;line-height:1}
.vgrid th.esq{left:0;z-index:4;min-width:230px;text-align:left;padding-left:12px;font-family:var(--cond);font-size:16px}
.vgrid tbody th,.vgrid tfoot th{position:sticky;left:0;background:var(--papel);z-index:1;text-align:left;padding:4px 12px;min-width:230px;max-width:230px;cursor:pointer;border-right:1px solid #D5D9E0}
.vgrid tbody th:hover .vn{color:var(--pista)}
.vn{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.vs{font-size:11.5px;color:var(--gris);font-weight:600}
.vgrid.z-mes td,.vgrid.z-mes th.dia{min-width:34px;height:38px;font-weight:700}
.vgrid.z-tri td,.vgrid.z-tri th.dia{min-width:22px;width:22px;height:32px;font-size:10.5px;font-weight:700}
.vgrid.z-tri th.dia{font-size:11px}
.vgrid.z-anio td,.vgrid.z-anio th.dia{min-width:8px;width:8px;height:26px}
.vgrid.z-anio th.dia{height:8px}
.vgrid tr.grp th{background:var(--asfalto);color:#fff;font-family:var(--cond);font-size:15px;padding:5px 12px;cursor:default}
.vgrid tr.grp td{background:#3A404C}
.vgrid tfoot th{font-family:var(--cond);font-size:15px;cursor:default;background:#F7F8FA}
.vgrid tfoot td{background:#F7F8FA;font-weight:700;font-size:12px;height:28px}
.vgrid td.cnt.cero{color:#C3C8D0}
.vgrid th.dia.fin{background:#E6E9EE}
.vgrid .m1{border-left:2px solid #B9BFC8}
.vgrid th.hoy{box-shadow:inset 0 -4px 0 var(--senal)}
.c-t{background:#fff}
.vgrid td.fin.c-t,.vd.fin.c-t{background:#F1F3F6}
.c-r{background:#E3E6EB;color:#5B6270}
.c-h{background:#23864F;color:#fff;font-weight:700}
.c-f{background:#DCE8FB;color:#1F5FBF;font-weight:700}
.c-x{background:#EADFF7;color:#6B3FA0;font-weight:700}
.c-aj{background:#FFF1C7;color:#7A5000;font-weight:700}
.c-p{background:#FBE1EC;color:#A3285E;font-weight:700}
.c-ina{background:repeating-linear-gradient(135deg,#F6D8B8 0 4px,#FCEEDF 4px 8px);color:#9A4F0A}
.c-b{background:#FBE1DE;color:var(--mal);font-weight:700}
.c-nd{background:#FAFAFB}
.c-otro{background:#F1F3F6;font-weight:700}
.leyv{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;font-weight:600;color:var(--gris)}
.leyv span{display:inline-flex;align-items:center}
.leyv i{display:inline-grid;place-items:center;min-width:24px;height:20px;border-radius:5px;margin-right:6px;font-style:normal;font-size:10.5px;border:1px solid #D5D9E0}
.vsel{display:flex;gap:10px;align-items:center}
.vnombre{font-size:26px;margin:0 4px}
.vfiltros{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:-2px 0 16px;padding:12px;background:#F4F5F8;border-radius:14px}
.vfiltros .buscar{flex:0 1 340px;background:#fff}
.vfiltros .flab{margin-left:8px}
.combo{position:relative;flex:0 1 380px;min-width:260px}
.combo input{width:100%;padding:11px 46px 11px 14px;font-weight:700;background:#fff}
.combo-n{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;pointer-events:none}
.combo-lista{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--papel);border:1px solid var(--linea);border-radius:12px;box-shadow:0 20px 40px -16px rgba(0,0,0,.35);max-height:360px;overflow:auto;padding:6px}
.combo-lista button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;flex-wrap:wrap}
.combo-lista button b{flex:1 1 auto;font-size:14.5px}
.combo-lista button .chip{padding:1px 8px;font-size:11.5px}
.combo-lista button.on{background:var(--senal-suave)}
.combo-lista button.sel b{color:var(--pista)}
.vsel .btn{padding:10px 14px}
.vquien{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--gris);font-weight:600;font-size:14px}
.vdatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.vdato{border:1px solid var(--linea);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.vdato small{color:var(--gris);font-weight:700;font-size:12.5px}
.vdato b{font-family:var(--cond);font-size:26px;line-height:1.1}
.vdato span{font-size:12.5px;color:var(--gris)}
.vdato.ok-v{border-color:#9ED3B0;background:#F1FAF4}
.vdato.aviso-v{border-color:#EBD27A;background:var(--senal-suave)}
.vtramos{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.vtramos>div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vtramos b{font-family:var(--cond);font-size:17px;margin-right:6px}
.tramo{border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:700}
.tramo em{font-style:normal;opacity:.85;font-weight:600;margin-left:4px}
.vmeses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
/* por trabajador: a la izquierda filtros y cuentas, a la derecha los 12 meses en 3 filas de 4 */
.vtrab{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);gap:24px;align-items:start}
.vlado{display:flex;flex-direction:column;gap:14px;min-width:0}
.vlado .vfiltros{flex-direction:column;align-items:stretch;margin:0;gap:6px}
.vlado .vfiltros .seg{width:100%;flex-wrap:wrap}
.vlado .vfiltros .seg button{flex:1 1 auto}
.vlado .vfiltros .seg.s-vacCon{display:grid;grid-template-columns:1fr 1fr}
.vlado .vfiltros .flab{margin:6px 0 0}
.vlado .combo{flex:none;min-width:0}
.vlado .vcab{flex-direction:column;align-items:stretch;margin:0;gap:8px}
.vlado .vsel{justify-content:space-between}
.vlado .vnombre{flex:1;font-size:22px;text-align:center}
.vlado .vquien{justify-content:center}
.vlado .vdatos{grid-template-columns:1fr 1fr;margin:0;gap:8px}
.vlado .vdato{padding:8px 10px}
.vlado .vdato b{font-size:22px}
.vlado .vtramos{margin:0}
.vlado .vtramos>div{flex-direction:column;align-items:flex-start}
.vder{min-width:0}
.vder .vmeses{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.vder .vd{min-height:clamp(30px,2.3vw,42px)}
@media (max-width:1500px){ .vder .vmeses{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1100px){ .vtrab{grid-template-columns:1fr} .vder .vmeses{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))} }
.vmesc{border:1px solid var(--linea);border-radius:12px;padding:10px 10px 12px}
.vmes-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.vmes-cab b{font-family:var(--cond);font-size:19px}
.vmes-cab span{border-radius:999px;padding:1px 9px;font-size:12px}
.vcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.vcal .ds{font-size:11px;text-align:center;color:var(--gris);font-weight:700}
.vd{position:relative;min-height:40px;border-radius:6px;display:grid;justify-items:center;align-content:end;padding-bottom:4px;font-size:12.5px;font-weight:700;border:1px solid #EEF0F3}
.vd i{position:absolute;top:2px;left:4px;font-style:normal;font-size:10px;font-weight:600;opacity:.75}
.vd.hoy{outline:2px solid var(--senal);outline-offset:-1px}
.chip.singar{background:#F1F3F6;color:var(--gris)}
.banda-j{border:2px dashed var(--linea);border-radius:12px;padding:12px 14px;background:#FAFBFC}
.banda-j b{font-family:var(--cond);font-size:28px}
.banda-j small{display:block;color:var(--gris);font-size:13.5px;font-weight:600;margin-top:2px}
.chip.concretada{background:#DDF1EE;color:#0E6F66}
.seg.turnos{flex-wrap:wrap;max-width:100%;overflow:visible}
.seg.turnos button{padding:9px 16px}
.jcampo.fijo{background:#F4F5F8;border-style:dashed}
.jcampo .valor{font-family:var(--cond);font-size:30px;font-weight:700}
.bloque .seg button{padding:9px 22px;font-size:15px}
.aviso{display:inline-block;background:#FBE7E5;color:var(--mal);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700}
.vacio{text-align:center;padding:50px 20px}
.vacio h3{font-size:28px;margin-bottom:8px}
.vacio p{color:var(--gris);margin:0 auto 18px;max-width:46ch}
.tarjetas-movil{display:none}

/* diálogos */
.fondo{position:fixed;inset:0;background:rgba(22,25,31,.55);z-index:50;display:grid;place-items:center;padding:16px;animation:aparecer .15s ease-out}
.dlg{background:var(--papel);border-radius:18px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:subir .22s cubic-bezier(.2,.7,.2,1)}
.dlg-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--papel);z-index:1}
.dlg-cab h2{font-size:28px}
.dlg-cuerpo{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.dlg-pie{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--linea);position:sticky;bottom:0;background:var(--papel)}
.dlg-pie .izq{margin-right:auto}
.cerrar{border:0;background:#F1F3F6;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:20px;line-height:1}
.bloque h3{font-size:20px;margin-bottom:10px}
.contratos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.contratos button{border:2px solid var(--linea);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}

.jcampo{border:2px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;transition:border-color .15s}
.jcampo.on{border-color:var(--asfalto);background:var(--senal-suave)}
.jcampo small{display:block;font-size:12.5px;font-weight:700;color:var(--gris);margin-bottom:4px}

.calculo .f{color:#C9CED6;font-size:14px;flex:1 1 100%}
.periodos{display:flex;flex-direction:column;gap:8px}
.periodo{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.periodo label{flex:1 1 150px}
.periodo .dias{font-weight:700;padding-bottom:11px;min-width:90px}
.quitar{border:0;background:#F1F3F6;border-radius:8px;width:40px;height:42px;cursor:pointer;font-size:18px}
/* horas hechas */
.prog{height:6px;background:#E3E6EB;border-radius:3px;overflow:hidden;margin-top:5px;min-width:90px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.prog.pasa i{background:var(--mal)}
.plantilla .hecha{font-family:var(--cond);font-size:20px;font-weight:700}
.de-mas{color:var(--mal);font-weight:700}
.semanas{display:flex;flex-direction:column;gap:6px}
.semana{display:grid;grid-template-columns:1fr 130px 40px;gap:10px;align-items:center;border:1px solid var(--linea);border-radius:10px;padding:6px 6px 6px 12px}
.semana .qs{font-weight:600}
.semana .qs small{display:block;color:var(--gris);font-weight:600;font-size:12.5px}
.semana .hcampo{display:flex;align-items:center;gap:6px}
.semana input{padding:8px 10px;text-align:right;font-family:var(--cond);font-size:20px;font-weight:700}
.semana .quitar{height:38px}
.calculo .hq{display:flex;gap:18px;flex-wrap:wrap;color:#fff;font-weight:600}
.calculo .hq em{font-style:normal;font-family:var(--cond);font-size:24px;color:var(--senal);margin-left:4px}
/* importar turnos */
.dlg.ancho{width:min(1000px,100%)}
.dlg.ficha{width:min(1400px,100%);max-height:calc(100vh - 24px)}
.ficha-cuerpo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px 34px;align-items:start}
.ficha-cuerpo .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.ficha-cuerpo .calculo{position:sticky;top:96px;z-index:1}
.ficha-cuerpo .calculo::before{content:'';position:absolute;left:-10px;right:-10px;top:-24px;height:24px;background:var(--papel)}
@media (max-height:900px){ .ficha-cuerpo .calculo{position:static} .ficha-cuerpo .calculo::before{display:none} }
.calculo .det{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:4px}
.calculo .det div{background:#2E333D;border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.calculo .det small{color:#9AA1AD;font-weight:700;font-size:12px}
.calculo .det b{font-size:22px;color:#fff}
.calculo .det span{color:#C9CED6;font-size:12.5px}
@media (max-width:980px){ .ficha-cuerpo{grid-template-columns:1fr} .ficha-cuerpo .calculo{position:static} }
.fondo.quieto,.fondo.quieto .dlg{animation:none}
.banda{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--senal-suave);border:1px solid #EBD27A;border-radius:14px;padding:12px 16px;margin-bottom:16px}
.aviso-suave{margin:0;background:var(--senal-suave);border-radius:10px;padding:10px 12px;font-size:14px}
.sep-lista{display:flex;flex-direction:column;border-top:2px solid var(--asfalto)}
.sep-fila{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--linea)}
.sep-fila.tit{font-family:var(--cond);font-weight:700;color:var(--gris);font-size:15px}
.sep-fila .sub{font-size:13.5px;color:var(--gris);font-weight:600;overflow-wrap:anywhere}
.sep-fila input{padding:8px 10px;font-size:15px}
.pla-lista{display:flex;flex-direction:column;border-top:2px solid var(--asfalto)}
.pla-fila{flex-direction:row;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--linea);color:var(--asfalto);font-size:15px;cursor:pointer;flex-wrap:wrap}
.pla-fila input{width:18px;height:18px;margin:0;flex:0 0 auto}
.pla-fila .nf{font-weight:700;flex:1 1 220px}
.pla-fila.ign{opacity:.55}
.pla-dato{font-weight:600;color:var(--gris)}
/* control de jornada */
.cifra.filtra{text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.cifra.filtra:hover{transform:translateY(-2px);box-shadow:0 10px 20px -16px rgba(34,38,46,.6)}
.cifra.filtra.on{border-color:var(--cc);box-shadow:inset 0 0 0 1px var(--cc)}
.estj{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.estj.bien{background:#DDF1E4;color:var(--ok)}
.estj.falta{background:#FFF1C7;color:#8A5A00}
.estj.pasa{background:#FBE7E5;color:var(--mal)}
.estj.sin{background:#F1F3F6;color:var(--gris)}
.dif{font-family:var(--cond);font-size:20px}
.dif.mas{color:var(--mal)} .dif.menos{color:#8A5A00}
.jtab td,.jtab th{padding-left:9px;padding-right:9px}
.jtab td:first-child{min-width:190px}
.tabla-escritorio{overflow-x:auto}
.jtab .aviso{margin-top:5px}
.nota{font-size:13.5px;margin:14px 0 0;max-width:120ch}
.seg-scroll{overflow-x:auto;border:1px solid var(--linea);border-radius:12px}
table.segj{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px}
.segj th,.segj td{padding:7px 8px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap;min-width:52px}
.segj thead th{font-family:var(--cond);font-size:15px;color:var(--gris);background:#F7F8FA;position:sticky;top:0}
.segj thead th small{display:block;font-family:var(--texto);font-size:11px;font-weight:600}
.segj thead th.ult{color:var(--asfalto);box-shadow:inset 0 -3px 0 var(--senal)}
.segj tbody th{text-align:left;font-weight:700;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.segj tr>:first-child{position:sticky;left:0;background:var(--papel);z-index:1;border-right:1px solid var(--linea)}
.segj thead tr>:first-child{background:#F7F8FA;z-index:2}
.segj td.ok{background:#E3F3E8;color:#17643A;font-weight:700}
.segj td.bajo{background:#FFF1C7;color:#7A5000;font-weight:700}
.segj td.alto{background:#FBE1DE;color:#A2271E;font-weight:700}
.segj td.vacia{color:#B4BAC4}
.segj td.fut{background:repeating-linear-gradient(135deg,#fff 0 6px,#F4F5F8 6px 12px)}
.segj .tot{font-family:var(--cond);font-size:16px;font-weight:700;border-left:1px solid var(--linea)}
.leyj{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--gris);font-weight:600}
.leyj>span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin-left:8px}
.leyj i{width:14px;height:14px;border-radius:4px}

.soltar{border:2px dashed var(--linea);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;color:var(--asfalto);display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s,background .15s}
.soltar:hover,.soltar.encima{border-color:var(--asfalto);background:var(--senal-suave)}

.imp-ajustes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;background:#F4F5F8;border-radius:14px;padding:14px}

.cols{display:flex;flex-wrap:wrap;gap:6px}
.cols label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--asfalto)}
.cols label.on{border-color:var(--asfalto);background:var(--senal-suave)}
.cols input{width:auto;margin:0}
.imp-res{display:flex;flex-wrap:wrap;gap:8px}
.imp-res span{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:#F1F3F6}
.imp-filas{display:flex;flex-direction:column;border-top:2px solid var(--asfalto)}
.imp-fila{display:grid;grid-template-columns:minmax(0,1.3fr) 90px minmax(0,1.5fr) 190px;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--linea)}

.imp-fila .nf{font-weight:700;overflow-wrap:anywhere}
.imp-fila .hf{text-align:right;font-family:var(--cond);font-size:20px;font-weight:700}
.imp-fila select{padding:8px 10px;font-size:14.5px}
.imp-fila.ign{opacity:.55}
.est{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;justify-self:start}
.est.ok{background:#DDF1E4;color:var(--ok)}
.est.duda{background:var(--senal-suave);color:#7A5600}
.est.no{background:#FBE7E5;color:var(--mal)}
.est.nuevo{background:#E4ECF9;color:var(--pista)}

/* bloqueo de actualización y recorrido */
.bloqueo{position:fixed;inset:0;z-index:100;background:rgba(22,25,31,.82);display:grid;place-items:center;padding:16px}
.caja{background:var(--papel);border-radius:20px;width:min(520px,100%);overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:subir .25s cubic-bezier(.2,.7,.2,1)}
.caja-cab{background:var(--senal);padding:20px 22px}
.caja-cab small{font-family:var(--cond);font-weight:700;font-size:15px}
.caja-cab h2{font-size:32px}
.caja-cuerpo{padding:20px 22px}
.caja-cuerpo p{margin:0 0 12px}
.caja-pie{display:flex;justify-content:space-between;align-items:center;padding:0 22px 20px}
.puntos{display:flex;gap:6px}
.puntos i{width:8px;height:8px;border-radius:50%;background:var(--linea)} .puntos i.on{background:var(--asfalto)}

.aviso-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--asfalto);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:200;animation:subir .2s}

/* movimiento */
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
main.entrando .anim{animation:subir .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* móvil */
@media (max-width:760px){
  .cab{padding:8px 12px} .marca h1{font-size:21px}

  .barra-herr .btn{flex:1 1 auto}
  main{padding:18px 12px 50px}

  .resumen{grid-template-columns:repeat(2,minmax(0,1fr))} .resumen .cifra:first-child{grid-column:1/-1}
  .tabla-escritorio{display:none} .tarjetas-movil{display:flex;flex-direction:column;gap:10px}
  .tm{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;text-align:left;width:100%;cursor:pointer}
  .tm .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .tm .l2{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--gris)}
  .tm .l2 b{font-family:var(--cond);font-size:22px;color:var(--asfalto)}
  .contratos,.jornada{grid-template-columns:1fr}
  .tm .l3{margin-top:8px;font-size:13.5px;color:var(--gris);display:flex;justify-content:space-between;gap:8px}
  .tm .l3 b{color:var(--asfalto)}
  .imp-fila{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .imp-fila select{grid-column:1/-1} .imp-fila .est{grid-column:1/-1}
  .imp-fila.tit{display:none}
  .semana{grid-template-columns:1fr 110px 40px}
  .ficha-cuerpo .calculo{position:static}
  .sep-fila{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
  .vgrid th.esq,.vgrid tbody th,.vgrid tfoot th{min-width:140px;max-width:140px}
  .vsel{flex:1 1 100%} .vnombre{font-size:21px;flex:1;text-align:center}
  .combo{flex:1 1 100%;min-width:0} .vfiltros .seg{flex-wrap:wrap;overflow:visible} .vfiltros .buscar{flex:1 1 100%} .vfiltros .flab{margin-left:0;flex:1 1 100%}

  .resumen .cifra.filtra b{font-size:26px}
  .segj tbody th{max-width:130px}
  .barra-herr .buscar{max-width:none} .seg{overflow-x:auto;max-width:100%}
  .dlg{border-radius:16px}
}
@media print{header,.barra-herr,.btn{display:none}}

/* propuesta para separar un nombre que viene junto, como en los Excel: «APELLIDOS, NOMBRE» o «APELLIDOS NOMBRE» */
function separarNombre(s){
  s = String(s||'').replace(/\s+/g,' ').trim();
  if(s.includes(',')){ const [a, ...n] = s.split(','); return { ape:a.trim(), nom:n.join(',').trim() }; }
  const w = s.split(' '); if(w.length<2) return { ape:'', nom:s };
  let k = w.length - 1;
  if(w.length>=4 && NOMBRES_DOBLES.has(sinAcentos(w[k-1]).toUpperCase())) k--;
  return { ape:w.slice(0,k).join(' '), nom:w.slice(k).join(' ') };
}

/* tiempo parcial sin jornada garantizada: no tiene una jornada fija, sino una banda
   entre el pMin y el pMax % de un tiempo completo (850 h y 1.530 h al año) */
const sinGarantia = t => t.contrato==='parcial' && t.garantizada===false;
/* los fijos discontinuos van como los parciales sin garantía, pero por los meses que trabajan (normalmente 10 de 12) */
const MESES_FD = 10;
const mesesFD = t => t.meses ?? MESES_FD;

/* banda del año sin bajas */
function bandaBase(t){ const A = S.ajustes, f = t.contrato==='discontinuo' ? Math.min(12, mesesFD(t)) / 12 : 1;
  return { min: A.pMin/100*A.hAnio*f, max: A.pMax/100*A.hAnio*f }; }
function pctDe(t){
  if(t.contrato==='completo') return 100;
  if(conBanda(t)) return null;
  const v = num(t.valor); if(v==null) return null;
  const A = S.ajustes;
  return t.modo==='pct' ? v : t.modo==='semana' ? v / A.hSemana * 100 : v / A.hAnio * 100;

const semanaDe = t => { const p = pctDe(t); return p==null ? null : p/100 * S.ajustes.hSemana; };   // la de su contrato
/* Jornada reducida: la que hace de verdad, en horas a la semana o en % de la jornada de su contrato.

function pctEf(t){
  const pc = pctDe(t); if(!t.reducido) return pc;
  const v = num(t.red?.valor); if(v==null || pc==null) return null;
  return t.red.modo==='pct' ? pc * v / 100 : v / S.ajustes.hSemana * 100;
}
const semanaEf = t => { const p = pctEf(t); return p==null ? null : p/100 * S.ajustes.hSemana; };
const pctDeSuJornada = t => { const pc = pctDe(t), pe = pctEf(t); return pc && pe!=null ? pe / pc * 100 : null; };
const anualBase = t => { const p = pctEf(t); return p==null ? null : p/100 * S.ajustes.hAnio; };
/* días de actividad de un fijo discontinuo dentro del año */
/* días de una lista de periodos que caen dentro del año, sin contar dos veces los que se pisan */
/* de la versión anterior, que apuntaba la actividad: la inactividad es el resto de esos años */
function inactividadDe(act){
  const ps = (Array.isArray(act) ? act : []).filter(p=>p && p.desde && p.hasta && p.hasta>=p.desde).sort((a,b)=>a.desde<b.desde?-1:1);
  if(!ps.length) return [];
  const out = []; let d = `${ps[0].desde.slice(0,4)}-01-01`; const fin = `${ps[ps.length-1].hasta.slice(0,4)}-12-31`;
  ps.forEach(p=>{ if(p.desde > d) out.push({desde:d, hasta:sumaDias(p.desde,-1)}); if(sumaDias(p.hasta,1) > d) d = sumaDias(p.hasta,1); });
  if(d <= fin) out.push({desde:d, hasta:fin});
  return out;
}
function diasDe(periodos, y, ini=`${y}-01-01`, fin=`${y}-12-31`){
  const dias = new Set();
  (periodos||[]).forEach(p=>{ if(!p || !p.desde || !p.hasta || p.hasta<p.desde) return;
    let d = p.desde < ini ? ini : p.desde; const h = p.hasta > fin ? fin : p.hasta;
    while(d<=h){ dias.add(d); d = sumaDias(d,1); } });
  return dias;
}
/* días activos de un fijo discontinuo: todo el rango menos sus periodos de inactividad (`cese`) */
const MIN_INACTIVO = 60;   // un fijo discontinuo para al menos 60 días al año
const diasInactivo = (t, y=S.anio) => diasDe(t.cese, y).size;
function diasActivos(t, y, ini=`${y}-01-01`, fin=`${y}-12-31`){
  const c = diasDe(t.cese, y, ini, fin), out = new Set();
  for(let d=ini; d<=fin; d=sumaDias(d,1)) if(!c.has(d)) out.add(d);
  return out;
}
const diasActividad = (t, y=S.anio) => diasActivos(t, y).size;
/* días del año con los que se calcula su jornada: todo el año, o los de actividad si es fijo discontinuo */
/* con rotación, la regla de tres de las bajas va por días de trabajo: los suyos del año y los de baja que caen en ellos */
const diasJornada = (t, y=S.anio) => tieneRot(t, y) ? diasTrabajo(t, y, undefined, undefined, false).length : t.contrato==='discontinuo' ? diasActividad(t, y) : diasAnio(y);
/* días de baja que caen en esos días */
function diasBaja(t, y=S.anio){
  const b = diasDe(t.bajas, y);
  if(tieneRot(t, y)) return diasTrabajo(t, y, undefined, undefined, false).filter(d=>b.has(d)).length;
  if(t.contrato!=='discontinuo') return b.size;
  const a = diasActivos(t, y); let n = 0; b.forEach(d=>{ if(a.has(d)) n++; }); return n;
}
/* ---------- rotación anual: un código por día; vacío = día de trabajo ---------- */
const NO_TRABAJO = new Set(['R','H','F','X','AJ','PR','PNR','V','VAC','B','IT','BAJA','L','LIBRE','D','DESC','?']);
const COD_VAC = new Set(['H','V','VAC']);
const COD_NOMBRE = { '':'casillas vacías', R:'descanso', H:'vacaciones', F:'festivo', X:'festivo de empresa', AJ:'ajuste de jornada', PR:'permiso retribuido', PNR:'permiso no retribuido', V:'vacaciones', VAC:'vacaciones', B:'baja', IT:'baja', '?':'sin dato' };
const _rot = new Map();
function rotDe(t, y){ const s = t.rot?.[y]; if(!s) return null; let a = _rot.get(s); if(!a){ a = s.split(','); _rot.set(s, a); } return a; }
const tieneRot = (t, y=S.anio) => !!t.rot?.[y];
const idxDia = d => Math.round((pd(d) - pd(d.slice(0,4)+'-01-01')) / 864e5);
const codigoDia = (t, d) => { const a = rotDe(t, Number(d.slice(0,4))); return a ? (a[idxDia(d)] ?? '?') : null; };
/* días de trabajo según la rotación, sin bajas y, en los fijos discontinuos, sin la inactividad (null si no hay rotación) */
function diasTrabajo(t, y=S.anio, ini=`${y}-01-01`, fin=`${y}-12-31`, conBajas=true){
  if(!tieneRot(t, y)) return null;
  const baja = conBajas ? diasDe(t.bajas, y, ini, fin) : new Set(), act = t.contrato==='discontinuo' ? diasActivos(t, y, ini, fin) : null, out = [];
  for(let d=ini; d<=fin; d=sumaDias(d,1)){ const c = codigoDia(t, d); if(c==null || NO_TRABAJO.has(c) || baja.has(d) || (act && !act.has(d))) continue; out.push(d); }
  return out;
}
const vacEnRot = (t, y=S.anio) => { const a = rotDe(t, y); return a ? a.filter(c=>COD_VAC.has(c)).length : null; };
/* jornada anual del año elegido */
function anualDe(t, y=S.anio){
  const base = anualBase(t); if(base==null) return null;
  if(t.contrato!=='discontinuo') return base;
  return base * diasActividad(t, y) / diasAnio(y);
}
/* cómputo: la jornada anual descontando las bajas con una regla de tres
   (si en x días tiene que hacer A horas, en x − bajas tiene que hacer A × (x − bajas) / x) */
function computoDe(t, y=S.anio){
  const a = anualDe(t, y); if(a==null) return null;
  const x = diasJornada(t, y); if(!x) return 0;
  return a * (x - Math.min(x, diasBaja(t, y))) / x;
}
/* lo que tiene que hacer en el año: una cifra (min = max) o la banda de los parciales sin garantía; con bajas */
function rangoDe(t, y=S.anio){
  if(!conBanda(t)){ const c = computoDe(t, y); return c==null ? null : {min:c, max:c}; }
  const b = bandaBase(t), x = diasJornada(t, y), f = x ? (x - Math.min(x, diasBaja(t, y))) / x : 0;
  return { min: b.min*f, max: b.max*f };
}
const entre = (a, b, ud=' h') => Math.abs(a-b)<0.005 ? nh(a)+ud : `${nh(a)}–${nh(b)}${ud}`;
const bandaSemana = () => entre(S.ajustes.pMin/100*S.ajustes.hSemana, S.ajustes.pMax/100*S.ajustes.hSemana);
const bandaPct = () => entre(S.ajustes.pMin, S.ajustes.pMax, ' %');
const semanasDe = (t, y=S.anio) => Object.keys(t.horas||{}).filter(l=>anioSemana(l)===y).sort();
const hechasDe = (t, y=S.anio) => semanasDe(t, y).reduce((a,l)=>a+(num(t.horas[l])||0), 0);
const quedanDe = (t, y=S.anio) => { const c = computoDe(t, y); return c==null ? null : c - hechasDe(t, y); };
const faltaJornada = t => !conBanda(t) && ((t.contrato!=='completo' && pctDe(t)==null) || (t.reducido && pctEf(t)==null));
const faltaActividad = t => t.contrato==='discontinuo' && diasActividad(t)===0;

/* resumen de la inactividad de un fijo discontinuo, para la lista */
function ceseTxt(t){
  if(t.contrato!=='discontinuo') return '';
  const ps = (t.cese||[]).filter(p=>p.desde && p.hasta && p.hasta>=`${S.anio}-01-01` && p.desde<=`${S.anio}-12-31`);
  return !ps.length ? 'sin inactividad' : ps.length===1 ? `para ${fCorto(ps[0].desde)} – ${fCorto(ps[0].hasta)}` : `para en ${ps.length} periodos`;
}
/* hechas y quedan, en la lista */
function barra(t){
  const r = rangoDe(t), h = hechasDe(t); if(!r || faltaJornada(t) || faltaActividad(t)) return '';
  const c = r.min, p = c>0 ? Math.min(100, h/c*100) : (h>0?100:0);
  return `<div class="prog ${h>r.max+0.005?'pasa':''}" title="${nh(c>0?h/c*100:0)} % ${conBanda(t)?'del mínimo':'hecho'}"><i style="width:${p}%"></i></div>`;
}
function horasCelda(t){
  const n = semanasDe(t).length;
  if(faltaJornada(t) || faltaActividad(t)) return n ? `<span class="hecha">${nh(hechasDe(t))} h</span>` : '<span class="muted">—</span>';
  return `<span class="hecha">${nh(hechasDe(t))} h</span>${barra(t)}<div class="sub">${n ? `${n} semana${n===1?'':'s'}` : 'Sin semanas'}</div>`;
}
function quedanCelda(t, corto){
  if(conBanda(t)){ const r = rangoDe(t), h = hechasDe(t); if(!r || faltaActividad(t)) return corto ? '' : '<span class="muted">—</span>';
    if(h > r.max + 0.005) return `<span class="de-mas">${nh(h-r.max)} h de más</span>`;
    if(h >= r.min - 0.005) return corto ? `Mínimo hecho · <b>${nh(r.max-h)} h</b> al máximo` : `<span class="hecha">Mínimo hecho</span><div class="sub">${nh(r.max-h)} h hasta el máximo</div>`;
    return corto ? `Al mínimo <b>${nh(r.min-h)} h</b>` : `<span class="hecha">${nh(r.min-h)} h</span><div class="sub">al mínimo · ${nh(r.max-h)} h al máximo</div>`; }
  const q = quedanDe(t); if(q==null || faltaJornada(t) || faltaActividad(t)) return corto ? '' : '<span class="muted">—</span>';
  if(q < -0.005) return `<span class="de-mas">${nh(-q)} h de más</span>`;
  return corto ? `Quedan <b>${nh(q)} h</b>` : `<span class="hecha">${nh(q)} h</span>`;
}

/* pasar a escribir en otra unidad: se convierte el valor actual */
function cambiarModo(modo, input){
  const e = UI.edit, pct = pctDe(e);
  e.modo = modo;
  if(pct!=null) e.valor = Math.round((modo==='pct' ? pct : modo==='semana' ? pct/100*S.ajustes.hSemana : pct/100*S.ajustes.hAnio) * 100) / 100;
  pintarFicha();
  const i = $('#j_'+modo); if(i){ i.focus(); i.select(); }
}
/* al escribir, se actualizan las otras casillas y el cálculo sin repintar la que tiene el foco */
function recalcular(){
  const e = UI.edit, pct = pctDe(e), A = S.ajustes;
  const vals = {semana: semanaDe(e), pct, anio: pct==null ? null : pct/100*A.hAnio};
  const pon = (id, v) => { const i = $('#'+id); if(i && document.activeElement!==i) i.value = v==null ? '' : nh(v).replace(/\./g,''); };
  Object.keys(vals).forEach(k=>{ if(k!==e.modo) pon('j_'+k, vals[k]); });
  if(e.reducido){
    if(e.red.modo!=='semana') pon('r_semana', semanaEf(e));
    if(e.red.modo!=='pct') pon('r_pct', pctDeSuJornada(e));
    const tc = $('#r_tc'); if(tc) tc.textContent = pctEf(e)==null ? '—' : nh(pctEf(e));
  }
  const c = $('#calc'); if(c) c.innerHTML = calculoHTML(e);
  if(conBanda(e)){ const bb = bandaBase(e), t = (id, v) => { const x = $('#'+id); if(x) x.textContent = v; };
    t('bjMin', nh(bb.min)+' h'); t('bjMax', nh(bb.max)+' h'); t('bjMeses', nh(mesesFD(e))); }
}
/* caja oscura del final de la ficha: jornada con bajas, hechas y quedan */
/* detalles de su año: rotación, vacaciones, plan y estado en Control de jornada */
function detallesHTML(e){
  const y = S.anio, r = seguimientoDe(e, y, corteDe(y)), d = [];
  if(r.estado==='inc') return '';
  if(r.rot){ d.push(['Días de trabajo', `${r.vacPend?'≈ ':''}${r.diasTrab}`, `quedan ${r.diasResto} hasta el 31 dic`]);
    d.push(['Vacaciones', `${r.vacRot} de ${vacDe(e)}`, r.vacPend ? `${r.vacPend} sin colocar en la rotación` : 'en su rotación']);
    if(r.diasResto) d.push(['Plan para llegar', r.banda ? `${entre(r.hDiaMin, r.hDiaMax, '')} h/día` : `${nh(r.hDia)} h/día`, r.banda ? 'del mínimo al máximo' : `objetivo ${nh(r.objetivo)} h`]); }
  else d.push(['Vacaciones', `${vacDe(e)} días`, 'sin rotación importada']);
  if(r.semanas){ d.push(['Debería llevar', entre(r.espMin, r.espMax), `lleva ${nh(r.hechas)} h`]);
    d.push(['Previsión', `${nh(Math.round(r.prevision))} h`, ESTADO_J[r.estado].txt]); }
  return `<div class="det">${d.map(([a,b,c])=>`<div><small>${a}</small><b>${b}</b><span>${c}</span></div>`).join('')}</div>`;
}
function calculoHTML(e){
  if(conBanda(e)){ const r = rangoDe(e), h = hechasDe(e), ok = r && !faltaActividad(e);
    return `<span>Jornada anual ${S.anio}</span><b>${r?entre(r.min, r.max):'—'}</b>
      ${ok ? `<span class="hq"><span>Hechas<em>${nh(h)} h</em></span>${h>r.max+0.005?`<span>De más<em>${nh(h-r.max)} h</em></span>`:`<span>Al mínimo<em>${nh(Math.max(0,r.min-h))} h</em></span><span>Al máximo<em>${nh(r.max-h)} h</em></span>`}</span>` : ''}
      ${detallesHTML(e)}<span class="f">${esc(formulaDe(e))}</span>`; }
  const c = computoDe(e), ok = c!=null && !faltaActividad(e);
  const q = ok ? c - hechasDe(e) : null;
  return `<span>Jornada anual ${S.anio}</span><b>${c==null?'—':nh(c)+' h'}</b>
    ${ok ? `<span class="hq"><span>Hechas<em>${nh(hechasDe(e))} h</em></span><span>${q < -0.005 ? `De más<em>${nh(-q)} h</em>` : `Quedan<em>${nh(q)} h</em>`}</span></span>` : ''}
    ${ok ? detallesHTML(e) : ''}<span class="f">${esc(formulaDe(e))}</span>`;
}
/* vacaciones: días al año (por defecto según el contrato) y lo que marca su rotación */

    <div class="fila" style="align-items:flex-end"><label style="flex:0 1 200px">Días al año<input inputmode="numeric" value="${e.vac==null?'':nh(e.vac)}" placeholder="${vacDefecto(e)}" oninput="UI.edit.vac=numPos(this.value)"></label>
      <span class="muted" style="font-size:13.5px;padding-bottom:12px">Si lo dejas vacío, ${vacDefecto(e)}: 24 en tiempo completo y parcial, 20 en fijo discontinuo.</span></div>

      <button type="button" class="enlace" onclick="if(confirm('¿Quitar la rotación de ${S.anio}?')){delete UI.edit.rot['${S.anio}'];pintarFicha()}">Quitar rotación</button></p>` : ''}

/* bajas: periodos a mano que descuentan su parte de la jornada */
function bloqueBajas(e){

    <div class="periodos">${e.bajas.map((p,i)=>`<div class="periodo">

/* horas apuntadas por semana en el año elegido */
function bloqueHoras(e){
  const ls = semanasDe(e);
  return `<div class="bloque"><h3>Horas trabajadas en ${S.anio}</h3>
    ${ls.length ? `<div class="semanas">${ls.map(l=>`<div class="semana"><span class="qs">Semana ${numSemana(l)}<small>${semanaTxt(l)}</small></span>
        <span class="hcampo"><input inputmode="decimal" aria-label="Horas de la semana ${numSemana(l)}" data-l="${l}" value="${e.horas[l]==null?'':nh(e.horas[l]).replace(/\./g,'')}" oninput="UI.edit.horas['${l}']=num(this.value);recalcular()"> <span class="ud muted">h</span></span>
        <button type="button" class="quitar" aria-label="Quitar semana" onclick="delete UI.edit.horas['${l}'];pintarFicha()">×</button></div>`).join('')}</div>`
      : `<p class="muted" style="margin:0 0 4px;font-size:14px">Todavía no hay semanas. Se llenan solas con «Importar turnos», o añádelas aquí.</p>`}
    <div class="fila" style="margin-top:8px;align-items:flex-end"><label style="flex:0 1 230px">Añadir la semana del día<input type="date" onchange="anadirSemana(this.value)"></label></div>

function anadirSemana(v){
  if(!v) return; const l = lunesDe(v);
  if(UI.edit.horas[l]===undefined) UI.edit.horas[l] = null;
  if(anioSemana(l)!==S.anio) toast(`Esa semana cuenta en ${anioSemana(l)}`);
  pintarFicha(); setTimeout(()=>{ const i = document.querySelector(`.semana input[data-l="${l}"]`); if(i){ i.focus(); i.scrollIntoView({block:'center'}); } }, 30);

/* explicación del cálculo de la jornada anual */
function formulaDe(e){
  const A = S.ajustes, pc = pctDe(e), pe = pctEf(e);
  if(conBanda(e)){ const b = diasBaja(e), x = diasJornada(e), r = rangoDe(e), bb = bandaBase(e);
    return (e.contrato==='discontinuo' ? `Fijo discontinuo: del ${nh(A.pMin)} % al ${nh(A.pMax)} % de ${nh(A.hAnio)} h, por ${nh(mesesFD(e))} de 12 meses: ${entre(bb.min, bb.max)}`
      : `Sin jornada garantizada: del ${nh(A.pMin)} % (${nh(A.pMin/100*A.hAnio)} h) al ${nh(A.pMax)} % (${nh(A.pMax/100*A.hAnio)} h) de ${nh(A.hAnio)} h`) + (b && x ? `. Con ${b} día${b===1?'':'s'} de baja, × ${x-Math.min(b,x)} / ${x} días: ${entre(r.min, r.max)}` : '') + '.'; }
  if(pc==null) return 'Escribe su jornada en cualquiera de las tres casillas.';
  if(e.reducido && pe==null) return 'Escribe su jornada reducida.';
  const base = pe/100*A.hAnio;
  let f = e.reducido ? `Reducida: ${nh(semanaEf(e))} h a la semana (${nh(pctDeSuJornada(e))} % de su jornada de ${nh(semanaDe(e))} h) = ${nh(pe)} % de ${nh(A.hAnio)} h`
        : e.contrato==='completo' ? `Tiempo completo: ${nh(A.hSemana)} h a la semana, ${nh(A.hAnio)} h al año`
        : `${nh(pe)} % de ${nh(A.hAnio)} h`;
  if(e.contrato==='discontinuo') f += `, y ${nh(base)} h × ${diasActividad(e)} días de actividad / ${diasAnio(S.anio)} días del año`;
  const b = diasBaja(e), x = diasJornada(e);
  if(b && x) f += `. Con ${b} día${b===1?'':'s'} de baja: ${nh(anualDe(e))} h × ${x-Math.min(b,x)} / ${x} días`;
  return f + '.';
}
/* al cambiar de casilla en la jornada reducida se repinta para marcar la activa sin perder el foco */
function marcarRed(){ document.querySelectorAll('.jornada.red .jcampo').forEach(x=>x.classList.toggle('on', x.querySelector('input')?.id==='r_'+UI.edit.red.modo)); }
function cerrarFicha(){ UI.edit = null; $('#capa').innerHTML = ''; }
function guardarFicha(){
  const e = UI.edit;
  e.nom = (e.nom||'').trim().replace(/\s+/g,' '); e.ape = (e.ape||'').trim().replace(/\s+/g,' ');
  if(!e.nom){ toast('Escribe el nombre'); $('#fNombre')?.focus(); return; }
  if(!e.ape){ toast('Escribe los apellidos'); $('#fApe')?.focus(); return; }
  e.nombre = nombreCompleto(e); delete e._junto;
  const p = pctDe(e);
  if(e.contrato!=='completo' && p!=null && (p<=0 || p>100)){ toast('La jornada tiene que estar entre 0 y un tiempo completo'); return; }
  if(e.concretado && !e.horario.turno){ toast('Elige su turno, o marca «No» en horario concretado'); return; }
  if(e.reducido){
    const pe = pctEf(e);
    if(pe==null){ toast('Escribe su jornada reducida, o marca «No»'); $('#r_'+e.red.modo)?.focus(); return; }
    if(pe<=0 || pe>p+0.001){ toast('La jornada reducida tiene que ser menor que la de su contrato'); return; }
  }
  if(e.contrato==='discontinuo' && e.cese.some(x=>x.desde&&x.hasta&&x.hasta<x.desde)){ toast('Hay un periodo de inactividad que acaba antes de empezar'); return; }
  if(e.contrato==='discontinuo' && diasInactivo(e) < MIN_INACTIVO){ toast(`Un fijo discontinuo tiene que parar al menos ${MIN_INACTIVO} días en ${S.anio}: lleva ${diasInactivo(e)}`); return; }
  if(e.bajas.some(x=>x.desde&&x.hasta&&x.hasta<x.desde)){ toast('Hay una baja que acaba antes de empezar'); return; }
  if(e.contrato==='discontinuo' && e.meses!=null && (e.meses<=0 || e.meses>12)){ toast('Los meses que trabaja tienen que estar entre 1 y 12'); return; }
  if(e.vac!=null && e.vac>60){ toast('Revisa los días de vacaciones: son más de 60'); return; }
  if(Object.values(e.horas).some(v=>v!=null && v<0)){ toast('Las horas de una semana no pueden ser negativas'); return; }
  e.actividad = []; e.cese = e.contrato==='discontinuo' ? e.cese.filter(x=>x.desde && x.hasta).sort((a,b)=>a.desde<b.desde?-1:1) : [];
  e.depto = (e.depto||'').trim().replace(/\s+/g,' '); e.grupo = (e.grupo||'').trim().replace(/\s+/g,' ');
  e.bajas = e.bajas.filter(x=>x.desde && x.hasta);
  e.horas = Object.fromEntries(Object.entries(e.horas).filter(([,v])=>v!=null).map(([k,v])=>[k, r2(v)]));
  if(e.contrato==='completo'){ e.valor = null; e.modo = 'semana'; }
  if(e.contrato!=='parcial') e.garantizada = true;
  if(conBanda(e)){ e.valor = null; e.reducido = false; }
  if(e.contrato!=='discontinuo') e.meses = null; else if(e.meses===MESES_FD) e.meses = null;
  if(!e.concretado) e.horario = {turno:'', desde:'', hasta:'', nota:''};
  else { e.horario.nota = e.horario.turno==='propia' ? (e.horario.nota||'').trim() : ''; }
  delete e.conc;
  if(!e.reducido) e.red = {modo:'semana', valor:null};
  else if(e.red.modo==='pct') e.red.valor = Math.round(pctDeSuJornada(e)*100)/100; else e.red.valor = Math.round(semanaEf(e)*100)/100;
  if(e.id){ const i = S.trabajadores.findIndex(x=>x.id===e.id); S.trabajadores[i] = e; toast('Cambios guardados'); }
  else { e.id = uid(); S.trabajadores.push(e); toast('Trabajador añadido'); }
  guardar(); cerrarFicha(); pintar();
}
function borrarTrabajador(id){
  const t = S.trabajadores.find(x=>x.id===id); if(!t) return;
  if(!confirm(`¿Borrar a ${t.nombre}? No se puede deshacer.`)) return;

function prepararPlantilla(hojas, archivo, pegado){

  const nombresEn = (h, c) => h.filas.filter(f=>esNombre(f[c])).length;

    if(cc<0 && vs.filter(v=>contratoDe(v)).length >= vs.length*0.7) cc = k;
    else if(ch<0 && vs.every(v=>{ const x = num(v); return x!=null && x>0 && x<=S.ajustes.hSemana; })) ch = k; }
  const vistos = new Set();

  PLA = { archivo, cc, ch, fuera, negocio:'', depto: /pasaje/i.test(archivo) ? 'Pasaje' : '', tambien:false, filas: filas.map(f=>{
    const nombre = String(f[c]).replace(/\s+/g,' ').trim(), k = normNombre(nombre);

    const ficticio = /\bFICTICI[OA]\b|\bEVENTUAL\b.*\d|^PAX\b/i.test(sinAcentos(nombre));

  }) };

/* =========================================================
   Control de jornada
   Cómo va cada trabajador con su jornada anual: lo que lleva,
   lo que debería llevar a la fecha de los últimos turnos, la
   previsión a fin de año y si llega, no llega o se pasa.
   Lo que «debería llevar» es su cómputo repartido por igual
   entre sus días de jornada (todo el año, o los de actividad),
   sin contar los días de baja.
   ========================================================= */
const MARGEN = 0.02;   // ±2 % sobre lo que debería llevar: dentro, «va a llegar»
const ESTADO_J = {
  pasado: {txt:'Se ha pasado', cls:'pasa'}, pasa: {txt:'Se va a pasar', cls:'pasa'},
  bien: {txt:'Va a llegar', cls:'bien'}, dentro: {txt:'Dentro de su banda', cls:'bien'}, falta: {txt:'No va a llegar', cls:'falta'},
  sin: {txt:'Sin horas', cls:'sin'}, inc: {txt:'Falta la jornada', cls:'sin'},
};
const FILTRO_J = { todos:'Todos', pasa:'Se pasan', bien:'Llegan', falta:'No llegan', sin:'Sin horas' };
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
/* el seguimiento va por semanas: su año empieza el lunes de la semana 1 y acaba el domingo de la última */
const iniSeg = y => lunesDe(`${y}-01-04`), finSeg = y => sumaDias(lunesDe(`${y+1}-01-04`), -1);
/* días de jornada de ese año sin bajas: con rotación, sus días de trabajo; si no, todos (o los de actividad si es fijo discontinuo) */
function diasEf(t, y){
  const a = iniSeg(y), b = finSeg(y);
  if(tieneRot(t, y)) return diasTrabajo(t, y, a, b);
  const baja = diasDe(t.bajas, y, a, b), out = [];
  if(t.contrato==='discontinuo') diasActivos(t, y, a, b).forEach(d=>{ if(!baja.has(d)) out.push(d); });
  else for(let d=a; d<=b; d=sumaDias(d,1)) if(!baja.has(d)) out.push(d);
  return out.sort();
}
/* hasta dónde hay turnos importados en el año: el domingo de la última semana con horas */
function corteDe(y=S.anio){
  const ls = S.trabajadores.flatMap(t=>semanasDe(t, y)).sort();
  if(!ls.length) return null;
  const fin = sumaDias(ls[ls.length-1], 6);
  return { primera: ls[0], ultima: ls[ls.length-1], hasta: fin };
}
/* todo va con una banda [min, max]: con jornada fija min = max; sin garantía, del pMin al pMax % */
const MARGEN_H = 20;    // con jornada garantizada, el plan apunta a sus horas menos 20
const SEGUIDAS = 4;     // parciales sin garantía: aviso si van tantas semanas seguidas por encima de su máximo
function seguimientoDe(t, y, corte){
  const r = { t, sinG: sinGarantia(t), banda: conBanda(t), pct: pctEf(t), garant: anualBase(t), rango: rangoDe(t, y), hechas: hechasDe(t, y), semanas: semanasDe(t, y).length };
  r.computo = r.rango ? r.rango.max : null;
  if(!r.rango || faltaJornada(t)){ r.estado = 'inc'; return r; }
  const ef = diasEf(t, y); r.ef = ef;
  const hastaN = corte ? ef.filter(d=>d<=corte.hasta).length : 0, fr = ef.length ? hastaN / ef.length : 0;
  r.espMin = r.rango.min * fr; r.espMax = r.rango.max * fr; r.esperadas = r.espMin;
  r.dif = r.hechas < r.espMin ? r.hechas - r.espMin : r.hechas > r.espMax ? r.hechas - r.espMax : 0;
  r.quedan = r.rango.min - r.hechas;
  const restantes = ef.length - hastaN;
  r.necesita = restantes > 0 ? Math.max(0, r.rango.min - r.hechas) / (restantes/7) : null;
  r.necesitaMax = restantes > 0 ? Math.max(0, r.rango.max - r.hechas) / (restantes/7) : null;
  r.prevision = fr > 0 ? r.hechas / fr : (r.hechas || null);
  /* con la rotación: días de trabajo del año, los que quedan hasta el 31 de diciembre y el plan semana a semana */
  if(tieneRot(t, y)){
    const dt = diasTrabajo(t, y), hoy = hoyIso();
    const desde = corte ? sumaDias(corte.hasta, 1) : (hoy > `${y}-01-01` ? hoy : `${y}-01-01`);
    const resto = dt.filter(d=>d>=desde);
    r.rot = true; r.resto = new Set(resto); r.vacRot = vacEnRot(t, y);
    /* las vacaciones que le corresponden y no están en la rotación (los FD no las traen) se descuentan de los días que quedan */
    r.vacPend = Math.max(0, vacDe(t) - r.vacRot);
    r.diasTrab = Math.max(0, dt.length - r.vacPend); r.diasResto = Math.max(0, resto.length - r.vacPend);
    r.semResto = new Set(resto.map(lunesDe)).size;
    const n = r.diasResto, rep = resto.length;
    if(!r.banda){ r.objetivo = r.rango.max - MARGEN_H; r.pend = Math.max(0, r.objetivo - r.hechas); r.hDia = n ? r.pend / n : null; r.hRep = rep ? r.pend / rep : null; }
    else { const pmin = Math.max(0, r.rango.min - r.hechas), pmax = Math.max(0, r.rango.max - r.hechas);
      r.hDiaMin = n ? pmin / n : null; r.hDiaMax = n ? pmax / n : null; r.hRepMin = rep ? pmin / rep : null; r.hRepMax = rep ? pmax / rep : null; }
  }
  /* parciales sin garantía: semanas seguidas, hasta la última importada, por encima de lo que le toca a su máximo */
  r.seguidas = 0;
  if(r.sinG && corte){ const s = new Set(ef), n = ef.length || 1;
    for(let l=corte.ultima; l>=corte.primera; l=sumaDias(l,-7)){ const h = t.horas?.[l]; if(h===undefined) break;
      const dias = [0,1,2,3,4,5,6].filter(k=>s.has(sumaDias(l,k))).length; if(!dias || h <= dias*r.rango.max/n) break; r.seguidas++; } }
  /* semanas sin horas entre la primera y la última importadas en las que tenía jornada */
  r.faltan = 0;
  if(corte){ const s = new Set(ef); for(let l=corte.primera; l<=corte.ultima; l=sumaDias(l,7)){
    if(t.horas?.[l]===undefined && [0,1,2,3,4,5,6].some(k=>s.has(sumaDias(l,k)))) r.faltan++; } }
  if(!r.semanas) r.estado = 'sin';
  else if(r.hechas > r.rango.max + 0.005) r.estado = 'pasado';
  else if(r.espMax <= 0) r.estado = r.banda ? 'dentro' : 'bien';
  else r.estado = r.hechas > r.espMax*(1+MARGEN) ? 'pasa' : r.hechas < r.espMin*(1-MARGEN) ? 'falta' : r.banda ? 'dentro' : 'bien';
  return r;
}
const grupoJ = e => e==='pasado' || e==='pasa' ? 'pasa' : e==='inc' ? 'sin' : e==='dentro' ? 'bien' : e;
/* diferencia de la previsión con lo que tiene que hacer */
const difPrev = r => !r.banda ? conSigno(r.prevision - r.rango.max) : r.prevision < r.rango.min ? conSigno(r.prevision - r.rango.min)+' al mínimo' : r.prevision > r.rango.max ? conSigno(r.prevision - r.rango.max)+' al máximo' : 'dentro de su banda';
const difCls = r => ({pasado:'mas', pasa:'mas', falta:'menos'})[r.estado] || '';
const conSigno = n => (n > 0.005 ? '+' : n < -0.005 ? '−' : '') + nh(Math.abs(n)) + ' h';

function vJornada(){
  const y = S.anio, corte = corteDe(y);
  const cab = `<div class="portada anim"><button class="volver" onclick="ir('inicio')">‹ Inicio</button><h2>Control de jornada</h2>
    <p>Cómo va cada trabajador con su jornada de ${y}: lo que lleva, lo que debería llevar y si va a llegar.</p></div>`;
  if(!S.trabajadores.length) return cab + `<div class="tarjeta vacio anim" style="--i:1"><h3>Todavía no hay nadie</h3><p>Añade a los trabajadores en Personal y luego importa sus turnos.</p>
    <div class="fila" style="justify-content:center"><button class="btn primario" onclick="ir('personal')">Ir a Personal</button></div></div>`;
  const todos = S.trabajadores.filter(enOrg).map(t=>seguimientoDe(t, y, corte));
  const hayRot = todos.some(r=>r.rot);
  const q = UI.buscar.trim().toLowerCase(), fj = UI.filtroJ || 'todos';
  const rs = todos.filter(r=>(fj==='todos' || grupoJ(r.estado)===fj) && (!q || r.t.nombre.toLowerCase().includes(q) || String(r.t.num).includes(q)))
    .sort((a,b)=>a.t.nombre.localeCompare(b.t.nombre,'es'));
  const n = k => todos.filter(r=>grupoJ(r.estado)===k).length;
  const faltan = todos.filter(r=>r.faltan).length;
  const chip = r => `<span class="estj ${ESTADO_J[r.estado].cls}">${ESTADO_J[r.estado].txt}</span>`;
  const garant = r => r.sinG ? 'Sin garantía' : r.banda ? `${nh(mesesFD(r.t))} meses` : r.pct==null ? '—' : `${nh(r.pct)} %`;
  const tiene = r => !r.rango ? '—' : entre(r.rango.min, r.rango.max);
  const avisoS = r => r.seguidas >= SEGUIDAS ? `<span class="aviso" title="Parcial sin jornada garantizada: cuidado con darle muchas horas seguidas">${r.seguidas} semanas seguidas por encima</span>` : '';
  const diasCelda = r => !r.rot ? '<span class="muted">—</span><div class="sub">sin rotación</div>'
    : `<span class="hecha">${r.vacPend?'≈ ':''}${r.diasTrab} días</span><div class="sub">quedan ${r.diasResto} hasta el 31 dic</div><div class="sub">${r.vacPend ? `${r.vacPend} de vacaciones sin colocar` : `vacaciones ${r.vacRot} de ${vacDe(r.t)}`}</div>`;
  const planCelda = (r, corto) => {
    if(r.estado==='inc') return '—';
    if(r.rot){ if(!r.diasResto) return corto ? '' : '—<div class="sub">no le quedan días de trabajo</div>';
      if(r.banda) return corto ? `Plan <b>${entre(r.hDiaMin, r.hDiaMax, '')} h/día</b>` : `${entre(r.hDiaMin, r.hDiaMax, '')} h/día<div class="sub">del mínimo al máximo</div>`;
      return corto ? `Plan <b>${nh(r.hDia)} h/día</b>` : `${nh(r.hDia)} h/día<div class="sub">≈ ${nh(r.pend/r.semResto)} h/sem · objetivo ${nh(r.objetivo)} h</div>`; }
    if(r.necesita==null) return corto ? '' : '—';
    return corto ? `Necesita <b>${r.banda?entre(r.necesita, r.necesitaMax, ''):nh(r.necesita)} h/sem</b>`
      : r.banda ? `${entre(r.necesita, r.necesitaMax)}/sem<div class="sub">del mínimo al máximo</div>` : `${nh(r.necesita)} h/sem<div class="sub">su jornada: ${nh(semanaEf(r.t))} h</div>`;
  };
  const avisoF = r => r.faltan ? `<span class="aviso" title="Hay semanas importadas en las que no sale">Faltan ${r.faltan} semana${r.faltan===1?'':'s'}</span>` : '';
  const filas = rs.map(r=>{ const t = r.t, inc = r.estado==='inc';
    return `<tr onclick="abrirFicha('${t.id}')">
      <td><div class="nombre">${esc(t.nombre)}</div><div class="sub"><span class="chip ${t.contrato}" style="padding:1px 8px;font-size:12px">${CONTRATOS[t.contrato].corto}</span>${t.reducido?' reducida':''} ${negocioChip(t)}${t.depto?` ${esc(t.depto)}`:''}</div></td>
      <td class="num"><span class="anual">${tiene(r)}</span><div class="sub">${garant(r)}${r.banda?' · '+bandaPct():''}${diasBaja(t,y)?` · ${diasBaja(t,y)} días de baja`:''}</div></td>
      <td class="num">${diasCelda(r)}</td>
      <td class="num"><span class="hecha">${nh(r.hechas)} h</span><div class="sub">${r.semanas} semana${r.semanas===1?'':'s'}</div></td>
      <td class="num">${inc||!corte||!r.semanas?'—':`<b class="dif ${difCls(r)}">${conSigno(r.dif)}</b>`}${inc||!corte?'':`<div class="sub">debería llevar ${entre(r.espMin, r.espMax)}</div>`}</td>
      <td class="num">${inc||!r.semanas||r.prevision==null?'—':`${nh(Math.round(r.prevision))} h<div class="sub">${difPrev(r)}</div>`}</td>
      <td class="num">${planCelda(r)}</td>
      <td>${chip(r)}${avisoF(r)?'<br>'+avisoF(r):''}${avisoS(r)?'<br>'+avisoS(r):''}</td></tr>`; }).join('');
  const tarjetas = rs.map(r=>{ const t = r.t, inc = r.estado==='inc';
    return `<button class="tm" onclick="abrirFicha('${t.id}')"><div class="l1"><b>${esc(t.nombre)}</b>${chip(r)}</div>
      <div class="l2"><span>${garant(r)} · ${r.banda?'entre':'cómputo'} ${tiene(r)}</span><b>${nh(r.hechas)} h</b></div>
      ${r.rot && !inc ? `<div class="l3"><span>Días de trabajo <b>${r.diasTrab}</b> · quedan <b>${r.diasResto}</b></span><span>${planCelda(r, true)}</span></div>` : ''}
      ${inc||!corte ? '' : `<div class="l3"><span>Debería llevar <b>${entre(r.espMin, r.espMax)}</b></span><span>${r.semanas?`<b class="dif ${difCls(r)}">${conSigno(r.dif)}</b>`:''}</span></div>
      <div class="l3"><span>Previsión <b>${r.semanas&&r.prevision!=null?nh(Math.round(r.prevision))+' h':'—'}</b></span><span>${r.rot?'':planCelda(r, true)}</span></div>`}
      ${avisoF(r)||avisoS(r)?`<div style="margin-top:6px">${avisoF(r)} ${avisoS(r)}</div>`:''}</button>`; }).join('');
  const fb = k => `<button class="${fj===k?'on':''}" onclick="UI.filtroJ='${k}';pintar()">${FILTRO_J[k]}</button>`;
  const cifra = (k, txt, cc) => `<button class="cifra filtra ${fj===k?'on':''}" style="--cc:${cc}" onclick="UI.filtroJ=UI.filtroJ==='${k}'?'todos':'${k}';pintar()"><b>${n(k)}</b><span>${txt}</span></button>`;
  return cab + `<div class="resumen anim" style="--i:1">
      <div class="cifra" style="--cc:var(--asfalto)"><b>${corte ? 'Semana ' + numSemana(corte.ultima) : '—'}</b><span>${corte ? `datos hasta el ${fmt(corte.hasta)}` : `sin turnos importados en ${y}`}</span></div>
      ${cifra('bien','van a llegar','var(--ok)')}${cifra('falta','no van a llegar','#C98A00')}${cifra('pasa','se pasan o se van a pasar','var(--mal)')}${cifra('sin','sin horas'+(faltan?` · a ${faltan} les faltan semanas`:''),'#9AA1AD')}
    </div>
    <div class="tarjeta anim" style="--i:2">
      <div class="barra-herr">
        <input class="buscar" type="search" placeholder="Buscar por nombre o número" value="${esc(UI.buscar)}" aria-label="Buscar" oninput="UI.buscar=this.value;clearTimeout(window._b);window._b=setTimeout(()=>{pintar();const i=document.querySelector('.buscar');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)">
        <div class="seg" role="group" aria-label="Filtrar por estado">${Object.keys(FILTRO_J).map(fb).join('')}</div>
        <div class="anio" title="Año"><button onclick="cambiarAnio(-1)" aria-label="Año anterior">‹</button><b>${y}</b><button onclick="cambiarAnio(1)" aria-label="Año siguiente">›</button></div>
        <span class="esp"></span>
        <button class="btn" onclick="abrirRotaciones()">${ICO.calendario} Importar rotaciones</button>
        <button class="btn" onclick="abrirImportar()">${ICO.subir} Importar turnos</button>
      </div>
      ${filtrosOrg()}
      ${!corte ? `<p class="muted" style="margin:4px 0 14px">Todavía no hay turnos de ${y}. Importa el archivo de una semana para empezar el seguimiento.</p>` : ''}
      ${rs.length ? `<div class="tabla-escritorio"><table class="plantilla jtab"><thead><tr><th>Trabajador</th><th class="num">Cómputo ${y}</th><th class="num">Días de trabajo</th><th class="num">Lleva</th><th class="num">Diferencia</th><th class="num">Previsión a fin de año</th><th class="num">Plan para llegar</th><th>Estado</th></tr></thead><tbody>${filas}</tbody></table></div>
        <div class="tarjetas-movil">${tarjetas}</div>` : '<p class="muted" style="margin:10px 0">Nadie coincide con el filtro.</p>'}
      <p class="muted nota">«Debería llevar» reparte su cómputo por igual entre sus días de jornada hasta el ${corte?fmt(corte.hasta):'último turno importado'}, sin contar las bajas. Llega si va dentro de un ${nf(MARGEN*100)} % arriba o abajo. La previsión supone que sigue al mismo ritmo. Con rotación, todo se reparte por sus días de trabajo (sin vacaciones, descansos, festivos ni ajustes), las bajas descuentan días de trabajo y el plan apunta a sus horas menos ${MARGEN_H} h. Si la rotación no trae todas sus vacaciones (como en los fijos discontinuos), las que faltan se restan de los días que le quedan. Los parciales sin garantía y los fijos discontinuos van por banda, entre su mínimo y su máximo, sin margen.</p>
    </div>
    ${corte || hayRot ? seguimientoHTML(todos.filter(r=>rs.includes(r)), y, corte) : ''}`;
}

/* seguimiento por semanas o por meses: lo que hizo en cada una frente a lo que le tocaba */
function seguimientoHTML(rs, y, corte){
  const modo = UI.segJ || 'semana';
  let periodos;
  if(modo==='mes') periodos = MESES.map((m,i)=>{ const a = `${y}-${String(i+1).padStart(2,'0')}-01`, b = sumaDias(i===11 ? `${y+1}-01-01` : `${y}-${String(i+2).padStart(2,'0')}-01`, -1);
    return { cab:m, sub:'', desde:a, hasta:b, semanas: l => anioSemana(l)===y && Number(sumaDias(l,3).slice(5,7))===i+1 }; });
  else { periodos = []; for(let l=lunesDe(`${y}-01-04`); anioSemana(l)===y; l=sumaDias(l,7))
    periodos.push({ cab:`S${numSemana(l)}`, sub:fCorto(l), desde:l, hasta:sumaDias(l,6), semanas: x => x===l, l }); }
  const hasta = corte ? corte.hasta : '0000';
  const celdas = r => periodos.map(p=>{
    if(p.desde > hasta){
      if(!r.rot || r.estado==='inc') return `<td class="fut"></td>`;
      const dias = r.ef.filter(d=>d>=p.desde && d<=p.hasta && r.resto.has(d)).length;
      if(!dias) return `<td class="fut" title="Sin días de trabajo"></td>`;
      if(r.banda) return `<td class="plan" title="${esc(p.cab)}: plan entre ${nh(dias*r.hRepMin)} y ${nh(dias*r.hRepMax)} h en ${dias} días de su rotación"><small>${nh(Math.round(dias*r.hRepMin))}–${nh(Math.round(dias*r.hRepMax))}</small></td>`;
      return `<td class="plan" title="${esc(p.cab)}: plan de ${nh(dias*r.hRep)} h en ${dias} días de su rotación${r.vacPend?' (con sus vacaciones sin colocar repartidas)':''}">${nh(Math.round(dias*r.hRep*10)/10)}</td>`; }
    if(r.estado==='inc') return `<td></td>`;
    const ls = Object.keys(r.t.horas||{}).filter(p.semanas);
    const dias = r.ef.filter(d=>d>=p.desde && d<=p.hasta).length, n = r.ef.length || 1;
    const tMin = dias * r.rango.min / n, tMax = dias * r.rango.max / n;
    if(!ls.length) return `<td class="${tMax>0.005?'vacia':''}" title="${tMax>0.005?'Sin horas importadas':'Sin jornada'}">${tMax>0.005?'·':''}</td>`;
    const h = ls.reduce((a,l)=>a+(num(r.t.horas[l])||0),0);
    const cls = tMax<=0.005 ? (h>0?'alto':'ok') : h > tMax*1.1 ? 'alto' : h < tMin*0.9 ? 'bajo' : 'ok';
    return `<td class="${cls}" title="${esc(p.cab)}: ${nh(h)} h; le tocaban ${entre(tMin, tMax)}">${nh(h)}</td>`; }).join('');
  const fila = r => `<tr><th scope="row" onclick="abrirFicha('${r.t.id}')">${esc(r.t.nombre)}</th>${celdas(r)}<td class="tot">${nh(r.hechas)}</td></tr>`;
  setTimeout(()=>{ const c = document.querySelector('.seg-scroll'), f = c?.querySelector('th.ult'); if(c && f) c.scrollLeft = Math.max(0, f.offsetLeft - c.clientWidth + 160); }, 0);
  return `<div class="tarjeta anim" style="--i:3">
    <div class="barra-herr"><h3 style="font-size:24px;margin:0">Seguimiento</h3>
      <div class="seg" role="group" aria-label="Ver por"><button class="${modo==='semana'?'on':''}" onclick="UI.segJ='semana';pintar()">Por semanas</button><button class="${modo==='mes'?'on':''}" onclick="UI.segJ='mes';pintar()">Por meses</button></div>
      <span class="esp"></span>
      <span class="leyj"><span><i class="ok"></i>Lo que le toca</span><span><i class="bajo"></i>Menos</span><span><i class="alto"></i>Más</span><span><i class="vacia"></i>Sin horas</span><span><i class="plan"></i>Plan</span></span></div>
    <div class="seg-scroll"><table class="segj"><thead><tr><th>Trabajador</th>${periodos.map(p=>`<th class="${corte && p.desde<=corte.hasta && p.hasta>=corte.hasta?'ult':''}">${p.cab}${p.sub?`<small>${p.sub}</small>`:''}</th>`).join('')}<th class="tot">Total</th></tr></thead>
      <tbody>${rs.map(fila).join('')}</tbody></table></div>
    <p class="muted nota">Horas que hizo en cada ${modo==='mes'?'mes':'semana'}. El color compara con lo que le tocaba según su cómputo: verde si va dentro de un 10 % arriba o abajo. Con rotación, las semanas que faltan llevan en gris el plan para llegar.${modo==='mes'?' Cada semana cuenta en el mes de su jueves.':''}</p>
  </div>`;
}

/* =========================================================
   Vacaciones
   Dos vistas, como el Excel de la base:
   · Departamento: todos los trabajadores y los días del año de un
     vistazo (por mes, por trimestre o el año entero), con cuántos
     están de vacaciones cada día.
   · Por trabajador: se elige en un desplegable y se ve su rotación
     anual mes a mes, con sus cuentas (D.T., R, H, F, X, AJ…).
   Cada día sale de su rotación; encima van sus bajas y, en los fijos
   discontinuos, su inactividad.
   ========================================================= */
const DIA_EST = {
  T:{cls:'c-t', txt:'', nombre:'Trabaja'}, R:{cls:'c-r', txt:'R', nombre:'Descanso'}, H:{cls:'c-h', txt:'H', nombre:'Vacaciones'},
  V:{cls:'c-h', txt:'V', nombre:'Vacaciones'}, VAC:{cls:'c-h', txt:'V', nombre:'Vacaciones'},
  F:{cls:'c-f', txt:'F', nombre:'Festivo'}, X:{cls:'c-x', txt:'X', nombre:'Festivo de empresa'}, AJ:{cls:'c-aj', txt:'AJ', nombre:'Ajuste de jornada'},
  PR:{cls:'c-p', txt:'PR', nombre:'Permiso retribuido'}, PNR:{cls:'c-p', txt:'PNR', nombre:'Permiso no retribuido'},
  INA:{cls:'c-ina', txt:'', nombre:'Inactividad (fijo discontinuo)'}, B:{cls:'c-b', txt:'B', nombre:'Baja'}, '?':{cls:'c-nd', txt:'', nombre:'Sin dato'},
};
const LEYENDA_VAC = ['T','R','H','F','X','AJ','PR','INA','B'];
const DIAS_SEM = ['L','M','X','J','V','S','D'];
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
/* qué tiene un trabajador un día: inactividad y baja mandan; si no, su rotación (null si no hay) */
function diaDe(t, d){
  if(t.contrato==='discontinuo' && (t.cese||[]).some(p=>p.desde<=d && d<=p.hasta)) return 'INA';
  if((t.bajas||[]).some(p=>p.desde<=d && d<=p.hasta)) return 'B';
  const c = codigoDia(t, d); if(c==null) return null;
  return c==='' ? 'T' : c;
}
const estDia = c => DIA_EST[c] || {cls:'c-otro', txt:c.slice(0,3), nombre:c};
const diasDelAnio = y => { const out = []; for(let d=`${y}-01-01`; d<=`${y}-12-31`; d=sumaDias(d,1)) out.push(d); return out; };
const diaSem = d => (pd(d).getUTCDay()+6)%7;   // 0 = lunes
/* cuentas del año, como el pie del cuadrante del Excel */
function cuentasDe(t, y){
  const n = {}; diasDelAnio(y).forEach(d=>{ const c = diaDe(t, d); if(c) n[c] = (n[c]||0) + 1; });
  return n;
}
/* periodos seguidos de un mismo tipo de día (H, INA…) */
function tramosDe(t, y, cods){
  const out = []; let ini = null, ant = null;
  diasDelAnio(y).forEach(d=>{ const si = cods.includes(diaDe(t, d));
    if(si && !ini) ini = d; if(!si && ini){ out.push({desde:ini, hasta:ant}); ini = null; } ant = d; });
  if(ini) out.push({desde:ini, hasta:ant});
  return out;
}
/* periodos de vacaciones: se juntan los que solo separan descansos o festivos (6–14 jul con R en medio es un periodo) */
function periodosVac(t, y){
  const cods = ['H','V','VAC'], ps = tramosDe(t, y, cods), out = [];
  ps.forEach(p=>{ const u = out[out.length-1];
    if(u){ let d = sumaDias(u.hasta, 1), libre = true; while(d < p.desde){ if(!['R','F','X'].includes(diaDe(t, d))){ libre = false; break; } d = sumaDias(d, 1); }
      if(libre){ u.hasta = p.hasta; return; } }
    out.push({...p}); });
  out.forEach(p=>{ let n = 0; for(let d=p.desde; d<=p.hasta; d=sumaDias(d,1)) if(cods.includes(diaDe(t, d))) n++; p.h = n; });
  return out;
}
const tramoTxt = p => p.desde===p.hasta ? fCorto(p.desde) : `${fCorto(p.desde)} – ${fCorto(p.hasta)}`;
const diasTramo = p => Math.round((pd(p.hasta)-pd(p.desde))/864e5) + 1;
/* quién sale en el módulo: con rotación del año, o fijo discontinuo con inactividad */
const enVacaciones = (t, y) => tieneRot(t, y) || (t.contrato==='discontinuo' && diasInactivo(t, y) > 0);
const grupoTxt = t => t.grupo || 'Sin grupo';
const ordenGrupo = (a, b) => (a==='Sin grupo') - (b==='Sin grupo') || a.localeCompare(b, 'es', {numeric:true});

function vVacaciones(){
  const y = S.anio, tab = UI.vacTab || 'dep';
  /* filtros propios del módulo: nombre, contrato y producto */
  const con = UI.vacCon || 'todos', prod = UI.vacProd || 'todos';
  const todos = S.trabajadores.filter(t=>(con==='todos' || t.contrato===con) && (prod==='todos' || t.negocio===prod));
  const conRot = S.trabajadores.filter(t=>enVacaciones(t, y));
  const ws = normNombre(UI.vacQ || '').split(' ').filter(Boolean);
  const ts = tab==='dep' ? todos.filter(t=>{ const n = normNombre(t.nombre); return ws.every(w=>n.includes(w)); }) : todos;
  const sinRot = todos.filter(t=>!tieneRot(t, y)).length;
  const lista = todos.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const elegido = lista.find(x=>x.id===UI.vacTrab) || lista.find(x=>tieneRot(x, y)) || lista[0] || null;
  const segF = (campo, val, ops) => `<div class="seg s-${campo}" role="group">${ops.map(([k,txt])=>`<button class="${val===k?'on':''}" onclick="UI.${campo}='${k}';pintar()">${txt}</button>`).join('')}</div>`;
  const filtros = `<div class="vfiltros">
      ${tab==='trab' ? comboHTML(lista, elegido) : `<input class="buscar" type="search" placeholder="Buscar por nombre" value="${esc(UI.vacQ||'')}" aria-label="Buscar por nombre" oninput="UI.vacQ=this.value;clearTimeout(window._b);window._b=setTimeout(()=>{pintar();const i=document.querySelector('.vfiltros .buscar');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)">`}
      <span class="flab">Contrato</span>${segF('vacCon', con, [['todos','Todos'],['completo','Completo'],['parcial','Parcial'],['discontinuo','Discontinuo']])}
      <span class="flab">Producto</span>${segF('vacProd', prod, [['todos','Todos'], ...Object.entries(NEGOCIOS).map(([k,n])=>[k,n.nombre])])}
    </div>`;
  const cab = `<div class="portada anim"><button class="volver" onclick="ir('inicio')">‹ Inicio</button><h2>Vacaciones</h2>
    <p>La rotación de ${y} y las vacaciones de cada uno: todo el departamento de un vistazo, o una persona con su calendario del año.</p></div>`;
  const barra = `<div class="barra-herr">
      <div class="seg" role="group" aria-label="Vista"><button class="${tab==='dep'?'on':''}" onclick="UI.vacTab='dep';pintar()">Departamento</button><button class="${tab==='trab'?'on':''}" onclick="UI.vacTab='trab';pintar()">Por trabajador</button></div>
      <div class="anio" title="Año"><button onclick="cambiarAnio(-1)" aria-label="Año anterior">‹</button><b>${y}</b><button onclick="cambiarAnio(1)" aria-label="Año siguiente">›</button></div>
      <span class="esp"></span>
      <button class="btn" onclick="abrirRotaciones()">${ICO.calendario} Importar rotaciones</button>
    </div>`;
  const leyenda = `<div class="leyv">${LEYENDA_VAC.map(c=>`<span><i class="${DIA_EST[c].cls}">${DIA_EST[c].txt}</i>${DIA_EST[c].nombre}</span>`).join('')}</div>`;
  if(!conRot.length) return cab + `<div class="tarjeta anim" style="--i:1">${barra}
    <div class="vacio"><h3>Todavía no hay rotaciones de ${y}</h3><p>Importa el Excel de la rotación anual y aquí verás el calendario de todos y las vacaciones de cada uno.</p>
    <div class="fila" style="justify-content:center"><button class="btn primario" onclick="abrirRotaciones()">${ICO.calendario} Importar rotaciones</button></div></div></div>`;
  const aviso = sinRot ? `<div class="banda anim" style="--i:1"><span><b>${sinRot} de ${todos.length} trabajadores</b> no tienen rotación de ${y}: sus días salen en blanco. Importa el Excel de su rotación para ver sus vacaciones.</span><button class="btn" onclick="abrirRotaciones()">${ICO.calendario} Importar rotaciones</button></div>` : '';
  const nadie = `<p class="muted" style="margin:14px 0">Nadie coincide con la búsqueda o los filtros.</p>`;
  return cab + aviso + `<div class="tarjeta anim" style="--i:2">${barra}${tab==='dep' ? filtros + (ts.length ? vacDepartamento(ts, y) : nadie) : (elegido ? vacTrabajador(lista, elegido, y, filtros) : filtros + nadie)}${leyenda}</div>`;
}

/* ---------- buscador de trabajador: se escribe y sale la lista filtrada por nombre ---------- */
let COMBO = { lista:[], vis:[], act:0 };
function comboHTML(lista, t){
  COMBO.lista = lista; COMBO.elegido = t;
  return `<div class="combo"><input id="comboIn" type="search" autocomplete="off" placeholder="Escribe un nombre" value="${esc(t?.nombre||'')}" aria-label="Buscar trabajador" aria-autocomplete="list" aria-controls="comboLista"
      onfocus="this.select();comboFiltra('')" oninput="comboFiltra(this.value)" onkeydown="comboTecla(event)" onblur="setTimeout(comboCierra,150)">
