<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Planning</title>
<meta name="theme-color" content="#22262E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Control Planning">
<meta name="application-name" content="Control Planning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Control Planning — señalética de aeropuerto
   ========================================================= */
:root{
  --asfalto:#22262E; --hormigon:#ECEEF1; --papel:#FFFFFF; --senal:#F6C300; --senal-suave:#FFF4CC;
  --pista:#1F5FBF; --gris:#5F6775; --linea:#D9DDE3; --ok:#23864F; --mal:#C23B30;
  --c-completo:#1F5FBF; --c-parcial:#7A4FB5; --c-disc:#C46A12;
  --ctx:var(--pista);
  --cond:'Barlow Condensed',system-ui,sans-serif; --texto:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--hormigon);color:var(--asfalto);font-family:var(--texto);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
.muted{color:var(--gris)}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}

/* cabecera */
header{position:sticky;top:0;z-index:20;background:var(--asfalto);color:#fff}
.cab{display:flex;align-items:center;gap:14px;padding:10px 22px;max-width:1600px;margin:0 auto}
.marca{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;cursor:pointer;padding:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--senal);display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:22px;height:22px}
.marca h1{font-size:24px;letter-spacing:.01em;white-space:nowrap}
.migas{display:flex;align-items:center;gap:6px;min-width:0}
.miga{border:0;border-radius:7px;padding:5px 10px;font-family:var(--cond);font-weight:700;font-size:17px;cursor:pointer;white-space:nowrap}
.miga.dep{background:#3A404C;color:var(--senal)}
.miga.prod{background:var(--ctx);color:#fff}
.migas .sep{color:#8C93A0}
.cab .esp{flex:1}
.anio{display:flex;align-items:center;gap:4px;color:#C9CED6;font-size:13px}
.anio b{color:var(--senal);font-family:var(--cond);font-size:22px;min-width:48px;text-align:center}
.anio button{border:0;background:#3A404C;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer}
.icono-btn{border:0;background:#3A404C;color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.icono-btn svg{width:20px;height:20px}

main{max-width:1600px;margin:0 auto;padding:26px 22px 60px}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--linea);background:var(--papel);border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{border-color:var(--asfalto)}
.btn:active{transform:scale(.97)}
.btn.primario{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.primario:hover{background:#000}
.btn.peligro{color:var(--mal);border-color:#E9B8B3}
.btn.peligro:hover{background:#FBE7E5;border-color:var(--mal)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--gris)}
input,select,textarea{border:1px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;font-size:15.5px;color:var(--asfalto);font-weight:500;width:100%}
textarea{font:inherit;min-height:140px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--asfalto);box-shadow:0 0 0 3px rgba(246,195,0,.45)}
.fila{display:flex;flex-wrap:wrap;gap:12px}
.fila>label{flex:1 1 180px}

/* portadas */
.portada{margin-bottom:22px}
.portada .k{font-family:var(--cond);font-weight:600;font-size:18px;color:var(--gris);margin:0 0 4px}
.portada h2{font-size:52px;letter-spacing:-.005em}
.portada p{margin:8px 0 0;color:var(--gris);max-width:60ch}
.volver{border:0;background:none;color:var(--pista);font-weight:600;cursor:pointer;padding:0;margin-bottom:8px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.tile{position:relative;text-align:left;border:0;border-radius:18px;padding:22px 22px 20px;min-height:170px;background:var(--asfalto);color:#fff;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(34,38,46,.8)}
.tile .letra{font-family:var(--cond);font-weight:700;font-size:20px;width:44px;height:44px;border-radius:10px;background:var(--senal);color:var(--asfalto);display:grid;place-items:center}
.tile .nom{font-family:var(--cond);font-weight:700;font-size:36px;line-height:1}
.tile .dato{color:#C9CED6;font-size:14px;margin-top:4px}
.tile .fl{position:absolute;top:22px;right:22px;color:var(--senal);transition:transform .2s}
.tile .fl svg{width:28px;height:28px}
.tile:hover .fl{transform:translateX(4px)}
.tile.prod{background:var(--c)} .tile.prod .letra{background:#fff;color:var(--c)} .tile.prod .dato{color:rgba(255,255,255,.85)} .tile.prod .fl{color:#fff}

/* globos del menú */
.globos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.globo{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:26px;padding:26px;min-height:250px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.globo:hover{transform:translateY(-4px);box-shadow:0 18px 36px -22px rgba(34,38,46,.55);border-color:color-mix(in srgb,var(--ctx) 40%,var(--linea))}
.globo .gi{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ctx) 12%,#fff);color:var(--ctx);transition:background .2s,color .2s}
.globo .gi svg{width:34px;height:34px}
.globo:hover .gi{background:var(--ctx);color:#fff}
.globo .gt{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.globo .gp{color:var(--gris);font-size:15px;max-width:36ch}
.globo .gd{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.globo .gd span{background:#F1F3F6;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}

/* Personal */
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.resumen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cifra{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.cifra b{display:block;font-family:var(--cond);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.cifra span{font-size:13.5px;color:var(--gris);font-weight:600}
.cifra::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc,var(--asfalto))}
.barra-herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.barra-herr .buscar{flex:1 1 240px;max-width:360px}
.seg{display:inline-flex;background:#DDE1E8;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 13px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--gris);white-space:nowrap}
.seg button.on{background:var(--papel);color:var(--asfalto);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.barra-herr .esp{flex:1}

table.plantilla{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.plantilla th{font-family:var(--cond);font-size:15px;font-weight:700;text-align:left;color:var(--gris);padding:10px 12px;border-bottom:2px solid var(--asfalto);white-space:nowrap}
.plantilla td{padding:12px;border-bottom:1px solid var(--linea);vertical-align:middle}
.plantilla .num{text-align:right;white-space:nowrap}
.plantilla tbody tr{cursor:pointer;transition:background .12s}
.plantilla tbody tr:hover{background:color-mix(in srgb,var(--ctx) 6%,#fff)}
.plantilla .nombre{font-weight:700;font-size:16px}
.plantilla .sub{font-size:13px;color:var(--gris)}
.plantilla .anual{font-family:var(--cond);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.completo{background:#E4ECF9;color:var(--c-completo)}
.chip.parcial{background:#EEE6F7;color:var(--c-parcial)}
.chip.discontinuo{background:#FBEBDC;color:var(--c-disc)}
.aviso{display:inline-block;background:#FBE7E5;color:var(--mal);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700}
.vacio{text-align:center;padding:50px 20px}
.vacio h3{font-size:28px;margin-bottom:8px}
.vacio p{color:var(--gris);margin:0 auto 18px;max-width:46ch}
.tarjetas-movil{display:none}

/* diálogos */
.fondo{position:fixed;inset:0;background:rgba(22,25,31,.55);z-index:50;display:grid;place-items:center;padding:16px;animation:aparecer .15s ease-out}
.dlg{background:var(--papel);border-radius:18px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:subir .22s cubic-bezier(.2,.7,.2,1)}
.dlg-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--papel);z-index:1}
.dlg-cab h2{font-size:28px}
.dlg-cuerpo{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.dlg-pie{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--linea);position:sticky;bottom:0;background:var(--papel)}
.dlg-pie .izq{margin-right:auto}
.cerrar{border:0;background:#F1F3F6;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:20px;line-height:1}
.bloque h3{font-size:20px;margin-bottom:10px}
.contratos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.contratos button{border:2px solid var(--linea);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.contratos button b{display:block;font-family:var(--cond);font-size:20px}
.contratos button span{font-size:13px;color:var(--gris)}
.contratos button.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,#fff)}
.jornada{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jcampo{border:2px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;transition:border-color .15s}
.jcampo.on{border-color:var(--asfalto);background:var(--senal-suave)}
.jcampo small{display:block;font-size:12.5px;font-weight:700;color:var(--gris);margin-bottom:4px}
.jcampo input{border:0;padding:0;font-family:var(--cond);font-size:30px;font-weight:700;background:transparent;box-shadow:none}
.jcampo input:disabled{color:var(--asfalto)}
.jcampo .ud{font-size:13px;color:var(--gris)}
.calculo{background:var(--asfalto);color:#fff;border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.calculo b{font-family:var(--cond);font-size:40px;color:var(--senal);line-height:1}
.calculo .f{color:#C9CED6;font-size:14px;flex:1 1 100%}
.periodos{display:flex;flex-direction:column;gap:8px}
.periodo{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.periodo label{flex:1 1 150px}
.periodo .dias{font-weight:700;padding-bottom:11px;min-width:90px}
.quitar{border:0;background:#F1F3F6;border-radius:8px;width:40px;height:42px;cursor:pointer;font-size:18px}

/* bloqueo de actualización y recorrido */
.bloqueo{position:fixed;inset:0;z-index:100;background:rgba(22,25,31,.82);display:grid;place-items:center;padding:16px}
.caja{background:var(--papel);border-radius:20px;width:min(520px,100%);overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:subir .25s cubic-bezier(.2,.7,.2,1)}
.caja-cab{background:var(--senal);padding:20px 22px}
.caja-cab small{font-family:var(--cond);font-weight:700;font-size:15px}
.caja-cab h2{font-size:32px}
.caja-cuerpo{padding:20px 22px}
.caja-cuerpo p{margin:0 0 12px}
.caja-pie{display:flex;justify-content:space-between;align-items:center;padding:0 22px 20px}
.puntos{display:flex;gap:6px}
.puntos i{width:8px;height:8px;border-radius:50%;background:var(--linea)} .puntos i.on{background:var(--asfalto)}

.aviso-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--asfalto);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:200;animation:subir .2s}

/* movimiento */
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
main.entrando .anim{animation:subir .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* móvil */
@media (max-width:760px){
  .cab{padding:8px 10px;gap:6px} .marca h1{display:none} .anio span{display:none}
  .migas{flex:1 1 auto;overflow:hidden} .migas .sep{display:none}
  .miga{font-size:14px;padding:4px 7px;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
  .cab .esp{display:none} .anio b{font-size:18px;min-width:40px} .anio button{width:24px;height:28px} .icono-btn{width:32px;height:32px}
  .cifra b{font-size:26px}
  .barra-herr .btn{flex:1 1 auto}
  main{padding:18px 12px 50px}
  .portada h2{font-size:38px}
  .resumen{grid-template-columns:repeat(2,minmax(0,1fr))} .resumen .cifra:first-child{grid-column:1/-1}
  .tabla-escritorio{display:none} .tarjetas-movil{display:flex;flex-direction:column;gap:10px}
  .tm{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;text-align:left;width:100%;cursor:pointer}
  .tm .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .tm .l2{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--gris)}
  .tm .l2 b{font-family:var(--cond);font-size:22px;color:var(--asfalto)}
  .contratos,.jornada{grid-template-columns:1fr}
  .barra-herr .buscar{max-width:none} .seg{overflow-x:auto;max-width:100%}
  .dlg{border-radius:16px}
}
@media print{header,.barra-herr,.btn{display:none}}
</style>
</head>
<body>
<header>
  <div class="cab">
    <button class="marca" onclick="ir('inicio')" aria-label="Ir al inicio">
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12)"><path fill="#22262E" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></g></svg></span>
      <h1>Control Planning</h1>
    </button>
    <nav class="migas" id="migas" aria-label="Dónde estás"></nav>
    <span class="esp"></span>
    <div class="anio" title="Año con el que se calcula la jornada anual"><span>Año</span><button onclick="cambiarAnio(-1)" aria-label="Año anterior">‹</button><b id="anio"></b><button onclick="cambiarAnio(1)" aria-label="Año siguiente">›</button></div>
    <button class="icono-btn" onclick="abrirAjustes()" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
  </div>
</header>
<main id="main"></main>
<div id="capa"></div>

<script>
/* =========================================================
   Control Planning 10 — rehecha desde cero
   Datos en localStorage, con una clave nueva: los de la versión
   anterior siguen en el navegador y se consultan en /antigua/.
   ========================================================= */
const APP_VERSION = '10.0.0';
const CLAVE = 'control-planning-v10';
const NOVEDADES = {
  '10.0.0': [
    { titulo:'Control Planning, desde cero', donde:'Toda la app',
      texto:'Empezamos una app nueva y más sencilla, por partes. La primera es Personal: los trabajadores, su contrato y su jornada anual. Los datos empiezan en blanco.' },
    { titulo:'Personal', donde:'Departamento › Producto › Personal',
      texto:'Añade a cada trabajador con su contrato: tiempo completo, tiempo parcial o fijo discontinuo. Verás su jornada en horas a la semana, en porcentaje y en horas al año.' },
    { titulo:'Jornada como tú la tengas', donde:'Ficha de cada trabajador',
      texto:'Escribe la jornada en horas semanales, en porcentaje o en horas anuales: la app calcula las otras dos. Un tiempo completo son 40 h a la semana y 1.700 h al año (se cambia en Ajustes).' },
    { titulo:'Fijos discontinuos', donde:'Ficha de cada trabajador',
      texto:'Apunta sus periodos de actividad y la jornada anual se calcula en proporción a los días que trabaja en el año.' },
    { titulo:'¿Y lo de antes?', donde:'Ajustes',
      texto:'La versión anterior sigue disponible, con sus datos, desde Ajustes › «Abrir la versión anterior».' },
  ],
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nf = (n, d=0) => n==null || isNaN(n) ? '—' : Number(n).toLocaleString('es-ES',{minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:'always'});
const nh = n => n==null || isNaN(n) ? '—' : Number(n).toLocaleString('es-ES',{maximumFractionDigits:2, useGrouping:'always'});
const num = v => { if(v===''||v==null) return null; const n = Number(String(v).replace(',','.')); return isNaN(n) ? null : n; };
const pd = s => new Date(s+'T00:00:00Z');
const fmt = s => s ? pd(s).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}) : '';
const diasEntre = (a,b) => Math.round((pd(b)-pd(a))/864e5) + 1;
const diasAnio = y => (y%4===0 && y%100!==0) || y%400===0 ? 366 : 365;
function toast(t){ const d = document.createElement('div'); d.className='aviso-toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }
const ICO = {
  flecha:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  personal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3.2 3.9 1.8 4.5 4.8"/></svg>',
  mas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pegar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5h6M9 10h6M9 14h6M9 18h3"/></svg>',
};

/* ---------- catálogos fijos ---------- */
const DEPARTAMENTOS = [ {id:'pasaje', nombre:'Pasaje'}, {id:'rampa', nombre:'Rampa'}, {id:'operaciones', nombre:'Operaciones'} ];
const PRODUCTOS = [ {id:'gh', nombre:'GroundHandling', color:'#1F5FBF'}, {id:'rb', nombre:'RedBull', color:'#E2631B'} ];
const CONTRATOS = {
  completo:    {nombre:'Tiempo completo', corto:'Completo', desc:'Jornada entera todo el año', color:'#1F5FBF'},
  parcial:     {nombre:'Tiempo parcial', corto:'Parcial', desc:'Menos horas que un completo', color:'#7A4FB5'},
  discontinuo: {nombre:'Fijo discontinuo', corto:'Discontinuo', desc:'Trabaja por periodos de actividad', color:'#C46A12'},
};
const nomDep = id => DEPARTAMENTOS.find(d=>d.id===id)?.nombre || '';
const prodDe = id => PRODUCTOS.find(p=>p.id===id);

/* ---------- estado ---------- */
function anioInicial(){ const d = new Date(); return d.getFullYear() + (d.getMonth()>=9 ? 1 : 0); }   // de octubre en adelante, el año siguiente
function estadoInicial(){ return { v:10, anio:anioInicial(), ajustes:{hSemana:40, hAnio:1700}, trabajadores:[], versionVista:'0' }; }
function normalizar(d){
  const b = estadoInicial();
  d = Object.assign(b, d || {});
  d.ajustes = Object.assign(estadoInicial().ajustes, d.ajustes || {});
  d.trabajadores = (d.trabajadores||[]).map(t=>({ id:t.id||uid(), nombre:t.nombre||'', num:t.num||'', dep:t.dep||'pasaje', prod:t.prod||'gh',
    contrato: CONTRATOS[t.contrato] ? t.contrato : 'completo', modo:['semana','pct','anio'].includes(t.modo)?t.modo:'semana',
    valor: t.valor ?? null, actividad: Array.isArray(t.actividad) ? t.actividad : [] }));
  return d;
}
let S;
try { S = normalizar(JSON.parse(localStorage.getItem(CLAVE))); } catch(e){ S = estadoInicial(); }
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch(e){ toast('No se ha podido guardar en este navegador'); } };
let UI = { vista:'inicio', dep:'', prod:'', buscar:'', filtro:'todos', edit:null };
try { const u = JSON.parse(sessionStorage.getItem('cp-ui')||'{}'); if(u.dep) UI.dep=u.dep; if(u.prod) UI.prod=u.prod; if(u.vista) UI.vista=u.vista; } catch(e){}

/* =========================================================
   Jornada
   Un tiempo completo son S.ajustes.hSemana horas a la semana
   y S.ajustes.hAnio horas al año (40 h y 1.700 h).
   La jornada de cada persona se guarda tal como la escribiste
   (modo + valor) y se convierte a las otras dos unidades.
   ========================================================= */
function pctDe(t){
  if(t.contrato==='completo') return 100;
  const v = num(t.valor); if(v==null) return null;
  const A = S.ajustes;
  return t.modo==='pct' ? v : t.modo==='semana' ? v / A.hSemana * 100 : v / A.hAnio * 100;
}
const semanaDe = t => { const p = pctDe(t); return p==null ? null : p/100 * S.ajustes.hSemana; };
const anualBase = t => { const p = pctDe(t); return p==null ? null : p/100 * S.ajustes.hAnio; };
/* días de actividad de un fijo discontinuo dentro del año */
function diasActividad(t, y=S.anio){
  const ini = `${y}-01-01`, fin = `${y}-12-31`; const dias = new Set();
  (t.actividad||[]).forEach(p=>{ if(!p.desde || !p.hasta || p.hasta<p.desde) return;
    let d = p.desde < ini ? ini : p.desde; const h = p.hasta > fin ? fin : p.hasta;
    while(d<=h){ dias.add(d); const x = pd(d); x.setUTCDate(x.getUTCDate()+1); d = x.toISOString().slice(0,10); } });
  return dias.size;
}
/* jornada anual del año elegido */
function anualDe(t, y=S.anio){
  const base = anualBase(t); if(base==null) return null;
  if(t.contrato!=='discontinuo') return base;
  return base * diasActividad(t, y) / diasAnio(y);
}
const faltaJornada = t => t.contrato!=='completo' && pctDe(t)==null;
const faltaActividad = t => t.contrato==='discontinuo' && diasActividad(t)===0;

/* =========================================================
   Pantallas
   ========================================================= */
function ir(v){ UI.vista = v; if(v==='inicio'){ UI.dep=''; UI.prod=''; } if(v==='producto') UI.prod=''; pintar(true); scrollTo(0,0); }
function elegirDep(id){ UI.dep = id; ir('producto'); }
function elegirProd(id){ UI.prod = id; ir('menu'); }
const plantilla = () => S.trabajadores.filter(t=>t.dep===UI.dep && t.prod===UI.prod);

function pintar(cambio){
  const p = prodDe(UI.prod);
  document.documentElement.style.setProperty('--ctx', p ? p.color : '#1F5FBF');
  $('#anio').textContent = S.anio;
  $('#migas').innerHTML = (UI.dep ? `<span class="sep">›</span><button class="miga dep" onclick="ir('producto')">${esc(nomDep(UI.dep))}</button>` : '')
    + (p ? `<span class="sep">›</span><button class="miga prod" onclick="ir('menu')">${esc(p.nombre)}</button>` : '');
  const V = {inicio:vInicio, producto:vProducto, menu:vMenu, personal:vPersonal};
  if(!V[UI.vista] || (UI.vista!=='inicio' && !UI.dep) || (['menu','personal'].includes(UI.vista) && !UI.prod)) UI.vista = UI.dep ? 'producto' : 'inicio';
  const m = $('#main'); m.innerHTML = V[UI.vista]();
  if(cambio){ m.classList.remove('entrando'); void m.offsetWidth; m.classList.add('entrando'); clearTimeout(pintar._t); pintar._t = setTimeout(()=>m.classList.remove('entrando'), 800); }
  try { sessionStorage.setItem('cp-ui', JSON.stringify({dep:UI.dep, prod:UI.prod, vista:UI.vista})); } catch(e){}
}

}
function vProducto(){
  return `<div class="portada anim"><button class="volver" onclick="ir('inicio')">‹ Departamentos</button><p class="k">${esc(nomDep(UI.dep))}</p><h2>¿Qué producto?</h2></div>
  <div class="tiles">${PRODUCTOS.map((p,i)=>{ const n = S.trabajadores.filter(t=>t.dep===UI.dep && t.prod===p.id).length;

}

  <div class="globos">
    <button class="globo anim" style="--i:1" onclick="ir('personal')"><span class="gi">${ICO.personal}</span><span class="gt">Personal</span>

      <span class="gd"><span>${ts.length} trabajador${ts.length===1?'':'es'}</span>${ts.length?`<span>${nh(total)} h en ${S.anio}</span>`:''}${pend?`<span>${pend} por completar</span>`:''}</span></button>

}

  const cab = `<div class="portada anim"><button class="volver" onclick="ir('menu')">‹ ${esc(prodDe(UI.prod).nombre)}</button><h2>Personal</h2>

  const filas = ts.map(t=>{ const c = CONTRATOS[t.contrato];
    return `<tr onclick="abrirFicha('${t.id}')">

      <td><span class="chip ${t.contrato}">${c.nombre}</span></td>
      <td class="num">${semanaDe(t)==null?'—':nh(semanaDe(t))+' h'}</td>
      <td class="num">${pctDe(t)==null?'—':nh(pctDe(t))+' %'}</td>
      <td class="num">${t.contrato==='discontinuo'?`${diasActividad(t)} días`:'<span class="muted">Todo el año</span>'}</td>

  const tarjetas = ts.map(t=>`<button class="tm" onclick="abrirFicha('${t.id}')"><div class="l1"><b>${esc(t.nombre)}</b><span class="chip ${t.contrato}">${CONTRATOS[t.contrato].corto}</span></div>
      <div class="l2"><span>${semanaDe(t)==null?'—':nh(semanaDe(t))+' h/sem'} · ${pctDe(t)==null?'—':nh(pctDe(t))+' %'}</span>${avisos(t) || `<b>${nh(anualDe(t))} h</b>`}</div></button>`).join('');
  const fb = (k,t) => `<button class="${UI.filtro===k?'on':''}" onclick="UI.filtro='${k}';pintar()">${t}</button>`;

        <div class="seg" role="group" aria-label="Filtrar por contrato">${fb('todos','Todos')}${fb('completo','Completo')}${fb('parcial','Parcial')}${fb('discontinuo','Discontinuo')}</div>
        <span class="esp"></span>

/* =========================================================
   Ficha del trabajador (diálogo)
   ========================================================= */
function abrirFicha(id){
  const t = id ? S.trabajadores.find(x=>x.id===id) : null;
  UI.edit = t ? JSON.parse(JSON.stringify(t)) : { id:null, nombre:'', num:'', dep:UI.dep, prod:UI.prod, contrato:'completo', modo:'semana', valor:null, actividad:[] };
  pintarFicha(true);
}
function pintarFicha(primera){
  const e = UI.edit, A = S.ajustes;
  const pct = pctDe(e), sem = semanaDe(e), anu = anualBase(e), real = anualDe(e), dAct = diasActividad(e);
  const campo = (modo, titulo, valor, ud) => { const activo = e.contrato!=='completo' && e.modo===modo;
    return `<div class="jcampo ${activo?'on':''}" onclick="${e.contrato==='completo'?'':`if(UI.edit.modo!=='${modo}'){cambiarModo('${modo}')}`}"><small>${titulo}</small>
      <input id="j_${modo}" inputmode="decimal" ${e.contrato==='completo'?'disabled':''} value="${valor==null?'':nh(valor).replace(/\./g,'')}" aria-label="${titulo}"
        onfocus="if(UI.edit.modo!=='${modo}') cambiarModo('${modo}', this)" oninput="UI.edit.valor=num(this.value);recalcular()"> <span class="ud">${ud}</span></div>`; };
  const contratoBtn = k => { const c = CONTRATOS[k]; return `<button type="button" class="${e.contrato===k?'on':''}" style="--cc:${c.color}" onclick="UI.edit.contrato='${k}';pintarFicha()"><b>${c.nombre}</b><span>${c.desc}</span></button>`; };
  const periodos = e.contrato!=='discontinuo' ? '' : `<div class="bloque"><h3>Periodos de actividad</h3>
      <div class="periodos">${(e.actividad.length?e.actividad:[]).map((p,i)=>`<div class="periodo">
        <label>Desde<input type="date" value="${p.desde||''}" onchange="UI.edit.actividad[${i}].desde=this.value;pintarFicha()"></label>
        <label>Hasta<input type="date" value="${p.hasta||''}" onchange="UI.edit.actividad[${i}].hasta=this.value;pintarFicha()"></label>
        <span class="dias">${p.desde&&p.hasta&&p.hasta>=p.desde?`${diasEntre(p.desde,p.hasta)} días`:''}</span>
        <button type="button" class="quitar" aria-label="Quitar periodo" onclick="UI.edit.actividad.splice(${i},1);pintarFicha()">×</button></div>`).join('')}
      </div>
      <div class="fila" style="margin-top:8px"><button type="button" class="btn" onclick="UI.edit.actividad.push({desde:'',hasta:''});pintarFicha()">${ICO.mas} Añadir periodo</button></div></div>`;
  const formula = e.contrato==='discontinuo'
    ? (anu==null ? 'Escribe su jornada para calcularla.' : `${nh(anu)} h × ${dAct} días de actividad / ${diasAnio(S.anio)} días del año`)
    : e.contrato==='completo' ? `Tiempo completo: ${nh(A.hSemana)} h a la semana, ${nh(A.hAnio)} h al año.`
    : (pct==null ? 'Escribe su jornada en cualquiera de las tres casillas.' : `${nh(pct)} % de ${nh(A.hAnio)} h`);
  $('#capa').innerHTML = `<div class="fondo" onclick="if(event.target===this)cerrarFicha()"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="fTit">
    <div class="dlg-cab"><h2 id="fTit">${e.id?esc(e.nombre||'Trabajador'):'Nuevo trabajador'}</h2><button class="cerrar" onclick="cerrarFicha()" aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <div class="fila"><label style="flex:3 1 260px">Nombre y apellidos<input id="fNombre" value="${esc(e.nombre)}" oninput="UI.edit.nombre=this.value" autocomplete="off"></label>
        <label style="flex:1 1 120px">Nº de empleado<input value="${esc(e.num)}" oninput="UI.edit.num=this.value" autocomplete="off"></label></div>
      <div class="bloque"><h3>Contrato</h3><div class="contratos">${Object.keys(CONTRATOS).map(contratoBtn).join('')}</div></div>
      <div class="bloque"><h3>Jornada</h3>
        <div class="jornada">${campo('semana','Horas a la semana', sem, 'h')}${campo('pct','Porcentaje', pct, '%')}${campo('anio','Horas al año', anu, 'h')}</div>
        ${e.contrato!=='completo'?'<p class="muted" style="margin:8px 0 0;font-size:13.5px">Escribe en la casilla que tengas; las otras dos se calculan solas.</p>':''}</div>
      ${periodos}
      <div class="calculo" id="calc"><span>Jornada anual ${S.anio}</span><b>${real==null?'—':nh(real)+' h'}</b><span class="f">${formula}</span></div>
    </div>
    <div class="dlg-pie">${e.id?`<button class="btn peligro izq" onclick="borrarTrabajador('${e.id}')">Borrar</button>`:''}<button class="btn" onclick="cerrarFicha()">Cancelar</button><button class="btn primario" onclick="guardarFicha()">${e.id?'Guardar cambios':'Añadir trabajador'}</button></div>
  </div></div>`;
  if(primera) setTimeout(()=>$('#fNombre')?.focus(), 30);
}
/* pasar a escribir en otra unidad: se convierte el valor actual */
function cambiarModo(modo, input){
  const e = UI.edit, pct = pctDe(e);
  e.modo = modo;
  if(pct!=null) e.valor = Math.round((modo==='pct' ? pct : modo==='semana' ? pct/100*S.ajustes.hSemana : pct/100*S.ajustes.hAnio) * 100) / 100;
  pintarFicha();
  const i = $('#j_'+modo); if(i){ i.focus(); i.select(); }
}
/* al escribir, se actualizan las otras casillas y el cálculo sin repintar la que tiene el foco */
function recalcular(){
  const e = UI.edit, pct = pctDe(e);
  const vals = {semana: semanaDe(e), pct, anio: anualBase(e)};
  Object.keys(vals).forEach(k=>{ if(k!==e.modo){ const i = $('#j_'+k); if(i) i.value = vals[k]==null ? '' : nh(vals[k]).replace(/\./g,''); } });
  const real = anualDe(e), c = $('#calc');
  if(c){ c.querySelector('b').textContent = real==null ? '—' : nh(real)+' h';
    c.querySelector('.f').textContent = e.contrato==='discontinuo' ? (vals.anio==null?'Escribe su jornada para calcularla.':`${nh(vals.anio)} h × ${diasActividad(e)} días de actividad / ${diasAnio(S.anio)} días del año`)
      : pct==null ? 'Escribe su jornada en cualquiera de las tres casillas.' : `${nh(pct)} % de ${nh(S.ajustes.hAnio)} h`; }
}
function cerrarFicha(){ UI.edit = null; $('#capa').innerHTML = ''; }
function guardarFicha(){
  const e = UI.edit;
  e.nombre = e.nombre.trim().replace(/\s+/g,' ');
  if(!e.nombre){ toast('Escribe el nombre'); $('#fNombre')?.focus(); return; }
  const p = pctDe(e);
  if(e.contrato!=='completo' && p!=null && (p<=0 || p>100)){ toast('La jornada tiene que estar entre 0 y un tiempo completo'); return; }
  if(e.contrato==='discontinuo' && e.actividad.some(x=>x.desde&&x.hasta&&x.hasta<x.desde)){ toast('Hay un periodo que acaba antes de empezar'); return; }
  e.actividad = e.actividad.filter(x=>x.desde && x.hasta);
  if(e.contrato==='completo'){ e.valor = null; e.modo = 'semana'; }
  if(e.id){ const i = S.trabajadores.findIndex(x=>x.id===e.id); S.trabajadores[i] = e; toast('Cambios guardados'); }
  else { e.id = uid(); S.trabajadores.push(e); toast('Trabajador añadido'); }
  guardar(); cerrarFicha(); pintar();
}
function borrarTrabajador(id){
  const t = S.trabajadores.find(x=>x.id===id); if(!t) return;
  if(!confirm(`¿Borrar a ${t.nombre}? No se puede deshacer.`)) return;
  S.trabajadores = S.trabajadores.filter(x=>x.id!==id); guardar(); cerrarFicha(); pintar(); toast('Trabajador borrado');
}

/* ---------- pegar lista desde Excel ---------- */
function abrirPegar(){
  $('#capa').innerHTML = `<div class="fondo" onclick="if(event.target===this)$('#capa').innerHTML=''"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pTit">
    <div class="dlg-cab"><h2 id="pTit">Pegar lista</h2><button class="cerrar" onclick="$('#capa').innerHTML=''" aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <p style="margin:0">Copia las columnas de tu Excel y pégalas aquí, una persona por fila, en este orden: <b>nombre</b>, <b>contrato</b> y <b>horas a la semana</b>. Solo el nombre es obligatorio.</p>
      <p class="muted" style="margin:0;font-size:14px">Contrato: «completo», «parcial» o «discontinuo» (vale cualquier palabra que empiece así). Si no pones nada, se entiende tiempo completo. Se añaden a ${esc(nomDep(UI.dep))}, ${esc(prodDe(UI.prod).nombre)}.</p>
      <textarea id="pegado" placeholder="ANA GARCÍA LÓPEZ&#9;completo&#10;LUIS PÉREZ RUIZ&#9;parcial&#9;30&#10;MARTA SANZ GIL&#9;discontinuo&#9;40"></textarea>
    </div>
    <div class="dlg-pie"><button class="btn" onclick="$('#capa').innerHTML=''">Cancelar</button><button class="btn primario" onclick="importarPegado()">Añadir a la plantilla</button></div></div></div>`;
  setTimeout(()=>$('#pegado')?.focus(), 30);
}
function importarPegado(){
  const filas = $('#pegado').value.split(/\r?\n/).map(l=>l.split(/\t|;/).map(x=>x.trim())).filter(c=>c[0]);
  if(!filas.length) return toast('No hay nada que añadir');
  let n = 0;
  filas.forEach(([nombre, contrato='', horas=''])=>{
    const c = /^disc|^fijo/i.test(contrato) ? 'discontinuo' : /^parc/i.test(contrato) ? 'parcial' : 'completo';
    const h = num(horas);
    S.trabajadores.push({ id:uid(), nombre:nombre.replace(/\s+/g,' '), num:'', dep:UI.dep, prod:UI.prod, contrato:c, modo:'semana', valor: c==='completo' ? null : h, actividad:[] });
    n++;
  });
  guardar(); $('#capa').innerHTML=''; pintar(); toast(`${n} trabajador${n===1?'':'es'} añadido${n===1?'':'s'}`);
}

/* ---------- año y ajustes ---------- */
function cambiarAnio(d){ S.anio += d; guardar(); pintar(); }
function abrirAjustes(){
  const A = S.ajustes;
  $('#capa').innerHTML = `<div class="fondo" onclick="if(event.target===this)$('#capa').innerHTML=''"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="aTit">
    <div class="dlg-cab"><h2 id="aTit">Ajustes</h2><button class="cerrar" onclick="$('#capa').innerHTML=''" aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <div class="bloque"><h3>Tiempo completo</h3><p class="muted" style="margin:0 0 10px;font-size:14px">Es la base de todos los cálculos de jornada.</p>
        <div class="fila"><label>Horas a la semana<input id="aSem" inputmode="decimal" value="${nh(A.hSemana)}"></label><label>Horas al año<input id="aAnio" inputmode="decimal" value="${String(A.hAnio)}"></label></div></div>
      <div class="bloque"><h3>Copia de seguridad</h3><p class="muted" style="margin:0 0 10px;font-size:14px">Los datos viven solo en este navegador. Descarga una copia de vez en cuando.</p>
        <div class="fila"><button class="btn" onclick="descargarCopia()">Descargar copia</button><label class="btn" style="flex:0 0 auto;color:inherit;font-size:inherit">Restaurar una copia<input type="file" accept=".json,application/json" style="display:none" onchange="restaurarCopia(this.files[0])"></label></div></div>
      <div class="bloque"><h3>Versión anterior</h3><p class="muted" style="margin:0 0 10px;font-size:14px">La app de antes sigue disponible con todos sus datos, por si necesitas consultar algo.</p>
        <a class="btn" href="antigua/" target="_blank" rel="noopener">Abrir la versión anterior</a></div>
      <p class="muted" style="margin:0;font-size:13px">Versión ${APP_VERSION}</p>
    </div>
    <div class="dlg-pie"><button class="btn" onclick="$('#capa').innerHTML=''">Cancelar</button><button class="btn primario" onclick="guardarAjustes()">Guardar</button></div></div></div>`;
}
function guardarAjustes(){
  const s = num($('#aSem').value), a = num($('#aAnio').value);
  if(!s || !a || s<=0 || a<=0) return toast('Escribe horas mayores que cero');
  S.ajustes.hSemana = s; S.ajustes.hAnio = a; guardar(); $('#capa').innerHTML=''; pintar(); toast('Ajustes guardados');
}
function descargarCopia(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S,null,1)], {type:'application/json'}));
  a.download = `control-planning-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function restaurarCopia(f){
  if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if(!d || d.v!==10) throw 0;
      if(!confirm('Se sustituirán todos los datos actuales por los de la copia. ¿Seguir?')) return;
      S = normalizar(d); guardar(); $('#capa').innerHTML=''; pintar(true); toast('Copia restaurada');
    } catch(e){ toast('Ese archivo no es una copia de esta versión de la app'); } };
  r.readAsText(f);
}

/* =========================================================
   Actualizaciones: aviso que bloquea y recorrido de novedades
   ========================================================= */
const masNueva = (a,b) => { const x=a.split('.').map(Number), y=b.split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)>(y[i]||0); } return false; };
let avisando = false;
async function comprobarVersion(){
  if(avisando || !/^https?:$/.test(location.protocol)) return;
  try { const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return; const v = await r.json();
    if(v && v.version && masNueva(v.version, APP_VERSION)) avisoActualizacion(v);
  } catch(e){ /* sin conexión: se vuelve a intentar */ }
}
function avisoActualizacion(v){
  avisando = true; cerrarFicha();
  const d = document.createElement('div'); d.className='bloqueo'; d.id='bloqueo';
  d.innerHTML = `<div class="caja" role="alertdialog" aria-modal="true" aria-labelledby="bTit"><div class="caja-cab"><small>Versión ${esc(v.version)}</small><h2 id="bTit">Hay una versión nueva</h2></div>
    <div class="caja-cuerpo"><p>Actualiza para seguir usando la app. Tus datos se quedan como están.</p>${(v.novedades||[]).length?`<ul>${v.novedades.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}</div>
    <div class="caja-pie"><span class="muted" style="font-size:13px">Tienes la ${APP_VERSION}</span><button class="btn primario" id="actBtn">Actualizar ahora</button></div></div>`;
  document.body.appendChild(d);
  const b = d.querySelector('#actBtn'); b.focus();
  b.onclick = () => { b.disabled = true; b.textContent = 'Actualizando…'; guardar(); location.replace(location.pathname + '?v=' + encodeURIComponent(v.version) + '&t=' + Date.now()); };
}
function recorrido(){
  const pasos = Object.keys(NOVEDADES).filter(v=>masNueva(v, S.versionVista||'0')).sort((a,b)=>masNueva(a,b)?1:-1).flatMap(v=>NOVEDADES[v].map(p=>({...p, v})));
  if(!pasos.length) return;
  let i = 0; const d = document.createElement('div'); d.className='bloqueo'; document.body.appendChild(d);
  const pinta = () => { const p = pasos[i], ult = i===pasos.length-1;
    d.innerHTML = `<div class="caja" role="dialog" aria-modal="true" aria-labelledby="rTit"><div class="caja-cab"><small>Novedades ${esc(p.v)} · ${esc(p.donde)}</small><h2 id="rTit">${esc(p.titulo)}</h2></div>
      <div class="caja-cuerpo"><p>${esc(p.texto)}</p></div>
      <div class="caja-pie"><span class="puntos">${pasos.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span><button class="btn primario" id="rSig">${ult?'Entendido':'Siguiente'}</button></div></div>`;
    const b = d.querySelector('#rSig'); b.focus();
    b.onclick = () => { if(ult){ S.versionVista = APP_VERSION; guardar(); d.remove(); } else { i++; pinta(); } }; };
  pinta();
}

/* ---------- arranque ---------- */
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#bloqueo') && $('#capa').innerHTML){ UI.edit=null; $('#capa').innerHTML=''; } });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
pintar(true);
if(masNueva(APP_VERSION, S.versionVista||'0')) recorrido();
comprobarVersion(); setInterval(comprobarVersion, 60*1000);
if(/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
