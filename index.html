      <thead><tr><th class="esq" rowspan="2">Trabajador</th>${meses.map(x=>`<th class="mes" colspan="${x.n}">${zoom==='anio'&&x.n<20?MESES[x.m]:MESES_L[x.m]}</th>`).join('')}</tr>
        <tr>${dias.map(d=>`<th class="dia${cls(d)}">${conTexto?`<small>${DIAS_SEM[diaSem(d)]}</small>${Number(d.slice(8))}`:''}</th>`).join('')}</tr></thead>
      ${nombres.map(g=>`<tbody><tr class="grp"><th>${grpTxt(g)}</th><td colspan="${dias.length}"></td></tr>${grupos[g].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')).map(fila).join('')}</tbody>`).join('')}
      <tfoot><tr><th>De vacaciones</th>${cuenta(c=>c && COD_VAC.has(c))}</tr><tr><th>Trabajan</th>${cuenta(c=>c==='T')}</tr></tfoot>
    </table></div>`;
}

/* ---------- por trabajador ---------- */
function vacTrabajador(lista, t, y, filtros=''){
  const i = lista.indexOf(t), hoy = hoyIso();
  const n = cuentasDe(t, y), h = (n.H||0)+(n.V||0)+(n.VAC||0), r = rangoDe(t, y);
  const vacs = periodosVac(t, y), inas = t.contrato==='discontinuo' ? tramosDe(t, y, ['INA']) : [];
  const dato = (k, v, sub, extra='') => `<div class="vdato ${extra}"><small>${k}</small><b>${v}</b>${sub?`<span>${sub}</span>`:''}</div>`;
  const mes = m => { const p = `${y}-${String(m+1).padStart(2,'0')}-01`, ult = sumaDias(m===11?`${y+1}-01-01`:`${y}-${String(m+2).padStart(2,'0')}-01`, -1);
    const ds = diasDelAnio(y).filter(d=>d>=p && d<=ult), hm = ds.filter(d=>COD_VAC.has(diaDe(t, d)||'')).length;
    return `<div class="vmesc"><div class="vmes-cab"><b>${MESES_L[m]}</b>${hm?`<span class="c-h">${hm} H</span>`:''}</div>
      <div class="vcal">${DIAS_SEM.map(x=>`<span class="ds">${x}</span>`).join('')}${'<span></span>'.repeat(diaSem(p))}
      ${ds.map(d=>{ const c = diaDe(t, d), e = c==null ? DIA_EST['?'] : estDia(c);
        const mv = movidoA(t, d); return `<span class="vd ${e.cls}${diaSem(d)>=5?' fin':''}${d===hoy?' hoy':''}${mv?' mov':''}" data-t="${t.id}" data-d="${d}" title="${fCorto(d)}: ${e.nombre}${mv?` (desprogramado del ${fCorto(mv.de)})`:''}"><i>${Number(d.slice(8))}</i>${e.txt}</span>`; }).join('')}</div></div>`; };
  return `<div class="vtrab"><aside class="vlado">${filtros}
    <div class="vbarra vcab">
      <div class="vsel"><button class="btn" onclick="UI.vacTrab='${lista[(i-1+lista.length)%lista.length].id}';pintar()" aria-label="Anterior" title="Anterior">‹</button>
        <h3 class="vnombre">${esc(t.nombre)}</h3>
        <button class="btn" onclick="UI.vacTrab='${lista[(i+1)%lista.length].id}';pintar()" aria-label="Siguiente" title="Siguiente">›</button></div>
      <span class="vquien"><span class="chip ${t.contrato}">${CONTRATOS[t.contrato].corto}</span> ${negocioChip(t)} ${t.depto?esc(t.depto):''}${t.grupo?` · ${esc(t.grupo)}`:''}${t.num?` · Nº ${esc(t.num)}`:''}</span>
      <button class="btn" onclick="abrirFicha('${t.id}')">Abrir ficha</button></div>
    <div class="vdatos">
      ${dato('Horas a realizar', r ? entre(r.min, r.max) : '—', diasBaja(t, y) ? `con ${diasBaja(t, y)} días de baja` : '')}
      ${dato('Horas realizadas', nh(hechasDe(t, y))+' h', `${semanasDe(t, y).length} semanas importadas`)}
      ${dato('D.T.', n.T||0, 'días de trabajo')}
      ${dato('H', `${h} de ${vacDe(t)}`, 'días de vacaciones', h!==vacDe(t) ? 'aviso-v' : 'ok-v')}
      ${dato('R', n.R||0, 'descansos')}
      ${dato('F', n.F||0, 'festivos')}
      ${dato('X', n.X||0, 'festivos de empresa')}
      ${dato('AJ', n.AJ||0, 'ajustes de jornada')}
      ${dato('PR · PNR', `${n.PR||0} · ${n.PNR||0}`, 'permisos')}
      ${dato('Desprog.', `${desprogDe(t, y).length} de ${DESPROG}`, 'vacaciones movidas', desprogDe(t, y).length>DESPROG ? 'aviso-v' : '')}
      ${t.contrato==='discontinuo' ? dato('Inactividad', `${n.INA||0} días`, n.INA<MIN_INACTIVO ? `mínimo ${MIN_INACTIVO}` : '', n.INA<MIN_INACTIVO ? 'aviso-v' : '') : ''}
      ${n.B ? dato('Baja', `${n.B} días`, '') : ''}
    </div>
    <div class="vtramos">
      ${desprogDe(t, y).length ? `<div><b>Desprogramaciones</b>${desprogDe(t, y).map((m,k)=>`<span class="tramo c-desp">${fCorto(m.de)} → ${fCorto(m.a)} <button type="button" title="Deshacer esta desprogramación" onclick="quitarDesprog('${t.id}',${y},${k})">×</button></span>`).join('')}</div>` : ''}
      <div><b>Vacaciones asignadas</b>${vacs.length ? vacs.map(p=>`<span class="tramo c-h">${tramoTxt(p)} <em>${p.h} H</em></span>`).join('') : '<span class="muted">Ninguna en la rotación</span>'}</div>
      ${t.contrato==='discontinuo' ? `<div><b>Inactividad</b>${inas.length ? inas.map(p=>`<span class="tramo c-ina">${tramoTxt(p)} <em>${diasTramo(p)} días</em></span>`).join('') : '<span class="muted">Sin periodos</span>'}</div>` : ''}
    </div>
    ${tieneRot(t, y) ? '' : `<p class="aviso-suave" style="margin:0 0 12px">No tiene rotación de ${y}${t.contrato==='discontinuo'?': solo se ve su inactividad':''}. Impórtala con «Importar rotaciones» para ver sus días y sus vacaciones.</p>`}
    </aside><div class="vder"><div class="vmeses">${MESES_L.map((_,m)=>mes(m)).join('')}</div>
    <p class="muted nota">Los días libres están sujetos a modificaciones por necesidades de la operativa.</p></div></div>`;
}

/* =========================================================
   Editar vacaciones y días
   Se pincha un día (o se arrastra para coger varios) en
   cualquiera de los dos calendarios y sale un menú junto al
   último día: poner o quitar vacaciones, descanso, festivo…
   Con otro clic (o Mayús + clic) en un día de la misma persona
   se alarga el periodo. Todo se puede deshacer.
   Las vacaciones solo se ponen en días de trabajo: los
   descansos, festivos e inactividad (FD) que caigan dentro se quedan como están.
   ========================================================= */
let SEL = null;
const DESHACER = [];
const OPS_DIA = [
  ['H','Vacaciones','c-h'], ['-H','Quitar vacaciones','c-t'], ['T','Trabaja','c-t'], ['R','Descanso','c-r'],
  ['F','Festivo','c-f'], ['X','Festivo de empresa','c-x'], ['AJ','Ajuste de jornada','c-aj'], ['PR','Permiso retribuido','c-p'], ['PNR','Permiso no retribuido','c-p'],
];
const celdaDia = el => el?.closest?.('[data-t][data-d]');
const rangoSel = () => SEL.a <= SEL.b ? [SEL.a, SEL.b] : [SEL.b, SEL.a];
function marcarSel(){
  document.querySelectorAll('.dsel').forEach(x=>x.classList.remove('dsel'));
  if(!SEL) return; const [a, b] = rangoSel();
  document.querySelectorAll(`[data-t="${SEL.t}"][data-d]`).forEach(x=>{ if(x.dataset.d>=a && x.dataset.d<=b) x.classList.add('dsel'); });
}
function cerrarMenuDia(){ $('#menuDia')?.remove(); SEL = null; marcarSel(); }
document.addEventListener('pointerdown', e=>{
  if(MOVER){ const c = celdaDia(e.target); if(c && UI.vista==='vacaciones'){ e.preventDefault(); terminarDesprog(c); } return; }
  if(e.target.closest('#menuDia')) return;
  const c = celdaDia(e.target);
  if(!c || e.button>0 || UI.vista!=='vacaciones'){ if($('#menuDia') && !c) cerrarMenuDia(); return; }
  /* con el menú abierto, otro día de la misma persona (o Mayús + clic) alarga el periodo */
  if(SEL && SEL.fin && c.dataset.t===SEL.t){ SEL.b = c.dataset.d; SEL.el = c; marcarSel(); abrirMenuDia(); return; }
  $('#menuDia')?.remove();
  SEL = { t:c.dataset.t, a:c.dataset.d, b:c.dataset.d, el:c, fin:false, tactil: e.pointerType==='touch' };
  if(!SEL.tactil) e.preventDefault();
  marcarSel();
});
document.addEventListener('pointermove', e=>{
  if(!SEL || SEL.fin || SEL.tactil) return;
  const c = celdaDia(document.elementFromPoint(e.clientX, e.clientY));
  if(c && c.dataset.t===SEL.t && c.dataset.d!==SEL.b){ SEL.b = c.dataset.d; SEL.el = c; marcarSel(); }
});
document.addEventListener('pointerup', ()=>{ if(SEL && !SEL.fin){ SEL.fin = true; abrirMenuDia(); } });
document.addEventListener('keydown', e=>{
  if(UI.vista!=='vacaciones' || $('#bloqueo') || $('#capa').innerHTML) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='z' && DESHACER.length && !e.target.closest('input')){ e.preventDefault(); deshacerDia(); return; }
  if(MOVER && e.key==='Escape'){ cancelarMover(); return; }
  if(!$('#menuDia') || e.target.closest('input')) return;
  const k = e.key.toUpperCase();
  if(e.key==='Escape'){ cerrarMenuDia(); return; }
  const mapa = { H:'H', T:'T', R:'R', F:'F', X:'X', A:'AJ', P:'PR', DELETE:'-H', BACKSPACE:'-H' };
  if(mapa[k]){ e.preventDefault(); aplicarDia(mapa[k]); }
});
addEventListener('scroll', ()=>{ if($('#menuDia')) colocarMenu(); }, true);
addEventListener('resize', ()=>{ if($('#menuDia')) colocarMenu(); });

function abrirMenuDia(){
  const t = S.trabajadores.find(x=>x.id===SEL.t); if(!t) return cerrarMenuDia();
  const [a, b] = rangoSel(), n = Math.round((pd(b)-pd(a))/864e5) + 1;
  const ds = []; for(let d=a; d<=b; d=sumaDias(d,1)) ds.push(d);
  const trab = ds.filter(d=>admiteVac(t, d, codigoDia(t, d))).length;
  const h = vacEnRot(t, S.anio) || 0;
  const m = $('#menuDia') || Object.assign(document.createElement('div'), { id:'menuDia', className:'mdia' });
  m.setAttribute('role','dialog'); m.setAttribute('aria-label','Cambiar días');
  /* en la inactividad de un FD solo se cambian las fechas del periodo */
  const k = (t.cese||[]).findIndex(p=>p.desde<=b && a<=p.hasta);
  if(t.contrato==='discontinuo' && k>=0) m.innerHTML = menuCese(t, k, a, b, n);
  else m.innerHTML = `<div class="mdia-cab"><div><b>${esc(t.nombre)}</b><span>${a===b ? fmt(a) : `${fCorto(a)} – ${fmt(b)}`} · ${n} día${n===1?'':'s'}</span></div><button class="cerrar" onclick="cerrarMenuDia()" aria-label="Cerrar">×</button></div>
    ${a===b && COD_VAC.has(codigoDia(t, a)||'') ? `<button type="button" class="mdia-desp" onclick="empezarDesprog()"><b>Desprogramar</b>: pasar este día de vacaciones a otra fecha <small>${desprogDe(t, Number(a.slice(0,4))).length} de ${DESPROG} usadas</small></button>` : ''}
    <div class="mdia-ops">${OPS_DIA.map(([k,txt,cls],i)=>`<button type="button" class="${i<2?'grande':''}" onclick="aplicarDia('${k}')"${k==='H'&&!trab?' disabled title="Ningún día de trabajo en lo elegido"':''}><i class="${cls}">${k==='-H'?'—':k==='T'?'':k}</i>${txt}${k==='H'&&trab<n?` <small>${trab ? `${trab} día${trab===1?'':'s'}` : 'no se puede'}</small>`:''}</button>`).join('')}</div>
    <p class="mdia-pie">Lleva <b>${h} de ${vacDe(t)}</b> días de vacaciones. Las vacaciones solo van en días de trabajo: ni descansos, ni festivos${t.contrato==='discontinuo'?', ni inactividad':''}. ${SEL.tactil?'Toca':'Pincha'} otro día suyo para alargar${SEL.tactil?'':', o arrastra'}.</p>`;
  const nuevo = !m.parentNode; if(nuevo) document.body.appendChild(m);
  /* el clic que sigue al toque no debe pulsar un botón del menú que acaba de salir debajo del dedo */
  m.style.pointerEvents = 'none'; clearTimeout(m._t); m._t = setTimeout(()=>{ m.style.pointerEvents = ''; }, 400);
  colocarMenu();
  /* en el móvil el menú va abajo: que el día elegido quede a la vista por encima */
  if(innerWidth < 760){ const el = document.querySelector(`[data-t="${SEL.t}"][data-d="${SEL.b}"]`), r = el?.getBoundingClientRect();
    if(r && r.bottom > innerHeight - m.offsetHeight - 12){ scrollBy(0, r.bottom - (innerHeight - m.offsetHeight - 24)); } }
  m.querySelector('button.grande, .mdia-ina button.btn')?.focus({preventScroll:true});
}
/* ---------- inactividad de los FD: desde el calendario solo se cambian sus fechas ---------- */
function menuCese(t, k, a, b, n){
  const p = t.cese[k], y = Number(a.slice(0,4));
  const cab = `<div class="mdia-cab"><div><b>${esc(t.nombre)}</b><span>${a===b ? fmt(a) : `${fCorto(a)} – ${fmt(b)}`} · ${n} día${n===1?'':'s'}</span></div><button class="cerrar" onclick="cerrarMenuDia()" aria-label="Cerrar">×</button></div>`;
  if(!SEL.cese) return cab + `<div class="mdia-ina">
      <p class="mdia-ina-p"><i class="c-ina"></i><span>Periodo de inactividad: <b>${fCorto(p.desde)} – ${fmt(p.hasta)}</b></span></p>
      <button type="button" class="btn primario" onclick="editarCese(${k})">Cambiar fechas del periodo de inactividad</button></div>
    <p class="mdia-pie">Mientras está inactivo no se le puede poner nada: ni vacaciones, ni descansos, ni festivos. Solo se pueden mover las fechas del periodo.</p>`;
  return cab + `<div class="mdia-ina">
      <p class="mdia-ina-p"><i class="c-ina"></i><span>Antes: ${fCorto(p.desde)} – ${fmt(p.hasta)}</span></p>
      <div class="mdia-fechas"><label>Desde<input type="date" id="ceDesde" value="${SEL.cese.desde}" oninput="calcCese()"></label><label>Hasta<input type="date" id="ceHasta" value="${SEL.cese.hasta}" oninput="calcCese()"></label></div>
      <p id="ceInfo" class="mdia-ina-info"></p>
      <div class="mdia-ina-bot"><button type="button" class="btn" onclick="SEL.cese=null;abrirMenuDia()">Cancelar</button><button type="button" class="btn primario" id="ceOk" onclick="guardarCese()">Guardar fechas</button></div></div>`;
}
function editarCese(k){
  const t = S.trabajadores.find(x=>x.id===SEL.t), p = t.cese[k], [a, b] = rangoSel();
  /* si lo elegido sale del periodo, se propone alargarlo hasta ahí */
  SEL.cese = { k, desde: a < p.desde ? a : p.desde, hasta: b > p.hasta ? b : p.hasta };
  abrirMenuDia(); calcCese();
}
/* cuenta en vivo cuántos días para en el año con las fechas nuevas */
function cesePropuesto(){
  const t = S.trabajadores.find(x=>x.id===SEL.t), d = $('#ceDesde')?.value, h = $('#ceHasta')?.value;
  const cese = (t.cese||[]).map((p,i)=> i===SEL.cese.k ? { desde:d, hasta:h } : p);
  const y = Number(SEL.a.slice(0,4));
  let error = '';
  if(!d || !h) error = 'Pon las dos fechas.';
  else if(h < d) error = '«Hasta» no puede ir antes que «Desde».';
  else if(cese.some((p,i)=> i!==SEL.cese.k && p.desde<=h && d<=p.hasta)) error = 'Se solapa con otro periodo de inactividad suyo.';
  const dias = error ? 0 : diasInactivo({ ...t, cese }, y), largo = error ? 0 : Math.round((pd(h)-pd(d))/864e5) + 1;
  return { t, cese, y, error, dias, largo, corto: !error && dias < MIN_INACTIVO };
}
function calcCese(){
  if(!SEL?.cese || !$('#ceInfo')) return;
  const r = cesePropuesto(), info = $('#ceInfo');
  info.className = 'mdia-ina-info' + (r.error || r.corto ? ' mal' : '');
  info.innerHTML = r.error ? r.error
    : r.corto ? `<b>Ojo: solo ${r.dias} días de inactividad en ${r.y}.</b> Un fijo discontinuo tiene que parar al menos ${MIN_INACTIVO} días al año.`
    : `Este periodo: <b>${r.largo} días</b>. En ${r.y} para <b>${r.dias} días</b> (mínimo ${MIN_INACTIVO}).`;
  $('#ceOk').disabled = !!r.error;
  colocarMenu();
}
function guardarCese(){
  const r = cesePropuesto(); if(r.error){ calcCese(); return; }
  if(r.corto && !confirm(`Con estas fechas ${r.t.nombre} solo para ${r.dias} días en ${r.y}, y un fijo discontinuo tiene que parar al menos ${MIN_INACTIVO} días al año.\n\n¿Guardarlas igualmente?`)) return;
  const t = r.t, nuevo = r.cese[SEL.cese.k];
  DESHACER.push({ id:t.id, y:r.y, antes: t.rot?.[r.y] ?? null, cese: JSON.stringify(t.cese || []) });
  if(DESHACER.length > 50) DESHACER.shift();
  t.cese = r.cese.sort((x,z)=>x.desde<z.desde?-1:1);
  guardar(); cerrarMenuDia(); pintar();
  toast(`Inactividad del ${fCorto(nuevo.desde)} al ${fmt(nuevo.hasta)} · para ${r.dias} días en ${r.y}${r.corto?` (mínimo ${MIN_INACTIVO})`:''}`);
}
function colocarMenu(){
  const m = $('#menuDia'); if(!m || !SEL) return;
  const el = document.querySelector(`[data-t="${SEL.t}"][data-d="${SEL.b}"]`) || SEL.el; if(!el) return;
  const r = el.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight, vw = innerWidth, vh = innerHeight;
  if(vw < 760){ m.style.left = '8px'; m.style.top = (vh - h - 8) + 'px'; return; }
  let x = r.right + 8, y = r.top - 10;
  if(x + w > vw - 8) x = r.left - w - 8;
  if(x < 8) x = Math.max(8, Math.min(vw - w - 8, r.left + r.width/2 - w/2));
  if(y + h > vh - 8) y = vh - h - 8;
  if(y < 62) y = 62;
  m.style.left = x + 'px'; m.style.top = y + 'px';
}
/* cambia los días elegidos en la rotación de esa persona */
function aplicarDia(cod){
  if(!SEL) return;
  const t = S.trabajadores.find(x=>x.id===SEL.t); if(!t) return cerrarMenuDia();
  const [a, b] = rangoSel(), y = Number(a.slice(0,4));
  if((t.cese||[]).some(p=>p.desde<=b && a<=p.hasta) && t.contrato==='discontinuo'){ toast('En su periodo de inactividad solo se pueden cambiar las fechas del periodo'); return; }
  t.rot = t.rot || {};
  const antes = t.rot[y] ?? null;
  const arr = antes ? antes.split(',') : Array(diasAnio(y)).fill('?');
  let cambiados = 0;
  for(let d=a; d<=b; d=sumaDias(d,1)){
    if(d.slice(0,4)!==String(y)) continue;
    const i = idxDia(d), cur = arr[i] ?? '?';
    let nuevo = cur;
    if(cod==='H'){ if(admiteVac(t, d, cur)) nuevo = 'H'; }
    else if(cod==='-H'){ if(COD_VAC.has(cur)) nuevo = ''; }
    else if(cod==='T') nuevo = '';
    else nuevo = cod;
    if(nuevo!==cur){ arr[i] = nuevo; cambiados++; }
  }
  if(!cambiados){ toast(cod==='H' ? (enCese(t, a) || enCese(t, b) ? 'En su periodo de inactividad no se pueden poner vacaciones' : 'No hay días de trabajo en lo que has elegido (descansos y festivos no cuentan)') : cod==='-H' ? 'No había vacaciones en esos días' : 'Esos días ya estaban así'); return; }
  DESHACER.push({ id:t.id, y, antes });
  if(DESHACER.length > 50) DESHACER.shift();
  t.rot[y] = arr.join(',');
  guardar(); cerrarMenuDia(); pintar();
  const h = vacEnRot(t, y), v = vacDe(t), nombre = OPS_DIA.find(o=>o[0]===cod)[1].toLowerCase();
  toast(cod==='H' ? `${cambiados} día${cambiados===1?'':'s'} de vacaciones · lleva ${h} de ${v}${h>v?` (se pasa en ${h-v})`:''}`
      : cod==='-H' ? `${cambiados} día${cambiados===1?'':'s'} de vacaciones quitado${cambiados===1?'':'s'} · lleva ${h} de ${v}`
      : `${cambiados} día${cambiados===1?'':'s'}: ${nombre}`);
}
/* ---------- desprogramaciones: mover un día de vacaciones a otra fecha (3 al año por convenio) ---------- */
const DESPROG = 3;
const desprogDe = (t, y=S.anio) => (t.desprog?.[y] || []);
const movidoA = (t, d) => desprogDe(t, Number(d.slice(0,4))).find(m=>m.a===d);
let MOVER = null;   // { t, desde } mientras se elige el día nuevo
function empezarDesprog(){
  if(!SEL) return;
  const t = S.trabajadores.find(x=>x.id===SEL.t), d = SEL.a, y = Number(d.slice(0,4)), usadas = desprogDe(t, y).length;
  if(usadas >= DESPROG && !confirm(`${t.nombre} ya ha usado sus ${DESPROG} desprogramaciones de ${y}. ¿Hacer otra igualmente?`)) return;
  MOVER = { t:t.id, desde:d };
  cerrarMenuDia(); pintarMover();
}
function pintarMover(){
  $('#moverAviso')?.remove(); if(!MOVER) return;
  const t = S.trabajadores.find(x=>x.id===MOVER.t), y = Number(MOVER.desde.slice(0,4));
  const d = document.createElement('div'); d.id = 'moverAviso'; d.className = 'mover-aviso';
  d.innerHTML = `<span><b>Desprogramación ${desprogDe(t, y).length + 1} de ${DESPROG}</b> · ${esc(t.nombre)}: ${UI.vista==='vacaciones'?'pincha':'elige'} el día de trabajo al que pasa el ${fCorto(MOVER.desde)}.</span><button class="btn" onclick="cancelarMover()">Cancelar</button>`;
  document.body.appendChild(d);
  document.querySelectorAll('.dorig').forEach(x=>x.classList.remove('dorig'));
  document.querySelector(`[data-t="${MOVER.t}"][data-d="${MOVER.desde}"]`)?.classList.add('dorig');
}
function cancelarMover(){ MOVER = null; $('#moverAviso')?.remove(); document.querySelectorAll('.dorig').forEach(x=>x.classList.remove('dorig')); }
/* el día nuevo: tiene que ser de la misma persona, del mismo año y de trabajo */
function terminarDesprog(c){
  const t = S.trabajadores.find(x=>x.id===MOVER.t), a = c.dataset.d, de = MOVER.desde, y = Number(de.slice(0,4));
  if(c.dataset.t!==MOVER.t){ toast(`Elige un día de ${t.nombre}`); return; }

  if(Number(a.slice(0,4))!==y){ toast(`Tiene que ser un día de ${y}`); return; }
  const arr = t.rot[y].split(','), i = idxDia(a), cur = arr[i];
  if(enCese(t, a)){ toast('Ese día está en su periodo de inactividad: no puede tener vacaciones'); return; }

}
function quitarDesprog(id, y, k){
  const t = S.trabajadores.find(x=>x.id===id), m = desprogDe(t, y)[k]; if(!m) return;
  if(!confirm(`¿Deshacer la desprogramación del ${fCorto(m.de)} al ${fCorto(m.a)}? Las vacaciones vuelven al ${fCorto(m.de)}.`)) return;
  const arr = t.rot[y].split(',');
  DESHACER.push({ id:t.id, y, antes:t.rot[y], desprog: JSON.stringify(t.desprog || {}) });
  if(COD_VAC.has(arr[idxDia(m.a)])) arr[idxDia(m.a)] = '';

  t.rot[y] = arr.join(','); t.desprog[y] = desprogDe(t, y).filter((_,i)=>i!==k);
  guardar(); pintar(); toast('Desprogramación deshecha');
}

function deshacerDia(){
  const u = DESHACER.pop(); if(!u) return;
  const t = S.trabajadores.find(x=>x.id===u.id); if(!t) return;
  if(u.antes==null) delete t.rot[u.y]; else t.rot[u.y] = u.antes;
  if(u.desprog!=null) t.desprog = JSON.parse(u.desprog);
  if(u.cese!=null) t.cese = JSON.parse(u.cese);

/* =========================================================
   Copias: guardar y cargar
   Los datos viven en cada navegador. «Guardar» descarga un

const CLAVE_ANTES = CLAVE + '-antes-de-cargar';
const fechaHora = iso => { if(!iso) return '—'; const d = new Date(iso);
  return `${d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})} a las ${d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`; };
const fechaCorta = iso => { const d = new Date(iso); return `${d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})} ${d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`; };
function dispositivo(){
  const u = navigator.userAgent;
  const so = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : '';
  const tipo = /Mobi|iPhone|Android.*Mobile/.test(u) ? 'Móvil' : /iPad|Tablet|Android/.test(u) ? 'Tableta' : 'Ordenador';
  return so ? `${tipo} (${so})` : tipo;
}
function apuntarRegistro(tipo, copia){
  S.registro = [{ tipo, el: new Date().toISOString(), copia, disp: dispositivo() }, ...(S.registro || [])].slice(0, 30);
}
const resumenDatos = d => {
  const ts = d.trabajadores || [];
  return { n: ts.length, rot: ts.filter(t=>t.rot && Object.keys(t.rot).length).length, sem: ts.reduce((a,t)=>a + Object.keys(t.horas||{}).length, 0) };
};
async function guardarCopia(){
  const ahora = new Date(), iso = ahora.toISOString();

  S.ultimaCopia = { el: iso, disp: dispositivo() };
  guardar(false);
  const datos = { app:'Control Planning', version: APP_VERSION, guardada: iso, dispositivo: dispositivo(), datos: S };
  const p = n => String(n).padStart(2,'0');
  const nombre = `control-planning_${ahora.getFullYear()}-${p(ahora.getMonth()+1)}-${p(ahora.getDate())}_${p(ahora.getHours())}-${p(ahora.getMinutes())}.json`;
  const archivo = new File([JSON.stringify(datos)], nombre, { type:'application/json' });
  /* en el móvil se abre el menú de compartir (guardar en Archivos, enviarlo…); en el ordenador se descarga */
  if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files:[archivo] })){
    try { await navigator.share({ files:[archivo], title:'Copia de Control Planning' }); toast(`Copia del ${fechaCorta(iso)} lista`); pintar(); return; }
    catch(e){ if(e.name==='AbortError'){ toast('No se ha guardado la copia'); return; } }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(archivo); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(`Copia guardada: ${fechaCorta(iso)} · ${nombre}`);

}

async function leerRotaciones(f){

/* una celda de la fila de fechas: número de fecha de Excel, 15/03/2027 o 2027-03-15 */
function fechaCelda(v){
  if(typeof v==='number') return v>36000 && v<60000 && v%1===0 ? isoDe(new Date(Date.UTC(1899,11,30) + v*864e5)) : null;
  const s = String(v ?? '').trim(); let m;
  if((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  return null;
}
function prepararRot(hojas, archivo){
  /* la fila con más fechas de todas las hojas es la cabecera */
  let mejor = null;
  hojas.forEach(h=>h.filas.forEach((f, ri)=>{ const fechas = {}; let n = 0;
    f.forEach((v, c)=>{ const d = fechaCelda(v); if(d){ fechas[c] = d; n++; } });
    if(n>=28 && (!mejor || n>mejor.n)) mejor = {h, ri, fechas, n}; }));
  if(!mejor) return toast('No encuentro la fila con las fechas de los días. ¿Es una rotación anual?');
  const {h, ri, fechas} = mejor, abajo = h.filas.slice(ri+1), ancho = Math.max(0, ...h.filas.map(f=>f.length));
  let cn = -1, mx = 0;
  for(let c=0; c<ancho; c++){ if(fechas[c]) continue; const k = abajo.filter(f=>esNombre(f[c])).length; if(k>mx){ mx = k; cn = c; } }
  if(cn<0) return toast('No encuentro los nombres de los trabajadores');
  let grupoAct = ''; const grupoDe = new Map();
  abajo.forEach(f=>{ const v = String(f[cn] ?? '').trim(); const m = v.match(/^(grupo|equipo|turno)\s*(\w+)$/i);
    if(m) grupoAct = m[1][0].toUpperCase() + m[1].slice(1).toLowerCase() + ' ' + m[2];
    else if(esNombre(f[cn])) grupoDe.set(f, grupoAct); });
  const datos = abajo.filter(f=>esNombre(f[cn]));
  let ci = -1;
  for(let c=0; c<ancho; c++){ if(c===cn || fechas[c]) continue; const k = datos.filter(f=>/^\d{4,10}$/.test(String(f[c] ?? '').trim())).length; if(k && k>=datos.length*0.6){ ci = c; break; } }
  const porAnio = {}; Object.values(fechas).forEach(d=>{ const y = d.slice(0,4); porAnio[y] = (porAnio[y]||0) + 1; });
  const y = Number(Object.keys(porAnio).sort((a,b)=>porAnio[b]-porAnio[a])[0]);
  const cols = Object.keys(fechas).map(Number).filter(c=>fechas[c].startsWith(y+'-'));
  const codigos = {};
  ROT = { archivo, y, completo: porAnio[y]===diasAnio(y), hayNum: ci>=0, ponerNum: true,
    negocio: ORGI.negocio, depto: ORGI.depto, filas: datos.map(f=>{

    cols.forEach(c=>{ const v = f[c]; const cod = v==null || v==='' ? '' : String(v).trim().toUpperCase().replace(/,/g,' ');
      dias[idxDia(fechas[c])] = cod; codigos[cod] = (codigos[cod]||0) + 1; });
    const m = emparejarOrg(nombre, num ? [num] : []);
    return { nombre, num, grupo: grupoDe.get(f) || '', dias, trab: dias.filter(c=>!NO_TRABAJO.has(c)).length, vac: dias.filter(c=>COD_VAC.has(c)).length, id:m.id, como:m.como, manual:false };
  }) };
  ROT.codigos = codigos;
  pintarRot(true);
}

/* ---------- lectura de archivos ---------- */
async function leerArchivo(f){
  if(!f) return;
  if(/\.xls$/i.test(f.name)) return toast('Ese Excel es del formato antiguo (.xls). Guárdalo como .xlsx o .csv y vuelve a subirlo');
  try {
    const buf = await f.arrayBuffer(), b = new Uint8Array(buf);
    const hojas = (b[0]===0x50 && b[1]===0x4B) ? await leerXlsx(buf) : [{ nombre: f.name, filas: leerCSV(textoDe(b)) }];
    prepararImport(hojas, f.name);
  } catch(e){ console.error(e); toast('No se ha podido leer el archivo. Prueba a guardarlo como .xlsx o .csv'); }
}
function leerPegadoImp(){
  const t = $('#impPegado')?.value || '';
  if(!t.trim()) return toast('Elige un archivo o pega las filas');
  prepararImport([{ nombre:'Filas pegadas', filas: leerCSV(t) }], 'Filas pegadas');

function textoDe(b){ try { return new TextDecoder('utf-8', {fatal:true}).decode(b); } catch(e){ return new TextDecoder('windows-1252').decode(b); } }
function leerCSV(t){
  t = t.replace(/^﻿/, '');
  const primera = t.split(/\r?\n/).find(l=>l.trim()) || '';
  const sep = ['\t',';',','].map(c=>[c, primera.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const filas = []; let fila = [], campo = '', comillas = false;
  for(let i=0; i<t.length; i++){
    const c = t[i];
    if(comillas){ if(c==='"'){ if(t[i+1]==='"'){ campo+='"'; i++; } else comillas = false; } else campo += c; }
    else if(c==='"' && campo==='') comillas = true;
    else if(c===sep){ fila.push(campo); campo=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && t[i+1]==='\n') i++; fila.push(campo); filas.push(fila); fila=[]; campo=''; }
    else campo += c;
  }
  if(campo!=='' || fila.length){ fila.push(campo); filas.push(fila); }
  return filas.map(f=>f.map(x=>x.trim()));
}
/* .xlsx: es un zip con XML dentro; se descomprime con el navegador, sin librerías */
async function leerXlsx(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = -1; for(let i=u8.length-22; i>=Math.max(0, u8.length-70000); i--){ if(dv.getUint32(i,true)===0x06054b50){ e = i; break; } }
  if(e<0) throw new Error('zip sin directorio');
  const n = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true); const ent = {};
  for(let k=0; k<n; k++){
    const met = dv.getUint16(p+10,true), tam = dv.getUint32(p+20,true), ln = dv.getUint16(p+28,true), lx = dv.getUint16(p+30,true), lc = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    ent[dec.decode(u8.subarray(p+46, p+46+ln))] = {met, tam, off}; p += 46+ln+lx+lc;
  }
  const leer = async nombre => {
    const x = ent[nombre]; if(!x) return null;
    const ini = x.off + 30 + dv.getUint16(x.off+26,true) + dv.getUint16(x.off+28,true), datos = u8.subarray(ini, ini+x.tam);
    if(x.met===0) return dec.decode(datos);
    const s = new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return dec.decode(await new Response(s).arrayBuffer());
  };
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const tags = (n, t) => Array.from(n.getElementsByTagName(t));
  const ss = await leer('xl/sharedStrings.xml');
  const compartidas = ss ? tags(xml(ss), 'si').map(si=>tags(si,'t').map(x=>x.textContent).join('')) : [];
  const wb = xml(await leer('xl/workbook.xml')), rels = xml(await leer('xl/_rels/workbook.xml.rels') || '<r/>');
  const destino = {}; tags(rels, 'Relationship').forEach(r=>destino[r.getAttribute('Id')] = r.getAttribute('Target'));
  const hojas = [];
  for(const h of tags(wb, 'sheet')){
    const rid = h.getAttribute('r:id') || h.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let ruta = destino[rid] || ''; ruta = ruta.startsWith('/') ? ruta.slice(1) : 'xl/' + ruta.replace(/^\.\//,'');
    const t = await leer(ruta); if(!t) continue;
    const filas = [];
    tags(xml(t), 'row').forEach(row=>{
      const r = Number(row.getAttribute('r')) - 1 || filas.length, fila = [];
      tags(row, 'c').forEach((c, i)=>{
        const ref = c.getAttribute('r'); let col = i;
        if(ref){ col = 0; for(const ch of ref.replace(/\d+/g,'')) col = col*26 + ch.charCodeAt(0) - 64; col--; }
        const tipo = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]?.textContent;
        let val = '';
        if(tipo==='s') val = compartidas[Number(v)] ?? '';
        else if(tipo==='inlineStr') val = tags(c,'t').map(x=>x.textContent).join('');
        else if(tipo==='b') val = v==='1' ? 'VERDADERO' : 'FALSO';
        else if(v!=null) val = tipo==='str' || tipo==='e' ? v : Number(v);
        fila[col] = val;
      });
      filas[r] = Array.from(fila, x=>x ?? '');
    });
    hojas.push({ nombre: h.getAttribute('name') || `Hoja ${hojas.length+1}`, filas: Array.from(filas, f=>f || []) });
  }
  if(!hojas.length) throw new Error('sin hojas');
  return hojas;
}

/* ---------- interpretar lo leído ---------- */
const sinAcentos = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const normNombre = s => sinAcentos(s).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const PARTICULAS = new Set(['DE','DEL','LA','LAS','LOS','Y','I','DA','DO','DOS','VAN','VON','SAN']);
const fichasDe = s => normNombre(s).split(' ').filter(x=>x && !PARTICULAS.has(x));
const CABECERAS = /^(nombre|nombres|apellidos?|trabajador(es)?|emplead[oa]s?|agente|personal|total(es)?|semana|turnos?|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo|horas?|departamento|puesto|categor[ií]a)\b/i;
/* una celda parece un nombre: palabras con letras, sin números */
const esNombre = v => typeof v==='string' && v.length<=70 && !/\d/.test(v) && !CABECERAS.test(v.trim()) && sinAcentos(v).split(/[\s,]+/).filter(w=>/^[A-Za-zÑñ'.·-]{2,}$/.test(w)).length >= 2;
/* horas de una celda: 37,5 · 37:30 · 06:00-14:00 · 6-14 / 16-20; los códigos (R, F, X, LIBRE…) cuentan 0 */
function horasDe(v){
  if(typeof v==='number') return isFinite(v) ? {h:v, num:true} : null;
  const s = String(v ?? '').trim(); if(!s) return null;
  const t = s.replace(',', '.');
  if(/^-?\d+(\.\d+)?\s*h?$/i.test(t)) return {h:parseFloat(t), num:true};
  let m = t.match(/^(\d{1,3}):(\d{2})(?::\d{2})?$/); if(m) return {h:Number(m[1]) + Number(m[2])/60, num:true};
  const re = /(\d{1,2})(?:[:.h](\d{2}))?\s*(?:-|–|—|a)\s*(\d{1,2})(?:[:.h](\d{2}))?/g; let suma = 0, hay = false;
  while((m = re.exec(t))){ const a = Number(m[1]) + Number(m[2]||0)/60; let b = Number(m[3]) + Number(m[4]||0)/60;
    if(a>24 || b>24) continue; if(b<=a) b += 24; suma += b - a; hay = true; }
  if(hay) return {h:suma, num:true};
  if(/^[A-Za-zÑñ.\/ ]{1,8}$/.test(s)) return {h:0, num:false};
  return null;
}
const letraCol = i => { let s = ''; i++; while(i>0){ const r = (i-1)%26; s = String.fromCharCode(65+r) + s; i = Math.floor((i-1)/26); } return s; };

function prepararImport(hojas, archivo){
  hojas.forEach(h=>{ const n = Math.max(0, ...h.filas.map(f=>f.length)); h.filas = h.filas.map(f=>Array.from({length:n}, (_,i)=>f[i] ?? '')); });
  const cuenta = h => { const n = h.filas[0]?.length || 0; let mx = 0; for(let c=0;c<n;c++) mx = Math.max(mx, h.filas.filter(f=>esNombre(f[c])).length); return mx; };
  const hoja = hojas.map((h,i)=>[i, cuenta(h)]).sort((a,b)=>b[1]-a[1])[0][0];
  IMP = { hojas, hoja, archivo };
  analizarHoja();
  if(IMP.colNombre<0){ IMP = null; return toast('No encuentro nombres de trabajadores en el archivo'); }
  pintarImport(true);
}
/* busca la columna de nombres, la cabecera, las columnas de horas y la semana */
function analizarHoja(colNombre){
  const filas = IMP.hojas[IMP.hoja].filas, n = filas[0]?.length || 0;
  if(colNombre==null){ let mx = 0; colNombre = -1;
    for(let c=0;c<n;c++){ const k = filas.filter(f=>esNombre(f[c])).length; if(k>mx){ mx = k; colNombre = c; } } }
  IMP.colNombre = colNombre;
  const datos = colNombre<0 ? [] : filas.map((f,i)=>i).filter(i=>esNombre(filas[i][colNombre]));
  const primera = datos[0] ?? 0;
  let cab = -1; for(let i=primera-1; i>=0; i--){ if(filas[i].filter(x=>x!=='' && x!=null).length>=2){ cab = i; break; } }
  IMP.datos = datos; IMP.cab = cab;
  IMP.titulos = Array.from({length:n}, (_,c)=>{ const t = cab>=0 ? String(filas[cab][c] ?? '').trim() : ''; return t && typeof filas[cab][c]!=='number' ? t : ''; });
  /* columnas que pueden llevar horas */
  const info = Array.from({length:n}, (_,c)=>{
    if(c===colNombre) return null;
    const vals = datos.map(i=>filas[i][c]).filter(v=>v!=='' && v!=null);
    if(!vals.length) return null;
    const p = vals.map(horasDe), nums = p.filter(x=>x && x.num).map(x=>x.h);
    if(!nums.length || p.filter(Boolean).length < vals.length*0.7) return null;
    const max = Math.max(...nums);
    if(max>24*7 || nums.some(x=>x<0)) return null;
    if(/n[º°o]\b|n[uú]m|c[oó]d|\bid\b|dni|nif|emplead/i.test(IMP.titulos[c])) return null;
    if(nums.length>3 && nums.every((x,k)=>x===k+1)) return null;            // una columna 1, 2, 3…
    const dia = max<3 && nums.some(x=>x%1!==0);                              // horas guardadas como fracción del día
    return { c, dia };
  }).filter(Boolean);
  IMP.candidatas = info;
  const val = (i,c) => { const x = horasDe(filas[i][c]); const d = info.find(z=>z.c===c)?.dia; return x ? x.h * (d?24:1) : 0; };
  let elegidas;
  const total = info.filter(z=>/total|suma|horas|h\.?\s*sem|semana/i.test(IMP.titulos[z.c]));
  if(total.length) elegidas = [total[total.length-1].c];
  else if(info.length===1) elegidas = [info[0].c];
  else if(info.length>1){
    const ult = info[info.length-1].c, resto = info.slice(0,-1).map(z=>z.c);
    const cuadra = datos.filter(i=>Math.abs(val(i,ult) - resto.reduce((a,c)=>a+val(i,c),0)) < 0.05).length;
    elegidas = cuadra >= datos.length*0.8 ? [ult] : info.map(z=>z.c);
  } else elegidas = [];
  IMP.colsHoras = elegidas;
  IMP.lunes = semanaDelArchivo(filas, primera) || IMP.lunes || lunesDe(hoyIso());
  construirFilas();
}
/* la semana: una fecha escrita en el archivo, un número de fecha de Excel encima de los datos o «semana 12» */
function semanaDelArchivo(filas, primera){
  const fechas = [];
  const zona = filas.slice(0, Math.max(primera, 1));
  filas.forEach((f, i)=>f.forEach(v=>{
    if(typeof v==='number'){ if(i<primera && v>36000 && v<60000 && v%1===0) fechas.push(isoDe(new Date(Date.UTC(1899,11,30) + v*864e5))); return; }
    const s = String(v); let m;
    const re = /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})\b/g;
    while((m = re.exec(s))){ const y = m[3].length===2 ? 2000+Number(m[3]) : Number(m[3]), mo = Number(m[2]), d = Number(m[1]);
      if(mo>=1 && mo<=12 && d>=1 && d<=31) fechas.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`); }
    const re2 = /\b(\d{4})-(\d{2})-(\d{2})\b/g; while((m = re2.exec(s))) fechas.push(m[0]);
  }));
  if(fechas.length) return lunesDe(fechas.sort()[0]);
  for(const f of zona) for(const v of f){ const m = String(v).match(/semana\s*(?:n[º°o.]?\s*)?(\d{1,2})\b/i);
    if(m){ const w = Number(m[1]); if(w>=1 && w<=53) return sumaDias(lunesDe(`${S.anio}-01-04`), (w-1)*7); } }
  return null;
}
/* empareja un nombre del archivo con un trabajador */
/* dos palabras casi iguales: de 5 letras o más y a una letra de distancia (una de más, de menos o cambiada) */
function casiIgual(a, b){
  if(a===b) return true; if(a.length<5 || b.length<5 || Math.abs(a.length-b.length)>1) return false;
  let i = 0, j = 0, dif = 0;
  while(i<a.length && j<b.length){ if(a[i]===b[j]){ i++; j++; continue; } if(++dif>1) return false;
    if(a.length>b.length) i++; else if(b.length>a.length) j++; else { i++; j++; } }
  return dif + (a.length-i) + (b.length-j) <= 1;
}
function emparejar(nombre, fila, filtro){
  const ts = filtro ? S.trabajadores.filter(filtro) : S.trabajadores, k = normNombre(nombre);
  const al = S.alias[k]; if(al && S.trabajadores.some(t=>t.id===al)) return {id:al, como:'guardado'};
  const celdas = new Set(fila.map(v=>String(v).trim()).filter(Boolean));
  const pn = ts.filter(t=>t.num && celdas.has(String(t.num).trim())); if(pn.length===1) return {id:pn[0].id, como:'numero'};
  const ex = ts.filter(t=>normNombre(t.nombre)===k); if(ex.length===1) return {id:ex[0].id, como:'exacto'};
  const fa = fichasDe(nombre), clave = [...fa].sort().join(' ');
  const or = ts.filter(t=>[...fichasDe(t.nombre)].sort().join(' ')===clave); if(or.length===1) return {id:or[0].id, como:'orden'};
  const A = new Set(fa);
  /* palabras que coinciden; con faltas pequeñas también («BEZRUKAVY» y «BEZRUKAVYY») */
  const notas = ts.map(t=>{ const B = new Set(fichasDe(t.nombre)), usadas = new Set(); let com = 0;
    A.forEach(x=>{ if(B.has(x) && !usadas.has(x)){ usadas.add(x); com++; return; }
      const y = [...B].find(w=>!usadas.has(w) && !A.has(w) && casiIgual(x, w)); if(y){ usadas.add(y); com++; } });
    const sub = com>=2 && (com===A.size || com===B.size);
    return {t, j: com / (A.size + B.size - com || 1), sub}; });
  const subs = notas.filter(x=>x.sub); if(subs.length===1) return {id:subs[0].t.id, como:'posible'};
  const mej = notas.filter(x=>x.j>=0.6).sort((a,b)=>b.j-a.j);
  if(mej.length && (mej.length===1 || mej[0].j>mej[1].j)) return {id:mej[0].t.id, como:'posible'};
  return {id:'', como:'nada'};
}
function construirFilas(){
  const filas = IMP.hojas[IMP.hoja].filas, prev = IMP.filas || [];
  const fac = c => IMP.candidatas.find(z=>z.c===c)?.dia ? 24 : 1;
  IMP.filas = IMP.datos.map(i=>{
    const f = filas[i], nombre = String(f[IMP.colNombre]).replace(/\s+/g,' ').trim();
    const ps = IMP.colsHoras.map(c=>{ const x = horasDe(f[c]); return x ? x.h * fac(c) : null; });
    const horas = ps.some(x=>x!=null) ? r2(ps.reduce((a,x)=>a+(x||0),0)) : null;
    const antes = prev.find(p=>p.nombre===nombre && p.manual);
    const m = antes ? {id:antes.id, como:'manual'} : emparejarOrg(nombre, f);
    return { nombre, horas, id:m.id, como:m.como, manual:!!antes };
  });
}

function guardarImport(){
  const filas = IMP.filas.filter(f=>f.id && f.horas!=null); if(!filas.length) return;
  const suma = {};
  filas.forEach(f=>{
    let id = f.id;
    if(id==='nuevo'){ const t = nuevoTrabajador({ id:uid(), nombre:f.nombre, negocio:ORGI.negocio, depto:ORGI.depto, ...(f.nombre.includes(',') ? separarNombre(f.nombre) : {}) }); t.nombre = nombreCompleto(t); S.trabajadores.push(t); id = t.id; }
    else if(f.como==='posible' || f.como==='otro' || f.como==='manual') S.alias[normNombre(f.nombre)] = id;   // la próxima vez se empareja solo
    suma[id] = (suma[id]||0) + f.horas;
  });
  Object.entries(suma).forEach(([id,h])=>{ const t = S.trabajadores.find(x=>x.id===id); if(t){ t.horas = t.horas || {}; t.horas[IMP.lunes] = r2(h); } });

  if(anioSemana(l)!==S.anio) S.anio = anioSemana(l);
  guardar(); cerrarImportar(); pintar();
  toast(`Semana ${numSemana(l)}: ${nh(total)} h apuntadas a ${n} trabajador${n===1?'':'es'}`);
}

/* =========================================================
   Sincronizar entre tus dispositivos (repositorio privado de GitHub)
   Los datos van a un archivo datos.json de un repositorio PRIVADO tuyo.
   La clave (token) se guarda solo en cada dispositivo, nunca en este repositorio.
   ========================================================= */
var SYNC = (()=>{ try { return JSON.parse(localStorage.getItem(CLAVE + '-sync')) || {}; } catch(e){ return {}; } })();
SYNC.repo = SYNC.repo || 'jomafergacreations/control-planning-datos';
SYNC.ruta = SYNC.ruta || 'datos.json';
let SYNC_ESTADO = { tipo: SYNC.token ? 'va' : 'off', txt: SYNC.token ? 'Conectando…' : 'Sin configurar', el:null };
const guardarSyncCfg = () => { try { localStorage.setItem(CLAVE + '-sync', JSON.stringify(SYNC)); } catch(e){} };
/* lo que es de cada dispositivo no viaja */
const SOLO_AQUI = ['versionVista', 'registro', 'ultimaCopia', 'cargada'];
const resumenTxt = d => { const r = resumenDatos(d); return `${r.n} trabajadores · ${r.rot} con rotación · ${r.sem} semanas de horas`; };
const datosParaSubir = () => { const d = JSON.parse(JSON.stringify(S)); SOLO_AQUI.forEach(k=>delete d[k]); return d; };
const a64 = txt => { const by = new TextEncoder().encode(txt); let b = ''; for(let i=0;i<by.length;i+=0x8000) b += String.fromCharCode.apply(null, by.subarray(i, i+0x8000)); return btoa(b); };
const de64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')), c=>c.charCodeAt(0)));
async function gh(metodo, cuerpo){
  const r = await fetch(`https://api.github.com/repos/${SYNC.repo}/contents/${SYNC.ruta}${metodo==='GET' ? '?t=' + Date.now() : ''}`, {
    method: metodo, cache:'no-store',
    headers: { 'Authorization': `Bearer ${SYNC.token}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  if(r.status===404 && metodo==='GET') return null;
  if(!r.ok){ const e = new Error('gh ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function traerNube(){
  const j = await gh('GET'); if(!j) return null;
  let txt;
  if(j.content) txt = de64(j.content);
  else { const r = await fetch(j.download_url, { cache:'no-store', headers:{ 'Authorization': `Bearer ${SYNC.token}` } }); txt = await r.text(); }
  const c = JSON.parse(txt);
  return { sha: j.sha, datos: c.datos || c, cuando: c.guardada || c.datos?.modificado, disp: c.dispositivo || '' };
}
async function subirNube(){
  const copia = { app:'control-planning', version: APP_VERSION, guardada: new Date().toISOString(), dispositivo: dispositivo(), datos: datosParaSubir() };
  const cuerpo = { message: `Datos desde ${dispositivo()} (${fechaCorta(copia.guardada)})`, content: a64(JSON.stringify(copia)) };
  if(SYNC.sha) cuerpo.sha = SYNC.sha;
  const j = await gh('PUT', cuerpo);
  SYNC.sha = j.content.sha; SYNC.base = S.modificado; SYNC.ult = copia.guardada; guardarSyncCfg();
}
/* pone en este dispositivo lo que hay en la nube (guarda antes lo de aquí por si acaso) */
function aplicarNube(n){
  try { localStorage.setItem(CLAVE_ANTES, JSON.stringify(S)); } catch(e){}
  const quedan = Object.fromEntries(SOLO_AQUI.map(k=>[k, S[k]]));
  S = Object.assign(normalizar(JSON.parse(JSON.stringify(n.datos))), quedan);
  S.modificado = n.datos.modificado || n.cuando || null; guardar(false);
  SYNC.sha = n.sha; SYNC.base = S.modificado; SYNC.ult = new Date().toISOString(); guardarSyncCfg();
  DESHACER.length = 0; pintar();
}
const ocupado = () => !!($('#capa').innerHTML || $('#menuDia') || (typeof SEL!=='undefined' && SEL) || (typeof MOVER!=='undefined' && MOVER));
let SYNC_EN_CURSO = false, SYNC_OTRA = false, SYNC_CONFLICTO = null;
async function sincronizar(manual, intento=0){
  if(!SYNC.token) return pintarSync();
  if(SYNC_EN_CURSO){ SYNC_OTRA = true; return; }
  if(!navigator.onLine){ estadoSync('mal', 'Sin conexión', 'Se sincronizará al volver la conexión'); return; }
  SYNC_EN_CURSO = true; estadoSync('va', 'Sincronizando…');
  try {
    const n = await traerNube();
    const loc = S.modificado || '', rem = n?.datos?.modificado || '', base = SYNC.base || '';
    const hayLocal = loc && loc !== base, hayNube = n && rem !== base;
    if(!n){ if(S.trabajadores.length || loc) await subirNube(); }
    else if(rem === loc){ SYNC.sha = n.sha; SYNC.base = loc; guardarSyncCfg(); }
    else if(hayLocal && hayNube && base){ SYNC_CONFLICTO = n; SYNC.sha = n.sha; estadoSync('aviso', 'Cambios en los dos sitios', 'Elige qué datos te quedas'); SYNC_EN_CURSO = false; abrirSync(); return; }
    else if(hayNube && (!hayLocal || !base) && (!loc || rem > loc || !hayLocal)){
      if(ocupado() && !manual){ SYNC.sha = n.sha; estadoSync('aviso', 'Hay datos nuevos', 'Se traerán al cerrar lo que tienes abierto'); SYNC_EN_CURSO = false; setTimeout(()=>sincronizar(), 4000); return; }
      aplicarNube(n); toast(`Datos al día: traídos del ${n.disp || 'otro dispositivo'}`);
    }
    else { SYNC.sha = n.sha; await subirNube(); }
    estadoSync('ok', 'Al día', `Sincronizado a las ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`);
  } catch(e){
    if((e.status===409 || e.status===422) && intento < 2){ SYNC.sha = null; SYNC_EN_CURSO = false; return sincronizar(manual, intento + 1); }
    estadoSync('mal', e.status===401 || e.status===403 ? 'La clave no vale' : e.status===404 ? 'No encuentro el repositorio' : 'No se ha podido sincronizar',
      e.status===401 || e.status===403 ? 'Revisa el token en Sincronizar' : e.status===404 ? `Comprueba que existe ${SYNC.repo} y que el token tiene acceso` : 'Se volverá a intentar en un momento');
    if(!e.status) setTimeout(()=>sincronizar(), 30000);
  }
  SYNC_EN_CURSO = false;
  if(SYNC_OTRA){ SYNC_OTRA = false; sincronizar(); }
}
/* cada cambio se sube a los pocos segundos */
function programarSync(){
  if(typeof SYNC==='undefined' || !SYNC.token) return;
  clearTimeout(programarSync._t); estadoSync('va', 'Cambios por subir');
  programarSync._t = setTimeout(()=>sincronizar(), 2500);
}
function estadoSync(tipo, txt, sub=''){ SYNC_ESTADO = { tipo, txt, sub }; pintarSync(); }
function pintarSync(){
  const p = $('#syncPunto'), t = $('#syncTxt'), e = SYNC.token ? SYNC_ESTADO : { tipo:'off', txt:'Sincronizar', sub:'Sin configurar' };

  const b = $('#syncBtn'); if(b) b.title = [e.txt, e.sub].filter(Boolean).join(' · ');
  const d = $('#syncDlgEstado'); if(d) d.innerHTML = estadoSyncHTML();
}
const estadoSyncHTML = () => { const e = SYNC_ESTADO;
  const err = !SYNC.token && e.tipo==='mal';
  return `<div class="sync-estado"><i class="${SYNC.token || err ? e.tipo : ''}"></i><span><b>${SYNC.token || err ? esc(e.txt) : 'No conectado'}</b><small>${SYNC.token || err ? esc(e.sub || '') : 'Los datos solo están en este dispositivo'}${SYNC.ult ? ` · última subida o bajada: ${fechaCorta(SYNC.ult)}` : ''}</small></span></div>`; };
function abrirSync(){
  const c = SYNC_CONFLICTO;
  $('#capa').innerHTML = `<div class="fondo" onclick="if(event.target===this)cerrarSync()"><div class="dlg sync" role="dialog" aria-modal="true" aria-label="Sincronizar">
    <div class="dlg-cab"><h2>Sincronizar entre tus dispositivos</h2><button class="cerrar" onclick="cerrarSync()" aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      ${c ? `<div><p style="margin:0 0 10px"><b>Has cambiado datos aquí y en otro dispositivo desde la última vez.</b> Elige con cuáles te quedas; los otros se guardan aparte por si hiciera falta volver.</p>
        <div class="sync-dos"><button onclick="resolverSync('aqui')"><b>Los de este dispositivo</b><small>Último cambio: ${fechaCorta(S.modificado)}</small><small>${resumenTxt(S)}</small></button>
        <button onclick="resolverSync('nube')"><b>Los de la nube</b><small>Subidos desde ${esc(c.disp || 'otro dispositivo')}: ${fechaCorta(c.datos.modificado || c.cuando)}</small><small>${resumenTxt(c.datos)}</small></button></div></div>` : ''}
      <div id="syncDlgEstado">${estadoSyncHTML()}</div>
      ${SYNC.token ? `<p class="muted" style="margin:0">Cada cambio se sube solo a los pocos segundos, y al abrir la app o volver a ella se traen los cambios del otro dispositivo. Los datos están en <b>${esc(SYNC.repo)}</b> (privado).</p>
        <div class="fila"><button class="btn primario" onclick="sincronizar(true)">Sincronizar ahora</button><button class="btn" onclick="desconectarSync()">Desconectar este dispositivo</button></div>`
      : `<p style="margin:0">Los datos se guardan en un repositorio <b>privado</b> de tu cuenta de GitHub. Solo hay que prepararlo una vez:</p>
        <ol class="sync-pasos">
          <li>En GitHub, crea un repositorio nuevo llamado <b>control-planning-datos</b> y márcalo como <b>Private</b>.</li>
          <li>Ve a Settings › Developer settings › Personal access tokens › <b>Fine-grained tokens</b> › Generate new token. En «Repository access» elige <b>Only select repositories</b> y ese repositorio; en «Permissions › Contents» pon <b>Read and write</b>. Ponle una caducidad larga.</li>
          <li>Pega el token aquí, en el ordenador y en el móvil. Empieza por el dispositivo que tiene los datos buenos.</li>
        </ol>
        <label>Repositorio<input id="syncRepo" value="${esc(SYNC.repo)}" autocomplete="off" spellcheck="false"></label>
        <label>Token<input id="syncTok" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></label>
        <div class="fila"><button class="btn primario" onclick="conectarSync()">Conectar</button></div>`}
    </div></div></div>`;
}
function cerrarSync(){ vaciarCapa(); }
async function conectarSync(){
  const tok = $('#syncTok').value.trim(), repo = $('#syncRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
  if(!tok || !/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast('Pon el repositorio (usuario/nombre) y el token'); return; }
  SYNC = { repo, ruta: SYNC.ruta || 'datos.json', token: tok }; guardarSyncCfg();
  estadoSync('va', 'Conectando…'); abrirSync();
  try {
    const n = await traerNube();
    if(n && S.trabajadores.length && (n.datos.modificado || '') !== (S.modificado || '')){ SYNC_CONFLICTO = n; SYNC.sha = n.sha; estadoSync('aviso', 'Ya hay datos en la nube', 'Elige con cuáles te quedas'); abrirSync(); return; }
    if(n){ SYNC.sha = n.sha; if((n.datos.modificado||'') === (S.modificado||'')){ SYNC.base = S.modificado; guardarSyncCfg(); } else { aplicarNube(n); } }
    else await subirNube();
    estadoSync('ok', 'Al día', 'Conectado'); abrirSync(); toast(n ? 'Conectado: datos traídos de la nube' : 'Conectado: datos subidos a la nube');
  } catch(e){
    SYNC.token = ''; guardarSyncCfg();
    estadoSync('mal', e.status===401 || e.status===403 ? 'La clave no vale' : e.status===404 ? 'No encuentro el repositorio' : 'No se ha podido conectar',
      e.status===404 ? 'Comprueba el nombre y que el token tiene acceso a ese repositorio' : 'Revisa el token y vuelve a probar');
    abrirSync();
  }
}
async function resolverSync(cual){
  const n = SYNC_CONFLICTO; if(!n) return; SYNC_CONFLICTO = null;
  try {
    if(cual==='nube'){ aplicarNube(n); toast('Te has quedado con los datos de la nube'); }
    else { try { localStorage.setItem(CLAVE_ANTES, JSON.stringify(n.datos)); } catch(e){} SYNC.sha = n.sha; await subirNube(); toast('Subidos los datos de este dispositivo'); }
    estadoSync('ok', 'Al día', `Sincronizado a las ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`);
  } catch(e){ estadoSync('mal', 'No se ha podido sincronizar', 'Vuelve a probar'); }
  abrirSync();
}
function desconectarSync(){
  if(!confirm('Este dispositivo dejará de sincronizarse. Los datos se quedan aquí y en la nube. ¿Desconectar?')) return;
  SYNC = { repo: SYNC.repo, ruta: SYNC.ruta }; guardarSyncCfg(); SYNC_ESTADO = { tipo:'off', txt:'Sin configurar' }; pintarSync(); abrirSync();
}
addEventListener('online', ()=>sincronizar());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') sincronizar(); });

/* ---------- arranque ---------- */
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#bloqueo') && $('#capa').innerHTML){ UI.edit=null; $('#capa').innerHTML=''; } });
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
pintar(true);
puntoNovedades();
{ const v = document.getElementById("verTxt"); if(v) v.textContent = APP_VERSION; }
comprobarVersion(); setInterval(comprobarVersion, 60*1000);
pintarSync(); if(SYNC.token) sincronizar();

if(/[?&]v=/.test(location.search)) history.replaceState(null, '', location.pathname);
</script>
</body>
