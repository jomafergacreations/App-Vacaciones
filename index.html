<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22262E">
<title>Vacaciones AGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="pageStyle">@page{size:A4 landscape;margin:12mm}</style>
<style>
/* Identidad: señalética de aeropuerto.
   Asfalto y hormigón de plataforma como base, amarillo de cartel de dirección para lo que pide acción ahora,
   azul de pista para lo interactivo. Barlow (rótulos de carretera) en versión condensada para titulares y cifras. */
:root{
  --asfalto:#22262E; --hormigon:#ECEEF1; --papel:#FFFFFF; --linea:#D9DDE3; --gris:#5F6775;
  --senal:#F6C300; --senal-soft:#FFF6D1;
  --pista:#1F5FBF; --pista-soft:#E6EEFA;
  --ok:#23864F; --ok-soft:#E2F2E8; --warn:#B86E00; --warn-soft:#FFF1D2; --bad:#C23B30; --bad-soft:#FBE4E1;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--text);background:var(--hormigon);color:var(--asfalto);font-size:15px;line-height:1.5;overflow-x:hidden}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* cabecera */
header.app{background:var(--asfalto);color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;height:58px;position:sticky;top:0;z-index:6}
.logo{width:34px;height:34px;border-radius:7px;background:var(--senal);color:var(--asfalto);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
header.app h1{font-family:var(--cond);font-weight:700;font-size:23px;letter-spacing:.01em;margin:0;flex:1;white-space:nowrap}
.ciclo{font-family:var(--cond);font-size:15px;color:#B8BEC9;white-space:nowrap}
.ciclo b{color:var(--senal);font-size:22px;font-weight:700;margin-left:4px}
#hdrDep{width:auto;margin:0;background:#363B45;color:#fff;border:1px solid #4A505C;font-weight:600;padding:7px 10px;max-width:230px}

/* pasos */
nav.pasos{display:flex;gap:4px;overflow-x:auto;background:var(--papel);border-bottom:1px solid var(--linea);padding:9px 12px;position:sticky;top:58px;z-index:5;scrollbar-width:none}
nav.pasos::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px 6px 6px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;color:var(--gris);white-space:nowrap;cursor:pointer}
.step:hover{background:var(--hormigon)}
.step .num{width:24px;height:24px;border-radius:5px;background:var(--hormigon);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--gris)}
.step.done .num{background:var(--ok);color:#fff}
.step.on{background:var(--senal);color:var(--asfalto);font-weight:700}
.step.on .num{background:var(--asfalto);color:var(--senal)}
.step.extra{padding-left:12px}
.sep{width:1px;background:var(--linea);margin:4px 6px;flex:0 0 1px}

main{max-width:1120px;margin:0 auto;padding:22px 18px 8px}
.intro{margin:0 0 20px;max-width:70ch}
.intro .k{font-size:14px;font-weight:600;color:var(--gris)}
.intro h2{font-family:var(--cond);font-size:38px;line-height:1.05;font-weight:700;margin:2px 0 8px;letter-spacing:-.005em}
.intro p{margin:0;color:var(--gris)}
.filtro{display:inline-flex;align-items:center;gap:6px;background:var(--asfalto);color:#fff;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:600;margin-top:10px}
.filtro button{background:none;border:0;color:var(--senal);font:inherit;cursor:pointer;padding:0 0 0 4px}

.card{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-family:var(--cond);font-size:23px;font-weight:600;margin:0 0 12px;line-height:1.15}
.card h3{font-family:var(--cond);font-size:18px;font-weight:600;margin:18px 0 6px}
.help{font-size:14px;color:var(--gris);margin:0 0 14px;max-width:72ch}
.muted{color:var(--gris);font-size:13px}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>label{flex:1 1 160px}
label{display:block;font-size:13px;color:var(--gris);font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--linea);border-radius:8px;font:inherit;font-weight:400;background:#fff;color:var(--asfalto)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pista);box-shadow:0 0 0 3px var(--pista-soft)}
input[type=checkbox]{display:inline-block;width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--pista)}
.chk{flex:0 1 auto!important;min-width:0;font-weight:500;color:var(--asfalto);font-size:15px;padding:6px 0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:#fff;color:var(--asfalto);padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#B9C0CA}
.btn.primary{background:var(--pista);border-color:var(--pista);color:#fff}
.btn.primary:hover{background:#184FA1}
.btn.ink{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pie{display:flex;justify-content:space-between;gap:10px;margin:10px 0 28px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--linea);vertical-align:middle}
th{font-size:13px;color:var(--gris);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--hormigon);font-family:var(--cond);font-weight:600;font-size:16px;padding:7px}
tr.grp .chip{font-family:var(--text);font-size:12px;margin-left:6px;vertical-align:1px}
.scroll{overflow-x:auto}

.chip{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12.5px;font-weight:600;background:var(--pista-soft);color:var(--pista);white-space:nowrap}
td .chip{white-space:normal}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.grey{background:var(--hormigon);color:var(--gris)}
.chip.mano{background:var(--senal-soft);color:#7A5B00}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:8px 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--asfalto)}
.pill.on{background:var(--asfalto);color:#fff;border-color:var(--asfalto)}
.seg{display:inline-flex;background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{border:0;background:none;font:inherit;font-weight:600;padding:8px 16px;border-radius:7px;cursor:pointer;color:var(--gris)}
.seg button.on{background:var(--asfalto);color:#fff}

/* departamentos */
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.gfila{border-top:1px solid var(--linea);padding:10px 0}
.gmeta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--gris);padding-left:16px}
.gmeta span{white-space:nowrap}
.gmeta select{flex:1;margin:0;padding:6px 8px;font-size:13px;min-width:0}
.dep{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:16px;border-top:6px solid var(--c);min-width:0}
.dep .nombre{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1.1;margin:0 0 2px}
.dep .cifras{display:flex;gap:16px;margin:8px 0 10px;font-size:13px;color:var(--gris)}
.dep .cifras b{font-family:var(--cond);font-size:22px;display:block;color:var(--asfalto);line-height:1}

/* el cartel de turno: el elemento con carácter de la app */
.cartel{display:flex;align-items:stretch;background:var(--senal);color:var(--asfalto);border-radius:12px;overflow:hidden;margin-bottom:18px}
.cartel .flecha{background:var(--asfalto);color:var(--senal);display:grid;place-items:center;font-family:var(--cond);font-size:46px;font-weight:700;padding:0 18px;line-height:1}
.cartel .cuerpo{flex:1;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.cartel .txt{flex:1 1 220px}
.cartel .ctx{font-size:14px;font-weight:600}
.cartel .who{font-family:var(--cond);font-size:36px;font-weight:700;line-height:1.05}
.cartel .sub{font-size:14px}
.cartel .btn{border-color:var(--asfalto)}
.cartel.fin{background:var(--ok-soft)} .cartel.fin .flecha{background:var(--ok);color:#fff}

.preview{border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px;border-left:5px solid}
.preview p{margin:8px 0 0}
.preview.ok{background:var(--ok-soft);border-color:var(--ok)} .preview.bad{background:var(--bad-soft);border-color:var(--bad)} .preview.warn{background:var(--warn-soft);border-color:var(--warn)}
.stats{display:flex;flex-wrap:wrap;gap:22px}
.stats div{font-size:13px;color:var(--gris)}
.stats b{font-family:var(--cond);font-size:30px;font-weight:700;display:block;line-height:1.05;color:var(--asfalto)}
.preview .stats b{font-size:24px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:12px;color:var(--gris);text-align:center;font-weight:600;padding:4px 0}
.cal .d{min-height:66px;border-radius:7px;border:1px solid var(--linea);padding:5px 6px;font-size:12px;cursor:pointer;background:#fff;display:flex;flex-direction:column}
.cal .d:hover{border-color:var(--pista)}
.cal .d.empty{border:0;background:none;cursor:default}
.cal .d .n{font-family:var(--cond);font-weight:700;font-size:16px;line-height:1}
.cal .d .o{margin-top:auto;font-weight:700;font-family:var(--cond);font-size:15px}
.cal .d .p{font-size:10.5px;color:var(--gris)}
.cal .d.lv1{background:var(--ok-soft)} .cal .d.lv2{background:var(--warn-soft)} .cal .d.lv3{background:var(--bad-soft);border-color:#EBB3AD}
.cal .d.sel{outline:3px solid var(--pista);outline-offset:-1px}
.cal .d.ss .n::after{content:" SS";font-size:10px;color:var(--warn)} .cal .d.pu .n::after{content:" P";font-size:10px;color:var(--pista)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--gris);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:0 0 auto}

.list-order{list-style:none;padding:0;margin:0;max-height:420px;overflow:auto}
.list-order li{padding:7px 6px;border-bottom:1px solid var(--linea);display:flex;gap:10px;align-items:center}
.list-order .pos{width:28px;text-align:right;font-family:var(--cond);font-weight:700;font-size:18px;color:var(--gris)}
.list-order .nm{flex:1}
.list-order a{color:var(--asfalto);font-weight:600;text-decoration:none}
.list-order a:hover{color:var(--pista);text-decoration:underline}
.list-order li.cur{background:var(--senal-soft);border-radius:8px}
.list-order li.cur .pos{color:var(--asfalto)}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.grid2>*{min-width:0}
.formula{background:var(--hormigon);border-radius:8px;padding:11px 13px;font-size:14px;margin-top:10px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--asfalto);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ----- informe PDF (sirve para la vista previa y para imprimir) ----- */
.hoja-wrap{overflow:hidden;background:#C9CED6;border-radius:12px;padding:18px}
.hoja{background:#fff;width:273mm;min-height:100mm;margin:0;padding:10mm;box-shadow:0 2px 10px rgba(34,38,46,.18);transform-origin:top left}
.hoja.vertical{width:186mm}
.inf{font-family:var(--text);color:var(--asfalto);font-size:10.5pt;line-height:1.35}
.inf-cab{display:flex;align-items:flex-end;gap:12px;border-bottom:3px solid var(--asfalto);padding-bottom:8px;margin-bottom:12px}
.inf-cab .logo{width:30px;height:30px;font-size:16px}
.inf-cab h1{font-family:var(--cond);font-size:24pt;line-height:1;margin:0;flex:1}
.inf-cab .meta{font-size:9pt;color:var(--gris);text-align:right}
.inf h2{font-family:var(--cond);font-size:16pt;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.inf h2 .barra{width:6px;height:18px;border-radius:2px;background:var(--c,var(--senal))}
.inf h2 small{font-family:var(--text);font-size:9.5pt;font-weight:500;color:var(--gris)}
.inf table{font-size:9.5pt}
.inf th,.inf td{padding:4px 5px}
.inf .firma{width:30mm;border-bottom:1px solid var(--gris);height:12px}
.gantt{margin:4px 0 10px;font-size:8.5pt}
.gantt .meses{display:flex;margin-left:var(--nw)}
.gantt .meses div{text-align:center;color:var(--gris);font-weight:600;border-left:1px solid var(--linea)}
.gantt .fila{display:flex;align-items:center;border-top:1px solid var(--linea);height:17px}
.gantt .nom{width:var(--nw);flex:0 0 var(--nw);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.gantt .pista{position:relative;flex:1;height:100%;background-image:var(--rejilla)}
.gantt .per{position:absolute;top:3px;bottom:3px;background:var(--pista);border-radius:2px}
.gantt .per.forz{background:var(--bad)}
.gantt .dp{position:absolute;top:1px;bottom:1px;width:3px;background:var(--senal);border:1px solid #9A7A00;border-radius:1px}
.gantt .ss{position:absolute;top:0;bottom:0;background:rgba(246,195,0,.18)}
.inf .leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:8.5pt;color:var(--gris);margin-top:3px}
.inf .leyenda i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.inf .salto{break-before:page;page-break-before:always}
.inf .pie-inf{margin-top:12px;font-size:8pt;color:var(--gris)}
#print{display:none}
/* aviso de actualización: bloquea la app hasta actualizar */
body.bloqueada{overflow:hidden}
#actualizacion{position:fixed;inset:0;z-index:100;background:rgba(34,38,46,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px}
.act-caja{background:var(--papel);border-radius:14px;overflow:hidden;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:actEntra .25s ease-out}
@keyframes actEntra{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.act-cab{display:flex;align-items:stretch;background:var(--senal);color:var(--asfalto)}
.act-cab .flecha{background:var(--asfalto);color:var(--senal);font-family:var(--cond);font-weight:700;font-size:40px;display:grid;place-items:center;padding:0 18px;line-height:1}
.act-cab .tit{padding:14px 18px}
.act-cab .ctx{font-size:14px;font-weight:600}
.act-cab h2{font-family:var(--cond);font-size:30px;font-weight:700;line-height:1.05;margin:2px 0 0}
.act-cuerpo{padding:18px}
.act-cuerpo p{margin:0 0 12px}
.act-cuerpo h3{font-family:var(--cond);font-size:18px;font-weight:600;margin:0 0 4px}
.act-cuerpo ul{margin:0 0 16px;padding-left:20px;color:var(--gris);font-size:14px}
.act-btn{width:100%;justify-content:center;font-size:17px;padding:14px}
.act-pie{font-size:12.5px;color:var(--gris);text-align:center;margin-top:10px}


@media (max-width:760px){
  .hide-m{display:none} .grid2{grid-template-columns:1fr}
  .cal .d{min-height:54px;font-size:11px;padding:4px} .cal .d .p{display:none}
  main{padding:16px 10px 6px} .intro h2{font-size:30px}
  .cartel .flecha{font-size:34px;padding:0 12px} .cartel .who{font-size:30px}
  header.app{padding:0 10px;gap:8px} header.app h1{font-size:19px} .ciclo{display:none} #hdrDep{max-width:130px}
}
@media print{
  body{background:#fff}
  body > *:not(#print){display:none!important}
  #print{display:block}
  .inf{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .inf tr,.gantt .fila{break-inside:avoid}
}
</style>
</head>
<body>
<header class="app">
  <span class="logo" aria-hidden="true">✈</span>
  <h1>Vacaciones AGP</h1>
  <select id="hdrDep" aria-label="Departamento" onchange="cambiarDep(this.value)"></select>
  <span class="ciclo" id="hdrCiclo"></span>
</header>
<nav class="pasos" id="pasos" aria-label="Pasos"></nav>
<main id="main"></main>
<div id="toast" role="status"></div>
<div id="print"></div>

<script>
/* =========================================================
   Vacaciones AGP — app personal de elección de vacaciones
   Reglas base: Convenio Menzies (BOE-A-2023-25956), arts. 32 y 33
   Datos guardados en el navegador (localStorage). Haz copias.
   ========================================================= */
const APP_VERSION = '3.1.0';   // súbela junto con version.json en cada publicación
const LS_KEY = 'vacaciones-agp-v1';
const SIN = '_'; // clave interna para «sin grupo»

/* ---------- fechas (UTC, sin sustos de horario de verano) ---------- */
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = pd(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((pd(b)-pd(a))/86400000);
function* eachDay(a,b){ for(let s=a; s<=b; s=addDays(s,1)) yield s; }
const hoy = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['L','M','X','J','V','S','D'];
const fmt = s => { if(!s) return ''; const d = pd(s); return `${d.getUTCDate()} ${MESES[d.getUTCMonth()].slice(0,3)}`; };
const fmtL = s => { if(!s) return ''; const d = pd(s); return `${d.getUTCDate()} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`; };
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return iso(new Date(Date.UTC(y,mo-1,da)));
}
const semanaSantaDefault = y => { const e = easter(y); return { desde: addDays(e,-7), hasta: e }; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n*100)/100;
const nf = n => (Math.round(n*100)/100).toLocaleString('es-ES');

/* ---------- estado ---------- */
const TRAMOS_CONVENIO = [
  {desde:'01-01',hasta:'01-07',pts:8, nombre:'Enero 1–7'},
  {desde:'01-08',hasta:'01-31',pts:0, nombre:'Enero 8–31'},
  {desde:'02-01',hasta:'02-29',pts:0, nombre:'Febrero'},
  {desde:'03-01',hasta:'03-31',pts:2, nombre:'Marzo'},
  {desde:'04-01',hasta:'04-30',pts:4, nombre:'Abril'},
  {desde:'05-01',hasta:'05-31',pts:5, nombre:'Mayo'},
  {desde:'06-01',hasta:'06-30',pts:7, nombre:'Junio'},
  {desde:'07-01',hasta:'07-31',pts:11,nombre:'Julio'},
  {desde:'08-01',hasta:'08-31',pts:12,nombre:'Agosto'},

const COLORES = ['#1F5FBF','#23864F','#B86E00','#7B4BB3','#C23B30','#0E8A9A','#7A5C3E','#C2477A'];
const DEP_COLORES = {Pasaje:'#1F5FBF', Rampa:'#E08A00', Operaciones:'#23864F'};
const AJUSTES_DEF = { computo:'naturales', bloquear:true, rondas:3, ptsSS:8, ptsPuente:2, diasDefecto:24,
  ponderar:true, baseDias:24, maxDesprog:3, preaviso:15, pctTurno:10, desprogPuntua:true };
const depsIniciales = () => ['Pasaje','Rampa','Operaciones'].map(n=>({id:uid(), nombre:n, color:DEP_COLORES[n], baseDias:''}));

function estadoInicial(){
  const ciclo = new Date().getFullYear() + (new Date().getMonth() >= 6 ? 1 : 0);
  const tipos = ['Auxiliar administrativo','Agente administrativo','Coordinador de pista','Auxiliar de rampa','Agente de rampa','Jefe de turno']
    .map((n,i)=>({id:uid(), nombre:n, color:COLORES[i%COLORES.length]}));
  return normalizar({ version:3, ciclo, tipos, departamentos:depsIniciales(), grupos:[], trabajadores:[], tramos:TRAMOS_CONVENIO.map(t=>({...t})),
    semanaSanta:semanaSantaDefault(ciclo), puentes:[], cupos:[], periodos:[], desprog:[], turnos:{}, pasosOk:[], vistaDep:'all' });
}
function normalizar(d){ // también migra copias de versiones anteriores
  d.version = 3;
  d.ajustes = {...AJUSTES_DEF, ...(d.ajustes||{})};
  if(!d.departamentos) d.departamentos = depsIniciales();
  d.grupos ||= []; d.desprog ||= []; d.pasosOk ||= []; d.puentes ||= []; d.cupos ||= []; d.periodos ||= []; d.tipos ||= [];
  d.trabajadores ||= []; d.vistaDep ||= 'all';
  d.grupos.forEach(g=>{ if(g.depId===undefined) g.depId=''; });
  d.trabajadores.forEach(t=>{ if(t.grupoId===undefined) t.grupoId=''; if(t.depId===undefined) t.depId=''; });
  d.cupos.forEach(c=>{ c.tipos ||= []; if(c.grupoId===undefined) c.grupoId=''; if(c.depId===undefined) c.depId=''; });
  if(!d.turnos || 'hechos' in d.turnos) d.turnos = {};
  return d;
}

try { const raw = JSON.parse(localStorage.getItem(LS_KEY)); S = raw ? normalizar(raw) : estadoInicial(); } catch(e){ S = estadoInicial(); }

/* ---------- consultas ---------- */
const tipoDe = id => S.tipos.find(t=>t.id===id);
const grupoDe = id => S.grupos.find(g=>g.id===id);
const depDeId = id => S.departamentos.find(d=>d.id===id);
const trabDe = id => S.trabajadores.find(t=>t.id===id);
const gk = w => w.grupoId || SIN;
const depDe = w => (w.grupoId && grupoDe(w.grupoId)?.depId) || w.depId || '';  // el departamento lo marca el grupo
const nombreGrupo = k => k===SIN ? 'Sin grupo' : (grupoDe(k)?.nombre || 'Sin grupo');
const nombreDep = id => depDeId(id)?.nombre || 'Sin departamento';
const DEP = () => S.vistaDep;                                 // departamento que se está viendo
const visible = w => DEP()==='all' || depDe(w)===DEP();
const grupoVisible = g => DEP()==='all' || g.depId===DEP();
const gruposVis = () => S.grupos.filter(grupoVisible);
const miembros = k => S.trabajadores.filter(t=>gk(t)===k);    // sin filtrar: para el 10 % del turno
const miembrosVis = k => miembros(k).filter(visible);
const trabsVis = () => S.trabajadores.filter(visible);
function gruposActivos(todos){ // grupos con gente, en orden, más «sin grupo» si hace falta
  const mm = todos ? miembros : miembrosVis;
  const ks = S.grupos.filter(g=>todos||grupoVisible(g)).map(g=>g.id).filter(k=>mm(k).length);
  if(mm(SIN).length) ks.push(SIN);
  return ks;
}
function cambiarDep(v){ S.vistaDep=v; UI.grupo=null; UI.trab=null; UI.calGrupo='all'; UI.pdf.grupo='all'; UI.m.filtro='all'; save(); render(); }

/* ---------- puntos (art. 33) ---------- */
function cuentaDia(s){
  const wd = pd(s).getUTCDay();
  if(S.ajustes.computo==='lunsab') return wd!==0;
  if(S.ajustes.computo==='lunvie') return wd!==0 && wd!==6;
  return true;
}
const enRango = (s,r) => r && r.desde && r.hasta && s>=r.desde && s<=r.hasta;
const esSS = s => enRango(s, S.semanaSanta);
const esPuente = s => S.puentes.some(p=>enRango(s,p));
function ptsBase(s){ const md = s.slice(5); const t = S.tramos.find(t=>md>=t.desde && md<=t.hasta); return t ? Number(t.pts)||0 : 0; }
function ptsDia(s){ return ptsBase(s) + (esSS(s)?Number(S.ajustes.ptsSS):0) + (esPuente(s)?Number(S.ajustes.ptsPuente):0); }
function statsRango(desde,hasta){
  let naturales=0, computables=0, pts=0;
  if(!desde||!hasta||hasta<desde) return {naturales,computables,pts};
  for(const s of eachDay(desde,hasta)){ naturales++; if(cuentaDia(s)){ computables++; pts+=ptsDia(s); } }
  return {naturales,computables,pts};
}
/* Base de ponderación: la del departamento si tiene una propia; si no, la general. */
const baseDe = w => { const d = depDeId(depDe(w)); return Number(d?.baseDias) > 0 ? Number(d.baseDias) : Number(S.ajustes.baseDias); };
/* Factor sobre los puntos brutos.
   - Con ponderación: base / días de vacaciones del trabajador (24/30 = ×0,8 a quien tiene 30 días).
     En un fijo discontinuo equivale a aplicar 365/días contratados sobre sus días equivalentes a año completo,
     así que no se aplica dos veces.
   - Sin ponderación: solo el ajuste del convenio para fijos discontinuos (365 / días contratados). */
function factorInfo(w){
  const A = S.ajustes, der = Number(w.diasDerecho)||0, base = baseDe(w);
  const disc = w.modalidad==='discontinuo' && Number(w.diasContratados)>0;
  if(A.ponderar && base>0 && der>0){
    const f = base/der;
    return { f, txt: f===1 ? '×1' : `×${nf(f)} (${base}/${der})` };
  }
  if(disc){ const f = 365/Number(w.diasContratados); return { f, txt:`×${nf(f)} (365/${w.diasContratados})` }; }
  return { f:1, txt:'×1' };
}
const factor = w => factorInfo(w).f;
const desprogDe = id => S.desprog.filter(d=>d.trabajadorId===id).sort((a,b)=>a.solicitud.localeCompare(b.solicitud) || a.creado-b.creado);
function statsTrab(w){
  const ps = S.periodos.filter(p=>p.trabajadorId===w.id).sort((a,b)=>a.desde.localeCompare(b.desde));
  const dps = desprogDe(w.id);
  let diasPer=0, bruto=0, largo=false;
  ps.forEach(p=>{ const st=statsRango(p.desde,p.hasta); diasPer+=st.computables; bruto+=st.pts; if(st.naturales>=15) largo=true; });
  if(S.ajustes.desprogPuntua) dps.forEach(d=>{ if(cuentaDia(d.dia)) bruto+=ptsDia(d.dia); });
  const derecho = Number(w.diasDerecho)||0, dias = diasPer + dps.length, pendientes = derecho - dias;
  const reservaPosible = Math.max(0, Number(S.ajustes.maxDesprog) - dps.length);
  const avisos = [];
  if(dias>derecho) avisos.push(`Se pasa ${dias-derecho} día(s) de su derecho`);
  if(ps.length>3) avisos.push(`${ps.length} periodos (el convenio fracciona en 3)`);
  if(ps.length && !largo) avisos.push('Ningún periodo llega a 15 días naturales');
  if(dps.length>Number(S.ajustes.maxDesprog)) avisos.push(`${dps.length} desprogramaciones (máx. ${S.ajustes.maxDesprog})`);
  return { periodos:ps, desprog:dps, diasPer, dias, derecho, pendientes, reservaPosible, bruto, f:factor(w), pts:r2(bruto*factor(w)), avisos };
}
function ordenEleccion(k){
  return S.trabajadores.filter(t=>k===undefined ? visible(t) : (gk(t)===k && (k!==SIN || visible(t)))).sort((a,b)=>
    (Number(a.ptsAnt)||0)-(Number(b.ptsAnt)||0) ||
    (Number(a.ptsAnt2)||0)-(Number(b.ptsAnt2)||0) ||
    (a.antig||'9999').localeCompare(b.antig||'9999') ||
    a.nombre.localeCompare(b.nombre,'es'));
}

/* ---------- cupos ---------- */
function ocupacion(excluirTrab){
  const occ = {};
  S.periodos.forEach(p=>{ if(p.trabajadorId===excluirTrab) return; for(const s of eachDay(p.desde,p.hasta)) (occ[s] ||= []).push(p.trabajadorId); });
  return occ;
}
const reglaAplica = (c,w) => w && (!c.depId || c.depId===depDe(w)) && (!c.grupoId || c.grupoId===w.grupoId) && (!c.tipos.length || c.tipos.includes(w.tipoId));
const cupoVisible = c => DEP()==='all' || !c.depId || c.depId===DEP() || (c.grupoId && grupoDe(c.grupoId)?.depId===DEP());
const usadosCupo = (c, ids) => ids.filter(id=>reglaAplica(c,trabDe(id))).length;
function conflictosCupo(w, desde, hasta){
  const occ = ocupacion(w.id), res = [];
  for(const s of eachDay(desde,hasta)){
    S.cupos.forEach(c=>{
      if(!enRango(s,c) || !reglaAplica(c,w)) return;
      const u = usadosCupo(c, occ[s]||[]);
      if(u+1 > Number(c.max)) res.push({dia:s, cupo:c, usados:u});
    });
  }
  return res;
}
function cuposExcedidos(){
  const occ = ocupacion(null), dias = new Set();
  S.cupos.filter(cupoVisible).forEach(c=>{ for(const s of eachDay(c.desde,c.hasta)) if(usadosCupo(c,occ[s]||[])>c.max) dias.add(s); });
  return dias.size;
}
const solapePropio = (w,desde,hasta,excepto) => S.periodos.some(p=>p.id!==excepto && p.trabajadorId===w.id && !(hasta<p.desde || desde>p.hasta));
const ambitoCupo = c => [c.depId ? esc(nombreDep(c.depId)) : '', c.grupoId ? esc(nombreGrupo(c.grupoId)) : (c.depId?'todos sus grupos':'Todos los departamentos'), c.tipos.length ? c.tipos.map(t=>esc(tipoDe(t)?.nombre)).filter(Boolean).join(', ') : 'todos los tipos'].filter(Boolean).join(', ');

/* ---------- desprogramaciones (art. 32) ---------- */
const maxDiaTurno = k => Math.floor(miembros(k).length * Number(S.ajustes.pctTurno) / 100);
function problemasDesprog(d){
  const w = trabDe(d.trabajadorId); if(!w) return [];
  const A = S.ajustes, out = [];
  const propias = desprogDe(w.id), idx = propias.findIndex(x=>x.id===d.id);
  if(idx >= Number(A.maxDesprog)) out.push({nivel:'bad', txt:`Pasa de ${A.maxDesprog} al año`});
  const ant = daysBetween(d.solicitud, d.dia);
  if(ant < Number(A.preaviso)) out.push({nivel:'bad', txt:`Preaviso de ${ant} día(s) (mín. ${A.preaviso})`});
  const k = gk(w), max = maxDiaTurno(k);
  const mismoDia = S.desprog.filter(x=>x.dia===d.dia && trabDe(x.trabajadorId) && gk(trabDe(x.trabajadorId))===k)
    .sort((a,b)=>a.solicitud.localeCompare(b.solicitud) || a.creado-b.creado);
  const pos = mismoDia.findIndex(x=>x.id===d.id);
  if(pos >= max) out.push({nivel:'bad', txt: max===0 ? `En ${nombreGrupo(k)} (${miembros(k).length} pers.) el ${A.pctTurno} % no llega a 1` : `Fuera del ${A.pctTurno} % del turno (máx. ${max} ese día)`});
  if(S.periodos.some(p=>p.trabajadorId===w.id && enRango(d.dia,p))) out.push({nivel:'warn', txt:'Coincide con sus vacaciones'});
  if(propias.some(x=>x.id!==d.id && x.dia===d.dia)) out.push({nivel:'warn', txt:'Día repetido'});
  if(!d.dia.startsWith(String(S.ciclo))) out.push({nivel:'warn', txt:`Fuera del ciclo ${S.ciclo}`});
  return out;
}

/* ---------- turnos por grupo ---------- */
const tState = k => (S.turnos[k] ||= {ronda:1, hechos:{}});
const hechosRonda = k => { const t=tState(k); return (t.hechos[t.ronda] ||= []); };
function turnoActual(k){ const h = hechosRonda(k); return ordenEleccion(k).find(w=>!h.includes(w.id)) || null; }
function grupoTerminado(k){ return !turnoActual(k) && tState(k).ronda >= Number(S.ajustes.rondas); }
function terminarTurno(k,id){
  const h = hechosRonda(k); if(!h.includes(id)) h.push(id);
  const t = tState(k);
  if(!turnoActual(k) && t.ronda < Number(S.ajustes.rondas)){ t.ronda++; toast(`${nombreGrupo(k)}: empieza la ronda ${t.ronda}`); }
  UI.trab = turnoActual(k)?.id || UI.trab; UI.desde=''; UI.hasta='';
  save(); render();
}
function deshacerTurno(k){
  const t = tState(k); let h = hechosRonda(k);
  if(!h.length && t.ronda>1){ t.ronda--; h = hechosRonda(k); }
  const id = h.pop(); if(id) UI.trab=id;
  save(); render();
}

function pasoHecho(k){
  switch(k){
    case 'reglas': return S.pasosOk.includes('reglas');
    case 'grupos': return S.grupos.length>0;
    case 'plantilla': return S.trabajadores.length>0 && S.trabajadores.every(t=>t.grupoId);
    case 'cupos': return S.cupos.length>0;
    case 'eleccion': return S.trabajadores.length>0 && gruposActivos(true).every(grupoTerminado);
    case 'desprog': return S.pasosOk.includes('desprog');
    default: return false;
  }
}

function cambiarCiclo(v){
  const y = Number(v); if(!(y>2000&&y<2100)) return;
  if(S.periodos.length && !confirm('Hay vacaciones asignadas en el ciclo actual. ¿Cambiar el año igualmente? Para pasar de año usa «Cerrar ciclo» en el último paso.')) return render();
  S.ciclo=y; S.semanaSanta=semanaSantaDefault(y); UI.calMes=null; save(); render();
}
function añadirTipo(){ const n=document.getElementById('nTipo').value.trim(); if(!n) return; S.tipos.push({id:uid(),nombre:n,color:COLORES[S.tipos.length%COLORES.length]}); save(); render(); }
function borrarTipo(id){
  const usados = S.trabajadores.filter(t=>t.tipoId===id).length;
  if(usados) return toast(`Hay ${usados} trabajador(es) con este tipo. Cámbialos antes de borrarlo.`);
  if(!confirm('¿Borrar este tipo?')) return;
  S.tipos=S.tipos.filter(t=>t.id!==id); S.cupos.forEach(c=>c.tipos=c.tipos.filter(x=>x!==id)); save(); render();
}
function añadirPuente(){
  const nom=document.getElementById('pNom').value.trim(), d=document.getElementById('pDes').value, h=document.getElementById('pHas').value||d;
  if(!d||h<d) return toast('La fecha de fin no puede ser anterior a la de inicio');
  S.puentes.push({id:uid(),nombre:nom,desde:d,hasta:h}); save(); render();
}

function vGrupos(){
  const deps = S.departamentos.filter(d=>DEP()==='all'||d.id===DEP());
  const sinG = trabsVis().filter(t=>!t.grupoId).length;
  const huerfanos = DEP()==='all' ? S.grupos.filter(g=>!g.depId) : [];
  const filaGrupo = g => `<div class="gfila">
      <div class="row" style="align-items:center;flex-wrap:nowrap;gap:8px"><span class="dot" style="background:${g.color}"></span>
      <input style="margin:0;flex:1;min-width:0" value="${esc(g.nombre)}" aria-label="Nombre del grupo" onchange="grupoDe('${g.id}').nombre=this.value.trim()||grupoDe('${g.id}').nombre;save();render()"></div>
      <div class="gmeta"><span>${miembros(g.id).length} personas</span>
      <select aria-label="Departamento del grupo" onchange="moverGrupo('${g.id}',this.value)">${opts(S.departamentos, g.depId, ['','Sin departamento'])}</select>

  return `<div class="deps">${deps.map(d=>{
    const gs = S.grupos.filter(g=>g.depId===d.id), n = S.trabajadores.filter(t=>depDe(t)===d.id).length;
    return `<div class="dep" style="--c:${d.color}">
      <div class="row" style="align-items:center;flex-wrap:nowrap"><input class="nombre" style="border:0;padding:0;margin:0;font-family:var(--cond);font-size:26px;font-weight:700" value="${esc(d.nombre)}" aria-label="Nombre del departamento" onchange="depDeId('${d.id}').nombre=this.value.trim()||depDeId('${d.id}').nombre;save();render()">
        <button class="btn small danger" onclick="borrarDep('${d.id}')" aria-label="Borrar departamento">✕</button></div>
      <div class="cifras"><div><b>${gs.length}</b>grupos</div><div><b>${n}</b>personas</div></div>
      <label style="margin-bottom:12px">Ponderar a (días)<input type="number" min="1" value="${esc(d.baseDias)}" placeholder="General: ${S.ajustes.baseDias}" onchange="depDeId('${d.id}').baseDias=this.value?Math.max(1,Number(this.value)):'';save();render()"></label>
      ${gs.map(filaGrupo).join('') || '<p class="muted" style="margin:0 0 8px">Sin grupos todavía.</p>'}
      <div class="row" style="flex-wrap:nowrap;margin-top:8px"><input id="nG_${d.id}" style="margin:0" placeholder="Nuevo grupo, p. ej. Turno A" aria-label="Nuevo grupo en ${esc(d.nombre)}" onkeydown="if(event.key==='Enter')añadirGrupo('${d.id}')"><button class="btn primary small" style="padding:9px 12px" onclick="añadirGrupo('${d.id}')">Añadir</button></div>
    </div>`}).join('')}</div>
  ${huerfanos.length?`<div class="card" style="margin-top:16px"><h2>Grupos sin departamento</h2>${huerfanos.map(filaGrupo).join('')}</div>`:''}
  <div class="card" style="margin-top:16px"><h2>Otro departamento</h2>
    <div class="row"><label style="flex:1">Nombre<input id="nDep" placeholder="Carga" onkeydown="if(event.key==='Enter')añadirDep()"></label><button class="btn" onclick="añadirDep()">Añadir departamento</button></div>
    ${sinG?`<p class="chip warn" style="margin-top:12px">${sinG} trabajador(es) sin grupo: asígnalos en Plantilla</p>`:''}
  </div>`;
}
function añadirDep(){ const n=document.getElementById('nDep').value.trim(); if(!n) return; S.departamentos.push({id:uid(),nombre:n,color:COLORES[(S.departamentos.length+3)%COLORES.length],baseDias:''}); save(); render(); }
function borrarDep(id){
  const gs = S.grupos.filter(g=>g.depId===id).length, n = S.trabajadores.filter(t=>depDe(t)===id).length;
  if(gs||n) return toast('Este departamento tiene grupos o personas. Muévelos antes de borrarlo.');
  if(!confirm('¿Borrar este departamento?')) return;
  S.departamentos = S.departamentos.filter(d=>d.id!==id); S.cupos.forEach(c=>{ if(c.depId===id) c.depId=''; }); save(); render();
}
function añadirGrupo(depId){
  const inp=document.getElementById('nG_'+depId), n=inp.value.trim(); if(!n) return;
  S.grupos.push({id:uid(),nombre:n,depId,color:COLORES[S.grupos.length%COLORES.length]}); save(); render(); document.getElementById('nG_'+depId)?.focus();
}
function moverGrupo(id, depId){ grupoDe(id).depId=depId; S.trabajadores.forEach(t=>{ if(t.grupoId===id) t.depId=depId; }); save(); render(); toast('Grupo movido'); }
function borrarGrupo(id){
  const n = miembros(id).length;
  if(n) return toast(`Hay ${n} persona(s) en este grupo. Muévelas a otro antes de borrarlo.`);
  if(S.cupos.some(c=>c.grupoId===id) && !confirm('Este grupo tiene cupos. Se borrarán también. ¿Seguir?')) return;
  S.grupos=S.grupos.filter(g=>g.id!==id); S.cupos=S.cupos.filter(c=>c.grupoId!==id); delete S.turnos[id]; save(); render();
}

    <textarea id="fPega" rows="5" placeholder="García López, Ana	Rampa	Turno A	Agente de rampa	30	312	298"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary" onclick="importarPegado()">Importar lista</button></div>

function guardarTrab(){
  const g = id => document.getElementById(id).value;
  const nombre = g('fNombre').trim(); if(!nombre) return toast('Escribe el nombre');
  const grupoId = g('fGrupo'), gr = grupoDe(grupoId);
  const datos = { nombre, grupoId, depId: (gr && gr.depId) || g('fDep'), tipoId:g('fTipo'), modalidad:g('fMod'), diasContratados:g('fDC'), diasDerecho:Number(g('fDer'))||0, ptsAnt:Number(g('fP1'))||0, ptsAnt2:Number(g('fP2'))||0, antig:g('fAnt') };
  if(datos.modalidad==='discontinuo' && !(Number(datos.diasContratados)>0)) return toast('Indica los días contratados del fijo discontinuo');
  if(UI.editTrab){
    const w = trabDe(UI.editTrab);
    if(w.grupoId!==datos.grupoId) Object.values(S.turnos).forEach(t=>Object.values(t.hechos).forEach(a=>{const i=a.indexOf(w.id); if(i>=0) a.splice(i,1);}));
    Object.assign(w, datos);
  } else S.trabajadores.push({id:uid(), ...datos});
  UI.editTrab=null; save(); render(); toast('Trabajador guardado');
}
function borrarTrab(id){
  const t=trabDe(id); if(!confirm(`¿Borrar a ${t.nombre} con sus vacaciones y desprogramaciones?`)) return;
  S.trabajadores = S.trabajadores.filter(x=>x.id!==id); S.periodos = S.periodos.filter(p=>p.trabajadorId!==id); S.desprog = S.desprog.filter(d=>d.trabajadorId!==id);
  Object.values(S.turnos).forEach(t=>Object.values(t.hechos).forEach(a=>{ const i=a.indexOf(id); if(i>=0) a.splice(i,1); }));
  save(); render();
}
function importarPegado(){
  const txt = document.getElementById('fPega').value.trim(); if(!txt) return;
  const num = x => Number(String(x||'0').replace(/\./g,'').replace(',','.'))||0;
  const busca = (lista, nombre, extra) => {
    if(!nombre) return null;
    let x = lista.find(t=>t.nombre.toLowerCase()===nombre.toLowerCase() && (!extra || !extra.depId || t.depId===extra.depId));
    if(!x){ x={id:uid(),nombre,color:COLORES[lista.length%COLORES.length],...(extra||{})}; lista.push(x); }
    return x;
  };
  let n=0;
  txt.split(/\r?\n/).forEach(l=>{
    const c = l.split(/\t|;/).map(x=>x.trim()); if(!c[0]) return;
    const d = busca(S.departamentos, c[1], {baseDias:''});
    const g = busca(S.grupos, c[2], {depId:d?.id||''});
    const t = busca(S.tipos, c[3]) || S.tipos[0];
    S.trabajadores.push({id:uid(), nombre:c[0], grupoId:g?.id||'', depId:d?.id||'', tipoId:t?.id, modalidad:'completo', diasContratados:'',
      diasDerecho: c[4] ? num(c[4]) : S.ajustes.diasDefecto, ptsAnt:num(c[5]), ptsAnt2:num(c[6]), antig:''});
    n++;
  });
  save(); render(); toast(`${n} trabajador(es) importados`);
}

    <div class="row">

      <label style="flex:0 1 130px">Máx. personas<input id="mMax" type="number" min="0" value="2"></label>

      <div class="row" style="margin-top:12px"><button class="btn danger" onclick="borrarCuposVisibles()">Borrar ${DEP()==='all'?'todos los cupos':'los cupos de '+esc(nombreDep(DEP()))}</button></div>`:'<p class="help">Sin cupos, cualquiera puede coger cualquier fecha.</p>'}

function guardarCupo(){
  const g = id => document.getElementById(id).value;
  const gr = grupoDe(g('cGrupo'));
  const c = { nombre:g('cNom').trim(), depId:(gr&&gr.depId)||g('cDep'), grupoId:g('cGrupo'), desde:g('cDes'), hasta:g('cHas'), max:Number(g('cMax')), tipos:[...document.querySelectorAll('.cTipo:checked')].map(x=>x.value) };
  if(!c.desde||!c.hasta||c.hasta<c.desde) return toast('Pon una fecha de inicio y una de fin posterior');
  if(!(c.max>=0)) return toast('El máximo tiene que ser 0 o más');
  if(UI.editCupo) Object.assign(S.cupos.find(x=>x.id===UI.editCupo), c); else S.cupos.push({id:uid(),...c});
  UI.editCupo=null; save(); render();
  const ex = cuposExcedidos(); toast(ex ? `Cupo guardado. Ya hay ${ex} día(s) por encima de algún cupo` : 'Cupo guardado');
}
function generarMensuales(){
  const grupoId = document.getElementById('mGrupo').value, gr=grupoDe(grupoId), depId = (gr&&gr.depId)||document.getElementById('mDep').value;
  const tipo = document.getElementById('mTipo').value, max = Number(document.getElementById('mMax').value);
  if(!(max>=0)) return toast('El máximo tiene que ser 0 o más');
  const pref = [depId?nombreDep(depId):'', grupoId?nombreGrupo(grupoId):'', tipo!=='all'?tipoDe(tipo).nombre:''].filter(Boolean).join(', ') || 'Todos';
  for(let m=0;m<12;m++){
    const d=`${S.ciclo}-${String(m+1).padStart(2,'0')}-01`, h=iso(new Date(Date.UTC(S.ciclo,m+1,0)));
    S.cupos.push({id:uid(), nombre:`${pref}, ${MESES[m]}`, depId, grupoId, desde:d, hasta:h, max, tipos: tipo==='all'?[]:[tipo]});
  }
  save(); render(); toast('12 cupos creados');
}
function borrarCupo(id){ S.cupos = S.cupos.filter(c=>c.id!==id); save(); render(); }
function borrarCuposVisibles(){ if(!confirm('¿Borrar estos cupos?')) return; S.cupos = S.cupos.filter(c=>!cupoVisible(c)); save(); render(); }

/* =========================================================
   PASO 5 · Elección (por turnos o a mano)
   ========================================================= */
function vEleccion(){
  const ks = gruposActivos();
  if(!ks.length) return vacio(DEP()==='all' ? 'Para elegir vacaciones primero tiene que haber gente en la plantilla.' : `No hay nadie en ${esc(nombreDep(DEP()))} todavía.`, `<button class="btn primary" onclick="go('plantilla')">Ir a Plantilla</button>`);
  const seg = `<div class="seg" role="tablist"><button class="${UI.modo==='turnos'?'on':''}" onclick="UI.modo='turnos';render()">Por turnos</button><button class="${UI.modo==='mano'?'on':''}" onclick="UI.modo='mano';render()">A mano</button></div>`;
  return seg + (UI.modo==='mano' ? vMano() : vTurnos(ks));
}
function previewHTML(w, desde, hasta, excepto, bloquea){
  if(!desde || !hasta) return '';
  if(hasta < desde) return `<div class="preview bad">La fecha de fin es anterior a la de inicio.</div>`;
  const st = statsTrab(w), r = statsRango(desde,hasta), conf = conflictosCupo(w,desde,hasta), sol = solapePropio(w,desde,hasta,excepto);
  let quedan = st.pendientes - r.computables;
  if(excepto){ const p=S.periodos.find(x=>x.id===excepto); if(p) quedan += statsRango(p.desde,p.hasta).computables; }
  const diasConf = [...new Set(conf.map(c=>c.dia))];
  const cls = (sol || (conf.length && bloquea)) ? 'bad' : (conf.length || quedan<0) ? 'warn' : 'ok';
  return `<div class="preview ${cls}">
    <div class="stats"><div><b>${r.computables}</b>días${r.computables!==r.naturales?` (${r.naturales} naturales)`:''}</div><div><b>${nf(r.pts)}</b>puntos brutos</div><div><b>${nf(r.pts*st.f)}</b>puntos finales</div><div><b>${quedan}</b>días le quedarían</div></div>
    ${sol?'<p><b>Se solapa con otro periodo suyo.</b></p>':''}
    ${conf.length?`<p><b>${bloquea?'No hay cupo':'Supera el cupo'} ${diasConf.length} día(s):</b> ${resumenConflictos(conf)}</p>`:'<p>Hay cupo todos los días.</p>'}
    ${quedan<0?`<p><b>Se pasa ${-quedan} día(s) de su derecho.</b></p>`:''}
  </div>`;
}
function vTurnos(ks){
  if(!UI.grupo || !ks.includes(UI.grupo)) UI.grupo = ks.find(k=>!grupoTerminado(k)) || ks[0];
  const k = UI.grupo, orden = ordenEleccion(k), actual = turnoActual(k), t = tState(k), h = hechosRonda(k);
  if(!UI.trab || !trabDe(UI.trab) || gk(trabDe(UI.trab))!==k) { UI.trab = actual?.id || orden[0].id; UI.desde=''; UI.hasta=''; }
  const w = trabDe(UI.trab), st = statsTrab(w);
  const depG = k!==SIN ? grupoDe(k)?.depId : '';
  const selector = ks.length>1 ? `<div class="chips" style="margin-bottom:14px">${ks.map(x=>{const dc=x!==SIN?depDeId(grupoDe(x)?.depId)?.color:null; return `<button class="pill ${x===k?'on':''}" onclick="UI.grupo='${x}';UI.trab=null;render()">${dc?`<span class="dot" style="background:${dc}"></span>`:''}${esc(nombreGrupo(x))} ${grupoTerminado(x)?'✓':`(ronda ${tState(x).ronda})`}</button>`}).join('')}</div>` : '';
  const cartel = actual
    ? `<div class="cartel"><div class="flecha" aria-hidden="true">➜</div><div class="cuerpo"><div class="txt">
         <div class="ctx">${depG?esc(nombreDep(depG))+', ':''}${esc(nombreGrupo(k))}, ronda ${t.ronda} de ${S.ajustes.rondas}. Le toca a</div>
         <div class="who">${esc(actual.nombre)}</div>
         <div class="sub">${esc(tipoDe(actual.tipoId)?.nombre||'')}, ${nf(actual.ptsAnt||0)} puntos el año anterior</div></div>
       <div class="row">${actual.id!==UI.trab?`<button class="btn" onclick="selTrab('${actual.id}')">Ver su elección</button>`:''}
       <button class="btn ink" onclick="terminarTurno('${k}','${actual.id}')">Pasar al siguiente ›</button>
       <button class="btn" onclick="deshacerTurno('${k}')" ${(!h.length&&t.ronda===1)?'disabled':''}>↶ Deshacer</button></div></div></div>`
    : `<div class="cartel fin"><div class="flecha" aria-hidden="true">✓</div><div class="cuerpo"><div class="txt"><div class="who">${esc(nombreGrupo(k))} ha terminado</div><div class="sub">Todas las rondas están cerradas.</div></div><button class="btn" onclick="deshacerTurno('${k}')">↶ Deshacer</button></div></div>`;
  const puede = UI.desde && UI.hasta && UI.hasta>=UI.desde && !solapePropio(w,UI.desde,UI.hasta) && !(S.ajustes.bloquear && conflictosCupo(w,UI.desde,UI.hasta).length);
  return `${selector}${cartel}
  <div class="grid2">
   <div class="card"><h2>Asignar vacaciones</h2>
    <div class="row">
      <label style="flex-basis:100%">Trabajador<select onchange="selTrab(this.value)">${orden.map((x,i)=>`<option value="${x.id}" ${x.id===UI.trab?'selected':''}>${i+1}. ${esc(x.nombre)}</option>`).join('')}</select></label>
      <label>Desde<input type="date" value="${UI.desde}" min="${S.ciclo}-01-01" max="${S.ciclo}-12-31" onchange="UI.desde=this.value; if(!UI.hasta||UI.hasta<UI.desde) UI.hasta=this.value; render()"></label>
      <label>Hasta<input type="date" value="${UI.hasta}" min="${UI.desde||S.ciclo+'-01-01'}" max="${S.ciclo}-12-31" onchange="UI.hasta=this.value; render()"></label>
    </div>
    ${previewHTML(w, UI.desde, UI.hasta, null, S.ajustes.bloquear)}
    <div class="row" style="margin-top:14px"><button class="btn primary" onclick="añadirPeriodo()" ${puede?'':'disabled'}>Añadir periodo</button>
    ${UI.desde?`<button class="btn" onclick="UI.desde='';UI.hasta='';render()">Limpiar fechas</button>`:''}</div>
    ${fichaTrab(w, st)}
   </div>
   <div class="card"><h2>Orden de ${esc(nombreGrupo(k))}</h2>
    <p class="help">De menos a más puntos del año anterior. Si empatan, cuenta el año previo (art. 33) y después la antigüedad.</p>
    <ol class="list-order">${orden.map((x,i)=>{const done=h.includes(x.id), cur=actual&&actual.id===x.id, s2=statsTrab(x);
      return `<li class="${cur?'cur':''}"><span class="pos">${i+1}</span><span class="nm"><a href="#" onclick="selTrab('${x.id}');return false">${esc(x.nombre)}</a><br><span class="muted">${nf(x.ptsAnt||0)} pts, ${s2.dias} de ${s2.derecho} días</span></span>${done?'<span class="chip ok">Hecho</span>':cur?'<span class="chip mano">Su turno</span>':'<span class="chip grey">Espera</span>'}</li>`}).join('')}</ol>
    <div class="row" style="margin-top:14px"><button class="btn" onclick="UI.calGrupo='${k}';go('calendario')">Ver calendario del grupo</button></div>
   </div>
  </div>`;
}
function fichaTrab(w, st){
  return `<h3>${esc(w.nombre)}</h3>
    <div class="muted">${esc(nombreDep(depDe(w)))}, ${esc(tipoDe(w.tipoId)?.nombre||'sin tipo')}, ${modalidadTxt(w)}, ${st.derecho} días. Factor ${factorInfo(w).txt}</div>
    ${(st.periodos.length||st.desprog.length) ? `<div class="scroll"><table><tr><th>Periodo</th><th class="num">Días</th><th class="num">Puntos</th><th></th></tr>
      ${st.periodos.map(p=>{const r=statsRango(p.desde,p.hasta);return `<tr><td>${fmt(p.desde)} – ${fmt(p.hasta)} <span class="muted">(${r.naturales} nat.)</span> ${p.manual?'<span class="chip mano">A mano</span>':''} ${p.forzado?'<span class="chip bad">Sin cupo</span>':''}</td><td class="num">${r.computables}</td><td class="num">${nf(r.pts*st.f)}</td>
        <td class="num" style="white-space:nowrap"><button class="btn small" onclick="editarPeriodo('${p.id}')">Editar</button> <button class="btn small danger" onclick="borrarPeriodo('${p.id}')" aria-label="Borrar">✕</button></td></tr>`}).join('')}
      ${st.desprog.length?`<tr><td>Desprogramaciones <span class="muted">(${st.desprog.map(d=>fmt(d.dia)).join(', ')})</span></td><td class="num">${st.desprog.length}</td><td class="num">${S.ajustes.desprogPuntua?nf(st.desprog.reduce((a,d)=>a+(cuentaDia(d.dia)?ptsDia(d.dia):0),0)*st.f):'—'}</td><td></td></tr>`:''}
      <tr><th>Total</th><th class="num">${st.dias} / ${st.derecho}</th><th class="num">${nf(st.pts)}</th><th></th></tr></table></div>`
      : '<p class="muted">Todavía no tiene vacaciones.</p>'}
    ${st.pendientes>0 && st.pendientes<=st.reservaPosible ? `<div class="chip" style="margin:6px 6px 0 0">Le quedan ${st.pendientes}: puede dejarlos para desprogramar</div>`:''}
    ${st.avisos.map(a=>`<div class="chip warn" style="margin:6px 6px 0 0">${a}</div>`).join('')}`;
}
function resumenConflictos(conf){
  const porCupo = {};
  conf.forEach(c=>{ (porCupo[c.cupo.id] ||= {c:c.cupo, dias:[]}).dias.push(c.dia); });
  return Object.values(porCupo).map(({c,dias})=>`«${esc(c.nombre||'Cupo')}» (máx. ${c.max}): ${rangosTxt(dias)}`).join('; ');
}
function rangosTxt(dias){
  dias = [...new Set(dias)].sort(); const out=[]; let a=dias[0], b=dias[0];
  for(let i=1;i<=dias.length;i++){ if(dias[i] && dias[i]===addDays(b,1)) b=dias[i]; else { out.push(a===b?fmt(a):`${fmt(a)}–${fmt(b)}`); a=b=dias[i]; } }
  return out.join(', ');
}
function selTrab(id){ UI.trab=id; UI.desde=''; UI.hasta=''; render(); }
function añadirPeriodo(){
  const w = trabDe(UI.trab); if(!w) return;
  if(solapePropio(w,UI.desde,UI.hasta)) return toast('Se solapa con otro periodo suyo');
  if(S.ajustes.bloquear && conflictosCupo(w,UI.desde,UI.hasta).length) return toast('No hay cupo en esas fechas');
  const forz = conflictosCupo(w,UI.desde,UI.hasta).length>0;
  S.periodos.push({id:uid(), trabajadorId:w.id, desde:UI.desde, hasta:UI.hasta, ronda:tState(gk(w)).ronda, forzado:forz});
  UI.desde=''; UI.hasta=''; save(); render(); toast('Periodo añadido');
}
function borrarPeriodo(id){ if(!confirm('¿Borrar este periodo?')) return; S.periodos = S.periodos.filter(p=>p.id!==id); if(UI.m.edit===id) limpiarMano(); save(); render(); }
function editarPeriodo(id){
  const p = S.periodos.find(x=>x.id===id); if(!p) return;
  const w = trabDe(p.trabajadorId); if(w && !visible(w)) S.vistaDep='all';
  UI.m = {...UI.m, trab:p.trabajadorId, desde:p.desde, hasta:p.hasta, nota:p.nota||'', forzar:!!p.forzado, edit:id};
  UI.modo='mano'; UI.vista='eleccion'; render(); window.scrollTo(0,0);
}

/* ----- a mano ----- */
function limpiarMano(){ UI.m = {...UI.m, desde:'', hasta:'', nota:'', forzar:false, edit:null}; }
function vMano(){
  const M = UI.m;
  if(!M.trab || !trabDe(M.trab) || !visible(trabDe(M.trab))) M.trab = ordenEleccion(gruposActivos()[0])[0].id;
  const w = trabDe(M.trab);
  const conf = (M.desde && M.hasta && M.hasta>=M.desde) ? conflictosCupo(w,M.desde,M.hasta) : [];
  const puede = M.desde && M.hasta && M.hasta>=M.desde && !solapePropio(w,M.desde,M.hasta,M.edit) && (!conf.length || M.forzar);
  const lista = S.periodos.filter(p=>{ const t=trabDe(p.trabajadorId); return t && visible(t) && (M.filtro==='all' || gk(t)===M.filtro); })
    .sort((a,b)=>a.desde.localeCompare(b.desde) || trabDe(a.trabajadorId).nombre.localeCompare(trabDe(b.trabajadorId).nombre,'es'));
  return `<div class="grid2">
   <div class="card"><h2>${M.edit?'Editar vacaciones':'Añadir vacaciones a mano'}</h2>
    <p class="help">Para apuntar lo que ya está hablado o corregir algo sin pasar por el turno. Los cupos se comprueban igual, pero puedes guardarlas aunque no haya cupo.</p>
    <div class="row">
      <label style="flex-basis:100%">Trabajador<select onchange="UI.m.trab=this.value;render()" ${M.edit?'disabled':''}>${trabOptions(M.trab)}</select></label>
      <label>Desde<input type="date" value="${M.desde}" min="${S.ciclo}-01-01" max="${S.ciclo}-12-31" onchange="UI.m.desde=this.value; if(!UI.m.hasta||UI.m.hasta<UI.m.desde) UI.m.hasta=this.value; render()"></label>
      <label>Hasta<input type="date" value="${M.hasta}" min="${M.desde||S.ciclo+'-01-01'}" max="${S.ciclo}-12-31" onchange="UI.m.hasta=this.value; render()"></label>
      <label style="flex-basis:100%">Nota (opcional)<input value="${esc(M.nota)}" placeholder="Acordado con el jefe de turno" onchange="UI.m.nota=this.value"></label>
    </div>
    ${previewHTML(w, M.desde, M.hasta, M.edit, !M.forzar)}
    ${conf.length?`<div class="row" style="margin-top:10px"><label class="chk"><input type="checkbox" ${M.forzar?'checked':''} onchange="UI.m.forzar=this.checked;render()">Guardar aunque no haya cupo</label></div>`:''}
    <div class="row" style="margin-top:14px"><button class="btn primary" onclick="guardarMano()" ${puede?'':'disabled'}>${M.edit?'Guardar cambios':'Añadir vacaciones'}</button>
      ${(M.desde||M.edit)?`<button class="btn" onclick="limpiarMano();render()">${M.edit?'Cancelar':'Limpiar'}</button>`:''}</div>
    ${fichaTrab(w, statsTrab(w))}
   </div>
   <div class="card"><h2>Vacaciones apuntadas (${lista.length})</h2>
    <label style="margin-bottom:10px">Grupo<select onchange="UI.m.filtro=this.value;render()">${optsGrupos(M.filtro, ['all','Todos los grupos'])}</select></label>
    ${lista.length?`<div class="scroll"><table><tr><th>Trabajador</th><th>Fechas</th><th class="num">Días</th><th></th></tr>
      ${lista.map(p=>{const t=trabDe(p.trabajadorId), r=statsRango(p.desde,p.hasta);return `<tr>
        <td><b>${esc(t.nombre)}</b>${p.manual?' <span class="chip mano">A mano</span>':''}${p.forzado?' <span class="chip bad">Sin cupo</span>':''}${p.nota?`<div class="muted">${esc(p.nota)}</div>`:''}</td>
        <td style="white-space:nowrap">${fmt(p.desde)} – ${fmt(p.hasta)}</td><td class="num">${r.computables}</td>
        <td class="num" style="white-space:nowrap"><button class="btn small" onclick="editarPeriodo('${p.id}')">Editar</button> <button class="btn small danger" onclick="borrarPeriodo('${p.id}')" aria-label="Borrar">✕</button></td></tr>`}).join('')}</table></div>`
      :'<p class="help">Todavía no hay vacaciones apuntadas.</p>'}
   </div>
  </div>`;
}
function guardarMano(){
  const M = UI.m, w = trabDe(M.trab); if(!w) return;
  if(!(M.desde&&M.hasta&&M.hasta>=M.desde)) return toast('Pon una fecha de inicio y una de fin posterior');
  if(solapePropio(w,M.desde,M.hasta,M.edit)) return toast('Se solapa con otro periodo suyo');
  const forz = conflictosCupo(w,M.desde,M.hasta).length>0;
  if(forz && !M.forzar) return toast('No hay cupo. Marca «Guardar aunque no haya cupo» si quieres apuntarlas igual');
  if(M.edit){ Object.assign(S.periodos.find(p=>p.id===M.edit), {desde:M.desde, hasta:M.hasta, nota:M.nota, forzado:forz, manual:true}); toast('Vacaciones actualizadas'); }
  else { S.periodos.push({id:uid(), trabajadorId:w.id, desde:M.desde, hasta:M.hasta, nota:M.nota, manual:true, forzado:forz, ronda:null}); toast('Vacaciones añadidas'); }
  limpiarMano(); save(); render();
}

/* =========================================================
   PASO 6 · Desprogramaciones
   ========================================================= */
function vDesprog(){
  const A = S.ajustes;
  if(!trabsVis().length) return vacio('Primero añade gente en la plantilla.');
  let prev = '';
  if(UI.dpTrab && UI.dpDia && UI.dpSol && trabDe(UI.dpTrab)){
    const tmp = {id:'__tmp', trabajadorId:UI.dpTrab, dia:UI.dpDia, solicitud:UI.dpSol, creado:Date.now()};
    S.desprog.push(tmp); const pr = problemasDesprog(tmp); S.desprog.pop();
    const n = desprogDe(UI.dpTrab).length + 1;
    prev = `<div class="preview ${pr.some(p=>p.nivel==='bad')?'bad':pr.length?'warn':'ok'}">
      <div class="stats"><div><b>${n} de ${A.maxDesprog}</b>del año</div><div><b>${daysBetween(UI.dpSol,UI.dpDia)}</b>días de preaviso</div><div><b>${nf(cuentaDia(UI.dpDia)&&A.desprogPuntua?ptsDia(UI.dpDia)*factor(trabDe(UI.dpTrab)):0)}</b>puntos</div></div>
      ${pr.length?pr.map(p=>`<p>${p.txt}</p>`).join(''):'<p>Cumple los requisitos.</p>'}</div>`;
  }
  const lista = S.desprog.filter(d=>trabDe(d.trabajadorId) && visible(trabDe(d.trabajadorId))).sort((a,b)=>a.dia.localeCompare(b.dia) || a.solicitud.localeCompare(b.solicitud));
  const ks = gruposActivos();
  return `<div class="card"><h2>Reglas</h2>
    <div class="row">

/* =========================================================
   PASO 7 · Resumen y cierre
   ========================================================= */
function vResumen(){
  const ks = gruposActivos();
  const todos = trabsVis().map(t=>({t,st:statsTrab(t)}));
  const ids = new Set(todos.map(f=>f.t.id));
  const sin = todos.filter(f=>!f.st.periodos.length).length, avisos = todos.filter(f=>f.st.avisos.length).length;
  const dpMal = S.desprog.filter(d=>ids.has(d.trabajadorId) && problemasDesprog(d).some(p=>p.nivel==='bad')).length;
  const forz = S.periodos.filter(p=>p.forzado && ids.has(p.trabajadorId)).length;
  const porDep = DEP()==='all' && S.departamentos.length>1 ? `<div class="deps" style="margin-bottom:16px">${S.departamentos.map(d=>{
      const ts=S.trabajadores.filter(t=>depDe(t)===d.id); if(!ts.length) return '';
      const sts=ts.map(statsTrab), dias=sts.reduce((a,s)=>a+s.dias,0), der=sts.reduce((a,s)=>a+s.derecho,0);
      return `<div class="dep" style="--c:${d.color};background:#fff;cursor:pointer" onclick="cambiarDep('${d.id}')" role="button" tabindex="0"><div class="nombre">${esc(d.nombre)}</div>
        <div class="cifras"><div><b>${ts.length}</b>personas</div><div><b>${der?Math.round(dias/der*100):0} %</b>días asignados</div><div><b>${sts.filter(s=>s.avisos.length).length}</b>avisos</div></div></div>`}).join('')}</div>` : '';
  return `${porDep}<div class="card"><h2>${DEP()==='all'?'Ciclo '+S.ciclo:esc(nombreDep(DEP()))+', ciclo '+S.ciclo}</h2>
    <div class="stats"><div><b>${todos.length}</b>personas</div><div><b>${todos.reduce((a,f)=>a+f.st.periodos.length,0)}</b>periodos</div><div><b>${sin}</b>sin vacaciones</div><div><b>${avisos}</b>con avisos</div><div><b>${cuposExcedidos()}</b>días sobre cupo</div><div><b>${forz}</b>guardadas sin cupo</div><div><b>${dpMal}</b>desprog. con problemas</div></div>
  </div>
  <div class="card"><div class="scroll"><table><tr><th>Nombre</th><th class="hide-m">Periodos</th><th class="num">Días</th><th class="num hide-m">Brutos</th><th class="num hide-m">Factor</th><th class="num">Puntos</th><th class="num">Desp.</th><th>Estado</th></tr>
    ${ks.map(k=>`<tr class="grp"><td colspan="8">${cabGrupo(k)}</td></tr>`+ordenEleccion(k).map((t,i)=>{const st=statsTrab(t);
      return `<tr><td><span class="muted">${i+1}.</span> <b>${esc(t.nombre)}</b></td>
      <td class="hide-m muted" style="font-size:13px">${st.periodos.map(p=>`${fmt(p.desde)}–${fmt(p.hasta)}`).join('<br>')||'—'}</td>
      <td class="num">${st.dias}/${st.derecho}</td><td class="num hide-m">${nf(st.bruto)}</td><td class="num hide-m muted">${factorInfo(t).txt}</td><td class="num"><b>${nf(st.pts)}</b></td><td class="num">${st.desprog.length}/${S.ajustes.maxDesprog}</td>
      <td>${st.avisos.length?st.avisos.map(a=>`<div class="chip warn" style="margin:2px 0">${a}</div>`).join(''):
        st.pendientes===0?'<span class="chip ok">Completo</span>':
        st.periodos.length&&st.pendientes<=st.reservaPosible?`<span class="chip">Reserva ${st.pendientes} para desprogramar</span>`:
        st.periodos.length?`<span class="chip grey">Le quedan ${st.pendientes}</span>`:'<span class="chip grey">Sin vacaciones</span>'}</td></tr>`}).join('')).join('')}
  </table></div>
  <div class="row" style="margin-top:14px"><button class="btn primary" onclick="go('pdf')">Exportar PDF</button><button class="btn" onclick="exportarCSV()">Descargar Excel (CSV)</button></div></div>
  <div class="card"><h2>Cerrar ciclo</h2>
    <p class="help">Cuando el ciclo ${S.ciclo} esté terminado en todos los departamentos: los puntos finales de este año pasan a «puntos año anterior» (y los de antes a «hace 2 años»), se vacían vacaciones y desprogramaciones, se reinician los turnos, los cupos se trasladan al ${S.ciclo+1} y se recalcula la Semana Santa. Antes se descarga una copia automáticamente.</p>
    <button class="btn danger" onclick="cerrarCiclo()">Cerrar ${S.ciclo} y abrir ${S.ciclo+1}</button>
  </div>`;
}
function exportarCSV(){
  const q = x => `"${String(x??'').replace(/"/g,'""')}"`, dec = n => String(r2(n)).replace('.',',');
  const rows = [['Departamento','Grupo','Orden','Nombre','Tipo','Modalidad','Días vacaciones','Pts año anterior','Periodo','Desde','Hasta','Días naturales','Días computables','Puntos periodo','A mano','Sin cupo','Nota','Desprogramaciones','Puntos brutos ciclo','Factor','Puntos finales ciclo']];
  gruposActivos().forEach(k=>ordenEleccion(k).forEach((t,i)=>{ const st=statsTrab(t);
    const base = [nombreDep(depDe(t)),nombreGrupo(k),i+1,t.nombre,tipoDe(t.tipoId)?.nombre,modalidadTxt(t),t.diasDerecho,t.ptsAnt];
    const fin = [st.desprog.map(d=>d.dia).join(' '), dec(st.bruto), dec(st.f), dec(st.pts)];
    if(!st.periodos.length) rows.push([...base,'','','','','','','','','',...fin]);
    st.periodos.forEach((p,j)=>{ const r=statsRango(p.desde,p.hasta); rows.push([...base,j+1,p.desde,p.hasta,r.naturales,r.computables,dec(r.pts*st.f),p.manual?'sí':'',p.forzado?'sí':'',p.nota||'',...fin]); });
  }));
  descargar(`vacaciones-${S.ciclo}${DEP()!=='all'?'-'+nombreDep(DEP()):''}.csv`, '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}
function copiaJSON(){ descargar('vacaciones-agp-'+S.ciclo+'-'+hoy()+'.json', JSON.stringify(S,null,1), 'application/json'); }
function cerrarCiclo(){
  if(!confirm(`Se cerrará el ciclo ${S.ciclo} para todos los departamentos. Antes se descargará una copia. ¿Seguir?`)) return;
  copiaJSON();
  S.trabajadores.forEach(t=>{ const st=statsTrab(t); t.ptsAnt2=t.ptsAnt||0; t.ptsAnt=st.pts; });
  const mas1 = s => { const d=pd(s), y=d.getUTCFullYear()+1, m=d.getUTCMonth(); const ult=new Date(Date.UTC(y,m+1,0)).getUTCDate(); return iso(new Date(Date.UTC(y,m,Math.min(d.getUTCDate(),ult)))); };
  S.cupos.forEach(c=>{ c.desde=mas1(c.desde); c.hasta=mas1(c.hasta); });
  S.ciclo++; S.periodos=[]; S.desprog=[]; S.puentes=[]; S.semanaSanta=semanaSantaDefault(S.ciclo); S.turnos={}; S.pasosOk=[];
  UI.calMes=null; UI.vista='reglas'; save(); render(); toast(`Ciclo ${S.ciclo} abierto. Añade los puentes del nuevo año.`);
}

function vCalendario(){
  if(UI.calMes===null){ const n=new Date(); UI.calMes = n.getFullYear()===S.ciclo ? n.getMonth() : 0; }
  if(UI.calGrupo!=='all' && !gruposVis().some(g=>g.id===UI.calGrupo)) UI.calGrupo='all';
  const y=S.ciclo, m=UI.calMes, mm=String(m+1).padStart(2,'0'), first=`${y}-${mm}-01`;
  const dim = new Date(Date.UTC(y,m+1,0)).getUTCDate(), offset=(pd(first).getUTCDay()+6)%7;
  const occ = ocupacion(null), FT = UI.calTipo, FG = UI.calGrupo;
  const pasaFiltro = id => { const t=trabDe(id); return t && visible(t) && (FG==='all'||gk(t)===FG) && (FT==='all'||t.tipoId===FT); };
  const reglasVisibles = s => S.cupos.filter(c=>enRango(s,c) && cupoVisible(c) && (FG==='all'||!c.grupoId||c.grupoId===FG) && (FT==='all'||!c.tipos.length||c.tipos.includes(FT)));
  const cell = s => {
    const ids = (occ[s]||[]).filter(pasaFiltro), reglas = reglasVisibles(s);
    let lv=0, txt = ids.length ? `${ids.length}` : '';
    if(reglas.length){
      let peor=null;
      reglas.forEach(c=>{ const u=usadosCupo(c,occ[s]||[]), ratio=u/Math.max(1,Number(c.max)); if(!peor||ratio>peor.ratio) peor={u,c,ratio}; });
      txt = `${peor.u}/${peor.c.max}`; lv = peor.u>=Number(peor.c.max)?3 : peor.ratio>=.75?2 : 1;
    }
    const cls = ['d','lv'+lv, esSS(s)?'ss':'', esPuente(s)?'pu':'', UI.calDia===s?'sel':''].join(' ');
    return `<div class="${cls}" role="button" tabindex="0" onclick="UI.calDia='${s}';render()" onkeydown="if(event.key==='Enter'){UI.calDia='${s}';render()}"><span class="n">${pd(s).getUTCDate()}</span><span class="p">${ptsDia(s)} pts</span><span class="o">${txt}</span></div>`;
  };
  let grid = DOW.map(d=>`<div class="dow">${d}</div>`).join('') + '<div class="d empty"></div>'.repeat(offset);
  for(let d=1; d<=dim; d++) grid += cell(`${y}-${mm}-${String(d).padStart(2,'0')}`);

  let det = '';
  if(UI.calDia){
    const s=UI.calDia, ids=(occ[s]||[]).filter(id=>visible(trabDe(id))), reglas=S.cupos.filter(c=>enRango(s,c)&&cupoVisible(c)), dps=S.desprog.filter(d=>d.dia===s && trabDe(d.trabajadorId) && visible(trabDe(d.trabajadorId)));
    det = `<div class="card"><h2>${fmtL(s)}</h2><p class="muted" style="margin-top:-6px">${ptsDia(s)} puntos por día${esSS(s)?', Semana Santa':''}${esPuente(s)?', puente':''}</p>
      ${reglas.length?`<h3>Cupos</h3>${reglas.map(c=>{const u=usadosCupo(c,occ[s]||[]), cl=u>=c.max?'bad':u/c.max>=.75?'warn':'ok';return `<div style="margin-bottom:6px"><span class="chip ${cl}">${u} de ${c.max}</span> ${esc(c.nombre||'Cupo')} <span class="muted">(${ambitoCupo(c)})</span></div>`}).join('')}`:'<p class="muted">Ningún cupo cubre este día.</p>'}
      <h3>De vacaciones (${ids.length})</h3>${ids.length?ids.map(id=>{const t=trabDe(id);return `<div style="margin-bottom:6px">${esc(t?.nombre)} ${DEP()==='all'?depChip(depDe(t)):''} ${grupoChip(gk(t))} ${tipoChip(t?.tipoId)}</div>`}).join(''):'<p class="muted">Nadie.</p>'}
      ${dps.length?`<h3>Desprogramaciones (${dps.length})</h3>${dps.map(d=>{const t=trabDe(d.trabajadorId);return `<div style="margin-bottom:6px">${esc(t?.nombre)} ${grupoChip(gk(t))}</div>`}).join('')}`:''}
      ${trabsVis().length?`<div class="row" style="margin-top:14px"><button class="btn primary" onclick="UI.m={...UI.m,desde:'${s}',hasta:'${s}',edit:null,forzar:false,nota:''};UI.modo='mano';go('eleccion')">Añadir vacaciones desde este día</button></div>`:''}</div>`;
  }
  return `<div class="intro"><h2>Calendario ${S.ciclo}</h2><p>Ocupación de cada día frente a su cupo. Toca un día para ver quién está fuera.</p>${avisoFiltro()}</div>
  <div class="card">
    <div class="row" style="margin-bottom:14px;align-items:center;flex-wrap:nowrap">
      <button class="btn" onclick="UI.calMes=Math.max(0,UI.calMes-1);UI.calDia=null;render()" ${m===0?'disabled':''} aria-label="Mes anterior">‹</button>
      <h2 style="margin:0;flex:1;text-align:center;font-size:28px;text-transform:capitalize">${MESES[m]}</h2>
      <button class="btn" onclick="UI.calMes=Math.min(11,UI.calMes+1);UI.calDia=null;render()" ${m===11?'disabled':''} aria-label="Mes siguiente">›</button>
    </div>
    <div class="row" style="margin-bottom:14px">
      <label>Grupo<select onchange="UI.calGrupo=this.value;render()">${optsGrupos(FG, ['all','Todos los grupos'])}</select></label>
      <label>Tipo<select onchange="UI.calTipo=this.value;render()">${opts(S.tipos, FT, ['all','Todos los tipos'])}</select></label>
    </div>
    <div class="cal">${grid}</div>
    <div class="legend"><span style="--c:var(--ok-soft)">Con hueco</span><span style="--c:var(--warn-soft)">Al 75 % o más</span><span style="--c:var(--bad-soft)">Lleno</span><span style="--c:var(--linea)">Sin cupo: nº de personas</span><span>SS Semana Santa, P puente</span></div>
  </div>${det}`;
}

function ajustarHoja(){ // encoge la vista previa para que quepa en la pantalla
  const h=document.getElementById('hoja'); if(!h) return;
  const wrap=h.parentElement; h.style.transform=''; wrap.style.height='';
  const disp=wrap.clientWidth-36, real=h.offsetWidth;
  const k = Math.min(1, disp/real);
  h.style.transform=`scale(${k})`; h.style.marginLeft = k<1 ? '0' : ((disp-real)/2)+'px';
  wrap.style.height=(h.offsetHeight*k+36)+'px';
}
window.addEventListener('resize',()=>{ if(UI.vista==='pdf') ajustarHoja(); });

    let html = `<h2 style="--c:${dep?.color||'var(--senal)'}"><span class="barra"></span>${dep&&DEP()==='all'?esc(dep.nombre)+', ':''}${esc(nombreGrupo(k))} <small>${orden.length} personas</small></h2>`;

        ${orden.map(t=>{const st=statsTrab(t);
          return `<div class="fila"><div class="nom">${esc(t.nombre)}</div><div class="pista">${ssBand}
            ${st.periodos.map(p=>`<span class="per ${p.forzado?'forz':''}" style="left:${pos(p.desde)}%;width:${Math.max(.25,(daysBetween(p.desde,p.hasta)+1)/lenY*100)}%"></span>`).join('')}
            ${P.desprog?st.desprog.filter(d=>d.dia.startsWith(String(y))).map(d=>`<span class="dp" style="left:calc(${pos(d.dia)}% - 1px)"></span>`).join(''):''}
          </div></div>`}).join('')}
        <div class="leyenda"><span><i style="background:var(--pista)"></i>Vacaciones</span><span><i style="background:var(--bad)"></i>Guardadas sin cupo</span>${P.desprog?'<span><i style="background:var(--senal);border:1px solid #9A7A00"></i>Desprogramación</span>':''}<span><i style="background:rgba(246,195,0,.3)"></i>Semana Santa</span></div>
      </div>`;
    }
    if(P.tabla){
      html += `<table><tr><th>#</th><th>Nombre</th><th>Tipo</th><th>Periodos</th><th class="num">Días</th>${P.desprog?'<th>Desprogramaciones</th>':''}${P.puntos?'<th class="num">Pts año ant.</th><th class="num">Pts ciclo</th>':''}${P.firma?'<th>Conforme</th>':''}</tr>
        ${orden.map((t,j)=>{const st=statsTrab(t);
          return `<tr><td>${j+1}</td><td><b>${esc(t.nombre)}</b></td><td>${esc(tipoDe(t.tipoId)?.nombre||'')}</td>
          <td>${st.periodos.map(p=>`${fmt(p.desde)} – ${fmt(p.hasta)}${p.forzado?' *':''}`).join('<br>')||'—'}</td>
          <td class="num">${st.dias}/${st.derecho}</td>
          ${P.desprog?`<td>${st.desprog.map(d=>fmt(d.dia)).join(', ')||'—'}</td>`:''}
          ${P.puntos?`<td class="num">${nf(t.ptsAnt||0)}</td><td class="num"><b>${nf(st.pts)}</b></td>`:''}
          ${P.firma?'<td><div class="firma"></div></td>':''}</tr>`}).join('')}
      </table>`;
    }
    return `<section class="${i>0?'salto':''}">${html}</section>`;
  }).join('');
  const notas = [
    P.puntos ? (S.ajustes.ponderar ? 'Puntos ponderados según la base de días de cada departamento.' : 'Puntos sin ponderar.') : '',
    P.tabla && S.periodos.some(p=>p.forzado) ? '* Periodo guardado por encima del cupo.' : '',
    'Orden de elección según el art. 33 del convenio.'
  ].filter(Boolean).join(' ');
  return `<div class="inf">${cab}${secciones}<div class="pie-inf">${notas}</div></div>`;
}
function imprimir(){
  const P = UI.pdf;
  document.getElementById('pageStyle').textContent = `@page{size:A4 ${P.orient};margin:12mm}`;
  document.getElementById('print').innerHTML = informeHTML(P);
  const t = document.title;
  document.title = `Vacaciones ${S.ciclo}${DEP()!=='all'?' - '+nombreDep(DEP()):''}${P.grupo!=='all'?' - '+nombreGrupo(P.grupo):''}`;
  setTimeout(()=>{ window.print(); document.title = t; }, 50);
}

/* =========================================================
   Copias de seguridad
   ========================================================= */
function vCopias(){
  return `<div class="intro"><h2>Copias de seguridad</h2><p>Los datos se guardan solo en este navegador. Descarga una copia de vez en cuando y úsala para pasar los datos a otro dispositivo.</p></div>
  <div class="card"><div class="row">
      <button class="btn primary" onclick="copiaJSON()">Descargar copia</button>
      <label class="btn" style="color:var(--asfalto);font-size:15px;cursor:pointer">Restaurar copia<input type="file" accept=".json,application/json" style="display:none" onchange="restaurar(this.files[0])"></label>
      <button class="btn danger" onclick="if(confirm('Se borrarán TODOS los datos de este navegador. ¿Seguro?')){S=estadoInicial();save();UI.vista='reglas';render()}">Empezar de cero</button>
  </div><p class="muted" style="margin:14px 0 0">Versión de la app: ${APP_VERSION}</p></div>`;
}
function restaurar(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.trabajadores||!d.tramos) throw 0; if(!confirm('Esto sustituye todos los datos actuales. ¿Continuar?')) return; S=normalizar(d); save(); UI.vista='reglas'; render(); toast('Copia restaurada'); }catch(e){ toast('Ese archivo no es una copia de esta app'); } };
  r.readAsText(f);
}

if(S.trabajadores.length && !S.pasosOk.length) UI.vista='eleccion';
render();

/* =========================================================
   Aviso de actualización
   La app consulta version.json del repositorio. Si hay una versión más nueva,
   bloquea la pantalla hasta que se actualice. Los datos no se tocan.
   ========================================================= */
let avisoActualizacion = false;
const esMasNueva = (a,b) => { const pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(let i=0;i<3;i++){ if((pa[i]||0)!==(pb[i]||0)) return (pa[i]||0)>(pb[i]||0); } return false; };
async function comprobarVersion(){
  if(avisoActualizacion || !/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const v = await r.json();
    if(v && v.version && esMasNueva(v.version, APP_VERSION)) mostrarActualizacion(v);
  }catch(e){ /* sin conexión: se vuelve a intentar más tarde */ }
}
function mostrarActualizacion(v){
  avisoActualizacion = true;
  const d = document.createElement('div');
  d.id='actualizacion'; d.setAttribute('role','alertdialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-labelledby','actTit');
  const nov = Array.isArray(v.novedades) ? v.novedades : [];
  d.innerHTML = `<div class="act-caja">
    <div class="act-cab"><span class="flecha" aria-hidden="true">↻</span><div class="tit"><div class="ctx">Versión ${esc(v.version)}</div><h2 id="actTit">Hay una versión nueva</h2></div></div>
    <div class="act-cuerpo"><p>Actualiza para seguir usando la app. Tus datos se quedan como están.</p>
      ${nov.length?`<h3>Novedades</h3><ul>${nov.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
      <button class="btn primary act-btn" id="actBtn">Actualizar ahora</button>
      <div class="act-pie">Tienes la versión ${APP_VERSION}</div></div></div>`;
  document.body.appendChild(d);
  document.body.classList.add('bloqueada');
  document.querySelectorAll('header.app, nav.pasos, main, #toast').forEach(e=>e.setAttribute('inert',''));
  const b = d.querySelector('#actBtn');
  b.addEventListener('click', ()=>{ b.disabled=true; b.textContent='Actualizando…'; save();
    location.replace(location.pathname + '?v=' + encodeURIComponent(v.version) + '&t=' + Date.now()); });
  d.addEventListener('keydown', e=>{ if(e.key==='Tab'||e.key==='Escape'){ e.preventDefault(); b.focus(); } });
  b.focus();
}
if(/[?&]v=/.test(location.search)){ history.replaceState(null,'',location.pathname+location.hash); setTimeout(()=>toast(`App actualizada a la versión ${APP_VERSION}`),300); }
comprobarVersion();
setInterval(comprobarVersion, 5*60*1000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) comprobarVersion(); });
window.addEventListener('focus', comprobarVersion);

</script>
