<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22262E">
<title>Vacaciones AGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="pageStyle">@page{size:A4 landscape;margin:12mm}</style>
<style>
/* Identidad: señalética de aeropuerto.
   Asfalto y hormigón de plataforma como base; amarillo de cartel para lo que pide acción ahora;
   los departamentos son carteles de ubicación (amarillo sobre negro); cada producto lleva su color.
   Barlow (rótulos de carretera) en versión condensada para titulares y cifras. */
:root{
  --asfalto:#22262E; --hormigon:#ECEEF1; --papel:#FFFFFF; --linea:#D9DDE3; --gris:#5F6775;
  --senal:#F6C300; --senal-soft:#FFF6D1;
  --pista:#1F5FBF; --pista-soft:#E6EEFA;
  --ok:#23864F; --ok-soft:#E2F2E8; --warn:#B86E00; --warn-soft:#FFF1D2; --bad:#C23B30; --bad-soft:#FBE4E1;
  --ctx:#1F5FBF;   /* color del producto en el que se trabaja */
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--text);background:var(--hormigon);color:var(--asfalto);font-size:15px;line-height:1.5;overflow-x:hidden}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* cabecera */
header.app{background:var(--asfalto);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;height:58px;position:sticky;top:0;z-index:6}
.marca{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;padding:0;font:inherit}
.logo{width:34px;height:34px;border-radius:7px;background:var(--senal);color:var(--asfalto);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.marca h1{font-family:var(--cond);font-weight:700;font-size:23px;margin:0;white-space:nowrap}
.migas{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.miga{border:0;font:inherit;font-weight:700;font-family:var(--cond);font-size:18px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;background:#363B45;color:var(--senal)}
.miga.prod{background:var(--ctx);color:#fff}
.migas .sep-m{color:#6B7280}
.ciclo{font-family:var(--cond);font-size:15px;color:#B8BEC9;white-space:nowrap}
.ciclo b{color:var(--senal);font-size:22px;font-weight:700;margin-left:4px}
.engranaje{background:#363B45;border:1px solid #4A505C;color:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 auto}
.engranaje.on{background:var(--senal);color:var(--asfalto);border-color:var(--senal)}

/* pasos */
nav.pasos{display:flex;gap:4px;overflow-x:auto;background:var(--papel);border-bottom:1px solid var(--linea);padding:9px 12px;position:sticky;top:58px;z-index:5;scrollbar-width:none;box-shadow:inset 0 3px 0 var(--ctx)}
nav.pasos::-webkit-scrollbar{display:none}
nav.pasos:empty{display:none}
.step{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px 6px 6px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;color:var(--gris);white-space:nowrap;cursor:pointer}
.step:hover{background:var(--hormigon)}
.step .num{width:24px;height:24px;border-radius:5px;background:var(--hormigon);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--gris)}
.step.done .num{background:var(--ok);color:#fff}
.step.on{background:var(--senal);color:var(--asfalto);font-weight:700}
.step.on .num{background:var(--asfalto);color:var(--senal)}
.step.extra{padding-left:12px}
.sep{width:1px;background:var(--linea);margin:4px 6px;flex:0 0 1px}

main{max-width:1760px;margin:0 auto;padding:24px clamp(18px,2.5vw,40px) 8px}
body.ancho main{max-width:none}
.intro{margin:0 0 20px;max-width:80ch}
.intro .k{font-size:14px;font-weight:600;color:var(--gris)}
.intro h2{font-family:var(--cond);font-size:38px;line-height:1.05;font-weight:700;margin:2px 0 8px;letter-spacing:-.005em}
.intro p{margin:0;color:var(--gris)}

/* portada: departamentos y productos */
.portada{margin:18px 0 24px}
.portada .k{font-size:15px;font-weight:600;color:var(--gris);margin:0 0 4px}
.portada h2{font-family:var(--cond);font-size:46px;line-height:1.02;font-weight:700;margin:0;max-width:16ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:22px}
.tile{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;text-align:left;border:0;border-radius:14px;padding:22px;cursor:pointer;font:inherit;background:var(--asfalto);color:#fff;min-height:132px;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .ini{width:58px;height:58px;border-radius:9px;background:var(--senal);color:var(--asfalto);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:34px}
.tile .nom{font-family:var(--cond);font-weight:700;font-size:40px;line-height:1;display:block;color:var(--senal)}
.tile .dato{display:block;color:#B8BEC9;font-size:14px;margin-top:6px}
.tile .fl{font-family:var(--cond);font-size:44px;color:var(--senal);line-height:1}
.tile.prod{background:var(--c);min-height:170px}
.tile.prod .nom{color:#fff;font-size:46px}
.tile.prod .dato{color:rgba(255,255,255,.85)}
.tile.prod .fl{color:#fff}
.tile.prod .ini{background:rgba(255,255,255,.18);color:#fff}
.asig{display:flex;align-items:stretch;width:100%;border:0;padding:0;background:var(--senal);color:var(--asfalto);border-radius:14px;overflow:hidden;cursor:pointer;font:inherit;text-align:left;margin-bottom:16px;transition:transform .12s}
.asig:hover{transform:translateY(-2px)}
.asig .flecha{background:var(--asfalto);color:var(--senal);display:grid;place-items:center;font-family:var(--cond);font-size:48px;font-weight:700;padding:0 22px}
.asig .cuerpo{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.asig .t{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1.05}
.asig .d{font-weight:600;font-size:14px}
.asig .e{font-size:14px;opacity:.85}
.asig .ir{font-family:var(--cond);font-size:46px;display:grid;place-items:center;padding:0 20px}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:24px}
.mtile{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:12px;padding:16px;cursor:pointer;font:inherit;color:var(--asfalto);border-left:5px solid var(--ctx)}
.mtile:hover{border-color:var(--asfalto);border-left-color:var(--ctx)}
.mtile .mini{width:42px;height:42px;border-radius:8px;background:var(--hormigon);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.mtile .mt{display:block;font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.mtile>span:last-child{min-width:0}
.mtile .md{display:block;color:var(--gris);font-size:13px;margin-top:2px}
.volver{background:none;border:0;font:inherit;font-weight:600;color:var(--pista);cursor:pointer;padding:0;margin-bottom:6px}

.card{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-family:var(--cond);font-size:23px;font-weight:600;margin:0 0 12px;line-height:1.15}
.card h3{font-family:var(--cond);font-size:18px;font-weight:600;margin:18px 0 6px}
.help{font-size:14px;color:var(--gris);margin:0 0 14px;max-width:72ch}
.muted{color:var(--gris);font-size:13px}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>label{flex:1 1 160px}
label{display:block;font-size:13px;color:var(--gris);font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--linea);border-radius:8px;font:inherit;font-weight:400;background:#fff;color:var(--asfalto)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pista);box-shadow:0 0 0 3px var(--pista-soft)}
input[type=checkbox]{display:inline-block;width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--pista)}
.chk{flex:0 1 auto!important;min-width:0;font-weight:500;color:var(--asfalto);font-size:15px;padding:6px 0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:#fff;color:var(--asfalto);padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#B9C0CA}
.btn.primary{background:var(--pista);border-color:var(--pista);color:#fff}
.btn.primary:hover{background:#184FA1}
.btn.ink{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pie{display:flex;justify-content:space-between;gap:10px;margin:10px 0 28px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--linea);vertical-align:middle}
th{font-size:13px;color:var(--gris);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--hormigon);font-family:var(--cond);font-weight:600;font-size:16px;padding:7px}
.scroll{overflow-x:auto}

.chip{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12.5px;font-weight:600;background:var(--pista-soft);color:var(--pista);white-space:nowrap}
td .chip{white-space:normal}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.grey{background:var(--hormigon);color:var(--gris)}
.chip.mano{background:var(--senal-soft);color:#7A5B00}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:8px 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--asfalto)}
.pill.on{background:var(--asfalto);color:#fff;border-color:var(--asfalto)}
.pill.sug{border-style:dashed;font-weight:500}
.seg{display:inline-flex;background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;color:var(--gris);white-space:nowrap}
.seg button.on{background:var(--asfalto);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:0 0 auto}

/* el cartel de turno */
.cartel{display:flex;align-items:stretch;background:var(--senal);color:var(--asfalto);border-radius:12px;overflow:hidden;margin-bottom:18px}
.cartel .flecha{background:var(--asfalto);color:var(--senal);display:grid;place-items:center;font-family:var(--cond);font-size:46px;font-weight:700;padding:0 18px;line-height:1}
.cartel .cuerpo{flex:1;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.cartel .txt{flex:1 1 220px}
.cartel .ctx{font-size:14px;font-weight:600}
.cartel .who{font-family:var(--cond);font-size:36px;font-weight:700;line-height:1.05}
.cartel .sub{font-size:14px}
.cartel .btn{border-color:var(--asfalto)}
.cartel.fin{background:var(--ok-soft)} .cartel.fin .flecha{background:var(--ok);color:#fff}

.preview{border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px;border-left:5px solid}
.preview p{margin:8px 0 0}
.preview.ok{background:var(--ok-soft);border-color:var(--ok)} .preview.bad{background:var(--bad-soft);border-color:var(--bad)} .preview.warn{background:var(--warn-soft);border-color:var(--warn)}
.stats{display:flex;flex-wrap:wrap;gap:22px}
.stats div{font-size:13px;color:var(--gris)}
.stats b{font-family:var(--cond);font-size:30px;font-weight:700;display:block;line-height:1.05;color:var(--asfalto)}
.preview .stats b{font-size:24px}

/* calendario mensual (cupos) */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:12px;color:var(--gris);text-align:center;font-weight:600;padding:4px 0}
.cal .d{min-height:66px;border-radius:7px;border:1px solid var(--linea);padding:5px 6px;font-size:12px;cursor:pointer;background:#fff;display:flex;flex-direction:column}
.cal .d:hover{border-color:var(--pista)}
.cal .d.empty{border:0;background:none;cursor:default}
.cal .d .n{font-family:var(--cond);font-weight:700;font-size:16px;line-height:1}
.cal .d .o{margin-top:auto;font-weight:700;font-family:var(--cond);font-size:15px}
.cal .d .p{font-size:10.5px;color:var(--gris)}
.cal .d.lv1{background:var(--ok-soft)} .cal .d.lv2{background:var(--warn-soft)} .cal .d.lv3{background:var(--bad-soft);border-color:#EBB3AD}
.cal .d.sel{outline:3px solid var(--pista);outline-offset:-1px}
.cal .d.ss .n::after{content:" SS";font-size:10px;color:var(--warn)} .cal .d.pu .n::after{content:" P";font-size:10px;color:var(--pista)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--gris);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* calendario anual */
.cal-anual-card{padding:14px}
.an-barra{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.an-barra label{flex:0 1 150px}
.an-barra .esp{flex:1}
.an-anio{display:flex;align-items:center;gap:6px}
.an-anio b{font-family:var(--cond);font-size:30px;line-height:1;min-width:64px;text-align:center}
.anual{--nw:170px;--dw:3px;overflow:auto;max-height:72vh;border:1px solid var(--linea);border-radius:10px;background:#fff;position:relative}
.an-grid{position:relative;width:calc(var(--nw) + var(--dw) * var(--dias));min-width:100%}
.an-fila{display:flex;height:30px;border-bottom:1px solid #EEF0F3;position:relative;z-index:1}
.an-fila:hover .an-nom{background:#F6F7F9}
.an-nom{position:sticky;left:0;z-index:3;width:var(--nw);flex:0 0 var(--nw);background:#fff;border-right:1px solid var(--linea);padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-nom small{color:var(--gris);font-weight:500}
.an-pista{position:relative;flex:1;cursor:copy}
.an-cab{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--linea)}
.an-cab .an-fila{height:auto;border:0}
.an-cab .an-nom{font-family:var(--cond);font-size:15px;color:var(--gris);align-items:flex-end;padding-bottom:4px}
.an-mes{position:absolute;top:0;height:22px;border-left:1px solid var(--linea);font-family:var(--cond);font-weight:700;font-size:14px;padding-left:5px;overflow:hidden;white-space:nowrap}
.an-dia{position:absolute;top:22px;height:18px;text-align:center;font-size:10.5px;color:var(--gris);font-variant-numeric:tabular-nums}
.an-dia.fs{color:#A0A6B1}
.an-cab .an-pista{height:22px;cursor:default}
.an-cab.con-dias .an-pista{height:42px}
.an-ocu{height:34px}
.an-ocu .an-nom{font-size:12.5px;color:var(--gris);font-weight:600}
.an-ocu .an-pista{cursor:default}
.an-ocu i{position:absolute;bottom:3px;background:var(--ctx);opacity:.55;border-radius:1px 1px 0 0}
.an-ocu i.max{opacity:1}
.an-grp{height:26px;background:var(--hormigon);z-index:2}
.an-grp .an-nom{background:var(--hormigon);font-family:var(--cond);font-size:15px}
.an-grp .an-pista{cursor:default}
.an-bar{position:absolute;top:5px;bottom:5px;border:0;padding:0 4px;border-radius:4px;background:var(--ctx);color:#fff;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:clip;text-align:left;min-width:2px}
.an-bar:hover{filter:brightness(1.12);z-index:2}
.an-bar.forz{background:var(--bad)}
.an-bar.mano{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 4px,transparent 4px 8px)}
.cese-fila{gap:6px!important}
.cese-fila input{flex:1 1 0;min-width:0}
.cese-fila .muted{flex:0 0 auto}
.an-cese{position:absolute;top:4px;bottom:4px;border-radius:4px;background:repeating-linear-gradient(135deg,#C9CED6 0 3px,#EEF0F3 3px 7px);cursor:pointer}
.an-dp{position:absolute;top:7px;bottom:7px;background:var(--senal);border:1px solid #9A7A00;border-radius:2px;min-width:3px;pointer-events:auto;cursor:help}
.an-capa{position:absolute;top:0;bottom:0;left:var(--nw);right:0;pointer-events:none;z-index:0}
.an-capa .lm{position:absolute;top:0;bottom:0;width:1px;background:#E1E4E9}
.an-capa .fs{position:absolute;top:0;bottom:0;background:#F5F6F8}
.an-capa .ss{position:absolute;top:0;bottom:0;background:rgba(246,195,0,.13)}
.an-capa .pu{position:absolute;top:0;bottom:0;background:rgba(31,95,191,.07)}
.an-capa .hoy{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.an-vacio{padding:40px 20px;text-align:center;color:var(--gris)}
body.cal-full{overflow:hidden}
body.cal-full .cal-anual-card{position:fixed;inset:0;z-index:40;margin:0;border-radius:0;display:flex;flex-direction:column;border:0}
body.cal-full .anual{flex:1;max-height:none}

.rsems{display:flex;flex-direction:column;gap:14px}
.rsem{background:var(--hormigon);border-radius:12px;padding:12px}
.rsem-t{font-family:var(--cond);font-weight:700;font-size:20px;margin:0 0 8px 2px}
.rsem-d{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rdia{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:104px;padding:8px 4px;border:1px solid var(--linea);border-top:6px solid var(--tc,var(--linea));border-radius:9px;background:#fff;font:inherit;cursor:pointer;color:var(--asfalto)}
.rdia:hover{border-color:var(--asfalto);border-top-color:var(--tc,var(--asfalto))}
.rdia .rd-n{font-size:12px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.03em}
.rdia .rd-c{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;color:var(--tc,#C3C8D0)}
.rdia .rd-t{font-size:12.5px;font-weight:600;color:var(--gris);text-align:center;line-height:1.1}
.rdia.lib{background:color-mix(in srgb,var(--tc) 10%,#fff)}
.rdia.vacio .rd-t{font-weight:500}
.dlg-fondo{position:fixed;inset:0;z-index:60;background:rgba(34,38,46,.55);display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h2{font-family:var(--cond);font-size:28px;margin:0 0 6px}
.dlg-ops{display:flex;flex-direction:column;gap:8px}
.dlg-op{display:flex;align-items:center;gap:14px;border:1px solid var(--linea);border-left:6px solid var(--tc,var(--linea));border-radius:9px;background:#fff;padding:10px 12px;font:inherit;cursor:pointer;text-align:left;color:var(--asfalto)}
.dlg-op:hover{border-color:var(--asfalto);border-left-color:var(--tc,var(--asfalto))}
.dlg-op.on{background:var(--senal-soft);border-color:var(--asfalto)}
.dlg-op b{font-family:var(--cond);font-size:26px;width:40px;text-align:center;color:var(--tc,var(--gris))}
.dlg-op small{color:var(--gris)}
.rot{display:grid;grid-template-columns:auto repeat(7,1fr);gap:4px;max-width:640px}
.rot-h{text-align:center;font-size:12px;font-weight:700;color:var(--gris)}
.rot-s{font-family:var(--cond);font-weight:600;font-size:15px;align-self:center;padding-right:8px;white-space:nowrap}

/* =========================================================
   Vacaciones AGP — app personal de elección de vacaciones
   Reglas base: Convenio Menzies (BOE-A-2023-25956), arts. 32 y 33
   Datos guardados en el navegador (localStorage). Haz copias.

const APP_VERSION = '5.2.1';   // súbela junto con version.json en cada publicación
const LS_KEY = 'vacaciones-agp-v1';
const SIN = '_'; // clave interna para «sin grupo»

/* ---------- fechas (UTC, sin sustos de horario de verano) ---------- */
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = pd(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((pd(b)-pd(a))/86400000);
function* eachDay(a,b){ for(let s=a; s<=b; s=addDays(s,1)) yield s; }
const hoy = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['L','M','X','J','V','S','D'];
const fmt = s => { if(!s) return ''; const d = pd(s); return `${d.getUTCDate()} ${MESES[d.getUTCMonth()].slice(0,3)}`; };
const fmtL = s => { if(!s) return ''; const d = pd(s); return `${d.getUTCDate()} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`; };
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return iso(new Date(Date.UTC(y,mo-1,da)));
}
const semanaSantaDefault = y => { const e = easter(y); return { desde: addDays(e,-7), hasta: e }; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n*100)/100;
const nf = n => (Math.round(n*100)/100).toLocaleString('es-ES');
const delAnio = (s,y) => !!s && s.startsWith(String(y));

  {desde:'12-16',hasta:'12-31',pts:8, nombre:'Diciembre 2.ª quincena'},

const COLORES = ['#1F5FBF','#23864F','#B86E00','#7B4BB3','#C23B30','#0E8A9A','#7A5C3E','#C2477A'];
const PRODUCTOS_DEF = [ {id:'gh', nombre:'GroundHandling', color:'#1F5FBF'}, {id:'rb', nombre:'RedBull', color:'#E8730C'} ];
const SUGERENCIAS = { // ideas para crear skills rápido; se pueden ignorar
  Pasaje:['Agente de pasaje','Facturación','Embarque','Coordinador de pasaje','Supervisor','Auxiliar administrativo'],
  Rampa:['Agente de rampa','Auxiliar de rampa','Coordinador de pista','Conductor','Carga','Jefe de turno'],

const TURNOS_DEF = [ {cod:'R',nombre:'Libre',color:'#23864F',libre:true}, {cod:'F',nombre:'Festivo',color:'#C23B30',libre:true}, {cod:'M',nombre:'Mañana',color:'#1F5FBF',libre:false}, {cod:'T',nombre:'Tarde',color:'#B86E00',libre:false}, {cod:'N',nombre:'Noche',color:'#5B3E99',libre:false} ];

function estadoInicial(){

    tramos:TRAMOS_CONVENIO.map(t=>({...t})), semanaSanta:semanaSantaDefault(ciclo), puentes:[], cupos:[], periodos:[], desprog:[], turnos:{}, pasosOk:{}, ctx:{dep:'',prod:''} });
}
function normalizar(d){ // también migra datos de versiones anteriores

  if(!d.departamentos) d.departamentos = depsIniciales();
  if(!d.productos) d.productos = PRODUCTOS_DEF.map(p=>({...p}));
  d.grupos ||= []; d.desprog ||= []; d.puentes ||= []; d.cupos ||= []; d.periodos ||= []; d.trabajadores ||= [];
  d.turnos ||= {}; if('hechos' in d.turnos) d.turnos = {};
  if(!d.ctx) d.ctx = {dep:'', prod:''};
  if(!d.pasosOk || Array.isArray(d.pasosOk)) d.pasosOk = {};
  const prod0 = d.productos[0].id;
  d.grupos.forEach(g=>{ if(g.depId===undefined) g.depId=''; if(!g.prodId) g.prodId=prod0; });
  const gDep = w => (w.grupoId && d.grupos.find(g=>g.id===w.grupoId)?.depId) || w.depId || '';
  const gProd = w => (w.grupoId && d.grupos.find(g=>g.id===w.grupoId)?.prodId) || w.prodId || prod0;
  d.trabajadores.forEach(t=>{ if(t.grupoId===undefined) t.grupoId=''; if(t.depId===undefined) t.depId=''; if(!t.prodId) t.prodId=gProd(t); t.depId = gDep(t); });

    d.skills = [];
    const viejos = d.tipos || [], mapa = {};
    const skillPara = (tipoId, dep, prod) => {
      const k = tipoId+'|'+dep+'|'+prod; if(mapa[k]) return mapa[k];
      const t = viejos.find(x=>x.id===tipoId); if(!t) return null;
      const s = {id:uid(), nombre:t.nombre, color:t.color, depId:dep, prodId:prod}; d.skills.push(s); return mapa[k]=s.id;
    };
    d.trabajadores.forEach(w=>{ const ids = Array.isArray(w.tipos)?w.tipos:(w.tipoId?[w.tipoId]:[]); w.skills = ids.map(id=>skillPara(id,w.depId,w.prodId)).filter(Boolean); delete w.tipos; delete w.tipoId; });
    d.cupos.forEach(c=>{ const ids = c.tipos||[]; c.skills = c.depId ? ids.map(id=>skillPara(id,c.depId,c.prodId||prod0)).filter(Boolean) : []; delete c.tipos; });

  d.rotaciones ||= []; d.transf ||= []; if(!Array.isArray(d.turnosTipos) || !d.turnosTipos.length) d.turnosTipos = TURNOS_DEF.map(t=>({...t}));
  if(d.turnosTipos.map(t=>t.cod).join()==='M,T,N,P,L'){ // tipos de la 5.0: el libre pasa a ser «R» y se añade festivo

  }
  d.grupos.forEach(g=>{ if(g.rotacionId===undefined) g.rotacionId=''; });
  d.trabajadores.forEach(t=>{ if(t.rotacionId===undefined) t.rotacionId=''; });
  d.cupos.forEach(c=>{ c.skills ||= []; if(c.grupoId===undefined) c.grupoId=''; if(c.depId===undefined) c.depId=''; if(c.prodId===undefined) c.prodId = c.depId ? prod0 : ''; });

/* ---------- consultas ---------- */
const skillDe = id => S.skills.find(t=>t.id===id);

function diasCese(w, y=S.ciclo){
  const a=`${y}-01-01`, b=`${y}-12-31`; let n=0;
  ceseDe(w).forEach(c=>{ const d=c.desde<a?a:c.desde, h=c.hasta>b?b:c.hasta; if(h>=d) n+=daysBetween(d,h)+1; });

}
/* días trabajados al año: los que se hayan escrito o, si no, los del año menos los de cese */

}
const ceseTxt = w => ceseDe(w).map(c=>`${fmt(c.desde)}${c.desde.slice(0,4)!==c.hasta.slice(0,4)?' '+c.desde.slice(0,4):''} – ${fmt(c.hasta)}${c.desde.slice(0,4)!==c.hasta.slice(0,4)?' '+c.hasta.slice(0,4):''}`).join(', ');

/* contexto: departamento + producto con el que se trabaja */
const enCtx = () => !!(S.ctx.dep && S.ctx.prod && depDeId(S.ctx.dep) && prodDeId(S.ctx.prod));

}
const tKey = k => k===SIN ? `${SIN}${S.ctx.dep}|${S.ctx.prod}` : k;
const ctxKey = () => `${S.ctx.dep}|${S.ctx.prod}`;

/* ---------- rotaciones: patrón de 3 semanas por grupo ---------- */
const rotDeId = id => S.rotaciones.find(r=>r.id===id);
const rotacionesVis = () => S.rotaciones.filter(r=>r.depId===S.ctx.dep && r.prodId===S.ctx.prod);
const rotDe = w => !w ? null : (w.rotacionId && rotDeId(w.rotacionId)) || (w.grupoId ? rotDeId(grupoDe(w.grupoId)?.rotacionId) : null) || null;   // la propia manda sobre la del grupo
const tipoTurno = cod => S.turnosTipos.find(t=>t.cod===cod);
const lunesDe = s => { const d=pd(s).getUTCDay(); return addDays(s, -((d+6)%7)); };
function turnoDia(w, s){
  const r = rotDe(w); if(!r || !r.inicio) return null;

}
const marcaTurno = (w,s) => { const t = turnoDia(w,s); return t ? `<i class="tc" style="color:${t.color}">${esc(t.cod)}</i>` : ''; };

/* ---------- transformaciones de contrato: los días de vacaciones se prorratean por tramos ---------- */
const transfDe = id => S.transf.filter(t=>t.trabajadorId===id).sort((a,b)=>a.fecha.localeCompare(b.fecha) || a.creado-b.creado);
const estadoActual = w => ({modalidad:w.modalidad, diasDerecho:Number(w.diasDerecho)||0, diasContratados:w.diasContratados||''});
function tramosContrato(w, y=S.ciclo){
  const ini=`${y}-01-01`, fin=`${y}-12-31`, ts = transfDe(w.id);
  const prox = ts.find(t=>t.fecha>ini);
  let estado = prox ? prox.antes : estadoActual(w), d = ini; const tramos = [];
  ts.filter(t=>t.fecha>ini && t.fecha<=fin).forEach(t=>{ tramos.push({desde:d, hasta:addDays(t.fecha,-1), estado}); estado=t.despues; d=t.fecha; });
  tramos.push({desde:d, hasta:fin, estado});
  return tramos;
}
function derechoCiclo(w, y=S.ciclo){
  const tr = tramosContrato(w,y);
  if(tr.length===1) return {n:Number(tr[0].estado.diasDerecho)||0, tramos:tr, prorrateo:false};
  const len = daysBetween(`${y}-01-01`,`${y+1}-01-01`);
  const x = tr.reduce((a,t)=>a + (Number(t.estado.diasDerecho)||0)*(daysBetween(t.desde,t.hasta)+1)/len, 0);
  return {n:Math.round(x), exacto:x, tramos:tr, prorrateo:true,
    txt: tr.map(t=>`${t.estado.diasDerecho} × ${daysBetween(t.desde,t.hasta)+1}/${len}`).join(' + ') + ` = ${nf(x)} → ${Math.round(x)}`};
}
const nombreModalidad = m => m==='discontinuo' ? 'Fijo discontinuo' : m==='parcial' ? 'Tiempo parcial' : 'Tiempo completo';

/* ---------- puntos (art. 33) ---------- */
function cuentaDia(s){
  const wd = pd(s).getUTCDay();
  if(S.ajustes.computo==='lunsab') return wd!==0;
  if(S.ajustes.computo==='lunvie') return wd!==0 && wd!==6;
  return true;
}
const enRango = (s,r) => r && r.desde && r.hasta && s>=r.desde && s<=r.hasta;
const esSS = s => enRango(s, S.semanaSanta);
const esPuente = s => S.puentes.some(p=>enRango(s,p));
function ptsBase(s){ const md = s.slice(5); const t = S.tramos.find(t=>md>=t.desde && md<=t.hasta); return t ? Number(t.pts)||0 : 0; }
function ptsDia(s){ return ptsBase(s) + (esSS(s)?Number(S.ajustes.ptsSS):0) + (esPuente(s)?Number(S.ajustes.ptsPuente):0); }
function statsRango(desde,hasta){
  let naturales=0, computables=0, pts=0;
  if(!desde||!hasta||hasta<desde) return {naturales,computables,pts};
  for(const s of eachDay(desde,hasta)){ naturales++; if(cuentaDia(s)){ computables++; pts+=ptsDia(s); } }
  return {naturales,computables,pts};
}
const baseDe = w => { const d = depDeId(depDe(w)); return Number(d?.baseDias) > 0 ? Number(d.baseDias) : Number(S.ajustes.baseDias); };
/* Factor sobre los puntos brutos.
   - Con ponderación: base del departamento / días de vacaciones del trabajador (24/30 = ×0,8).
     En un fijo discontinuo equivale a aplicar 365/días contratados sobre sus días de año completo: no se aplica dos veces.
   - Sin ponderación: solo el ajuste del convenio para fijos discontinuos (365 / días contratados). */
function factorInfo(w){
  const A = S.ajustes, der = derechoCiclo(w).n, base = baseDe(w);
  const dc = esDisc(w) ? diasContratadosEf(w).n : 0;
  if(A.ponderar && base>0 && der>0){ const f = base/der; return { f, txt: f===1 ? '×1' : `×${nf(f)} (${base}/${der})` }; }
  if(dc>0){ const f = 365/dc; return { f, txt:`×${nf(f)} (365/${dc})` }; }
  return { f:1, txt:'×1' };
}
const factor = w => factorInfo(w).f;
/* El histórico se conserva: el ciclo activo solo mira sus propias fechas. */
const periodosDe = (id, y=S.ciclo) => S.periodos.filter(p=>p.trabajadorId===id && delAnio(p.desde,y)).sort((a,b)=>a.desde.localeCompare(b.desde));
const desprogDe = (id, y=S.ciclo) => S.desprog.filter(d=>d.trabajadorId===id && delAnio(d.dia,y)).sort((a,b)=>a.solicitud.localeCompare(b.solicitud) || a.creado-b.creado);
function statsTrab(w){
  const ps = periodosDe(w.id), dps = desprogDe(w.id);
  let diasPer=0, bruto=0, largo=false;
  ps.forEach(p=>{ const st=statsRango(p.desde,p.hasta); diasPer+=st.computables; bruto+=st.pts; if(st.naturales>=15) largo=true; });
  if(S.ajustes.desprogPuntua) dps.forEach(d=>{ if(cuentaDia(d.dia)) bruto+=ptsDia(d.dia); });
  const derecho = derechoCiclo(w).n, dias = diasPer + dps.length, pendientes = derecho - dias;
  const reservaPosible = Math.max(0, Number(S.ajustes.maxDesprog) - dps.length);
  const avisos = [];
  if(dias>derecho) avisos.push(`Se pasa ${dias-derecho} día(s) de su derecho`);
  if(ps.length>3) avisos.push(`${ps.length} periodos (el convenio fracciona en 3)`);
  if(ps.length && !largo) avisos.push('Ningún periodo llega a 15 días naturales');
  if(dps.length>Number(S.ajustes.maxDesprog)) avisos.push(`${dps.length} desprogramaciones (máx. ${S.ajustes.maxDesprog})`);
  if(ps.some(p=>solapaCese(w,p.desde,p.hasta))) avisos.push('Tiene vacaciones dentro de su periodo de cese');

}
function ordenEleccion(k){
  return S.trabajadores.filter(t=>visible(t) && (k===undefined || gk(t)===k)).sort((a,b)=>
    (Number(a.ptsAnt)||0)-(Number(b.ptsAnt)||0) ||
    (Number(a.ptsAnt2)||0)-(Number(b.ptsAnt2)||0) ||
    (a.antig||'9999').localeCompare(b.antig||'9999') ||
    a.nombre.localeCompare(b.nombre,'es'));
}

/* ---------- cupos ---------- */
function ocupacion(excluirTrab){
  const occ = {};
  S.periodos.forEach(p=>{ if(p.trabajadorId===excluirTrab) return; for(const s of eachDay(p.desde,p.hasta)) (occ[s] ||= []).push(p.trabajadorId); });
  return occ;
}
const reglaAplica = (c,w) => w && (!c.depId || c.depId===depDe(w)) && (!c.prodId || c.prodId===prodDe(w)) && (!c.grupoId || c.grupoId===w.grupoId) && (!c.skills.length || skillsDe(w).some(id=>c.skills.includes(id)));
const cupoVisible = c => (!c.depId || c.depId===S.ctx.dep) && (!c.prodId || c.prodId===S.ctx.prod);
const usadosCupo = (c, ids) => ids.filter(id=>reglaAplica(c,trabDe(id))).length;
function conflictosCupo(w, desde, hasta){
  const occ = ocupacion(w.id), res = [];
  for(const s of eachDay(desde,hasta)){
    S.cupos.forEach(c=>{
      if(!enRango(s,c) || !reglaAplica(c,w)) return;
      const u = usadosCupo(c, occ[s]||[]);
      if(u+1 > Number(c.max)) res.push({dia:s, cupo:c, usados:u});
    });
  }
  return res;
}
function cuposExcedidos(){
  const occ = ocupacion(null), dias = new Set();
  S.cupos.filter(cupoVisible).forEach(c=>{ for(const s of eachDay(c.desde,c.hasta)) if(usadosCupo(c,occ[s]||[])>c.max) dias.add(s); });
  return dias.size;
}
/* días que ya tiene alguien del mismo grupo (dentro del mismo departamento y producto) */
function companerosEnFechas(w, desde, hasta, excepto){

  const k = gk(w), out = new Set();
  S.periodos.forEach(p=>{ if(p.id===excepto || p.trabajadorId===w.id) return; const t=trabDe(p.trabajadorId);
    if(t && visible(t)===visible(w) && depDe(t)===depDe(w) && prodDe(t)===prodDe(w) && gk(t)===k && !(hasta<p.desde || desde>p.hasta)) out.add(t.nombre); });
  return [...out];
}
const solapePropio = (w,desde,hasta,excepto) => S.periodos.some(p=>p.id!==excepto && p.trabajadorId===w.id && !(hasta<p.desde || desde>p.hasta));
const ambitoCupo = c => [!c.depId ? 'Todos los departamentos' : '', c.grupoId ? 'Solo '+esc(nombreGrupo(c.grupoId)) : 'Toda la plantilla', c.skills.length ? c.skills.map(t=>esc(skillDe(t)?.nombre)).filter(Boolean).join(', ') : 'todas las skills'].filter(Boolean).join(', ');

/* ---------- desprogramaciones (art. 32) ---------- */
const maxDiaTurno = k => Math.floor(miembros(k).length * Number(S.ajustes.pctTurno) / 100);
function problemasDesprog(d){
  const w = trabDe(d.trabajadorId); if(!w) return [];
  const A = S.ajustes, out = [], y = d.dia.slice(0,4);
  const propias = desprogDe(w.id, y), idx = propias.findIndex(x=>x.id===d.id);
  if(idx >= Number(A.maxDesprog)) out.push({nivel:'bad', txt:`Pasa de ${A.maxDesprog} al año`});
  const ant = daysBetween(d.solicitud, d.dia);
  if(ant < Number(A.preaviso)) out.push({nivel:'bad', txt:`Preaviso de ${ant} día(s) (mín. ${A.preaviso})`});
  const k = gk(w), max = maxDiaTurno(k);
  const mismoDia = S.desprog.filter(x=>x.dia===d.dia && trabDe(x.trabajadorId) && gk(trabDe(x.trabajadorId))===k && visible(trabDe(x.trabajadorId))===visible(w))
    .sort((a,b)=>a.solicitud.localeCompare(b.solicitud) || a.creado-b.creado);
  const pos = mismoDia.findIndex(x=>x.id===d.id);
  if(pos >= max) out.push({nivel:'bad', txt: max===0 ? `En ${nombreGrupo(k)} (${miembros(k).length} pers.) el ${A.pctTurno} % no llega a 1` : `Fuera del ${A.pctTurno} % del turno (máx. ${max} ese día)`});
  if(S.periodos.some(p=>p.trabajadorId===w.id && enRango(d.dia,p))) out.push({nivel:'warn', txt:'Coincide con sus vacaciones'});
  if(propias.some(x=>x.id!==d.id && x.dia===d.dia)) out.push({nivel:'warn', txt:'Día repetido'});
  if(enCese(w,d.dia)) out.push({nivel:'bad', txt:'Cae en su periodo de cese'});
  if(!delAnio(d.dia,S.ciclo)) out.push({nivel:'warn', txt:`Fuera del ciclo ${S.ciclo}`});
  return out;
}

/* ---------- turnos por grupo ---------- */
const tState = k => (S.turnos[tKey(k)] ||= {ronda:1, hechos:{}});
const hechosRonda = k => { const t=tState(k); return (t.hechos[t.ronda] ||= []); };
function turnoActual(k){ const h = hechosRonda(k); return ordenEleccion(k).find(w=>!h.includes(w.id)) || null; }
function grupoTerminado(k){ return !turnoActual(k) && tState(k).ronda >= Number(S.ajustes.rondas); }
function terminarTurno(k,id){
  const h = hechosRonda(k); if(!h.includes(id)) h.push(id);
  const t = tState(k);
  if(!turnoActual(k) && t.ronda < Number(S.ajustes.rondas)){ t.ronda++; toast(`${nombreGrupo(k)}: empieza la ronda ${t.ronda}`); }
  UI.trab = turnoActual(k)?.id || UI.trab; UI.desde=''; UI.hasta='';
  save(); render();
}
function deshacerTurno(k){
  const t = tState(k); let h = hechosRonda(k);
  if(!h.length && t.ronda>1){ t.ronda--; h = hechosRonda(k); }
  const id = h.pop(); if(id) UI.trab=id;
  save(); render();
}

/* ---------- navegación ---------- */
const PASOS = [
  ['grupos','Grupos de elección','Los grupos que eligen vacaciones por separado, cada uno con su propio orden por puntos. No son los cupos de plantilla: esos están en Plantilla.'],
  ['eleccion','Elección','Cada grupo elige por turnos en el orden que marcan los puntos, sobre el calendario del año. También puedes apuntar vacaciones a mano.'],
  ['resumen','Resumen y cierre','Revisa que todo cuadra, exporta a Excel o PDF y cierra el ciclo cuando terminéis.'],
];
const SECCIONES = [
  ['plantilla','Plantilla','Las personas de este departamento y producto y los cupos de plantilla, es decir, cuántas pueden estar de vacaciones a la vez. Puedes verlos y cambiarlos cuando quieras.'],
  ['skills','Skills','Las funciones que pueden tener los trabajadores de este departamento y producto.'],
  ['rotaciones','Rotaciones','El patrón de turnos de la base, en una plantilla de 3 semanas. Cada grupo lleva una rotación y todos sus miembros la siguen.'],
  ['transformaciones','Transformaciones','Cambios de contrato con su fecha. Los días de vacaciones del año se prorratean por tramos.'],
  ['desprog','Desprogramaciones','Consulta a cada trabajador: sus vacaciones, sus días desprogramados y cuántos le quedan. Toca un día para registrar una desprogramación.'],
  ['calendario','Calendario',''],
  ['pdf','Exportar PDF',''],
];
const VISTAS_CTX = ['menu', ...PASOS.map(p=>p[0]), ...SECCIONES.map(e=>e[0])];
const ALIAS = {trabajadores:['plantilla','trabajadores'], cupos:['plantilla','cupos']};   // las antiguas secciones viven ahora en Plantilla
const enProceso = () => PASOS.some(p=>p[0]===UI.vista);
function pasoHecho(k){
  switch(k){
    case 'grupos': return gruposVis().length>0 && trabsVis().length>0 && trabsVis().every(t=>t.grupoId);
    case 'eleccion': return trabsVis().length>0 && gruposActivos().every(grupoTerminado);
    default: return false;
  }
}
function go(v){
  if(ALIAS[v]){ UI.plantTab = ALIAS[v][1]; v = ALIAS[v][0]; }
  if(v==='ajustes' && UI.vista!=='ajustes') UI.volverDe = UI.vista;
  salirPantallaCompleta(); UI.vista=v; render(); window.scrollTo(0,0);
}
function irInicio(){ S.ctx={dep:'',prod:''}; save(); go('inicio'); }
function elegirDep(id){ S.ctx={dep:id, prod:''}; save(); go('producto'); }
function elegirProd(id){
  S.ctx.prod=id; save();
  UI.grupo=null; UI.trab=null; UI.cal.grupo='all'; UI.cal.skill='all'; UI.pdf.grupo='all'; UI.m={...UI.m, filtro:'all', trab:'', edit:null}; UI.dpTrab=''; UI.dpDia='';
  go('menu');
}
function siguiente(){
  const i = PASOS.findIndex(p=>p[0]===UI.vista);
  if(i>=0 && i<PASOS.length-1) go(PASOS[i+1][0]);
}
const volverMenu = () => `<button class="volver" onclick="go('menu')">‹ Menú de ${esc(ctxTxt())}</button>`;
function intro(){
  const i = PASOS.findIndex(p=>p[0]===UI.vista);
  if(i>=0) return `<div class="intro"><div class="k">Asignación de vacaciones ${S.ciclo}, paso ${i+1} de ${PASOS.length}</div><h2>${PASOS[i][1]}</h2><p>${PASOS[i][2]}</p></div>`;
  const sec = SECCIONES.find(x=>x[0]===UI.vista);
  if(sec && sec[2]) return `<div class="intro">${volverMenu()}<h2>${sec[1]}</h2><p>${sec[2]}</p></div>`;
  return '';
}
function pie(){
  const i = PASOS.findIndex(p=>p[0]===UI.vista); if(i<0) return '';
  return `<div class="pie">${i>0?`<button class="btn" onclick="go('${PASOS[i-1][0]}')">‹ ${PASOS[i-1][1]}</button>`:`<button class="btn" onclick="go('menu')">‹ Salir al menú</button>`}
    ${i<PASOS.length-1?`<button class="btn primary" onclick="siguiente()">Siguiente: ${PASOS[i+1][1]} ›</button>`:`<button class="btn primary" onclick="go('menu')">Terminar y volver al menú</button>`}</div>`;
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800); }
function render(){
  // ¿qué pantalla toca según el contexto?
  if(UI.vista!=='ajustes'){
    if(!S.ctx.dep || !depDeId(S.ctx.dep)){ S.ctx={dep:'',prod:''}; UI.vista='inicio'; }
    else if(!enCtx()) UI.vista='producto';
    else if(ALIAS[UI.vista]){ UI.plantTab = ALIAS[UI.vista][1]; UI.vista = ALIAS[UI.vista][0]; }
    else if(!VISTAS_CTX.includes(UI.vista)) UI.vista='menu';
  }
  const p = prodDeId(S.ctx.prod);
  document.documentElement.style.setProperty('--ctx', p?.color || '#1F5FBF');
  document.getElementById('hdrCiclo').innerHTML = `Ciclo <b>${S.ciclo}</b>`;
  document.getElementById('btnAjustes').classList.toggle('on', UI.vista==='ajustes');
  document.getElementById('migas').innerHTML = !S.ctx.dep ? '' :
    `<button class="miga" onclick="irInicio()" title="Cambiar de departamento">${esc(nombreDep(S.ctx.dep))}</button>`
    + (p ? `<span class="sep-m">›</span><button class="miga prod" onclick="${UI.vista==='menu'?"S.ctx.prod='';save();go('producto')":"go('menu')"}" title="${UI.vista==='menu'?'Cambiar de producto':'Volver al menú'}">${esc(p.nombre)}</button>` : '');
  // la barra de pasos solo aparece durante la asignación de vacaciones
  document.getElementById('pasos').innerHTML = !(enCtx() && enProceso()) ? '' :
    `<button class="step extra" onclick="go('menu')">‹ Menú</button><span class="sep"></span>` +
    PASOS.map(([k,n],i)=>`<button class="step ${UI.vista===k?'on':''} ${pasoHecho(k)?'done':''}" onclick="go('${k}')" ${UI.vista===k?'aria-current="step"':''}><span class="num">${pasoHecho(k)&&UI.vista!==k?'✓':i+1}</span>${n}</button>`).join('');
  document.body.classList.toggle('ancho', UI.vista==='calendario' && UI.cal.modo==='anual');
  const V = {plantilla:vPlantilla, menu:vMenu, rotaciones:vRotaciones, transformaciones:vTransformaciones, inicio:vInicio, producto:vProducto, ajustes:vAjustes, skills:vSkills, grupos:vGrupos, trabajadores:vTrabajadores, cupos:vCupos, eleccion:vEleccion, desprog:vDesprog, resumen:vResumen, calendario:vCalendario, pdf:vPDF};
  const an0 = document.getElementById('anual'); if(an0){ UI.cal.sx = an0.scrollLeft; UI.cal.sy = an0.scrollTop; }
  document.getElementById('main').innerHTML = intro() + V[UI.vista]() + pie();
  const on = document.querySelector('.step.on'); if(on) on.scrollIntoView({block:'nearest',inline:'center'});
  if(UI.vista==='pdf') ajustarHoja();
  if(UI.vista==='rotaciones' && UI.rotEdit) document.querySelector('.dlg-op.on, .dlg-op')?.focus();
  if(UI.vista==='calendario' && UI.cal.modo==='anual') ajustarAnual();
}
const skillChip = id => { const t=skillDe(id); return t ? `<span class="chip" style="background:${t.color}1a;color:${t.color}">${esc(t.nombre)}</span>` : '<span class="chip grey">Sin skill</span>'; };
const skillsChips = w => skillsDe(w).length ? skillsDe(w).map(skillChip).join(' ') : skillChip(null);
const grupoChip = k => { const g=grupoDe(k); return g ? `<span class="chip grey"><span class="dot" style="background:${g.color};margin-right:5px;width:8px;height:8px"></span>${esc(g.nombre)}</span>` : '<span class="chip warn">Sin grupo</span>'; };
const opts = (lista, sel, todos) => (todos?`<option value="${todos[0]}" ${sel===todos[0]?'selected':''}>${todos[1]}</option>`:'') + lista.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.nombre)}</option>`).join('');
const modalidadTxt = w => w.modalidad==='discontinuo' ? `fijo discontinuo${diasContratadosEf(w).n?` (${diasContratadosEf(w).n} días trabajados)`:''}` : w.modalidad==='parcial' ? 'tiempo parcial' : 'tiempo completo';
function descargar(nombre, contenido, tipo){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([contenido],{type:tipo})); a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function trabOptions(sel){
  return gruposActivos().map(k=>`<optgroup label="${esc(nombreGrupo(k))}">${ordenEleccion(k).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.nombre)}</option>`).join('')}</optgroup>`).join('');
}
const filaCese = (d,h) => `<div class="row cese-fila" style="flex-wrap:nowrap;margin-top:6px;align-items:center"><input type="date" class="ceD" value="${esc(d)}" aria-label="Inicio del cese" style="margin:0"><span class="muted">a</span><input type="date" class="ceH" value="${esc(h)}" aria-label="Fin del cese" style="margin:0"><button class="btn small danger" onclick="this.parentElement.remove()" aria-label="Quitar periodo de cese">✕</button></div>`;
const vacio = (txt, boton) => `<div class="card"><p class="help">${txt}</p>${boton||''}</div>`;

/* =========================================================
   Inicio: departamento → producto
   ========================================================= */
function vInicio(){
  const sinDep = S.trabajadores.filter(t=>!depDeId(depDe(t))).length;
  return `<div class="portada"><p class="k">Ciclo ${S.ciclo}</p><h2>¿Con qué departamento vas a trabajar?</h2></div>
  <div class="tiles">${S.departamentos.map(d=>{const n=S.trabajadores.filter(t=>depDe(t)===d.id).length;
    return `<button class="tile" onclick="elegirDep('${d.id}')"><span class="ini" aria-hidden="true">${esc(d.nombre[0])}</span><span><span class="nom">${esc(d.nombre)}</span><span class="dato">${n?`${n} persona${n===1?'':'s'}`:'Sin trabajadores todavía'}</span></span><span class="fl" aria-hidden="true">›</span></button>`}).join('')}</div>
  ${sinDep?`<div class="card"><h2>${sinDep} trabajador(es) sin departamento</h2><p class="help">Vienen de una versión anterior. Elige a qué departamento y producto pasan.</p>
    <div class="row"><label>Departamento<select id="mDep">${opts(S.departamentos,'')}</select></label><label>Producto<select id="mProd">${opts(S.productos,'')}</select></label><button class="btn primary" onclick="asignarSinDep()">Asignar</button></div></div>`:''}`;
}
function asignarSinDep(){
  const dep=document.getElementById('mDep').value, prod=document.getElementById('mProd').value;
  S.trabajadores.filter(t=>!depDeId(depDe(t))).forEach(t=>{ t.depId=dep; t.prodId=prod; const g=grupoDe(t.grupoId); if(g){ g.depId=dep; g.prodId=prod; } });
  save(); render(); toast('Trabajadores asignados');
}
function vProducto(){
  const d = depDeId(S.ctx.dep);
  return `<div class="portada"><button class="volver" onclick="irInicio()">‹ Departamentos</button><p class="k">${esc(d.nombre)}</p><h2>¿Con qué producto?</h2></div>
  <div class="tiles">${S.productos.map(p=>{const n=S.trabajadores.filter(t=>depDe(t)===d.id && prodDe(t)===p.id).length;
    return `<button class="tile prod" style="--c:${p.color}" onclick="elegirProd('${p.id}')"><span class="ini" aria-hidden="true">${esc(p.nombre[0])}</span><span><span class="nom">${esc(p.nombre)}</span><span class="dato">${n?`${n} persona${n===1?'':'s'} en ${esc(d.nombre)}`:'Sin trabajadores todavía'}</span></span><span class="fl" aria-hidden="true">›</span></button>`}).join('')}</div>`;
}

function vMenu(){
  const ts = trabsVis(), ks = gruposActivos();
  const hechos = ks.reduce((a,k)=>a+Object.values(tState(k).hechos).flat().filter((v,i,arr)=>arr.indexOf(v)===i).length,0);
  const terminado = ts.length && ks.every(grupoTerminado);
  const conVac = ts.filter(t=>periodosDe(t.id).length).length;
  const dpAnio = S.desprog.filter(d=>{const t=trabDe(d.trabajadorId); return t&&visible(t)&&delAnio(d.dia,S.ciclo);}).length;
  const tile = (v, titulo, dato, ini) => `<button class="mtile" onclick="go('${v}')"><span class="mini">${ini}</span><span><span class="mt">${titulo}</span><span class="md">${dato}</span></span></button>`;
  return `<div class="portada"><p class="k">${esc(nombreDep(S.ctx.dep))}</p><h2 style="max-width:none">${esc(nombreProd(S.ctx.prod))}</h2></div>
  <button class="asig" onclick="go('grupos')"><span class="flecha" aria-hidden="true">➜</span>
    <span class="cuerpo"><span class="t">Asignación de vacaciones ${S.ciclo}</span>
      <span class="d">Grupos de elección › Elección › Resumen y cierre</span>
      <span class="e">${!ts.length?'Primero añade trabajadores':terminado?'Todas las rondas terminadas':`${conVac} de ${ts.length} personas con vacaciones`}</span></span>
    <span class="ir" aria-hidden="true">›</span></button>
  <div class="mtiles">
    ${tile('plantilla','Plantilla', `${ts.length} persona${ts.length===1?'':'s'}, ${S.cupos.filter(c=>cupoVisible(c)&&c.depId).length} cupos de plantilla`, '👤')}
    ${tile('skills','Skills', `${skillsVis().length} skill${skillsVis().length===1?'':'s'}`, '★')}
    ${tile('rotaciones','Rotaciones', `${rotacionesVis().length} rotación(es), ${gruposVis().filter(g=>g.rotacionId).length} de ${gruposVis().length} grupos con rotación`, '↻')}
    ${tile('transformaciones','Transformaciones', `${S.transf.filter(t=>{const w=trabDe(t.trabajadorId); return w&&visible(w);}).length} cambios de contrato`, '⇄')}
    ${tile('desprog','Desprogramaciones', `${dpAnio} en ${S.ciclo}`, '✕')}
    ${tile('calendario','Calendario', 'Todo el año, a pantalla completa', '▦')}
    ${tile('pdf','Exportar PDF', 'Informe del producto', '⎙')}
  </div>`;
}

/* =========================================================
   Ajustes generales (valen para todos los departamentos)
   ========================================================= */

  return `<div class="intro"><button class="volver" onclick="go(UI.volverDe||'inicio')">‹ Volver</button><h2>Ajustes generales</h2><p>Reglas del convenio que valen para todos los departamentos y productos.</p></div>
  <div class="card"><h2>Ciclo y elección</h2>

      <label>Año del ciclo<input type="number" value="${S.ciclo}" onchange="cambiarCiclo(this.value)"></label>
      <label>Rondas de elección<input type="number" min="1" max="10" value="${A.rondas}" onchange="S.ajustes.rondas=Math.max(1,Number(this.value)||1);save();render()"></label>
      <label>Días de vacaciones por defecto<input type="number" min="0" value="${A.diasDefecto}" onchange="S.ajustes.diasDefecto=Number(this.value)||0;save()"></label>

        <option value="lunvie" ${A.computo==='lunvie'?'selected':''}>Lunes a viernes</option></select></label>
      <label style="flex-basis:260px">Si no hay cupo al elegir por turnos<select onchange="S.ajustes.bloquear=this.value==='1';save();render()">

    </div>
    <div class="row" style="margin-top:12px"><label class="chk"><input type="checkbox" ${A.bloqueoGrupo?'checked':''} onchange="S.ajustes.bloqueoGrupo=this.checked;save();render()">No dejar coger días que ya tiene alguien de su mismo grupo (los de otros grupos no bloquean)</label></div>
  </div>
  <div class="card"><h2>Ponderación</h2>

    <div class="formula">${A.ponderar

      : `Sin ponderación: puntos brutos tal cual. Solo a los fijos discontinuos se les aplica × 365 ÷ días contratados (art. 33).`}</div>
  </div>
  <div class="card"><h2>Puntos por fecha (art. 33)</h2>

    </div>
    <div class="row" style="margin-top:10px"><label class="chk"><input type="checkbox" ${A.desprogPuntua?'checked':''} onchange="S.ajustes.desprogPuntua=this.checked;save();render()">Los días desprogramados suman puntos como vacaciones</label></div>

  </div>
  <div class="card"><h2>Copias de seguridad</h2>
    <p class="help">Los datos se guardan solo en este navegador. Descarga una copia de vez en cuando y úsala para pasar los datos a otro dispositivo.</p>
    <div class="row">
      <button class="btn primary" onclick="copiaJSON()">Descargar copia</button>
      <label class="btn" style="color:var(--asfalto);font-size:15px;cursor:pointer;flex:0 0 auto">Restaurar copia<input type="file" accept=".json,application/json" style="display:none" onchange="restaurar(this.files[0])"></label>
      <button class="btn danger" onclick="if(confirm('Se borrarán TODOS los datos de este navegador. ¿Seguro?')){S=estadoInicial();save();go('inicio')}">Empezar de cero</button>
    </div>
    <p class="muted" style="margin:14px 0 0">Versión de la app: ${APP_VERSION}</p>

  document.querySelector(`.fSkill[value="${t.id}"]`).checked = true; inp.value=''; inp.focus();
}
function guardarTrab(){
  const g = id => document.getElementById(id).value;
  const nombre = g('fNombre').trim(); if(!nombre) return toast('Escribe el nombre');
  const datos = { nombre, grupoId:g('fGrupo'), rotacionId:g('fRot'), depId:S.ctx.dep, prodId:S.ctx.prod, skills:[...document.querySelectorAll('.fSkill:checked')].map(x=>x.value), modalidad:g('fMod'), diasContratados:g('fDC'), diasDerecho:Number(g('fDer'))||0, ptsAnt:Number(g('fP1'))||0, ptsAnt2:Number(g('fP2'))||0, antig:g('fAnt') };
  const filas = [...document.querySelectorAll('#fCese .cese-fila')].map(f=>({desde:f.querySelector('.ceD').value, hasta:f.querySelector('.ceH').value})).filter(c=>c.desde||c.hasta);
  if(filas.some(c=>!c.desde||!c.hasta)) return toast('Cada periodo de cese necesita fecha de inicio y de fin');
  if(filas.some(c=>c.hasta<c.desde)) return toast('En un periodo de cese, la fecha de fin es anterior a la de inicio');
  datos.cese = datos.modalidad==='discontinuo' ? filas.sort((a,b)=>a.desde.localeCompare(b.desde)) : [];
  if(!datos.skills.length) return toast('Marca al menos una skill');
  if(UI.editTrab){
    const w = trabDe(UI.editTrab);
    if(w.grupoId!==datos.grupoId) Object.values(S.turnos).forEach(t=>Object.values(t.hechos).forEach(a=>{const i=a.indexOf(w.id); if(i>=0) a.splice(i,1);}));
    Object.assign(w, datos);
  } else S.trabajadores.push({id:uid(), ...datos});
  const id = UI.editTrab; UI.editTrab=null; save(); render();
  const w2 = id ? trabDe(id) : S.trabajadores[S.trabajadores.length-1];
  toast(ceseDe(w2).length && periodosDe(w2.id).some(p=>solapaCese(w2,p.desde,p.hasta)) ? 'Guardado. Ojo: tiene vacaciones dentro del cese' : 'Trabajador guardado');
}
function borrarTrab(id){
  const t=trabDe(id); if(!confirm(`¿Borrar a ${t.nombre} con sus vacaciones y desprogramaciones de todos los años?`)) return;
  S.trabajadores = S.trabajadores.filter(x=>x.id!==id); S.periodos = S.periodos.filter(p=>p.trabajadorId!==id); S.desprog = S.desprog.filter(d=>d.trabajadorId!==id);
  Object.values(S.turnos).forEach(t=>Object.values(t.hechos).forEach(a=>{ const i=a.indexOf(id); if(i>=0) a.splice(i,1); }));
  save(); render();
}
function importarPegado(){
  const txt = document.getElementById('fPega').value.trim(); if(!txt) return;
  const num = x => Number(String(x||'0').replace(/\./g,'').replace(',','.'))||0;
  let n=0;
  txt.split(/\r?\n/).forEach(l=>{
    const c = l.split(/\t|;/).map(x=>x.trim()); if(!c[0]) return;
    let g = c[1] ? gruposVis().find(x=>x.nombre.toLowerCase()===c[1].toLowerCase()) : null;
    if(c[1] && !g){ g={id:uid(),nombre:c[1],depId:S.ctx.dep,prodId:S.ctx.prod,color:COLORES[S.grupos.length%COLORES.length]}; S.grupos.push(g); }
    const sk = (c[2]||'').split(/[\/+]/).map(x=>x.trim()).filter(Boolean).map(x=>buscaSkill(x)||nuevaSkill(x));
    S.trabajadores.push({id:uid(), nombre:c[0], grupoId:g?.id||'', depId:S.ctx.dep, prodId:S.ctx.prod, skills:sk.map(x=>x.id), modalidad:'completo', diasContratados:'',
      diasDerecho: c[3] ? num(c[3]) : S.ajustes.diasDefecto, ptsAnt:num(c[4]), ptsAnt2:num(c[5]), antig:''});
    n++;
  });
  save(); render(); toast(`${n} trabajador(es) importados`);
}

function guardarCupo(){
  const g = id => document.getElementById(id).value;
  const c = { nombre:g('cNom').trim(), depId:S.ctx.dep, prodId:S.ctx.prod, grupoId:g('cGrupo'), desde:g('cDes'), hasta:g('cHas'), max:Number(g('cMax')), skills:[...document.querySelectorAll('.cSkill:checked')].map(x=>x.value) };
  if(!c.desde||!c.hasta||c.hasta<c.desde) return toast('Pon una fecha de inicio y una de fin posterior');

function generarMensuales(){

function previewHTML(w, desde, hasta, excepto, bloquea){
  if(!desde || !hasta) return '';
  if(hasta < desde) return `<div class="preview bad">La fecha de fin es anterior a la de inicio.</div>`;
  const st = statsTrab(w), r = statsRango(desde,hasta), conf = conflictosCupo(w,desde,hasta), sol = solapePropio(w,desde,hasta,excepto), ces = solapaCese(w,desde,hasta), comp = companerosEnFechas(w,desde,hasta,excepto);
  let quedan = st.pendientes - r.computables;
  if(excepto){ const p=S.periodos.find(x=>x.id===excepto); if(p && delAnio(p.desde,S.ciclo)) quedan += statsRango(p.desde,p.hasta).computables; }
  const diasConf = [...new Set(conf.map(c=>c.dia))];
  const cls = (sol || ces || ((conf.length||comp.length) && bloquea)) ? 'bad' : (conf.length || comp.length || quedan<0) ? 'warn' : 'ok';
  return `<div class="preview ${cls}">
    <div class="stats"><div><b>${r.computables}</b>días${r.computables!==r.naturales?` (${r.naturales} naturales)`:''}</div><div><b>${nf(r.pts)}</b>puntos brutos</div><div><b>${nf(r.pts*st.f)}</b>puntos finales</div><div><b>${quedan}</b>días le quedarían</div></div>
    ${sol?'<p><b>Se solapa con otro periodo suyo.</b></p>':''}
    ${ces?`<p><b>Cae dentro de su periodo de cese</b> (${esc(ceseTxt(w))}).</p>`:''}
    ${comp.length?`<p><b>Coincide con alguien de su grupo:</b> ${esc(comp.join(', '))}.</p>`:''}
    ${conf.length?`<p><b>${bloquea?'No hay cupo':'Supera el cupo'} ${diasConf.length} día(s):</b> ${resumenConflictos(conf)}</p>`:'<p>Hay cupo todos los días.</p>'}
    ${quedan<0?`<p><b>Se pasa ${-quedan} día(s) de su derecho.</b></p>`:''}
    ${!delAnio(desde,S.ciclo)?`<p><b>Ojo:</b> estas fechas no son del ciclo ${S.ciclo}; no cuentan para sus puntos de este ciclo.</p>`:''}
  </div>`;
}

/* ----- calendario de elección: pinchar o arrastrar días ----- */
let selLibres = new Set(), selArrastre = null, selTipo = 'mouse';
function selectorAnual(w){
  const y = S.ciclo, occ = ocupacion(w.id), k = gk(w), hoyS = hoy();
  const propios = new Set(); S.periodos.filter(p=>p.trabajadorId===w.id).forEach(p=>{ for(const d of eachDay(p.desde,p.hasta)) propios.add(d); });
  selLibres = new Set();
  let html = '<div class="selcal" id="selcal">';
  for(let m=0;m<12;m++){
    const mm=String(m+1).padStart(2,'0'), first=`${y}-${mm}-01`, dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(), off=(pd(first).getUTCDay()+6)%7;
    html += `<div class="smes"><div class="smes-t">${MESES[m][0].toUpperCase()+MESES[m].slice(1)}</div><div class="sgrid">${DOW.map(d=>`<span class="sdow">${d}</span>`).join('')}${'<span></span>'.repeat(off)}`;
    for(let d=1; d<=dim; d++){
      const s=`${y}-${mm}-${String(d).padStart(2,'0')}`, wd=pd(s).getUTCDay();
      const otros = (occ[s]||[]).map(trabDe).filter(t=>t && visible(t));
      const mismos = S.ajustes.bloqueoGrupo ? otros.filter(t=>gk(t)===k) : [];
      const deOtros = otros.filter(t=>gk(t)!==k);
      const cupoLleno = S.cupos.some(c=>enRango(s,c) && reglaAplica(c,w) && usadosCupo(c, occ[s]||[])+1 > Number(c.max));
      let st='libre', motivo='';
      if(propios.has(s)){ st='propio'; motivo='Ya son vacaciones suyas'; }
      else if(enCese(w,s)){ st='blk ces'; motivo='Periodo de cese'; }
      else if(mismos.length){ st='blk'; motivo=`Lo tiene ${mismos.map(t=>t.nombre).join(', ')} (mismo grupo)`; }
      else if(cupoLleno && S.ajustes.bloquear){ st='blk lleno'; motivo='Sin cupo'; }
      if(st==='libre') selLibres.add(s);
      const cls = ['ed', st, (wd===0||wd===6)?'we':'', esSS(s)?'ss':'', esPuente(s)?'pu':'', deOtros.length?'og':'', cupoLleno&&!S.ajustes.bloquear&&st==='libre'?'casi':'', s===hoyS?'hoy':'', (UI.desde&&s>=UI.desde&&s<=UI.hasta)?'sel':''].filter(Boolean).join(' ');
      const tit = `${fmt(s)}: ${ptsDia(s)} pts${esSS(s)?', Semana Santa':''}${esPuente(s)?', puente':''}${motivo?'. '+motivo:''}${deOtros.length?`. De otros grupos: ${deOtros.map(t=>t.nombre).join(', ')}`:''}`;
      const tt = turnoDia(w,s);
      html += `<span class="${cls}${tt&&tt.libre&&st==='libre'?' lib':''}" data-d="${s}" data-m="${esc(motivo)}" title="${esc(tit)}${tt?'. Turno '+esc(tt.nombre):''}">${d}${tt?`<i class="tc" style="color:${st==='propio'?'#fff':tt.color}">${esc(tt.cod)}</i>`:''}</span>`;
    }
    html += '</div></div>';
  }
  return html + `</div><div class="legend"><span style="--c:var(--senal)">Seleccionado</span><span style="--c:var(--ctx)">Sus vacaciones</span><span style="--c:repeating-linear-gradient(135deg,#C9CED6 0 2px,#EEF0F3 2px 4px)">No disponible</span><span class="lg-og">Alguien de otro grupo</span><span style="--c:var(--senal-soft)">Semana Santa</span></div>`;
}
function selLimitar(a, b){ // avanza desde a hacia b y se para antes del primer día no disponible
  const paso = b>=a ? 1 : -1; let fin = a;
  for(let s=addDays(a,paso); paso>0 ? s<=b : s>=b; s=addDays(s,paso)){ if(!selLibres.has(s)) break; fin = s; }
  return fin;
}
function selPintar(a, b){
  const [d,h] = a<=b ? [a,b] : [b,a];
  document.querySelectorAll('#selcal .ed[data-d]').forEach(e=>e.classList.toggle('sel', e.dataset.d>=d && e.dataset.d<=h));
}
function selFijar(a, b){ const [d,h] = a<=b ? [a,b] : [b,a]; UI.desde=d; UI.hasta=h; render(); }
function selToque(s, el){
  if(!selLibres.has(s)) return toast(el?.dataset.m || 'Ese día no está disponible');
  if(UI.desde && UI.desde===UI.hasta && s!==UI.desde && selLibres.has(UI.desde)) return selFijar(UI.desde, selLimitar(UI.desde, s));
  if(UI.desde===s && UI.hasta===s){ UI.desde=''; UI.hasta=''; return render(); }
  selFijar(s, s);
}
document.addEventListener('pointerdown', e=>{
  const el = e.target.closest && e.target.closest('#selcal .ed[data-d]'); if(!el) return;
  selTipo = e.pointerType || 'mouse';
  if(selTipo==='touch') return;               // en táctil se marca con dos toques
  e.preventDefault();
  if(!selLibres.has(el.dataset.d)) return toast(el.dataset.m || 'Ese día no está disponible');
  selArrastre = {a:el.dataset.d, b:el.dataset.d, movido:false}; selPintar(el.dataset.d, el.dataset.d);
});
document.addEventListener('pointerover', e=>{
  if(!selArrastre) return; const el = e.target.closest && e.target.closest('#selcal .ed[data-d]'); if(!el) return;
  const b = selLimitar(selArrastre.a, el.dataset.d);
  if(b!==selArrastre.b){ selArrastre.b=b; selArrastre.movido=true; selPintar(selArrastre.a, b); }
});
document.addEventListener('pointerup', ()=>{
  if(!selArrastre) return; const {a,b,movido} = selArrastre; selArrastre=null;
  if(movido) selFijar(a,b); else selToque(a, document.querySelector(`#selcal .ed[data-d="${a}"]`));
});
document.addEventListener('click', e=>{
  const el = e.target.closest && e.target.closest('#selcal .ed[data-d]'); if(!el || selTipo!=='touch') return;
  selToque(el.dataset.d, el);
});
function fichaTrab(w, st){

    ${st.pendientes>0 && st.pendientes<=st.reservaPosible ? `<div class="chip" style="margin:6px 6px 0 0">Le quedan ${st.pendientes}: puede dejarlos para desprogramar</div>`:''}

}
function resumenConflictos(conf){
  const porCupo = {};
  conf.forEach(c=>{ (porCupo[c.cupo.id] ||= {c:c.cupo, dias:[]}).dias.push(c.dia); });
  return Object.values(porCupo).map(({c,dias})=>`«${esc(c.nombre||'Cupo')}» (máx. ${c.max}): ${rangosTxt(dias)}`).join('; ');
}
function rangosTxt(dias){
  dias = [...new Set(dias)].sort(); const out=[]; let a=dias[0], b=dias[0];
  for(let i=1;i<=dias.length;i++){ if(dias[i] && dias[i]===addDays(b,1)) b=dias[i]; else { out.push(a===b?fmt(a):`${fmt(a)}–${fmt(b)}`); a=b=dias[i]; } }
  return out.join(', ');
}

function añadirPeriodo(){

  if(S.ajustes.bloquear && conflictosCupo(w,UI.desde,UI.hasta).length) return toast('No hay cupo en esas fechas');

}

/* calendario de 12 meses de una persona: vacaciones en verde, desprogramaciones en rojo */
function calendarioFicha(w, y, interactivo){
  const vac = new Set(), dps = new Set(desprogDe(w.id,y).map(d=>d.dia));
  S.periodos.filter(p=>p.trabajadorId===w.id).forEach(p=>{ for(const d of eachDay(p.desde,p.hasta)) vac.add(d); });
  let html = `<div class="fcal">`;
  for(let m=0;m<12;m++){
    const mm=String(m+1).padStart(2,'0'), first=`${y}-${mm}-01`, dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(), off=(pd(first).getUTCDay()+6)%7;
    html += `<div class="smes"><div class="smes-t">${MESES[m][0].toUpperCase()+MESES[m].slice(1)}</div><div class="sgrid">${DOW.map(d=>`<span class="sdow">${d}</span>`).join('')}${'<span></span>'.repeat(off)}`;
    for(let d=1; d<=dim; d++){
      const s=`${y}-${mm}-${String(d).padStart(2,'0')}`, wd=pd(s).getUTCDay(), tt=turnoDia(w,s);
      const cls = ['fd', dps.has(s)?'dp':vac.has(s)?'vac':enCese(w,s)?'ces':'', (wd===0||wd===6)?'we':'', esSS(s)?'ss':'', tt&&tt.libre&&!vac.has(s)&&!dps.has(s)?'lib':'', interactivo&&UI.dpDia===s?'sel':''].filter(Boolean).join(' ');
      const tit = `${fmt(s)}${dps.has(s)?': desprogramado':vac.has(s)?': vacaciones':enCese(w,s)?': cese':''}${tt?`. Turno ${tt.nombre}`:''}`;
      const click = interactivo && !vac.has(s) && !enCese(w,s) ? ` onclick="UI.dpDia='${s}';render()" role="button" tabindex="0"` : '';
      html += `<span class="${cls}" title="${esc(tit)}"${click}>${d}${tt?`<i class="tc" style="color:${(vac.has(s)||dps.has(s))?'#fff':tt.color}">${esc(tt.cod)}</i>`:''}</span>`;
    }
    html += '</div></div>';
  }
  return html + `</div><div class="legend"><span style="--c:var(--ok)">Vacaciones</span><span style="--c:var(--bad)">Desprogramado</span><span style="--c:repeating-linear-gradient(135deg,#C9CED6 0 2px,#EEF0F3 2px 4px)">Cese</span><span style="--c:var(--senal-soft)">Semana Santa</span>${rotDe(w)?'<span style="--c:#EBEFF6">Libre según rotación</span>':''}</div>`;
}

/* =========================================================
   Calendario: cuadrante anual a pantalla completa o mes con cupos
   ========================================================= */
function vCalendario(){
  if(!trabsVis().length) return `<div class="intro">${volverMenu()}<h2>Calendario</h2></div>`+vacio(`Todavía no hay trabajadores en ${esc(ctxTxt())}.`, `<button class="btn primary" onclick="go('trabajadores')">Ir a Trabajadores</button>`);
  if(UI.cal.grupo!=='all' && !gruposVis().some(g=>g.id===UI.cal.grupo)) UI.cal.grupo='all';
  if(UI.cal.skill!=='all' && !skillsVis().some(s=>s.id===UI.cal.skill)) UI.cal.skill='all';
  const seg = `<div class="seg"><button class="${UI.cal.modo==='anual'?'on':''}" onclick="UI.cal.modo='anual';render()">Año completo</button><button class="${UI.cal.modo==='mes'?'on':''}" onclick="UI.cal.modo='mes';render()">Mes y cupos</button></div>`;
  return UI.cal.modo==='mes' ? vCalMes(seg) : vCalAnual(seg);
}
const pasaFiltroCal = t => t && visible(t) && (UI.cal.grupo==='all'||gk(t)===UI.cal.grupo) && (UI.cal.skill==='all'||tieneSkill(t,UI.cal.skill))
  && (!UI.cal.buscar || t.nombre.toLowerCase().includes(UI.cal.buscar.toLowerCase()));
function aniosDisponibles(){
  const ys = new Set([S.ciclo-1, S.ciclo, S.ciclo+1]);
  S.periodos.forEach(p=>{ const t=trabDe(p.trabajadorId); if(t && visible(t)) ys.add(Number(p.desde.slice(0,4))); });
  return [...ys].sort();
}
function vCalAnual(seg){
  const y = UI.cal.anio ||= S.ciclo;
  const ys = aniosDisponibles(), iy = ys.indexOf(y);
  const ini = `${y}-01-01`, dias = daysBetween(ini, `${y+1}-01-01`);
  const idx = s => daysBetween(ini, s);
  const clip = (a,b) => { const d = a<ini?ini:a, h = b>`${y}-12-31`?`${y}-12-31`:b; return h<d?null:[idx(d), daysBetween(d,h)+1]; };
  const ks = gruposActivos().filter(k=>UI.cal.grupo==='all'||k===UI.cal.grupo);
  const filas = ks.map(k=>({k, ts:ordenEleccion(k).filter(pasaFiltroCal)})).filter(f=>f.ts.length);
  // ocupación diaria
  const cuenta = new Array(dias).fill(0);
  filas.forEach(f=>f.ts.forEach(t=>S.periodos.filter(p=>p.trabajadorId===t.id).forEach(p=>{ const c=clip(p.desde,p.hasta); if(c) for(let i=c[0];i<c[0]+c[1];i++) cuenta[i]++; })));
  const maxC = Math.max(1, ...cuenta);
  // capa de fondo: fines de semana, meses, Semana Santa, puentes, hoy
  const ss = y===S.ciclo ? S.semanaSanta : semanaSantaDefault(y);
  let capa = '';
  for(let i=0;i<dias;i++){ const wd = pd(addDays(ini,i)).getUTCDay(); if(wd===6) capa += `<i class="fs" style="left:calc(var(--dw)*${i});width:calc(var(--dw)*2)"></i>`; }
  for(let m=1;m<12;m++) capa += `<i class="lm" style="left:calc(var(--dw)*${idx(`${y}-${String(m+1).padStart(2,'0')}-01`)})"></i>`;
  const cs = clip(ss.desde, ss.hasta); if(cs) capa += `<i class="ss" style="left:calc(var(--dw)*${cs[0]});width:calc(var(--dw)*${cs[1]})" title="Semana Santa"></i>`;
  if(y===S.ciclo) S.puentes.forEach(p=>{ const c=clip(p.desde,p.hasta); if(c) capa += `<i class="pu" style="left:calc(var(--dw)*${c[0]});width:calc(var(--dw)*${c[1]})"></i>`; });
  const h = hoy(); if(delAnio(h,y)) capa += `<i class="hoy" style="left:calc(var(--dw)*${idx(h)})" title="Hoy"></i>`;
  // cabecera de meses y días
  let cab = '';
  for(let m=0;m<12;m++){ const d0=`${y}-${String(m+1).padStart(2,'0')}-01`, dm=new Date(Date.UTC(y,m+1,0)).getUTCDate();
    cab += `<span class="an-mes" style="left:calc(var(--dw)*${idx(d0)});width:calc(var(--dw)*${dm})">${MESES[m][0].toUpperCase()+MESES[m].slice(1)}</span>`; }
  const conDias = UI.cal.zoom!=='ajustar';
  if(conDias) for(let i=0;i<dias;i++){ const d=pd(addDays(ini,i)), wd=d.getUTCDay(); cab += `<span class="an-dia ${wd===0||wd===6?'fs':''}" style="left:calc(var(--dw)*${i});width:var(--dw)">${d.getUTCDate()}</span>`; }
  const ocu = cuenta.map((c,i)=>c?`<i class="${c===maxC?'max':''}" style="left:calc(var(--dw)*${i});width:var(--dw);height:${Math.round(c/maxC*24)+2}px" title="${fmt(addDays(ini,i))}: ${c} de vacaciones"></i>`:'').join('');
  const fila = t => {
    const ps = S.periodos.filter(p=>p.trabajadorId===t.id).map(p=>({p,c:clip(p.desde,p.hasta)})).filter(x=>x.c);
    const dps = S.desprog.filter(d=>d.trabajadorId===t.id && delAnio(d.dia,y));
    const ces = ceseDe(t).map(c=>clip(c.desde,c.hasta)).filter(Boolean);

function ajustarAnual(){
  const a = document.getElementById('anual'); if(!a) return;
  const dias = Number(getComputedStyle(a).getPropertyValue('--dias')) || 365;
  const nw = parseFloat(getComputedStyle(a).getPropertyValue('--nw')) || 170;
  let dw = UI.cal.zoom==='dia' ? 26 : UI.cal.zoom==='semana' ? 12 : Math.max(1.6, (a.clientWidth - nw - 2) / dias);
  a.style.setProperty('--dw', dw+'px');
  const clave = UI.cal.zoom+'|'+UI.cal.anio;
  if(UI.cal.zoomHecho !== clave){ // al cambiar de zoom o de año, colocar en hoy (o en enero)
    UI.cal.zoomHecho = clave;
    const h = hoy(), y = UI.cal.anio, ref = delAnio(h,y) ? h : `${y}-01-01`;
    a.scrollLeft = UI.cal.zoom==='ajustar' ? 0 : Math.max(0, daysBetween(`${y}-01-01`, ref)*dw - (a.clientWidth-nw)/3);
    a.scrollTop = 0;
  } else { a.scrollLeft = UI.cal.sx||0; a.scrollTop = UI.cal.sy||0; }
}
window.addEventListener('resize',()=>{ if(UI.vista==='calendario' && UI.cal.modo==='anual') ajustarAnual(); if(UI.vista==='pdf') ajustarHoja(); });
function clicPista(e, trabId, y){
  const a = document.getElementById('anual'), dw = parseFloat(a.style.getPropertyValue('--dw')) || 3;
  const r = e.currentTarget.getBoundingClientRect(), i = Math.floor((e.clientX - r.left)/dw);
  const dia = addDays(`${y}-01-01`, Math.max(0, i));
  if(enCese(trabDe(trabId), dia)) return toast('Ese día está dentro de su periodo de cese');
  salirPantallaCompleta();
  UI.m = {...UI.m, trab:trabId, desde:dia, hasta:dia, edit:null, forzar:false, nota:''}; UI.modo='mano'; go('eleccion');
  toast(`Añadiendo vacaciones desde el ${fmt(dia)}`);
}
function pantallaCompleta(){
  const on = !document.body.classList.contains('cal-full');
  document.body.classList.toggle('cal-full', on);
  try{ if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); else if(!on && document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  render();
}
function salirPantallaCompleta(){
  if(!document.body.classList.contains('cal-full')) return;
  document.body.classList.remove('cal-full');
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}
document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement && document.body.classList.contains('cal-full')){ document.body.classList.remove('cal-full'); if(UI.vista==='calendario') render(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && UI.rotEdit && !document.getElementById('bloqueo')){ UI.rotEdit=null; render(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && document.body.classList.contains('cal-full') && !document.getElementById('bloqueo')){ salirPantallaCompleta(); render(); } });

function vCalMes(seg){

  const dim = new Date(Date.UTC(y,m+1,0)).getUTCDate(), offset=(pd(first).getUTCDay()+6)%7;

  let grid = DOW.map(d=>`<div class="dow">${d}</div>`).join('') + '<div class="d empty"></div>'.repeat(offset);
  for(let d=1; d<=dim; d++) grid += cell(`${y}-${mm}-${String(d).padStart(2,'0')}`);
  let det = '';
  if(UI.cal.dia && delAnio(UI.cal.dia,y)){
    const s=UI.cal.dia, ids=(occ[s]||[]).filter(id=>visible(trabDe(id))), reglas=S.cupos.filter(c=>enRango(s,c)&&cupoVisible(c)), dps=S.desprog.filter(d=>d.dia===s && trabDe(d.trabajadorId) && visible(trabDe(d.trabajadorId)));

      ${reglas.length?`<h3>Cupos</h3>${reglas.map(c=>{const u=usadosCupo(c,occ[s]||[]), cl=u>=c.max?'bad':u/c.max>=.75?'warn':'ok';return `<div style="margin-bottom:6px"><span class="chip ${cl}">${u} de ${c.max}</span> ${esc(c.nombre||'Cupo')} <span class="muted">(${ambitoCupo(c)})</span></div>`}).join('')}`:'<p class="muted">Ningún cupo cubre este día.</p>'}
      <h3>De vacaciones (${ids.length})</h3>${ids.length?ids.map(id=>{const t=trabDe(id);return `<div style="margin-bottom:6px">${esc(t?.nombre)} ${grupoChip(gk(t))} ${skillsChips(t)}</div>`}).join(''):'<p class="muted">Nadie.</p>'}

      <div class="row" style="margin-top:14px"><button class="btn primary" onclick="UI.m={...UI.m,desde:'${s}',hasta:'${s}',edit:null,forzar:false,nota:''};UI.modo='mano';go('eleccion')">Añadir vacaciones desde este día</button></div></div>`;
  }

    <div class="an-barra">${seg}
      <label>Grupo<select onchange="UI.cal.grupo=this.value;render()">${opts(gruposVis(), FG, ['all','Todos'])}</select></label>

    <div class="cal">${grid}</div>
    <div class="legend"><span style="--c:var(--ok-soft)">Con hueco</span><span style="--c:var(--warn-soft)">Al 75 % o más</span><span style="--c:var(--bad-soft)">Lleno</span><span style="--c:var(--linea)">Sin cupo: nº de personas</span><span>SS Semana Santa, P puente</span></div>

function ponerDiaRot(id, wi, di, cod){ const r=rotDeId(id); if(!r) return; r.semanas[wi][di]=cod; UI.rotEdit=null; save(); render(); }
function crearRotacion(silencio){
  const r = {id:uid(), nombre:`Rotación ${rotacionesVis().length+1}`, depId:S.ctx.dep, prodId:S.ctx.prod, inicio:lunesDe(`${S.ciclo}-01-01`), semanas:[0,1,2].map(()=>Array(7).fill(''))};

function pintarRot(id, wi, di){

function borrarRotacion(id){

function cambiarCodTurno(i, v){

  S.turnosTipos[i].cod = nuevo; S.rotaciones.forEach(r=>r.semanas.forEach(sem=>sem.forEach((c,k)=>{ if(c===viejo) sem[k]=nuevo; })));

function borrarTipoTurno(i){
  const c = S.turnosTipos[i].cod, usos = S.rotaciones.reduce((a,r)=>a+r.semanas.flat().filter(x=>x===c).length,0);
  if(!confirm(usos?`El turno ${c} se usa en ${usos} casilla(s). Se vaciarán. ¿Borrarlo?`:`¿Borrar el turno ${c}?`)) return;

    <div class="row" style="margin-top:12px">

      ${lista.map(t=>{const x=trabDe(t.trabajadorId), ult=transfDe(x.id).slice(-1)[0]?.id===t.id, y=Number(t.fecha.slice(0,4));

function guardarTransf(){
  const T = UI.tf, w = trabDe(T.trab); if(!w || !T.fecha) return;
  const ultima = transfDe(w.id).slice(-1)[0];
  if(ultima && T.fecha<=ultima.fecha) return toast('Tiene que ser posterior a su última transformación');
  const despues = {modalidad:T.mod, diasDerecho:Number(T.der)||0, diasContratados:T.mod==='discontinuo'?T.dc:''};
  S.transf.push({id:uid(), trabajadorId:w.id, fecha:T.fecha, antes:estadoActual(w), despues, nota:T.nota||'', creado:Date.now()});
  Object.assign(w, despues);
  UI.tf = {trab:w.id, fecha:'', mod:'', der:'', dc:'', nota:''}; save(); render();
  toast(`Registrada. ${w.nombre} tiene ${derechoCiclo(w).n} días en ${S.ciclo}`);
}
function borrarTransf(id){
  const t = S.transf.find(x=>x.id===id); if(!t) return; const w = trabDe(t.trabajadorId);
  if(transfDe(w.id).slice(-1)[0]?.id!==id) return toast('Solo se puede deshacer la última');
  if(!confirm(`¿Deshacer el cambio de contrato de ${w.nombre} del ${fmt(t.fecha)}? Su ficha vuelve al contrato anterior.`)) return;
  Object.assign(w, t.antes); S.transf = S.transf.filter(x=>x.id!==id); UI.tf=null; save(); render(); toast('Transformación deshecha');
}

function ajustarHoja(){

  const wrap=h.parentElement; h.style.transform=''; wrap.style.height='';

  h.style.transform=`scale(${k})`; h.style.marginLeft = k<1 ? '0' : ((disp-real)/2)+'px';
  wrap.style.height=(h.offsetHeight*k+36)+'px';

function informeHTML(P){

  let acc=0; const lineas=[]; for(let m=0;m<11;m++){ acc+=dim(m); lineas.push(acc/lenY*100); }
  const rejilla = `linear-gradient(to right, ${lineas.map(p=>`transparent calc(${p}% - .5px), #D9DDE3 calc(${p}% - .5px), #D9DDE3 calc(${p}% + .5px), transparent calc(${p}% + .5px)`).join(', ')})`;

  if(!ks.length) return `<div class="inf">${cab}<p>No hay trabajadores en la selección.</p></div>`;
  const secciones = ks.map((k,i)=>{
    const orden = ordenEleccion(k);
    let html = `<h2><span class="barra"></span>${esc(nombreGrupo(k))} <small>${orden.length} personas</small></h2>`;
    if(P.cuadrante){
      html += `<div class="gantt" style="--nw:38mm;--rejilla:${rejilla}">
        <div class="meses">${MESES.map((n,m)=>`<div style="flex:${dim(m)}">${n.slice(0,3)}</div>`).join('')}</div>
        ${orden.map(t=>{const st=statsTrab(t);
          return `<div class="fila"><div class="nom">${esc(t.nombre)}</div><div class="pista">${ssBand}
            ${ceseDe(t).map(c=>{const d=c.desde<`${y}-01-01`?`${y}-01-01`:c.desde, h=c.hasta>`${y}-12-31`?`${y}-12-31`:c.hasta; return h<d?'':`<span class="ces" style="left:${pos(d)}%;width:${(daysBetween(d,h)+1)/lenY*100}%"></span>`}).join('')}
            ${st.periodos.map(p=>`<span class="per ${p.forzado?'forz':''}" style="left:${pos(p.desde)}%;width:${Math.max(.25,(daysBetween(p.desde,p.hasta)+1)/lenY*100)}%"></span>`).join('')}
            ${P.desprog?st.desprog.map(d=>`<span class="dp" style="left:calc(${pos(d.dia)}% - 1px)"></span>`).join(''):''}
          </div></div>`}).join('')}
        <div class="leyenda"><span><i style="background:var(--ctx)"></i>Vacaciones</span><span><i style="background:var(--bad)"></i>Guardadas sin cupo</span>${P.desprog?'<span><i style="background:var(--senal);border:1px solid #9A7A00"></i>Desprogramación</span>':''}<span><i style="background:repeating-linear-gradient(135deg,#B9BFC8 0 2px,#EEF0F3 2px 4px)"></i>Cese</span><span><i style="background:rgba(246,195,0,.3)"></i>Semana Santa</span></div>
      </div>`;
    }
    if(P.tabla){
      html += `<table><tr><th>#</th><th>Nombre</th><th>Skills</th><th>Periodos</th><th class="num">Días</th>${P.desprog?'<th>Desprogramaciones</th>':''}${P.puntos?'<th class="num">Pts año ant.</th><th class="num">Pts ciclo</th>':''}${P.firma?'<th>Conforme</th>':''}</tr>
        ${orden.map((t,j)=>{const st=statsTrab(t);

          <td class="num">${st.dias}/${st.derecho}</td>
          ${P.desprog?`<td>${st.desprog.map(d=>fmt(d.dia)).join(', ')||'—'}</td>`:''}
          ${P.puntos?`<td class="num">${nf(t.ptsAnt||0)}</td><td class="num"><b>${nf(st.pts)}</b></td>`:''}

function restaurar(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.trabajadores||!d.tramos) throw 0; if(!confirm('Esto sustituye todos los datos actuales. ¿Continuar?')) return; S=normalizar(d); save(); go('inicio'); toast('Copia restaurada'); }catch(e){ toast('Ese archivo no es una copia de esta app'); } };
  r.readAsText(f);
}
