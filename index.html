<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Planning</title>
<meta name="theme-color" content="#22262E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Control Planning">
<meta name="application-name" content="Control Planning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Control Planning — señalética de aeropuerto
   ========================================================= */
:root{
  --asfalto:#22262E; --hormigon:#ECEEF1; --papel:#FFFFFF; --senal:#F6C300; --senal-suave:#FFF4CC;
  --pista:#1F5FBF; --gris:#5F6775; --linea:#D9DDE3; --ok:#23864F; --mal:#C23B30;
  --c-completo:#1F5FBF; --c-parcial:#7A4FB5; --c-disc:#C46A12;
  --ctx:var(--pista);
  --cond:'Barlow Condensed',system-ui,sans-serif; --texto:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--hormigon);color:var(--asfalto);font-family:var(--texto);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
.muted{color:var(--gris)}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}

/* cabecera */
header{position:sticky;top:0;z-index:20;background:var(--asfalto);color:#fff}
.cab{display:flex;align-items:center;gap:14px;padding:10px 22px;max-width:1600px;margin:0 auto}
.marca{display:flex;align-items:center;gap:10px;border:0;background:none;color:#fff;cursor:pointer;padding:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--senal);display:grid;place-items:center;flex:0 0 auto}
.logo svg{width:22px;height:22px}
.marca h1{font-size:24px;letter-spacing:.01em;white-space:nowrap}
.anio{display:flex;align-items:center;gap:4px;background:var(--asfalto);border-radius:10px;padding:4px}
.anio b{color:var(--senal);font-family:var(--cond);font-size:22px;min-width:52px;text-align:center}
.anio button{border:0;background:#3A404C;color:#fff;width:30px;height:32px;border-radius:7px;cursor:pointer}

main{max-width:1600px;margin:0 auto;padding:26px 22px 60px}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--linea);background:var(--papel);border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{border-color:var(--asfalto)}
.btn:active{transform:scale(.97)}
.btn.primario{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.primario:hover{background:#000}
.btn.peligro{color:var(--mal);border-color:#E9B8B3}
.btn.peligro:hover{background:#FBE7E5;border-color:var(--mal)}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--gris)}
input,select,textarea{border:1px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;font-size:15.5px;color:var(--asfalto);font-weight:500;width:100%}
textarea{font:inherit;min-height:140px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--asfalto);box-shadow:0 0 0 3px rgba(246,195,0,.45)}
.fila{display:flex;flex-wrap:wrap;gap:12px}
.fila>label{flex:1 1 180px}

/* portadas */
.portada{margin-bottom:22px}
.portada h2{font-size:52px;letter-spacing:-.005em}
.portada p{margin:8px 0 0;color:var(--gris);max-width:60ch}
.volver{border:0;background:none;color:var(--pista);font-weight:600;cursor:pointer;padding:0;margin-bottom:8px;font-size:15px}
   
/* globos del menú */
.globos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.globo{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:26px;padding:26px;min-height:250px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.globo:hover{transform:translateY(-4px);box-shadow:0 18px 36px -22px rgba(34,38,46,.55);border-color:color-mix(in srgb,var(--ctx) 40%,var(--linea))}
.globo .gi{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ctx) 12%,#fff);color:var(--ctx);transition:background .2s,color .2s}
.globo .gi svg{width:34px;height:34px}
.globo:hover .gi{background:var(--ctx);color:#fff}
.globo .gt{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.globo .gp{color:var(--gris);font-size:15px;max-width:36ch}
.globo .gd{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.globo .gd span{background:#F1F3F6;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}

/* Personal */
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.resumen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cifra{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.cifra b{display:block;font-family:var(--cond);font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.cifra span{font-size:13.5px;color:var(--gris);font-weight:600}
.cifra::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc,var(--asfalto))}
.barra-herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.barra-herr .buscar{flex:1 1 240px;max-width:360px}
.seg{display:inline-flex;background:#DDE1E8;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 13px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--gris);white-space:nowrap}
.seg button.on{background:var(--papel);color:var(--asfalto);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.barra-herr .esp{flex:1}

table.plantilla{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.plantilla th{font-family:var(--cond);font-size:15px;font-weight:700;text-align:left;color:var(--gris);padding:10px 12px;border-bottom:2px solid var(--asfalto);white-space:nowrap}
.plantilla td{padding:12px;border-bottom:1px solid var(--linea);vertical-align:middle}
.plantilla .num{text-align:right;white-space:nowrap}
.plantilla tbody tr{cursor:pointer;transition:background .12s}
.plantilla tbody tr:hover{background:color-mix(in srgb,var(--ctx) 6%,#fff)}
.plantilla .nombre{font-weight:700;font-size:16px}
.plantilla .sub{font-size:13px;color:var(--gris)}
.plantilla .anual{font-family:var(--cond);font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.completo{background:#E4ECF9;color:var(--c-completo)}
.chip.parcial{background:#EEE6F7;color:var(--c-parcial)}
.chip.discontinuo{background:#FBEBDC;color:var(--c-disc)}
.chip.reducida{background:var(--senal-suave);color:#7A5600}
.chip.concretada{background:#DDF1EE;color:#0E6F66}
.seg.turnos button{padding:9px 16px}
.jcampo.fijo{background:#F4F5F8;border-style:dashed}
.jcampo .valor{font-family:var(--cond);font-size:30px;font-weight:700}
.bloque .seg button{padding:9px 22px;font-size:15px}
.aviso{display:inline-block;background:#FBE7E5;color:var(--mal);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700}
.vacio{text-align:center;padding:50px 20px}
.vacio h3{font-size:28px;margin-bottom:8px}
.vacio p{color:var(--gris);margin:0 auto 18px;max-width:46ch}
.tarjetas-movil{display:none}

/* diálogos */
.fondo{position:fixed;inset:0;background:rgba(22,25,31,.55);z-index:50;display:grid;place-items:center;padding:16px;animation:aparecer .15s ease-out}
.dlg{background:var(--papel);border-radius:18px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:subir .22s cubic-bezier(.2,.7,.2,1)}
.dlg-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--papel);z-index:1}
.dlg-cab h2{font-size:28px}
.dlg-cuerpo{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.dlg-pie{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--linea);position:sticky;bottom:0;background:var(--papel)}
.dlg-pie .izq{margin-right:auto}
.cerrar{border:0;background:#F1F3F6;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:20px;line-height:1}
.bloque h3{font-size:20px;margin-bottom:10px}
.contratos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.contratos button{border:2px solid var(--linea);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.contratos button b{display:block;font-family:var(--cond);font-size:20px}
.contratos button span{font-size:13px;color:var(--gris)}
.contratos button.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,#fff)}
.jornada{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jcampo{border:2px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;transition:border-color .15s}
.jcampo.on{border-color:var(--asfalto);background:var(--senal-suave)}
.jcampo small{display:block;font-size:12.5px;font-weight:700;color:var(--gris);margin-bottom:4px}
.jcampo input{border:0;padding:0;font-family:var(--cond);font-size:30px;font-weight:700;background:transparent;box-shadow:none}
.jcampo input:disabled{color:var(--asfalto)}
.jcampo .ud{font-size:13px;color:var(--gris)}
.calculo{background:var(--asfalto);color:#fff;border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.calculo b{font-family:var(--cond);font-size:40px;color:var(--senal);line-height:1}
.calculo .f{color:#C9CED6;font-size:14px;flex:1 1 100%}
.periodos{display:flex;flex-direction:column;gap:8px}
.periodo{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.periodo label{flex:1 1 150px}
.periodo .dias{font-weight:700;padding-bottom:11px;min-width:90px}
.quitar{border:0;background:#F1F3F6;border-radius:8px;width:40px;height:42px;cursor:pointer;font-size:18px}
/* horas hechas */
.prog{height:6px;background:#E3E6EB;border-radius:3px;overflow:hidden;margin-top:5px;min-width:90px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.prog.pasa i{background:var(--mal)}
.plantilla .hecha{font-family:var(--cond);font-size:20px;font-weight:700}
.de-mas{color:var(--mal);font-weight:700}
.semanas{display:flex;flex-direction:column;gap:6px}
.semana{display:grid;grid-template-columns:1fr 130px 40px;gap:10px;align-items:center;border:1px solid var(--linea);border-radius:10px;padding:6px 6px 6px 12px}
.semana .qs{font-weight:600}
.semana .qs small{display:block;color:var(--gris);font-weight:600;font-size:12.5px}
.semana .hcampo{display:flex;align-items:center;gap:6px}
.semana input{padding:8px 10px;text-align:right;font-family:var(--cond);font-size:20px;font-weight:700}
.semana .quitar{height:38px}
.calculo .hq{display:flex;gap:18px;flex-wrap:wrap;color:#fff;font-weight:600}
.calculo .hq em{font-style:normal;font-family:var(--cond);font-size:24px;color:var(--senal);margin-left:4px}
/* importar turnos */
.dlg.ancho{width:min(1000px,100%)}
.fondo.quieto,.fondo.quieto .dlg{animation:none}
.pla-lista{display:flex;flex-direction:column;border-top:2px solid var(--asfalto)}
.pla-fila{flex-direction:row;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--linea);color:var(--asfalto);font-size:15px;cursor:pointer;flex-wrap:wrap}
.pla-fila input{width:18px;height:18px;margin:0;flex:0 0 auto}
.pla-fila .nf{font-weight:700;flex:1 1 220px}
.pla-fila.ign{opacity:.55}
.pla-dato{font-weight:600;color:var(--gris)}
/* control de jornada */
.cifra.filtra{text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.cifra.filtra:hover{transform:translateY(-2px);box-shadow:0 10px 20px -16px rgba(34,38,46,.6)}
.cifra.filtra.on{border-color:var(--cc);box-shadow:inset 0 0 0 1px var(--cc)}
.estj{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.estj.bien{background:#DDF1E4;color:var(--ok)}
.estj.falta{background:#FFF1C7;color:#8A5A00}
.estj.pasa{background:#FBE7E5;color:var(--mal)}
.estj.sin{background:#F1F3F6;color:var(--gris)}
.dif{font-family:var(--cond);font-size:20px}
.dif.mas{color:var(--mal)} .dif.menos{color:#8A5A00}
.jtab td,.jtab th{padding-left:9px;padding-right:9px}
.jtab .aviso{margin-top:5px}
.nota{font-size:13.5px;margin:14px 0 0;max-width:90ch}
.seg-scroll{overflow-x:auto;border:1px solid var(--linea);border-radius:12px}
table.segj{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px}
.segj th,.segj td{padding:7px 8px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap;min-width:52px}
.segj thead th{font-family:var(--cond);font-size:15px;color:var(--gris);background:#F7F8FA;position:sticky;top:0}
.segj thead th small{display:block;font-family:var(--texto);font-size:11px;font-weight:600}
.segj thead th.ult{color:var(--asfalto);box-shadow:inset 0 -3px 0 var(--senal)}
.segj tbody th{text-align:left;font-weight:700;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.segj tr>:first-child{position:sticky;left:0;background:var(--papel);z-index:1;border-right:1px solid var(--linea)}
.segj thead tr>:first-child{background:#F7F8FA;z-index:2}
.segj td.ok{background:#E3F3E8;color:#17643A;font-weight:700}
.segj td.bajo{background:#FFF1C7;color:#7A5000;font-weight:700}
.segj td.alto{background:#FBE1DE;color:#A2271E;font-weight:700}
.segj td.vacia{color:#B4BAC4}
.segj td.fut{background:repeating-linear-gradient(135deg,#fff 0 6px,#F4F5F8 6px 12px)}
.segj .tot{font-family:var(--cond);font-size:16px;font-weight:700;border-left:1px solid var(--linea)}
.leyj{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--gris);font-weight:600}
.leyj>span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin-left:8px}
.leyj i{width:14px;height:14px;border-radius:4px}
.leyj i.ok{background:#E3F3E8;border:1px solid #9ED3B0} .leyj i.bajo{background:#FFF1C7;border:1px solid #E5C45A} .leyj i.alto{background:#FBE1DE;border:1px solid #E7A39C} .leyj i.vacia{background:#fff;border:1px dashed #B4BAC4}
.soltar{border:2px dashed var(--linea);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;color:var(--asfalto);display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s,background .15s}
.soltar:hover,.soltar.encima{border-color:var(--asfalto);background:var(--senal-suave)}
.soltar b{font-family:var(--cond);font-size:22px}
.soltar input{display:none}
.imp-ajustes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;background:#F4F5F8;border-radius:14px;padding:14px}
.imp-ajustes .semtxt{font-size:13px;color:var(--gris);font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.cols label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--asfalto)}
.cols label.on{border-color:var(--asfalto);background:var(--senal-suave)}
.cols input{width:auto;margin:0}
.imp-res{display:flex;flex-wrap:wrap;gap:8px}
.imp-res span{border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:#F1F3F6}
.imp-filas{display:flex;flex-direction:column;border-top:2px solid var(--asfalto)}
.imp-fila{display:grid;grid-template-columns:minmax(0,1.3fr) 90px minmax(0,1.5fr) 190px;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--linea)}
.imp-fila.tit{font-family:var(--cond);font-weight:700;color:var(--gris);font-size:15px}
.imp-fila .nf{font-weight:700;overflow-wrap:anywhere}
.imp-fila .hf{text-align:right;font-family:var(--cond);font-size:20px;font-weight:700}
.imp-fila select{padding:8px 10px;font-size:14.5px}
.imp-fila.ign{opacity:.55}
.est{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;justify-self:start}
.est.ok{background:#DDF1E4;color:var(--ok)}
.est.duda{background:var(--senal-suave);color:#7A5600}
.est.no{background:#FBE7E5;color:var(--mal)}
.est.nuevo{background:#E4ECF9;color:var(--pista)}

/* bloqueo de actualización y recorrido */
.bloqueo{position:fixed;inset:0;z-index:100;background:rgba(22,25,31,.82);display:grid;place-items:center;padding:16px}
.caja{background:var(--papel);border-radius:20px;width:min(520px,100%);overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:subir .25s cubic-bezier(.2,.7,.2,1)}
.caja-cab{background:var(--senal);padding:20px 22px}
.caja-cab small{font-family:var(--cond);font-weight:700;font-size:15px}
.caja-cab h2{font-size:32px}
.caja-cuerpo{padding:20px 22px}
.caja-cuerpo p{margin:0 0 12px}
.caja-pie{display:flex;justify-content:space-between;align-items:center;padding:0 22px 20px}
.puntos{display:flex;gap:6px}
.puntos i{width:8px;height:8px;border-radius:50%;background:var(--linea)} .puntos i.on{background:var(--asfalto)}

.aviso-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--asfalto);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;z-index:200;animation:subir .2s}

/* movimiento */
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
main.entrando .anim{animation:subir .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* móvil */
@media (max-width:760px){
  .cab{padding:8px 12px} .marca h1{font-size:21px}
  .cifra b{font-size:26px}
  .barra-herr .btn{flex:1 1 auto}
  main{padding:18px 12px 50px}
  .portada h2{font-size:38px} .globos{grid-template-columns:1fr}
  .resumen{grid-template-columns:repeat(2,minmax(0,1fr))} .resumen .cifra:first-child{grid-column:1/-1}
  .tabla-escritorio{display:none} .tarjetas-movil{display:flex;flex-direction:column;gap:10px}
  .tm{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;text-align:left;width:100%;cursor:pointer}
  .tm .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .tm .l2{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--gris)}
  .tm .l2 b{font-family:var(--cond);font-size:22px;color:var(--asfalto)}
  .contratos,.jornada{grid-template-columns:1fr}
  .tm .l3{margin-top:8px;font-size:13.5px;color:var(--gris);display:flex;justify-content:space-between;gap:8px}
  .tm .l3 b{color:var(--asfalto)}

<script>
/* =========================================================
   Control Planning 10 — rehecha desde cero
   Datos en localStorage, con una clave nueva.
   ========================================================= */
const APP_VERSION = '10.6.0';
const CLAVE = 'control-planning-v10';
const NOVEDADES = {
  '10.6.0': [
    { titulo:'Añadir la plantilla desde Excel', donde:'Personal › Añadir desde Excel',
      texto:'«Pegar lista» ahora se llama «Añadir desde Excel» y admite el archivo entero (.xlsx o .csv), además de filas pegadas. Basta con una columna de nombres. Antes de añadir a nadie ves la lista: los que ya están en la app y las plazas ficticias salen sin marcar.' },
    { titulo:'Luego, cada ficha', donde:'Personal › ficha del trabajador',

    { titulo:'Control de jornada', donde:'Inicio › Control de jornada',

    { titulo:'Lo que la app recuerda', donde:'Personal › Importar turnos',

    { titulo:'Bajas y semanas en la ficha', donde:'Personal › ficha del trabajador',
      texto:'Apunta sus bajas (desde y hasta) y su jornada anual se recalcula con una regla de tres sobre los días del año, o sobre los de actividad si es fijo discontinuo. Debajo están sus horas semana a semana: puedes corregirlas, quitarlas o añadir una semana a mano.' },
  ],
  '10.3.0': [
    { titulo:'Horario concretado y jornada reducida, por separado', donde:'Personal › ficha del trabajador',
      texto:'Ahora son dos opciones distintas y puedes marcar las dos. «¿Tiene horario concretado?»: eliges su turno (mañanas, tardes o noches) y, si quieres, el horario; no cambia sus horas. «¿Tiene jornada reducida?»: escribes las horas que hace a la semana o el porcentaje de su jornada, y se recalcula su jornada anual.' },
    { titulo:'Lo que ya tenías', donde:'Personal',
      texto:'Los trabajadores que marcaste antes como «concretados» con menos horas pasan a «Jornada reducida». Revisa si alguno tiene además un horario concretado.' },
    { titulo:'En la lista', donde:'Personal',
      texto:'Etiqueta amarilla «Reducida» para la jornada reducida y etiqueta verde con el turno y el horario para el horario concretado.' },
  ],
  '10.1.0': [
    { titulo:'Control Planning, desde cero', donde:'Inicio',
      texto:'La app empieza de nuevo y crecerá por partes. Por ahora solo tiene una: Personal.' },
    { titulo:'Personal', donde:'Inicio › Personal',
      texto:'Añade a cada trabajador con su contrato (tiempo completo, tiempo parcial o fijo discontinuo) y su jornada. Verás la jornada en horas a la semana, en porcentaje y en horas al año.' },
    { titulo:'Jornada como tú la tengas', donde:'Ficha de cada trabajador',
      texto:'Escribe la jornada en horas semanales, en porcentaje o en horas anuales: la app calcula las otras dos. Un tiempo completo son 40 h a la semana y 1.700 h al año. A los fijos discontinuos se les apuntan sus periodos de actividad.' },
  ],
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nf = (n, d=0) => n==null || isNaN(n) ? '—' : Number(n).toLocaleString('es-ES',{minimumFractionDigits:d, maximumFractionDigits:d, useGrouping:'always'});
const nh = n => n==null || isNaN(n) ? '—' : Number(n).toLocaleString('es-ES',{maximumFractionDigits:2, useGrouping:'always'});
const num = v => { if(v===''||v==null) return null; const n = Number(String(v).replace(',','.')); return isNaN(n) ? null : n; };
const pd = s => new Date(s+'T00:00:00Z');
const fmt = s => s ? pd(s).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}) : '';
const diasEntre = (a,b) => Math.round((pd(b)-pd(a))/864e5) + 1;
const diasAnio = y => (y%4===0 && y%100!==0) || y%400===0 ? 366 : 365;
const isoDe = d => d.toISOString().slice(0,10);
const sumaDias = (s, n) => { const d = pd(s); d.setUTCDate(d.getUTCDate()+n); return isoDe(d); };
const lunesDe = s => { const d = pd(s); d.setUTCDate(d.getUTCDate() - (d.getUTCDay()+6)%7); return isoDe(d); };
const hoyIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
/* una semana (por su lunes) cuenta en el año de su jueves, como las semanas del calendario */
const anioSemana = l => Number(sumaDias(l,3).slice(0,4));
const numSemana = l => Math.round((pd(l) - pd(lunesDe(`${anioSemana(l)}-01-04`))) / 6048e5) + 1;
const fCorto = s => pd(s).toLocaleDateString('es-ES',{day:'numeric',month:'short',timeZone:'UTC'}).replace('.','');
const semanaTxt = l => `${fCorto(l)} – ${fCorto(sumaDias(l,6))}${anioSemana(l)!==S.anio?' '+anioSemana(l):''}`;
const r2 = n => Math.round(n*100)/100;
function toast(t){ const d = document.createElement('div'); d.className='aviso-toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }
const ICO = {
  flecha:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  personal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3.2 3.9 1.8 4.5 4.8"/></svg>',
  mas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  subir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>',
  jornada:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l3.5-3.5M9.5 2.5h5M12 2.5v2.5"/></svg>',
  pegar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5h6M9 10h6M9 14h6M9 18h3"/></svg>',
};

/* ---------- catálogos fijos ---------- */
const TURNOS = { manana:'Mañanas', tarde:'Tardes', noche:'Noches' };
const horarioTxt = t => !t.concretado ? '' : `${TURNOS[t.horario?.turno]||'Horario concretado'}${t.horario?.desde&&t.horario?.hasta?` ${t.horario.desde}–${t.horario.hasta}`:''}`;
const CONTRATOS = {
  completo:    {nombre:'Tiempo completo', corto:'Completo', desc:'Jornada entera todo el año', color:'#1F5FBF'},
  parcial:     {nombre:'Tiempo parcial', corto:'Parcial', desc:'Menos horas que un completo', color:'#7A4FB5'},
  discontinuo: {nombre:'Fijo discontinuo', corto:'Discontinuo', desc:'Trabaja por periodos de actividad', color:'#C46A12'},
};

/* ---------- estado ---------- */
function anioInicial(){ const d = new Date(); return d.getFullYear() + (d.getMonth()>=9 ? 1 : 0); }   // de octubre en adelante, el año siguiente
function estadoInicial(){ return { v:10, anio:anioInicial(), ajustes:{hSemana:40, hAnio:1700}, trabajadores:[], alias:{}, versionVista:'0' }; }
/* un trabajador vacío, con todos sus campos */
const nuevoTrabajador = (o={}) => ({ id:null, nombre:'', num:'', contrato:'completo', modo:'semana', valor:null, actividad:[], reducido:false, red:{modo:'semana', valor:null}, concretado:false, horario:{turno:'', desde:'', hasta:''}, bajas:[], horas:{}, ...o });
function normalizar(d){
  const b = estadoInicial();
  d = Object.assign(b, d || {});
  d.ajustes = Object.assign(estadoInicial().ajustes, d.ajustes || {});
  d.trabajadores = (d.trabajadores||[]).map(t=>({ id:t.id||uid(), nombre:t.nombre||'', num:t.num||'',
    contrato: CONTRATOS[t.contrato] ? t.contrato : 'completo', modo:['semana','pct','anio'].includes(t.modo)?t.modo:'semana',
    valor: t.valor ?? null, actividad: Array.isArray(t.actividad) ? t.actividad : [],
    reducido: t.reducido, red: t.red, concretado: t.concretado, horario: t.horario, conc: t.conc, bajas: t.bajas, horas: t.horas,
    ...(t.red===undefined && t.conc ? { reducido: !!t.concretado, red: t.conc, concretado: false } : {}),
  })).map(t=>({ ...t,
    reducido: !!t.reducido, red: { modo: t.red?.modo==='pct' ? 'pct' : 'semana', valor: t.red?.valor ?? null },
    concretado: !!t.concretado, horario: { turno: t.horario?.turno || '', desde: t.horario?.desde || '', hasta: t.horario?.hasta || '' },
    bajas: Array.isArray(t.bajas) ? t.bajas.filter(b=>b && b.desde && b.hasta) : [],
    horas: Object.fromEntries(Object.entries(t.horas && typeof t.horas==='object' ? t.horas : {}).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof v==='number' && isFinite(v)).map(([k,v])=>[lunesDe(k), v])) }));
  const ids = new Set(d.trabajadores.map(t=>t.id));
  d.alias = Object.fromEntries(Object.entries(d.alias && typeof d.alias==='object' ? d.alias : {}).filter(([k,id])=>ids.has(id)));
  return d;
}
let S;
try { S = normalizar(JSON.parse(localStorage.getItem(CLAVE))); } catch(e){ S = estadoInicial(); }
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch(e){ toast('No se ha podido guardar en este navegador'); } };
let UI = { vista:'inicio', buscar:'', filtro:'todos', filtroJ:'todos', segJ:'semana', edit:null };
try { const u = JSON.parse(sessionStorage.getItem('cp-ui')||'{}'); if(u.vista) UI.vista=u.vista; } catch(e){}

/* =========================================================
   Jornada
   Un tiempo completo son S.ajustes.hSemana horas a la semana
   y S.ajustes.hAnio horas al año (40 h y 1.700 h).
   La jornada de cada persona se guarda tal como la escribiste
   (modo + valor) y se convierte a las otras dos unidades.
   ========================================================= */
function pctDe(t){
  if(t.contrato==='completo') return 100;
  const v = num(t.valor); if(v==null) return null;
  const A = S.ajustes;
  return t.modo==='pct' ? v : t.modo==='semana' ? v / A.hSemana * 100 : v / A.hAnio * 100;
}
const semanaDe = t => { const p = pctDe(t); return p==null ? null : p/100 * S.ajustes.hSemana; };   // la de su contrato
/* Jornada reducida: la que hace de verdad, en horas a la semana o en % de la jornada de su contrato.
   pctEf es la jornada efectiva en % de un tiempo completo; todos los cálculos salen de ella. */
function pctEf(t){
  const pc = pctDe(t); if(!t.reducido) return pc;
  const v = num(t.red?.valor); if(v==null || pc==null) return null;
  return t.red.modo==='pct' ? pc * v / 100 : v / S.ajustes.hSemana * 100;
}
const semanaEf = t => { const p = pctEf(t); return p==null ? null : p/100 * S.ajustes.hSemana; };
const pctDeSuJornada = t => { const pc = pctDe(t), pe = pctEf(t); return pc && pe!=null ? pe / pc * 100 : null; };
const anualBase = t => { const p = pctEf(t); return p==null ? null : p/100 * S.ajustes.hAnio; };
/* días de actividad de un fijo discontinuo dentro del año */
/* días de una lista de periodos que caen dentro del año, sin contar dos veces los que se pisan */
function diasDe(periodos, y, ini=`${y}-01-01`, fin=`${y}-12-31`){
  const dias = new Set();
  (periodos||[]).forEach(p=>{ if(!p || !p.desde || !p.hasta || p.hasta<p.desde) return;
    let d = p.desde < ini ? ini : p.desde; const h = p.hasta > fin ? fin : p.hasta;
    while(d<=h){ dias.add(d); d = sumaDias(d,1); } });
  return dias;
}
const diasActividad = (t, y=S.anio) => diasDe(t.actividad, y).size;
/* días del año con los que se calcula su jornada: todo el año, o los de actividad si es fijo discontinuo */
const diasJornada = (t, y=S.anio) => t.contrato==='discontinuo' ? diasActividad(t, y) : diasAnio(y);
/* días de baja que caen en esos días */
function diasBaja(t, y=S.anio){
  const b = diasDe(t.bajas, y); if(t.contrato!=='discontinuo') return b.size;
  const a = diasDe(t.actividad, y); let n = 0; b.forEach(d=>{ if(a.has(d)) n++; }); return n;
}
/* jornada anual del año elegido */
function anualDe(t, y=S.anio){
  const base = anualBase(t); if(base==null) return null;
  if(t.contrato!=='discontinuo') return base;
  return base * diasActividad(t, y) / diasAnio(y);
}
/* cómputo: la jornada anual descontando las bajas con una regla de tres
   (si en x días tiene que hacer A horas, en x − bajas tiene que hacer A × (x − bajas) / x) */
function computoDe(t, y=S.anio){
  const a = anualDe(t, y); if(a==null) return null;
  const x = diasJornada(t, y); if(!x) return 0;
  return a * (x - Math.min(x, diasBaja(t, y))) / x;
}
const semanasDe = (t, y=S.anio) => Object.keys(t.horas||{}).filter(l=>anioSemana(l)===y).sort();
const hechasDe = (t, y=S.anio) => semanasDe(t, y).reduce((a,l)=>a+(num(t.horas[l])||0), 0);
const quedanDe = (t, y=S.anio) => { const c = computoDe(t, y); return c==null ? null : c - hechasDe(t, y); };
const faltaJornada = t => (t.contrato!=='completo' && pctDe(t)==null) || (t.reducido && pctEf(t)==null);
const faltaActividad = t => t.contrato==='discontinuo' && diasActividad(t)===0;

/* =========================================================
   Pantallas
   ========================================================= */
function ir(v){ UI.vista = v; pintar(true); scrollTo(0,0); }
const plantilla = () => S.trabajadores;

function pintar(cambio){
  const V = {inicio:vInicio, personal:vPersonal, jornada:vJornada};
  if(!V[UI.vista]) UI.vista = 'inicio';
  const m = $('#main'); m.innerHTML = V[UI.vista]();
  if(cambio){ m.classList.remove('entrando'); void m.offsetWidth; m.classList.add('entrando'); clearTimeout(pintar._t); pintar._t = setTimeout(()=>m.classList.remove('entrando'), 800); }
  try { sessionStorage.setItem('cp-ui', JSON.stringify({vista:UI.vista})); } catch(e){}
}

/* inicio: una sola burbuja */
function vInicio(){
  const ts = S.trabajadores, pend = ts.filter(t=>faltaJornada(t)||faltaActividad(t)).length;
  return `<div class="globos">
    <button class="globo anim" style="--i:0" onclick="ir('personal')"><span class="gi">${ICO.personal}</span><span class="gt">Personal</span>
      <span class="gp">Los trabajadores, su contrato, su jornada y las horas que llevan.</span>
      <span class="gd">${ts.length?`<span>${ts.length} trabajador${ts.length===1?'':'es'}</span>`:'<span>Sin trabajadores todavía</span>'}${pend?`<span>${pend} por completar</span>`:''}</span></button>
    ${(()=>{ const c = corteDe(S.anio), rs = c ? ts.map(t=>seguimientoDe(t, S.anio, c)) : [], k = e => rs.filter(r=>grupoJ(r.estado)===e).length;
      return `<button class="globo anim" style="--i:1;--ctx:#23864F" onclick="ir('jornada')"><span class="gi">${ICO.jornada}</span><span class="gt">Control de jornada</span>
      <span class="gp">Si cada trabajador va a llegar a su jornada anual, no va a llegar o se pasa.</span>
      <span class="gd">${c ? `<span>Semana ${numSemana(c.ultima)}</span>${k('falta')?`<span>${k('falta')} no llegan</span>`:''}${k('pasa')?`<span>${k('pasa')} se pasan</span>`:''}` : `<span>Sin turnos de ${S.anio}</span>`}</span></button>`; })()}
  </div>`;
}

function vPersonal(){
  const todos = plantilla();
  const cab = `<div class="portada anim"><button class="volver" onclick="ir('inicio')">‹ Inicio</button><h2>Personal</h2>
    <p>Los trabajadores con su contrato, su jornada y las horas que llevan.</p></div>`;
  if(!todos.length) return cab + `<div class="tarjeta vacio anim" style="--i:1"><h3>Todavía no hay nadie</h3><p>Añade a los trabajadores uno a uno o pega la lista desde tu Excel.</p>
    <div class="fila" style="justify-content:center"><button class="btn primario" onclick="abrirFicha()">${ICO.mas} Añadir trabajador</button><button class="btn" onclick="abrirPegar()">${ICO.pegar} Añadir desde Excel</button></div></div>`;
  const cuenta = c => todos.filter(t=>t.contrato===c).length;
  const total = todos.reduce((a,t)=>a+(computoDe(t)||0),0);
  const totalHechas = todos.reduce((a,t)=>a+hechasDe(t),0);
  const q = UI.buscar.trim().toLowerCase();
  const ts = todos.filter(t=>(UI.filtro==='todos'||t.contrato===UI.filtro) && (!q || t.nombre.toLowerCase().includes(q) || String(t.num).includes(q)))
    .sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const avisos = t => faltaJornada(t) ? '<span class="aviso">Falta la jornada</span>' : faltaActividad(t) ? `<span class="aviso">Sin actividad en ${S.anio}</span>` : '';
  const filas = ts.map(t=>{ const c = CONTRATOS[t.contrato];
    return `<tr onclick="abrirFicha('${t.id}')">
      <td><div class="nombre">${esc(t.nombre)}</div>${t.num?`<div class="sub">Nº ${esc(t.num)}</div>`:''}</td>
      <td><span class="chip ${t.contrato}">${c.nombre}</span>${t.reducido?' <span class="chip reducida">Reducida</span>':''}${t.concretado?` <span class="chip concretada">${esc(horarioTxt(t))}</span>`:''}</td>
      <td class="num">${semanaEf(t)==null?'—':nh(semanaEf(t))+' h'}${t.reducido&&semanaDe(t)!=null?`<div class="sub">de ${nh(semanaDe(t))} h</div>`:''}</td>
      <td class="num">${pctEf(t)==null?'—':nh(pctEf(t))+' %'}</td>
      <td class="num">${t.contrato==='discontinuo'?`${diasActividad(t)} días`:'<span class="muted">Todo el año</span>'}</td>

  const fb = (k,t) => `<button class="${UI.filtro===k?'on':''}" onclick="UI.filtro='${k}';pintar()">${t}</button>`;
  return cab + `<div class="resumen anim" style="--i:1">
      <div class="cifra"><b>${todos.length}</b><span>trabajadores${[todos.filter(t=>t.reducido).length && `${todos.filter(t=>t.reducido).length} con reducción`, todos.filter(t=>t.concretado).length && `${todos.filter(t=>t.concretado).length} con horario concretado`].filter(Boolean).map(x=>', '+x).join('')}</span></div>
      <div class="cifra" style="--cc:var(--c-completo)"><b>${cuenta('completo')}</b><span>tiempo completo</span></div>

      <div class="cifra" style="--cc:var(--senal)"><b>${nh(total)} h</b><span>jornada anual en ${S.anio}${totalHechas?`, ${nh(totalHechas)} h hechas`:''}</span></div>
    </div>

        <div class="seg" role="group" aria-label="Filtrar por contrato">${fb('todos','Todos')}${fb('completo','Completo')}${fb('parcial','Parcial')}${fb('discontinuo','Discontinuo')}</div>

        <span class="esp"></span>

/* hechas y quedan, en la lista */
function barra(t){
  const c = computoDe(t), h = hechasDe(t); if(c==null || faltaJornada(t) || faltaActividad(t)) return '';
  const p = c>0 ? Math.min(100, h/c*100) : (h>0?100:0);
  return `<div class="prog ${h>c+0.005?'pasa':''}" title="${nh(c>0?h/c*100:0)} % hecho"><i style="width:${p}%"></i></div>`;
}
function horasCelda(t){
  const n = semanasDe(t).length;
  if(faltaJornada(t) || faltaActividad(t)) return n ? `<span class="hecha">${nh(hechasDe(t))} h</span>` : '<span class="muted">—</span>';
  return `<span class="hecha">${nh(hechasDe(t))} h</span>${barra(t)}<div class="sub">${n ? `${n} semana${n===1?'':'s'}` : 'Sin semanas'}</div>`;
}
function quedanCelda(t, corto){
  const q = quedanDe(t); if(q==null || faltaJornada(t) || faltaActividad(t)) return corto ? '' : '<span class="muted">—</span>';
  if(q < -0.005) return `<span class="de-mas">${nh(-q)} h de más</span>`;
  return corto ? `Quedan <b>${nh(q)} h</b>` : `<span class="hecha">${nh(q)} h</span>`;
}

/* =========================================================
   Ficha del trabajador (diálogo)

function abrirFicha(id){
  const t = id ? S.trabajadores.find(x=>x.id===id) : null;

}

          <label style="flex:0 1 140px">Desde<input type="time" value="${esc(hz.desde)}" onchange="UI.edit.horario.desde=this.value"></label>
          <label style="flex:0 1 140px">Hasta<input type="time" value="${esc(hz.hasta)}" onchange="UI.edit.horario.hasta=this.value"></label></div>
        <p class="muted" style="margin:8px 0 0;font-size:13.5px">Elige su turno y, si quieres, el horario. No cambia sus horas.</p>` : ''}
    </div>`;
  const bReducido = `<div class="bloque"><h3>¿Tiene jornada reducida?</h3>
      ${siNo('reducido', "setTimeout(()=>$('#r_'+UI.edit.red.modo)?.focus(),20)")}
      ${e.reducido ? `<div class="jornada red" style="margin-top:12px">${ccampo('semana','Horas a la semana que hace', cSem, 'h')}${ccampo('pct','Porcentaje de su jornada', cPct, '%')}

/* pasar a escribir en otra unidad: se convierte el valor actual */
function cambiarModo(modo, input){
  const e = UI.edit, pct = pctDe(e);
  e.modo = modo;
  if(pct!=null) e.valor = Math.round((modo==='pct' ? pct : modo==='semana' ? pct/100*S.ajustes.hSemana : pct/100*S.ajustes.hAnio) * 100) / 100;
  pintarFicha();
  const i = $('#j_'+modo); if(i){ i.focus(); i.select(); }
}
/* al escribir, se actualizan las otras casillas y el cálculo sin repintar la que tiene el foco */
function recalcular(){
  const e = UI.edit, pct = pctDe(e), A = S.ajustes;
  const vals = {semana: semanaDe(e), pct, anio: pct==null ? null : pct/100*A.hAnio};
  const pon = (id, v) => { const i = $('#'+id); if(i && document.activeElement!==i) i.value = v==null ? '' : nh(v).replace(/\./g,''); };
  Object.keys(vals).forEach(k=>{ if(k!==e.modo) pon('j_'+k, vals[k]); });
  if(e.reducido){
    if(e.red.modo!=='semana') pon('r_semana', semanaEf(e));
    if(e.red.modo!=='pct') pon('r_pct', pctDeSuJornada(e));
    const tc = $('#r_tc'); if(tc) tc.textContent = pctEf(e)==null ? '—' : nh(pctEf(e));
  }
  const c = $('#calc'); if(c) c.innerHTML = calculoHTML(e);
}
/* caja oscura del final de la ficha: jornada con bajas, hechas y quedan */
function calculoHTML(e){
  const c = computoDe(e), ok = c!=null && !faltaActividad(e);
  const q = ok ? c - hechasDe(e) : null;
  return `<span>Jornada anual ${S.anio}</span><b>${c==null?'—':nh(c)+' h'}</b>
    ${ok ? `<span class="hq"><span>Hechas<em>${nh(hechasDe(e))} h</em></span><span>${q < -0.005 ? `De más<em>${nh(-q)} h</em>` : `Quedan<em>${nh(q)} h</em>`}</span></span>` : ''}
    <span class="f">${esc(formulaDe(e))}</span>`;
}
/* bajas: periodos a mano que descuentan su parte de la jornada */
function bloqueBajas(e){
  const x = diasJornada(e), b = diasBaja(e);
  return `<div class="bloque"><h3>Bajas</h3>
    <div class="periodos">${e.bajas.map((p,i)=>`<div class="periodo">
      <label>Desde<input type="date" value="${p.desde||''}" onchange="UI.edit.bajas[${i}].desde=this.value;pintarFicha()"></label>
      <label>Hasta<input type="date" value="${p.hasta||''}" onchange="UI.edit.bajas[${i}].hasta=this.value;pintarFicha()"></label>
      <span class="dias">${p.desde&&p.hasta&&p.hasta>=p.desde?`${diasDe([p], S.anio).size} días en ${S.anio}`:''}</span>
      <button type="button" class="quitar" aria-label="Quitar baja" onclick="UI.edit.bajas.splice(${i},1);pintarFicha()">×</button></div>`).join('')}</div>
    <div class="fila" style="margin-top:8px"><button type="button" class="btn" onclick="UI.edit.bajas.push({desde:'',hasta:''});pintarFicha()">${ICO.mas} Añadir baja</button></div>
    ${b ? `<p class="muted" style="margin:8px 0 0;font-size:13.5px">${b} día${b===1?'':'s'} de baja de ${x}${e.contrato==='discontinuo'?' de actividad':''}: su jornada de ${S.anio} se queda en ${x-b}/${x} partes.</p>` : ''}
  </div>`;
}
/* horas apuntadas por semana en el año elegido */
function bloqueHoras(e){
  const ls = semanasDe(e);
  return `<div class="bloque"><h3>Horas trabajadas en ${S.anio}</h3>
    ${ls.length ? `<div class="semanas">${ls.map(l=>`<div class="semana"><span class="qs">Semana ${numSemana(l)}<small>${semanaTxt(l)}</small></span>
        <span class="hcampo"><input inputmode="decimal" aria-label="Horas de la semana ${numSemana(l)}" data-l="${l}" value="${e.horas[l]==null?'':nh(e.horas[l]).replace(/\./g,'')}" oninput="UI.edit.horas['${l}']=num(this.value);recalcular()"> <span class="ud muted">h</span></span>
        <button type="button" class="quitar" aria-label="Quitar semana" onclick="delete UI.edit.horas['${l}'];pintarFicha()">×</button></div>`).join('')}</div>`
      : `<p class="muted" style="margin:0 0 4px;font-size:14px">Todavía no hay semanas. Se llenan solas con «Importar turnos», o añádelas aquí.</p>`}
    <div class="fila" style="margin-top:8px;align-items:flex-end"><label style="flex:0 1 230px">Añadir la semana del día<input type="date" onchange="anadirSemana(this.value)"></label></div>
  </div>`;
}
function anadirSemana(v){
  if(!v) return; const l = lunesDe(v);
  if(UI.edit.horas[l]===undefined) UI.edit.horas[l] = null;
  if(anioSemana(l)!==S.anio) toast(`Esa semana cuenta en ${anioSemana(l)}`);
  pintarFicha(); setTimeout(()=>{ const i = document.querySelector(`.semana input[data-l="${l}"]`); if(i){ i.focus(); i.scrollIntoView({block:'center'}); } }, 30);
}
/* explicación del cálculo de la jornada anual */
function formulaDe(e){
  const A = S.ajustes, pc = pctDe(e), pe = pctEf(e);
  if(pc==null) return 'Escribe su jornada en cualquiera de las tres casillas.';
  if(e.reducido && pe==null) return 'Escribe su jornada reducida.';
  const base = pe/100*A.hAnio;
  let f = e.reducido ? `Reducida: ${nh(semanaEf(e))} h a la semana (${nh(pctDeSuJornada(e))} % de su jornada de ${nh(semanaDe(e))} h) = ${nh(pe)} % de ${nh(A.hAnio)} h`
        : e.contrato==='completo' ? `Tiempo completo: ${nh(A.hSemana)} h a la semana, ${nh(A.hAnio)} h al año`
        : `${nh(pe)} % de ${nh(A.hAnio)} h`;
  if(e.contrato==='discontinuo') f += `, y ${nh(base)} h × ${diasActividad(e)} días de actividad / ${diasAnio(S.anio)} días del año`;
  const b = diasBaja(e), x = diasJornada(e);
  if(b && x) f += `. Con ${b} día${b===1?'':'s'} de baja: ${nh(anualDe(e))} h × ${x-Math.min(b,x)} / ${x} días`;
  return f + '.';
}
/* al cambiar de casilla en la jornada reducida se repinta para marcar la activa sin perder el foco */
function marcarRed(){ document.querySelectorAll('.jornada.red .jcampo').forEach(x=>x.classList.toggle('on', x.querySelector('input')?.id==='r_'+UI.edit.red.modo)); }
function cerrarFicha(){ UI.edit = null; $('#capa').innerHTML = ''; }
function guardarFicha(){
  const e = UI.edit;
  e.nombre = e.nombre.trim().replace(/\s+/g,' ');
  if(!e.nombre){ toast('Escribe el nombre'); $('#fNombre')?.focus(); return; }
  const p = pctDe(e);
  if(e.contrato!=='completo' && p!=null && (p<=0 || p>100)){ toast('La jornada tiene que estar entre 0 y un tiempo completo'); return; }
  if(e.concretado && !e.horario.turno){ toast('Elige su turno, o marca «No» en horario concretado'); return; }
  if(e.reducido){
    const pe = pctEf(e);
    if(pe==null){ toast('Escribe su jornada reducida, o marca «No»'); $('#r_'+e.red.modo)?.focus(); return; }
    if(pe<=0 || pe>p+0.001){ toast('La jornada reducida tiene que ser menor que la de su contrato'); return; }
  }
  if(e.contrato==='discontinuo' && e.actividad.some(x=>x.desde&&x.hasta&&x.hasta<x.desde)){ toast('Hay un periodo que acaba antes de empezar'); return; }
  if(e.bajas.some(x=>x.desde&&x.hasta&&x.hasta<x.desde)){ toast('Hay una baja que acaba antes de empezar'); return; }
  if(Object.values(e.horas).some(v=>v!=null && v<0)){ toast('Las horas de una semana no pueden ser negativas'); return; }
  e.actividad = e.actividad.filter(x=>x.desde && x.hasta);
  e.bajas = e.bajas.filter(x=>x.desde && x.hasta);
  e.horas = Object.fromEntries(Object.entries(e.horas).filter(([,v])=>v!=null).map(([k,v])=>[k, r2(v)]));
  if(e.contrato==='completo'){ e.valor = null; e.modo = 'semana'; }
  if(!e.concretado) e.horario = {turno:'', desde:'', hasta:''};
  delete e.conc;
  if(!e.reducido) e.red = {modo:'semana', valor:null};
  else if(e.red.modo==='pct') e.red.valor = Math.round(pctDeSuJornada(e)*100)/100; else e.red.valor = Math.round(semanaEf(e)*100)/100;
  if(e.id){ const i = S.trabajadores.findIndex(x=>x.id===e.id); S.trabajadores[i] = e; toast('Cambios guardados'); }
  else { e.id = uid(); S.trabajadores.push(e); toast('Trabajador añadido'); }
  guardar(); cerrarFicha(); pintar();
}
function borrarTrabajador(id){
  const t = S.trabajadores.find(x=>x.id===id); if(!t) return;
  if(!confirm(`¿Borrar a ${t.nombre}? No se puede deshacer.`)) return;
  S.trabajadores = S.trabajadores.filter(x=>x.id!==id);
  Object.keys(S.alias).forEach(k=>{ if(S.alias[k]===id) delete S.alias[k]; }); guardar(); cerrarFicha(); pintar(); toast('Trabajador borrado');
}

/* ---------- pegar lista desde Excel ---------- */
/* ---------- añadir trabajadores desde Excel: archivo o filas pegadas ----------
   Busca la columna de nombres y, si las hay, la de contrato y la de horas a la semana.
   Antes de añadir se revisa la lista: los que ya están y los «ficticios» salen sin marcar. */
let PLA = null;
function abrirPegar(){
  PLA = null;
  $('#capa').innerHTML = `<div class="fondo" onclick="if(event.target===this)cerrarPegar()"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pTit">
    <div class="dlg-cab"><h2 id="pTit">Añadir desde Excel</h2><button class="cerrar" onclick="cerrarPegar()" aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <p style="margin:0">Sube el Excel con la plantilla o pega sus filas. Basta con una columna de <b>nombres</b>; si además trae el <b>contrato</b> y las <b>horas a la semana</b>, también se recogen. Lo revisas antes de añadir a nadie.</p>
      <label class="soltar" ondragover="event.preventDefault();this.classList.add('encima')" ondragleave="this.classList.remove('encima')" ondrop="event.preventDefault();this.classList.remove('encima');leerPlantilla(event.dataTransfer.files[0])">
        <input type="file" accept=".xlsx,.xlsm,.csv,.txt" onchange="leerPlantilla(this.files[0])">
        ${ICO.subir.replace('<svg','<svg width="30" height="30"')}<b>Elegir archivo</b><span class="muted">o arrástralo aquí · Excel (.xlsx) o .csv</span></label>
      <label>O pega aquí las filas copiadas de tu Excel<textarea id="pegado" style="min-height:110px" placeholder="ANA GARCÍA LÓPEZ&#9;completo&#10;LUIS PÉREZ RUIZ&#9;parcial&#9;30&#10;MARTA SANZ GIL&#9;discontinuo&#9;40"></textarea></label>
      <p class="muted" style="margin:0;font-size:13.5px">Contrato: «completo», «parcial» o «discontinuo» (vale cualquier palabra que empiece así). Si no viene, se entiende tiempo completo; luego lo cambias en la ficha de cada uno.</p>
    </div>
    <div class="dlg-pie"><button class="btn" onclick="cerrarPegar()">Cancelar</button><button class="btn primario" onclick="leerPegadoPlantilla()">Leer lo pegado</button></div></div></div>`;
}
function cerrarPegar(){ PLA = null; $('#capa').innerHTML = ''; }
async function leerPlantilla(f){
  if(!f) return;
  if(/\.xls$/i.test(f.name)) return toast('Ese Excel es del formato antiguo (.xls). Guárdalo como .xlsx o .csv y vuelve a subirlo');
  try {
    const buf = await f.arrayBuffer(), b = new Uint8Array(buf);
    prepararPlantilla((b[0]===0x50 && b[1]===0x4B) ? await leerXlsx(buf) : [{ nombre:f.name, filas:leerCSV(textoDe(b)) }], f.name);
  } catch(e){ console.error(e); toast('No se ha podido leer el archivo. Prueba a guardarlo como .xlsx o .csv'); }
}
function leerPegadoPlantilla(){
  const t = $('#pegado')?.value || ''; if(!t.trim()) return toast('Elige un archivo o pega las filas');
  /* lo pegado a mano: la primera columna es el nombre aunque no parezca uno */
  const filas = leerCSV(t).filter(f=>String(f[0]||'').trim());
  prepararPlantilla([{ nombre:'Filas pegadas', filas }], 'Filas pegadas', true);
}
const contratoDe = v => { const s = sinAcentos(v).trim(); return /^(disc|fijo|fd\b)/i.test(s) ? 'discontinuo' : /^(parc|tp\b)/i.test(s) ? 'parcial' : /^(comp|tc\b)/i.test(s) ? 'completo' : null; };
function prepararPlantilla(hojas, archivo, pegado){
  const ancho = h => Math.max(0, ...h.filas.map(f=>f.length));
  const nombresEn = (h, c) => h.filas.filter(f=>esNombre(f[c])).length;
  let mejor = null;
  hojas.forEach(h=>{ for(let c=0; c<ancho(h); c++){ const n = nombresEn(h, c); if(!mejor || n>mejor.n) mejor = {h, c, n}; } });
  if(pegado && (!mejor || !mejor.n)) mejor = {h:hojas[0], c:0, n:1};
  if(!mejor || !mejor.n) return toast('No encuentro nombres de trabajadores en el archivo');
  const {h, c} = mejor, filas = h.filas.filter(f=>pegado ? String(f[c]||'').trim() : esNombre(f[c]));
  /* columnas de contrato y de horas a la semana, si las hay */
  const n = ancho(h); let cc = -1, ch = -1;
  for(let k=0; k<n; k++){ if(k===c) continue;
    const vs = filas.map(f=>f[k]).filter(v=>v!=='' && v!=null); if(!vs.length) continue;
    if(cc<0 && vs.filter(v=>contratoDe(v)).length >= vs.length*0.7) cc = k;
    else if(ch<0 && vs.every(v=>{ const x = num(v); return x!=null && x>0 && x<=S.ajustes.hSemana; })) ch = k; }
  const vistos = new Set();
  const fuera = pegado ? 0 : h.filas.filter(f=>!esNombre(f[c]) && /FICTICI/i.test(String(f[c]||''))).length;
  PLA = { archivo, cc, ch, fuera, filas: filas.map(f=>{
    const nombre = String(f[c]).replace(/\s+/g,' ').trim(), k = normNombre(nombre);
    const m = emparejar(nombre, []), ya = m.id && ['exacto','orden','guardado'].includes(m.como);
    const ficticio = /\bFICTICI[OA]\b|\bEVENTUAL\b.*\d|^PAX\b/i.test(sinAcentos(nombre));
    const repe = vistos.has(k); vistos.add(k);
    const contrato = cc>=0 ? contratoDe(f[cc]) || 'completo' : 'completo';
    return { nombre, contrato, horas: ch>=0 ? num(f[ch]) : null, ya: ya ? S.trabajadores.find(t=>t.id===m.id)?.nombre : '', ficticio, repe, si: !ya && !ficticio && !repe };
  }) };
  pintarPlantilla(true);
}
function pintarPlantilla(primera){
  const d0 = $('#capa .dlg'), sc = d0 ? d0.scrollTop : 0;
  const nSi = PLA.filas.filter(f=>f.si).length, nYa = PLA.filas.filter(f=>f.ya).length, nFic = PLA.filas.filter(f=>f.ficticio).length + PLA.fuera;
  const nota = f => f.ya ? `<span class="est duda">Ya está como ${esc(f.ya)}</span>` : f.ficticio ? '<span class="est no">Parece una plaza ficticia</span>' : f.repe ? '<span class="est no">Repetido en el archivo</span>' : '';
  $('#capa').innerHTML = `<div class="fondo${primera?'':' quieto'}" onclick="if(event.target===this)cerrarPegar()"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="pTit">
    <div class="dlg-cab"><h2 id="pTit">Revisa la plantilla</h2><button class="cerrar" onclick="cerrarPegar()" aria-label="Cerrar">×</button></div>
    <div class="dlg-cuerpo">
      <p class="muted" style="margin:0;font-size:14px">${esc(PLA.archivo)} · ${PLA.filas.length} nombres${PLA.cc>=0?' · con contrato':''}${PLA.ch>=0?' · con horas a la semana':''}</p>
      <div class="imp-res"><span class="est ok">${nSi} se añaden</span>${nYa?`<span class="est duda">${nYa} ya estaban</span>`:''}${nFic?`<span class="est no">${nFic} ficticios fuera</span>`:''}
        <button type="button" class="btn" style="padding:5px 12px;margin-left:auto" onclick="PLA.filas.forEach(f=>f.si=!f.ya&&!f.ficticio&&!f.repe);pintarPlantilla()">Marcar todos</button></div>
      <div class="pla-lista">${PLA.filas.map((f,i)=>`<label class="pla-fila ${f.si?'':'ign'}"><input type="checkbox" ${f.si?'checked':''} onchange="PLA.filas[${i}].si=this.checked;pintarPlantilla()">
        <span class="nf">${esc(f.nombre)}</span><span class="pla-dato">${f.contrato!=='completo'||PLA.cc>=0?`<span class="chip ${f.contrato}">${CONTRATOS[f.contrato].corto}</span>`:''}${f.horas!=null&&f.contrato!=='completo'?` ${nh(f.horas)} h`:''}</span>${nota(f)}</label>`).join('')}</div>
      <p class="muted" style="margin:0;font-size:13.5px">Todos entran como ${PLA.cc>=0?'dice el archivo':'tiempo completo'}. Después, en la ficha de cada uno, puedes cambiar el contrato, la jornada, la reducción, el horario y todo lo demás.</p>
    </div>
    <div class="dlg-pie"><button class="btn" onclick="abrirPegar()">Otro archivo</button><button class="btn primario" ${nSi?'':'disabled'} onclick="guardarPlantilla()">Añadir ${nSi} trabajador${nSi===1?'':'es'}</button></div></div></div>`;
  const d = $('#capa .dlg'); if(d && !primera) d.scrollTop = sc;
}
function guardarPlantilla(){
  const fs = PLA.filas.filter(f=>f.si); if(!fs.length) return;
  fs.forEach(f=>S.trabajadores.push(nuevoTrabajador({ id:uid(), nombre:f.nombre, contrato:f.contrato, valor: f.contrato==='completo' ? null : f.horas })));
  guardar(); cerrarPegar(); pintar();
  const sin = fs.filter(f=>f.contrato!=='completo' && f.horas==null).length;
  toast(`${fs.length} trabajador${fs.length===1?'':'es'} añadido${fs.length===1?'':'s'}${sin?` · a ${sin} les falta la jornada`:''}`);
}

/* =========================================================
   Control de jornada
   Cómo va cada trabajador con su jornada anual: lo que lleva,
   lo que debería llevar a la fecha de los últimos turnos, la
   previsión a fin de año y si llega, no llega o se pasa.
   Lo que «debería llevar» es su cómputo repartido por igual
   entre sus días de jornada (todo el año, o los de actividad),
   sin contar los días de baja.
   ========================================================= */
const MARGEN = 0.02;   // ±2 % sobre lo que debería llevar: dentro, «va a llegar»
const ESTADO_J = {
  pasado: {txt:'Se ha pasado', cls:'pasa'}, pasa: {txt:'Se va a pasar', cls:'pasa'},
  bien: {txt:'Va a llegar', cls:'bien'}, falta: {txt:'No va a llegar', cls:'falta'},
  sin: {txt:'Sin horas', cls:'sin'}, inc: {txt:'Falta la jornada', cls:'sin'},
};
const FILTRO_J = { todos:'Todos', pasa:'Se pasan', bien:'Llegan', falta:'No llegan', sin:'Sin horas' };
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
/* el seguimiento va por semanas: su año empieza el lunes de la semana 1 y acaba el domingo de la última */
const iniSeg = y => lunesDe(`${y}-01-04`), finSeg = y => sumaDias(lunesDe(`${y+1}-01-04`), -1);
/* días de jornada de ese año sin bajas (todos, o los de actividad si es fijo discontinuo) */
function diasEf(t, y){
  const a = iniSeg(y), b = finSeg(y), baja = diasDe(t.bajas, y, a, b), out = [];
  if(t.contrato==='discontinuo') diasDe(t.actividad, y, a, b).forEach(d=>{ if(!baja.has(d)) out.push(d); });
  else for(let d=a; d<=b; d=sumaDias(d,1)) if(!baja.has(d)) out.push(d);
  return out.sort();
}
/* hasta dónde hay turnos importados en el año: el domingo de la última semana con horas */
function corteDe(y=S.anio){
  const ls = S.trabajadores.flatMap(t=>semanasDe(t, y)).sort();
  if(!ls.length) return null;
  const fin = sumaDias(ls[ls.length-1], 6);
  return { primera: ls[0], ultima: ls[ls.length-1], hasta: fin };
}
function seguimientoDe(t, y, corte){
  const r = { t, pct: pctEf(t), garant: anualBase(t), computo: computoDe(t, y), hechas: hechasDe(t, y), semanas: semanasDe(t, y).length };
  if(r.computo==null || faltaJornada(t)){ r.estado = 'inc'; return r; }
  const ef = diasEf(t, y); r.ef = ef;
  const porDia = ef.length ? r.computo / ef.length : 0;
  const hastaN = corte ? ef.filter(d=>d<=corte.hasta).length : 0;
  r.esperadas = porDia * hastaN;
  r.dif = r.hechas - r.esperadas;
  r.quedan = r.computo - r.hechas;
  const restantes = ef.length - hastaN;
  r.necesita = restantes > 0 ? Math.max(0, r.quedan) / (restantes/7) : null;
  r.prevision = r.esperadas > 0 ? r.hechas / r.esperadas * r.computo : (r.hechas || null);
  /* semanas sin horas entre la primera y la última importadas en las que tenía jornada */
  r.faltan = 0;
  if(corte){ const s = new Set(ef); for(let l=corte.primera; l<=corte.ultima; l=sumaDias(l,7)){
    if(t.horas?.[l]===undefined && [0,1,2,3,4,5,6].some(k=>s.has(sumaDias(l,k)))) r.faltan++; } }
  if(!r.semanas) r.estado = 'sin';
  else if(r.hechas > r.computo + 0.005) r.estado = 'pasado';
  else if(r.esperadas <= 0) r.estado = 'bien';
  else { const k = r.hechas / r.esperadas; r.estado = k > 1 + MARGEN ? 'pasa' : k < 1 - MARGEN ? 'falta' : 'bien'; }
  return r;
}
const grupoJ = e => e==='pasado' || e==='pasa' ? 'pasa' : e==='inc' ? 'sin' : e;
const difCls = r => ({pasado:'mas', pasa:'mas', falta:'menos'})[r.estado] || '';
const conSigno = n => (n > 0.005 ? '+' : n < -0.005 ? '−' : '') + nh(Math.abs(n)) + ' h';

function vJornada(){
  const y = S.anio, corte = corteDe(y);
  const cab = `<div class="portada anim"><button class="volver" onclick="ir('inicio')">‹ Inicio</button><h2>Control de jornada</h2>
    <p>Cómo va cada trabajador con su jornada de ${y}: lo que lleva, lo que debería llevar y si va a llegar.</p></div>`;
  if(!S.trabajadores.length) return cab + `<div class="tarjeta vacio anim" style="--i:1"><h3>Todavía no hay nadie</h3><p>Añade a los trabajadores en Personal y luego importa sus turnos.</p>
    <div class="fila" style="justify-content:center"><button class="btn primario" onclick="ir('personal')">Ir a Personal</button></div></div>`;
  const todos = S.trabajadores.map(t=>seguimientoDe(t, y, corte));
  const q = UI.buscar.trim().toLowerCase(), fj = UI.filtroJ || 'todos';
  const rs = todos.filter(r=>(fj==='todos' || grupoJ(r.estado)===fj) && (!q || r.t.nombre.toLowerCase().includes(q) || String(r.t.num).includes(q)))
    .sort((a,b)=>a.t.nombre.localeCompare(b.t.nombre,'es'));
  const n = k => todos.filter(r=>grupoJ(r.estado)===k).length;
  const faltan = todos.filter(r=>r.faltan).length;
  const chip = r => `<span class="estj ${ESTADO_J[r.estado].cls}">${ESTADO_J[r.estado].txt}</span>`;
  const garant = r => r.pct==null ? '—' : `${nh(r.pct)} %`;
  const avisoF = r => r.faltan ? `<span class="aviso" title="Hay semanas importadas en las que no sale">Faltan ${r.faltan} semana${r.faltan===1?'':'s'}</span>` : '';
  const filas = rs.map(r=>{ const t = r.t, inc = r.estado==='inc';
    return `<tr onclick="abrirFicha('${t.id}')">
      <td><div class="nombre">${esc(t.nombre)}</div><div class="sub"><span class="chip ${t.contrato}" style="padding:1px 8px;font-size:12px">${CONTRATOS[t.contrato].corto}</span>${t.reducido?' reducida':''}</div></td>
      <td class="num"><span class="hecha">${garant(r)}</span><div class="sub">${r.garant==null?'':nh(r.garant)+' h'}</div></td>
      <td class="num"><span class="anual">${r.computo==null?'—':nh(r.computo)+' h'}</span>${!inc && r.garant!=null && Math.abs(r.computo-r.garant)>0.005?`<div class="sub">${t.contrato==='discontinuo'?'por actividad':''}${t.contrato==='discontinuo'&&diasBaja(t,y)?' y ':''}${diasBaja(t,y)?`${diasBaja(t,y)} días de baja`:''}</div>`:''}</td>
      <td class="num"><span class="hecha">${nh(r.hechas)} h</span><div class="sub">${r.semanas} semana${r.semanas===1?'':'s'}</div></td>
      <td class="num">${inc||!corte?'—':nh(r.esperadas)+' h'}</td>
      <td class="num">${inc||!corte||!r.semanas?'—':`<b class="dif ${difCls(r)}">${conSigno(r.dif)}</b>`}</td>
      <td class="num">${inc||!r.semanas||r.prevision==null?'—':`${nh(Math.round(r.prevision))} h<div class="sub">${conSigno(r.prevision-r.computo)}</div>`}</td>
      <td class="num">${inc||r.necesita==null?'—':`${nh(r.necesita)} h<div class="sub">su jornada: ${nh(semanaEf(t))} h</div>`}</td>
      <td>${chip(r)}${avisoF(r)?'<br>'+avisoF(r):''}</td></tr>`; }).join('');
  const tarjetas = rs.map(r=>{ const t = r.t, inc = r.estado==='inc';
    return `<button class="tm" onclick="abrirFicha('${t.id}')"><div class="l1"><b>${esc(t.nombre)}</b>${chip(r)}</div>
      <div class="l2"><span>${garant(r)} · cómputo ${r.computo==null?'—':nh(r.computo)+' h'}</span><b>${nh(r.hechas)} h</b></div>
      ${inc||!corte ? '' : `<div class="l3"><span>Debería llevar <b>${nh(r.esperadas)} h</b></span><span>${r.semanas?`<b class="dif ${difCls(r)}">${conSigno(r.dif)}</b>`:''}</span></div>
      <div class="l3"><span>Previsión <b>${r.semanas&&r.prevision!=null?nh(Math.round(r.prevision))+' h':'—'}</b></span><span>${r.necesita==null?'':`Necesita <b>${nh(r.necesita)} h/sem</b>`}</span></div>`}
      ${avisoF(r)?`<div style="margin-top:6px">${avisoF(r)}</div>`:''}</button>`; }).join('');
  const fb = k => `<button class="${fj===k?'on':''}" onclick="UI.filtroJ='${k}';pintar()">${FILTRO_J[k]}</button>`;
  const cifra = (k, txt, cc) => `<button class="cifra filtra ${fj===k?'on':''}" style="--cc:${cc}" onclick="UI.filtroJ=UI.filtroJ==='${k}'?'todos':'${k}';pintar()"><b>${n(k)}</b><span>${txt}</span></button>`;
  return cab + `<div class="resumen anim" style="--i:1">
      <div class="cifra" style="--cc:var(--asfalto)"><b>${corte ? 'Semana ' + numSemana(corte.ultima) : '—'}</b><span>${corte ? `datos hasta el ${fmt(corte.hasta)}` : `sin turnos importados en ${y}`}</span></div>
      ${cifra('bien','van a llegar','var(--ok)')}${cifra('falta','no van a llegar','#C98A00')}${cifra('pasa','se pasan o se van a pasar','var(--mal)')}${cifra('sin','sin horas'+(faltan?` · a ${faltan} les faltan semanas`:''),'#9AA1AD')}
    </div>
    <div class="tarjeta anim" style="--i:2">
      <div class="barra-herr">
        <input class="buscar" type="search" placeholder="Buscar por nombre o número" value="${esc(UI.buscar)}" aria-label="Buscar" oninput="UI.buscar=this.value;clearTimeout(window._b);window._b=setTimeout(()=>{pintar();const i=document.querySelector('.buscar');i.focus();i.setSelectionRange(i.value.length,i.value.length)},200)">
        <div class="seg" role="group" aria-label="Filtrar por estado">${Object.keys(FILTRO_J).map(fb).join('')}</div>
        <div class="anio" title="Año"><button onclick="cambiarAnio(-1)" aria-label="Año anterior">‹</button><b>${y}</b><button onclick="cambiarAnio(1)" aria-label="Año siguiente">›</button></div>
        <span class="esp"></span>
        <button class="btn" onclick="abrirImportar()">${ICO.subir} Importar turnos</button>
      </div>
      ${!corte ? `<p class="muted" style="margin:4px 0 14px">Todavía no hay turnos de ${y}. Importa el archivo de una semana para empezar el seguimiento.</p>` : ''}
      ${rs.length ? `<div class="tabla-escritorio"><table class="plantilla jtab"><thead><tr><th>Trabajador</th><th class="num">Jornada garantizada</th><th class="num">Cómputo ${y}</th><th class="num">Lleva</th><th class="num">Debería llevar</th><th class="num">Diferencia</th><th class="num">Previsión a fin de año</th><th class="num">Necesita a la semana</th><th>Estado</th></tr></thead><tbody>${filas}</tbody></table></div>
        <div class="tarjetas-movil">${tarjetas}</div>` : '<p class="muted" style="margin:10px 0">Nadie coincide con el filtro.</p>'}
      <p class="muted nota">«Debería llevar» reparte su cómputo por igual entre sus días de jornada hasta el ${corte?fmt(corte.hasta):'último turno importado'}, sin contar las bajas. Llega si va dentro de un ${nf(MARGEN*100)} % arriba o abajo. La previsión supone que sigue al mismo ritmo.</p>
    </div>
    ${corte ? seguimientoHTML(todos.filter(r=>rs.includes(r)), y, corte) : ''}`;
}

/* seguimiento por semanas o por meses: lo que hizo en cada una frente a lo que le tocaba */
function seguimientoHTML(rs, y, corte){
  const modo = UI.segJ || 'semana';
  let periodos;
  if(modo==='mes') periodos = MESES.map((m,i)=>{ const a = `${y}-${String(i+1).padStart(2,'0')}-01`, b = sumaDias(i===11 ? `${y+1}-01-01` : `${y}-${String(i+2).padStart(2,'0')}-01`, -1);
    return { cab:m, sub:'', desde:a, hasta:b, semanas: l => anioSemana(l)===y && Number(sumaDias(l,3).slice(5,7))===i+1 }; });
  else { periodos = []; for(let l=lunesDe(`${y}-01-04`); anioSemana(l)===y; l=sumaDias(l,7))
    periodos.push({ cab:`S${numSemana(l)}`, sub:fCorto(l), desde:l, hasta:sumaDias(l,6), semanas: x => x===l, l }); }
  const celdas = r => periodos.map(p=>{
    if(p.desde > corte.hasta) return `<td class="fut"></td>`;
    if(r.estado==='inc') return `<td></td>`;
    const ls = Object.keys(r.t.horas||{}).filter(p.semanas);
    const toca = r.ef.filter(d=>d>=p.desde && d<=p.hasta).length * (r.ef.length ? r.computo / r.ef.length : 0);
    if(!ls.length) return `<td class="${toca>0.005?'vacia':''}" title="${toca>0.005?'Sin horas importadas':'Sin jornada'}">${toca>0.005?'·':''}</td>`;
    const h = ls.reduce((a,l)=>a+(num(r.t.horas[l])||0),0), k = toca>0 ? h/toca : (h>0?2:1);
    const cls = k > 1.1 ? 'alto' : k < 0.9 ? 'bajo' : 'ok';

/* ---------- lectura de archivos ---------- */
async function leerArchivo(f){
  if(!f) return;
  if(/\.xls$/i.test(f.name)) return toast('Ese Excel es del formato antiguo (.xls). Guárdalo como .xlsx o .csv y vuelve a subirlo');
  try {
    const buf = await f.arrayBuffer(), b = new Uint8Array(buf);
    const hojas = (b[0]===0x50 && b[1]===0x4B) ? await leerXlsx(buf) : [{ nombre: f.name, filas: leerCSV(textoDe(b)) }];
    prepararImport(hojas, f.name);
  } catch(e){ console.error(e); toast('No se ha podido leer el archivo. Prueba a guardarlo como .xlsx o .csv'); }
}
function leerPegadoImp(){
  const t = $('#impPegado')?.value || '';
  if(!t.trim()) return toast('Elige un archivo o pega las filas');
  prepararImport([{ nombre:'Filas pegadas', filas: leerCSV(t) }], 'Filas pegadas');
}
function textoDe(b){ try { return new TextDecoder('utf-8', {fatal:true}).decode(b); } catch(e){ return new TextDecoder('windows-1252').decode(b); } }
function leerCSV(t){
  t = t.replace(/^﻿/, '');
  const primera = t.split(/\r?\n/).find(l=>l.trim()) || '';
  const sep = ['\t',';',','].map(c=>[c, primera.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const filas = []; let fila = [], campo = '', comillas = false;
  for(let i=0; i<t.length; i++){
    const c = t[i];
    if(comillas){ if(c==='"'){ if(t[i+1]==='"'){ campo+='"'; i++; } else comillas = false; } else campo += c; }
    else if(c==='"' && campo==='') comillas = true;
    else if(c===sep){ fila.push(campo); campo=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && t[i+1]==='\n') i++; fila.push(campo); filas.push(fila); fila=[]; campo=''; }
    else campo += c;
  }
  if(campo!=='' || fila.length){ fila.push(campo); filas.push(fila); }
  return filas.map(f=>f.map(x=>x.trim()));
}
/* .xlsx: es un zip con XML dentro; se descomprime con el navegador, sin librerías */
async function leerXlsx(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = -1; for(let i=u8.length-22; i>=Math.max(0, u8.length-70000); i--){ if(dv.getUint32(i,true)===0x06054b50){ e = i; break; } }
  if(e<0) throw new Error('zip sin directorio');
  const n = dv.getUint16(e+10,true); let p = dv.getUint32(e+16,true); const ent = {};
  for(let k=0; k<n; k++){
    const met = dv.getUint16(p+10,true), tam = dv.getUint32(p+20,true), ln = dv.getUint16(p+28,true), lx = dv.getUint16(p+30,true), lc = dv.getUint16(p+32,true), off = dv.getUint32(p+42,true);
    ent[dec.decode(u8.subarray(p+46, p+46+ln))] = {met, tam, off}; p += 46+ln+lx+lc;
  }
  const leer = async nombre => {
    const x = ent[nombre]; if(!x) return null;
    const ini = x.off + 30 + dv.getUint16(x.off+26,true) + dv.getUint16(x.off+28,true), datos = u8.subarray(ini, ini+x.tam);
    if(x.met===0) return dec.decode(datos);
    const s = new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return dec.decode(await new Response(s).arrayBuffer());
  };
  const xml = t => new DOMParser().parseFromString(t, 'application/xml');
  const tags = (n, t) => Array.from(n.getElementsByTagName(t));
  const ss = await leer('xl/sharedStrings.xml');
  const compartidas = ss ? tags(xml(ss), 'si').map(si=>tags(si,'t').map(x=>x.textContent).join('')) : [];
  const wb = xml(await leer('xl/workbook.xml')), rels = xml(await leer('xl/_rels/workbook.xml.rels') || '<r/>');
  const destino = {}; tags(rels, 'Relationship').forEach(r=>destino[r.getAttribute('Id')] = r.getAttribute('Target'));
  const hojas = [];
  for(const h of tags(wb, 'sheet')){
    const rid = h.getAttribute('r:id') || h.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let ruta = destino[rid] || ''; ruta = ruta.startsWith('/') ? ruta.slice(1) : 'xl/' + ruta.replace(/^\.\//,'');
    const t = await leer(ruta); if(!t) continue;
    const filas = [];
    tags(xml(t), 'row').forEach(row=>{
      const r = Number(row.getAttribute('r')) - 1 || filas.length, fila = [];
      tags(row, 'c').forEach((c, i)=>{
        const ref = c.getAttribute('r'); let col = i;
        if(ref){ col = 0; for(const ch of ref.replace(/\d+/g,'')) col = col*26 + ch.charCodeAt(0) - 64; col--; }
        const tipo = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]?.textContent;
        let val = '';
        if(tipo==='s') val = compartidas[Number(v)] ?? '';
        else if(tipo==='inlineStr') val = tags(c,'t').map(x=>x.textContent).join('');
        else if(tipo==='b') val = v==='1' ? 'VERDADERO' : 'FALSO';
        else if(v!=null) val = tipo==='str' || tipo==='e' ? v : Number(v);
        fila[col] = val;
      });
      filas[r] = Array.from(fila, x=>x ?? '');
    });
    hojas.push({ nombre: h.getAttribute('name') || `Hoja ${hojas.length+1}`, filas: Array.from(filas, f=>f || []) });
  }
  if(!hojas.length) throw new Error('sin hojas');
  return hojas;
}

/* ---------- interpretar lo leído ---------- */
const sinAcentos = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const normNombre = s => sinAcentos(s).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const PARTICULAS = new Set(['DE','DEL','LA','LAS','LOS','Y','I','DA','DO','DOS','VAN','VON','SAN']);
const fichasDe = s => normNombre(s).split(' ').filter(x=>x && !PARTICULAS.has(x));
const CABECERAS = /^(nombre|nombres|apellidos?|trabajador(es)?|emplead[oa]s?|agente|personal|total(es)?|semana|turnos?|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo|horas?|departamento|puesto|categor[ií]a)\b/i;
/* una celda parece un nombre: palabras con letras, sin números */
const esNombre = v => typeof v==='string' && v.length<=70 && !/\d/.test(v) && !CABECERAS.test(v.trim()) && sinAcentos(v).split(/[\s,]+/).filter(w=>/^[A-Za-zÑñ'.·-]{2,}$/.test(w)).length >= 2;
/* horas de una celda: 37,5 · 37:30 · 06:00-14:00 · 6-14 / 16-20; los códigos (R, F, X, LIBRE…) cuentan 0 */
function horasDe(v){
  if(typeof v==='number') return isFinite(v) ? {h:v, num:true} : null;
  const s = String(v ?? '').trim(); if(!s) return null;
  const t = s.replace(',', '.');
  if(/^-?\d+(\.\d+)?\s*h?$/i.test(t)) return {h:parseFloat(t), num:true};
  let m = t.match(/^(\d{1,3}):(\d{2})(?::\d{2})?$/); if(m) return {h:Number(m[1]) + Number(m[2])/60, num:true};
  const re = /(\d{1,2})(?:[:.h](\d{2}))?\s*(?:-|–|—|a)\s*(\d{1,2})(?:[:.h](\d{2}))?/g; let suma = 0, hay = false;
  while((m = re.exec(t))){ const a = Number(m[1]) + Number(m[2]||0)/60; let b = Number(m[3]) + Number(m[4]||0)/60;
    if(a>24 || b>24) continue; if(b<=a) b += 24; suma += b - a; hay = true; }
  if(hay) return {h:suma, num:true};
  if(/^[A-Za-zÑñ.\/ ]{1,8}$/.test(s)) return {h:0, num:false};
  return null;
}
const letraCol = i => { let s = ''; i++; while(i>0){ const r = (i-1)%26; s = String.fromCharCode(65+r) + s; i = Math.floor((i-1)/26); } return s; };

function prepararImport(hojas, archivo){
  hojas.forEach(h=>{ const n = Math.max(0, ...h.filas.map(f=>f.length)); h.filas = h.filas.map(f=>Array.from({length:n}, (_,i)=>f[i] ?? '')); });
  const cuenta = h => { const n = h.filas[0]?.length || 0; let mx = 0; for(let c=0;c<n;c++) mx = Math.max(mx, h.filas.filter(f=>esNombre(f[c])).length); return mx; };
  const hoja = hojas.map((h,i)=>[i, cuenta(h)]).sort((a,b)=>b[1]-a[1])[0][0];
  IMP = { hojas, hoja, archivo };
  analizarHoja();
  if(IMP.colNombre<0){ IMP = null; return toast('No encuentro nombres de trabajadores en el archivo'); }
  pintarImport(true);
}
/* busca la columna de nombres, la cabecera, las columnas de horas y la semana */
function analizarHoja(colNombre){
  const filas = IMP.hojas[IMP.hoja].filas, n = filas[0]?.length || 0;
  if(colNombre==null){ let mx = 0; colNombre = -1;
    for(let c=0;c<n;c++){ const k = filas.filter(f=>esNombre(f[c])).length; if(k>mx){ mx = k; colNombre = c; } } }
  IMP.colNombre = colNombre;
  const datos = colNombre<0 ? [] : filas.map((f,i)=>i).filter(i=>esNombre(filas[i][colNombre]));
  const primera = datos[0] ?? 0;
  let cab = -1; for(let i=primera-1; i>=0; i--){ if(filas[i].filter(x=>x!=='' && x!=null).length>=2){ cab = i; break; } }
  IMP.datos = datos; IMP.cab = cab;
  IMP.titulos = Array.from({length:n}, (_,c)=>{ const t = cab>=0 ? String(filas[cab][c] ?? '').trim() : ''; return t && typeof filas[cab][c]!=='number' ? t : ''; });
  /* columnas que pueden llevar horas */
  const info = Array.from({length:n}, (_,c)=>{
    if(c===colNombre) return null;
    const vals = datos.map(i=>filas[i][c]).filter(v=>v!=='' && v!=null);
    if(!vals.length) return null;
    const p = vals.map(horasDe), nums = p.filter(x=>x && x.num).map(x=>x.h);
    if(!nums.length || p.filter(Boolean).length < vals.length*0.7) return null;
    const max = Math.max(...nums);
    if(max>24*7 || nums.some(x=>x<0)) return null;
    if(/n[º°o]\b|n[uú]m|c[oó]d|\bid\b|dni|nif|emplead/i.test(IMP.titulos[c])) return null;
    if(nums.length>3 && nums.every((x,k)=>x===k+1)) return null;            // una columna 1, 2, 3…
    const dia = max<3 && nums.some(x=>x%1!==0);                              // horas guardadas como fracción del día
    return { c, dia };
  }).filter(Boolean);
  IMP.candidatas = info;
  const val = (i,c) => { const x = horasDe(filas[i][c]); const d = info.find(z=>z.c===c)?.dia; return x ? x.h * (d?24:1) : 0; };
  let elegidas;
  const total = info.filter(z=>/total|suma|horas|h\.?\s*sem|semana/i.test(IMP.titulos[z.c]));
  if(total.length) elegidas = [total[total.length-1].c];
  else if(info.length===1) elegidas = [info[0].c];
  else if(info.length>1){
    const ult = info[info.length-1].c, resto = info.slice(0,-1).map(z=>z.c);
    const cuadra = datos.filter(i=>Math.abs(val(i,ult) - resto.reduce((a,c)=>a+val(i,c),0)) < 0.05).length;
    elegidas = cuadra >= datos.length*0.8 ? [ult] : info.map(z=>z.c);
  } else elegidas = [];
  IMP.colsHoras = elegidas;
  IMP.lunes = semanaDelArchivo(filas, primera) || IMP.lunes || lunesDe(hoyIso());
  construirFilas();
}
/* la semana: una fecha escrita en el archivo, un número de fecha de Excel encima de los datos o «semana 12» */
function semanaDelArchivo(filas, primera){
  const fechas = [];
  const zona = filas.slice(0, Math.max(primera, 1));
  filas.forEach((f, i)=>f.forEach(v=>{
    if(typeof v==='number'){ if(i<primera && v>36000 && v<60000 && v%1===0) fechas.push(isoDe(new Date(Date.UTC(1899,11,30) + v*864e5))); return; }
    const s = String(v); let m;
    const re = /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})\b/g;
    while((m = re.exec(s))){ const y = m[3].length===2 ? 2000+Number(m[3]) : Number(m[3]), mo = Number(m[2]), d = Number(m[1]);
      if(mo>=1 && mo<=12 && d>=1 && d<=31) fechas.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`); }
    const re2 = /\b(\d{4})-(\d{2})-(\d{2})\b/g; while((m = re2.exec(s))) fechas.push(m[0]);
  }));
  if(fechas.length) return lunesDe(fechas.sort()[0]);
  for(const f of zona) for(const v of f){ const m = String(v).match(/semana\s*(?:n[º°o.]?\s*)?(\d{1,2})\b/i);
    if(m){ const w = Number(m[1]); if(w>=1 && w<=53) return sumaDias(lunesDe(`${S.anio}-01-04`), (w-1)*7); } }
  return null;
}
/* empareja un nombre del archivo con un trabajador */
function emparejar(nombre, fila){
  const ts = S.trabajadores, k = normNombre(nombre);
  const al = S.alias[k]; if(al && ts.some(t=>t.id===al)) return {id:al, como:'guardado'};
  const celdas = new Set(fila.map(v=>String(v).trim()).filter(Boolean));
  const pn = ts.filter(t=>t.num && celdas.has(String(t.num).trim())); if(pn.length===1) return {id:pn[0].id, como:'numero'};
  const ex = ts.filter(t=>normNombre(t.nombre)===k); if(ex.length===1) return {id:ex[0].id, como:'exacto'};
  const fa = fichasDe(nombre), clave = [...fa].sort().join(' ');
  const or = ts.filter(t=>[...fichasDe(t.nombre)].sort().join(' ')===clave); if(or.length===1) return {id:or[0].id, como:'orden'};
  const A = new Set(fa);
  const notas = ts.map(t=>{ const B = new Set(fichasDe(t.nombre)); let com = 0; A.forEach(x=>{ if(B.has(x)) com++; });
    const sub = com>=2 && (com===A.size || com===B.size);
    return {t, j: com / (A.size + B.size - com || 1), sub}; });
  const subs = notas.filter(x=>x.sub); if(subs.length===1) return {id:subs[0].t.id, como:'posible'};
  const mej = notas.filter(x=>x.j>=0.6).sort((a,b)=>b.j-a.j);
  if(mej.length && (mej.length===1 || mej[0].j>mej[1].j)) return {id:mej[0].t.id, como:'posible'};
  return {id:'', como:'nada'};
}
function construirFilas(){
  const filas = IMP.hojas[IMP.hoja].filas, prev = IMP.filas || [];
  const fac = c => IMP.candidatas.find(z=>z.c===c)?.dia ? 24 : 1;
  IMP.filas = IMP.datos.map(i=>{
    const f = filas[i], nombre = String(f[IMP.colNombre]).replace(/\s+/g,' ').trim();
    const ps = IMP.colsHoras.map(c=>{ const x = horasDe(f[c]); return x ? x.h * fac(c) : null; });
    const horas = ps.some(x=>x!=null) ? r2(ps.reduce((a,x)=>a+(x||0),0)) : null;
    const antes = prev.find(p=>p.nombre===nombre && p.manual);
    const m = antes ? {id:antes.id, como:'manual'} : emparejar(nombre, f);
    return { nombre, horas, id:m.id, como:m.como, manual:!!antes };
  });
}
