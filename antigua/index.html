function previewHTML(w, desde, hasta, excepto, bloquea){
  if(!desde || !hasta) return '';
  if(hasta < desde) return `<div class="preview bad">La fecha de fin es anterior a la de inicio.</div>`;
  const st = statsTrab(w), r = statsRango(desde,hasta,w), conf = conflictosCupo(w,desde,hasta), sol = solapePropio(w,desde,hasta,excepto), ces = solapaCese(w,desde,hasta), comp = companerosEnFechas(w,desde,hasta,excepto);
  let quedan = st.pendientes - r.computables;
  if(excepto){ const p=S.periodos.find(x=>x.id===excepto); if(p && delAnio(p.desde,CIC())) quedan += statsRango(p.desde,p.hasta,w).computables; }
  const diasConf = [...new Set(conf.map(c=>c.dia))];
  const cls = (sol || ces || quedan<0 || !r.computables || ((conf.length||comp.length) && bloquea)) ? 'bad' : (conf.length || comp.length) ? 'warn' : 'ok';
  return `<div class="preview ${cls}">
    <div class="stats"><div><b>${r.computables}</b>días de vacaciones${r.computables!==r.naturales?` (${r.naturales} naturales${r.descansos?`, ${r.descansos} de descanso que no cuentan`:''})`:''}</div><div><b>${nf(r.pts)}</b>puntos brutos</div><div><b>${nf(r.pts*st.f)}</b>puntos finales</div><div><b>${quedan}</b>días le quedarían</div></div>
    ${sol?'<p><b>Se solapa con otro periodo suyo.</b></p>':''}
    ${ces?`<p><b>Cae dentro de su periodo de cese</b> (${esc(ceseTxt(w))}).</p>`:''}
    ${comp.length?`<p><b>Se pasa del cupo de ${nombreCat(catDe(w)).toLowerCase()}s de su grupo</b> (${cupoGrupo(w)} a la vez): ${esc(comp.join(', '))}.</p>`:''}
    ${!r.computables?'<p><b>Todos esos días son descanso o festivo según su rotación.</b></p>':''}
    ${conf.length?`<p><b>${bloquea?'No hay cupo':'Supera el cupo'} ${diasConf.length} día(s):</b> ${resumenConflictos(conf)}</p>`:'<p>Hay cupo todos los días.</p>'}
    ${quedan<0?`<p><b>No le quedan días: se pasaría ${-quedan} día(s) de los ${st.derecho} que tiene.</b></p>`:''}
    ${!delAnio(desde,CIC())?`<p><b>Ojo:</b> estas fechas no son del ciclo ${CIC()}; no cuentan para sus puntos de este ciclo.</p>`:''}
  </div>`;
}
function vTurnos(ks){
  if(!UI.grupo || !ks.includes(UI.grupo)) UI.grupo = ks.find(k=>!grupoTerminado(k)) || ks[0];
  const k = UI.grupo, orden = ordenEleccion(k), actual = turnoActual(k), t = tState(k), h = hechosRonda(k);
  if(!UI.trab || !trabDe(UI.trab) || gk(trabDe(UI.trab))!==k || !visible(trabDe(UI.trab))) { UI.trab = actual?.id || orden[0].id; UI.desde=''; UI.hasta=''; }

  const selector = ks.length>1 ? `<div class="chips" style="margin-bottom:14px">${ks.map(x=>`<button class="pill ${x===k?'on':''}" onclick="UI.grupo='${x}';UI.trab=null;render()">${esc(nombreGrupo(x))} ${grupoTerminado(x)?'✓':`(ronda ${tState(x).ronda})`}</button>`).join('')}</div>` : '';

       <div class="row">${actual.id!==UI.trab?`<button class="btn" onclick="selTrab('${actual.id}')">Ver su elección</button>`:''}
       <button class="btn ink" onclick="terminarTurno('${k}','${actual.id}')">Pasar al siguiente ›</button>
       <button class="btn" onclick="deshacerTurno('${k}')" ${(!h.length&&t.ronda===1)?'disabled':''}>↶ Deshacer</button></div></div></div>`
    : `<div class="cartel fin"><div class="flecha" aria-hidden="true">✓</div><div class="cuerpo"><div class="txt"><div class="who">${esc(nombreGrupo(k))} ha terminado</div><div class="sub">Todas las rondas están cerradas.</div></div><button class="btn" onclick="deshacerTurno('${k}')">↶ Deshacer</button></div></div>`;
  const puede = UI.desde && UI.hasta && UI.hasta>=UI.desde && !solapePropio(w,UI.desde,UI.hasta) && !solapaCese(w,UI.desde,UI.hasta) && !companerosEnFechas(w,UI.desde,UI.hasta).length && !excedeDias(w,UI.desde,UI.hasta) && statsRango(UI.desde,UI.hasta,w).computables>0 && !(S.ajustes.bloquear && conflictosCupo(w,UI.desde,UI.hasta).length);
  const sel = UI.desde && UI.hasta ? statsRango(UI.desde,UI.hasta,w) : null;
  return `${selector}${cartel}
  <div class="card">
    <div class="row" style="align-items:flex-end;margin-bottom:12px">

let selLibres = new Set(), selPaso = new Set(), selCuenta = new Set(), selQuedan = 0, selArrastre = null, selTipo = 'mouse';
function selectorAnual(w){

    for(let d=1; d<=dim; d++){

      const deOtros = otros.filter(t=>!mismos.includes(t));
      const descanso = esDescanso(w,s);
      const cupoLleno = S.cupos.some(c=>enRango(s,c) && reglaAplica(c,w) && usadosCupo(c, occ[s]||[])+1 > Number(c.max));
      let st='libre', motivo='';

      else if(mismos.length>=maxG){ st='blk'; motivo=`Cupo de ${nombreCat(cat).toLowerCase()}s del grupo lleno (${maxG} a la vez): ${mismos.map(t=>t.nombre).join(', ')}`; }

      if(st==='rst' || (st==='propio' && false)) selPaso.add(s);

    }

}
function selLimitar(a, b){ // avanza desde a hacia b; cruza descansos, se para en lo no disponible o al acabarse sus días
  const paso = b>=a ? 1 : -1; let fin = a, usados = selCuenta.has(a) ? 1 : 0;
  for(let s=addDays(a,paso); paso>0 ? s<=b : s>=b; s=addDays(s,paso)){
    if(!selPaso.has(s)) break;

  }

}
function selPintar(a, b){
  const [d,h] = a<=b ? [a,b] : [b,a];

function selToque(s, el){

  if(selQuedan<=0) return toast('Ya tiene todos sus días de vacaciones');
  if(UI.desde && UI.desde===UI.hasta && s!==UI.desde && selLibres.has(UI.desde)) return selFijar(UI.desde, selLimitar(UI.desde, s));
  if(UI.desde===s && UI.hasta===s){ UI.desde=''; UI.hasta=''; return render(); }
  selFijar(s, s);
}
document.addEventListener('pointerdown', e=>{
  const el = e.target.closest && e.target.closest('#selcal .ed[data-d]'); if(!el) return;

document.addEventListener('pointerover', e=>{

document.addEventListener('pointerup', ()=>{

function rangosTxt(dias){

}

      const click = interactivo && !vac.has(s) && !enCese(w,s) && !esDescanso(w,s) ? ` onclick="UI.dpDia='${s}';render()" role="button" tabindex="0"` : '';
      html += `<span class="${cls}"${tt&&tt.libre?` style="--cc:${(PAL_DIA[tt.cod]||[tt.color])[0]};--ct:${(PAL_DIA[tt.cod]||[0,'#fff'])[1]}"`:''} title="${esc(tit)}"${click}>${d}${tt?`<i class="tc" style="color:${(vac.has(s)||dps.has(s))?'#fff':tt.color}">${esc(tt.cod)}</i>`:''}</span>`;
    }
    html += '</div></div>';
  }
  return html + `</div><div class="legend"><span style="--c:var(--ok)">Vacaciones</span><span style="--c:var(--bad)">Desprogramado</span><span style="--c:repeating-linear-gradient(135deg,#C9CED6 0 2px,#EEF0F3 2px 4px)">Cese</span><span style="--c:var(--senal-soft)">Semana Santa</span>${rotDe(w)?'<span style="--c:#EBEFF6">Libre según rotación</span>':''}</div>`;
}
function añadirDesprog(){

      <td>${st.avisos.length?st.avisos.map(a=>`<div class="chip warn" style="margin:2px 0">${a}</div>`).join(''):

function exportarCSV(){
  const q = x => `"${String(x??'').replace(/"/g,'""')}"`, dec = n => String(r2(n)).replace('.',',');
  const rows = [['Departamento','Producto','Grupo','Orden','Nombre','Skills','Modalidad','Días vacaciones','Pts año anterior','Periodo','Desde','Hasta','Días naturales','Días computables','Puntos periodo','A mano','Sin cupo','Nota','Desprogramaciones','Puntos brutos ciclo','Factor','Puntos finales ciclo']];
  gruposActivos().forEach(k=>ordenEleccion(k).forEach((t,i)=>{ const st=statsTrab(t);
    const base = [nombreDep(depDe(t)),nombreProd(prodDe(t)),nombreGrupo(k),i+1,t.nombre,skillsTxt(t),modalidadTxt(t),t.diasDerecho,t.ptsAnt];
    const fin = [st.desprog.map(d=>d.dia).join(' '), dec(st.bruto), dec(st.f), dec(st.pts)];
    if(!st.periodos.length) rows.push([...base,'','','','','','','','','',...fin]);
    st.periodos.forEach((p,j)=>{ const r=statsRango(p.desde,p.hasta,t); rows.push([...base,j+1,p.desde,p.hasta,r.naturales,r.computables,dec(r.pts*st.f),p.manual?'sí':'',p.forzado?'sí':'',p.nota||'',...fin]); });
  }));
  descargar(`vacaciones-${CIC()}-${nombreDep(S.ctx.dep)}-${nombreProd(S.ctx.prod)}.csv`, '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}
function copiaJSON(){ descargar('control-planning-'+CIC()+'-'+hoy()+'.json', JSON.stringify(S,null,1), 'application/json'); }
function cerrarCiclo(){
  const Y = S.ciclo + 1;   // el año que se acaba de asignar
  if(!confirm(`Se terminará la asignación de ${Y} para todos los departamentos y productos y pasarás a trabajar en el ciclo ${Y}. Antes se descargará una copia. ¿Seguir?`)) return;
  copiaJSON();
  conAsig(()=>S.trabajadores.forEach(t=>{ const st=statsTrab(t); t.ptsAnt2=t.ptsAnt||0; t.ptsAnt=st.pts; }));
  const mas1 = s => { const d=pd(s), y=d.getUTCFullYear()+1, m=d.getUTCMonth(); const ult=new Date(Date.UTC(y,m+1,0)).getUTCDate(); return iso(new Date(Date.UTC(y,m,Math.min(d.getUTCDate(),ult)))); };
  S.cupos.forEach(c=>{ c.desde=mas1(c.desde); c.hasta=mas1(c.hasta); });
  S.ciclo = Y; S.semanaSanta = semanaSantaDefault(Y); S.turnos = {}; S.asigAnio = Y+1;
  save(); go('vacaciones'); toast(`Ahora trabajas en el ciclo ${Y}. La próxima asignación es la de ${Y+1}.`);
}

function tarjetaEnero(){
  const y = CIC(), dias = Array.from({length:31}, (_,i)=>`${y}-01-${String(i+1).padStart(2,'0')}`);
  const dowL = s => DOW[(pd(s).getUTCDay()+6)%7];
  const d1 = DIAS_LARGOS[(pd(`${y}-01-01`).getUTCDay()+6)%7].toLowerCase();
  const filas = [];
  gruposVis().forEach(g=>{ const r=rotDeId(g.rotacionId); if(r) filas.push({tipo:'g', id:g.id, nombre:g.nombre, r, sem:(g.rotSemana!=null&&g.rotSemana!==''&&g.rotAnio===y)?Number(g.rotSemana):null, ini:inicioRot({grupoId:g.id}, r)}); });
  trabsVis().filter(t=>t.rotacionId && rotDeId(t.rotacionId)).forEach(t=>{ const r=rotDeId(t.rotacionId); filas.push({tipo:'t', id:t.id, nombre:t.nombre+' (propia)', r, sem:(t.rotSemana!=null&&t.rotSemana!==''&&t.rotAnio===y)?Number(t.rotSemana):null, ini:inicioRot(t, r)}); });
  if(!filas.length) return `<div class="card"><h2>Enero ${y}</h2><p class="help">Asigna esta rotación a algún grupo para decidir en qué semana empieza cada uno el 1 de enero.</p></div>`;
  const semDe = (r, ini) => { const n=r.semanas.length*7, i=((daysBetween(ini,`${y}-01-01`)%n)+n)%n; return Math.floor(i/7); };
  return `<div class="card"><h2>Enero ${y}: ¿en qué semana empieza cada uno?</h2>
    <p class="help">El 1 de enero de ${y} es ${d1}. Elige qué semana de la rotación le toca a cada grupo esa semana; a partir de ahí sigue sin cortes el resto del año.</p>
    <div class="scroll"><table class="ene"><tr><th class="ene-n">Grupo</th><th class="ene-s">Semana del día 1</th>${dias.map(s=>`<th class="ene-d ${['S','D'].includes(dowL(s))?'fs':''}"><span>${dowL(s)}</span>${Number(s.slice(8))}</th>`).join('')}</tr>
    ${filas.map(f=>{ const actual = f.sem!=null ? f.sem : semDe(f.r, f.ini);
      return `<tr><td class="ene-n"><b>${esc(f.nombre)}</b><div class="muted">${esc(f.r.nombre)}</div></td>
      <td class="ene-s"><select style="margin:0" aria-label="Semana de ${esc(f.nombre)} el 1 de enero" onchange="fijarSemanaEnero('${f.tipo}','${f.id}',this.value)">${f.r.semanas.map((sem,k)=>{const t=tipoTurno(sem[(pd(`${y}-01-01`).getUTCDay()+6)%7]); return `<option value="${k}" ${k===actual?'selected':''}>Semana ${k+1}${t?` (el ${d1} 1 es ${t.cod})`:''}</option>`}).join('')}</select>${f.sem==null?'<div class="muted" style="font-size:12px">Según la fecha de la rotación</div>':''}</td>
      ${dias.map(s=>{ const c=codEnFecha(f.r,f.ini,s), t=tipoTurno(c); return `<td class="ene-c ${t&&t.libre?'lib':''}" style="${t?`--tc:${t.color}`:''}" title="${fmt(s)}: ${t?esc(t.nombre):'trabajo'}">${t?esc(t.cod):''}</td>`; }).join('')}</tr>`; }).join('')}
    </table></div></div>`;
}

function crearRotacion(silencio){
  const r = {id:uid(), nombre:`Rotación ${rotacionesVis().length+1}`, depId:S.ctx.dep, prodId:S.ctx.prod, inicio:lunesDe(`${CIC()}-01-01`), semanas:[0,1,2].map(()=>Array(7).fill(''))};

function borrarRotacion(id){
  const r = rotDeId(id), ng = S.grupos.filter(g=>g.rotacionId===id).length, np = S.trabajadores.filter(t=>t.rotacionId===id).length;

function cambiarCodTurno(i, v){
  const nuevo = v.trim().toUpperCase().slice(0,3), viejo = S.turnosTipos[i].cod;
  if(!nuevo || S.turnosTipos.some((t,j)=>j!==i && t.cod===nuevo)) { toast('Ese código ya existe o está vacío'); return render(); }
  S.turnosTipos[i].cod = nuevo; S.rotaciones.forEach(r=>r.semanas.forEach(sem=>sem.forEach((c,k)=>{ if(c===viejo) sem[k]=nuevo; })));
  save(); render();
}
function añadirTipoTurno(){
  const c=document.getElementById('nTc').value.trim().toUpperCase().slice(0,3), n=document.getElementById('nTn').value.trim();
  if(!c || !n) return toast('Pon código y nombre'); if(tipoTurno(c)) return toast('Ese código ya existe');
  S.turnosTipos.push({cod:c, nombre:n, color:COLORES[S.turnosTipos.length%COLORES.length], libre:false}); save(); render(); toast('Tipo añadido');
}
function borrarTipoTurno(i){
  const c = S.turnosTipos[i].cod, usos = S.rotaciones.reduce((a,r)=>a+r.semanas.flat().filter(x=>x===c).length,0);
  if(!confirm(usos?`El turno ${c} se usa en ${usos} casilla(s). Se vaciarán. ¿Borrarlo?`:`¿Borrar el turno ${c}?`)) return;
  S.turnosTipos.splice(i,1); S.rotaciones.forEach(r=>r.semanas.forEach(sem=>sem.forEach((x,k)=>{ if(x===c) sem[k]=''; }))); save(); render();
}

function vTransformaciones(soloId){
  if(!trabsVis().length) return vacio(`Todavía no hay trabajadores en ${esc(ctxTxt())}.`, `<button class="btn primary" onclick="go('personal')">Ir a Personal</button>`);
  const T = UI.tf ||= {trab:'', fecha:'', mod:'', der:'', dc:'', nota:''};
  if(soloId && T.trab!==soloId){ T.trab = soloId; T.mod=''; T.fecha=''; }
  if(!T.trab || !trabDe(T.trab) || !visible(trabDe(T.trab))){ T.trab = ordenEleccion(gruposActivos()[0])[0].id; T.mod=''; }
  const w = trabDe(T.trab), ultima = transfDe(w.id).slice(-1)[0];
  if(!T.mod) { T.mod = w.modalidad; T.der = String(w.diasDerecho||''); T.dc = w.diasContratados||''; }
  let prev = '';
  if(T.fecha){
    if(ultima && T.fecha<=ultima.fecha) prev = `<div class="preview bad">Tiene otra transformación el ${fmt(ultima.fecha)} ${ultima.fecha.slice(0,4)}. La nueva tiene que ser posterior.</div>`;
    else {
      const y = Number(T.fecha.slice(0,4)), antes = derechoCiclo(w,y).n;
      const tmp = {id:'__tmp', trabajadorId:w.id, fecha:T.fecha, antes:estadoActual(w), despues:{modalidad:T.mod, diasDerecho:Number(T.der)||0, diasContratados:T.mod==='discontinuo'?T.dc:''}, creado:Date.now()};
      const guard = {modalidad:w.modalidad, diasDerecho:w.diasDerecho, diasContratados:w.diasContratados};
      S.transf.push(tmp); Object.assign(w, tmp.despues); const desp = derechoCiclo(w,y); S.transf.pop(); Object.assign(w, guard);
      prev = `<div class="preview ok"><div class="stats"><div><b>${antes}</b>días en ${y} antes</div><div><b>${desp.n}</b>días en ${y} después</div></div>
        <p>${nombreModalidad(w.modalidad)}, ${w.diasDerecho} días al año → ${nombreModalidad(T.mod)}, ${Number(T.der)||0} días al año, desde el ${fmtL(T.fecha)}.</p>
        ${desp.prorrateo?`<p class="muted">Prorrateo: ${desp.txt}</p>`:''}</div>`;
    }
  }
  const lista = S.transf.filter(t=>{const x=trabDe(t.trabajadorId); return x&&visible(x)&&(!soloId||x.id===soloId);}).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const puede = T.fecha && Number(T.der)>0 && !(ultima && T.fecha<=ultima.fecha);
  return `<div class="card"><h2>Registrar transformación</h2>
    <div class="row">
      ${soloId?'':`<label style="flex:1 1 220px">Trabajador<select onchange="UI.tf={trab:this.value,fecha:UI.tf.fecha,mod:'',der:'',dc:'',nota:''};render()">${trabOptions(w.id)}</select></label>`}
      <label style="flex:0 1 200px">Desde el día<input type="date" value="${T.fecha}" onchange="UI.tf.fecha=this.value;render()"></label>
    </div>
    <p class="muted" style="margin:10px 0 0">Ahora: ${nombreModalidad(w.modalidad)}, ${w.diasDerecho} días de vacaciones al año${ultima?`. Última transformación: ${fmt(ultima.fecha)} ${ultima.fecha.slice(0,4)}`:''}.</p>
    <div class="row" style="margin-top:12px">
      <label>Nueva modalidad<select onchange="UI.tf.mod=this.value;render()">${['completo','parcial','discontinuo'].map(m=>`<option value="${m}" ${T.mod===m?'selected':''}>${nombreModalidad(m)}</option>`).join('')}</select></label>
      <label>Días de vacaciones al año<input type="number" min="0" value="${esc(T.der)}" onchange="UI.tf.der=this.value;render()"></label>
      ${T.mod==='discontinuo'?`<label>Días trabajados al año <span style="font-weight:400">(opcional)</span><input type="number" min="1" max="366" value="${esc(T.dc)}" onchange="UI.tf.dc=this.value;render()"></label>`:''}
      <label style="flex-basis:100%">Nota (opcional)<input value="${esc(T.nota)}" placeholder="Paso a indefinido a jornada completa" onchange="UI.tf.nota=this.value"></label>
    </div>
    ${prev}
    <div class="row" style="margin-top:14px"><button class="btn primary" onclick="guardarTransf()" ${puede?'':'disabled'}>Registrar transformación</button></div>
    <p class="help" style="margin:12px 0 0">Al registrarla, la ficha del trabajador pasa a tener el contrato nuevo. Los días de vacaciones del año del cambio se prorratean: los días de cada contrato por la parte del año que dura.</p>
  </div>
  <div class="card"><h2>Historial (${lista.length})</h2>
    ${lista.length?`<div class="scroll"><table><tr><th>Fecha</th><th>Trabajador</th><th>Cambio</th><th class="num">Días ${CIC()}</th><th></th></tr>
      ${lista.map(t=>{const x=trabDe(t.trabajadorId), ult=transfDe(x.id).slice(-1)[0]?.id===t.id, y=Number(t.fecha.slice(0,4));
        return `<tr><td style="white-space:nowrap">${fmt(t.fecha)} ${y}</td><td><b>${esc(x.nombre)}</b>${t.nota?`<div class="muted">${esc(t.nota)}</div>`:''}</td>
        <td>${nombreModalidad(t.antes.modalidad)}, ${t.antes.diasDerecho} d → ${nombreModalidad(t.despues.modalidad)}, ${t.despues.diasDerecho} d</td>
        <td class="num">${derechoCiclo(x).n}</td>
        <td class="num">${ult?`<button class="btn small danger" onclick="borrarTransf('${t.id}')">Deshacer</button>`:''}</td></tr>`}).join('')}</table></div>
      <p class="help" style="margin:10px 0 0">Solo se puede deshacer la última transformación de cada persona: su ficha vuelve al contrato anterior.</p>`
      :'<p class="help">Todavía no hay cambios de contrato.</p>'}
  </div>`;
}
function guardarTransf(){
  const T = UI.tf, w = trabDe(T.trab); if(!w || !T.fecha) return;
  const ultima = transfDe(w.id).slice(-1)[0];
  if(ultima && T.fecha<=ultima.fecha) return toast('Tiene que ser posterior a su última transformación');
  const despues = {modalidad:T.mod, diasDerecho:Number(T.der)||0, diasContratados:T.mod==='discontinuo'?T.dc:''};
  S.transf.push({id:uid(), trabajadorId:w.id, fecha:T.fecha, antes:estadoActual(w), despues, nota:T.nota||'', creado:Date.now()});
  Object.assign(w, despues);
  UI.tf = {trab:w.id, fecha:'', mod:'', der:'', dc:'', nota:''}; save(); render();
  toast(`Registrada. ${w.nombre} tiene ${derechoCiclo(w).n} días en ${CIC()}`);
}
function borrarTransf(id){
  const t = S.transf.find(x=>x.id===id); if(!t) return; const w = trabDe(t.trabajadorId);
  if(transfDe(w.id).slice(-1)[0]?.id!==id) return toast('Solo se puede deshacer la última');
  if(!confirm(`¿Deshacer el cambio de contrato de ${w.nombre} del ${fmt(t.fecha)}? Su ficha vuelve al contrato anterior.`)) return;
  Object.assign(w, t.antes); S.transf = S.transf.filter(x=>x.id!==id); UI.tf=null; save(); render(); toast('Transformación deshecha');
}

function ajustarHoja(){
  const h=document.getElementById('hoja'); if(!h) return;
  const wrap=h.parentElement; h.style.transform=''; wrap.style.height='';
  const disp=wrap.clientWidth-36, real=h.offsetWidth, k = Math.min(1, disp/real);
  h.style.transform=`scale(${k})`; h.style.marginLeft = k<1 ? '0' : ((disp-real)/2)+'px';
  wrap.style.height=(h.offsetHeight*k+36)+'px';
}
function informeHTML(P){
  const ks = gruposActivos().filter(k=>P.grupo==='all' || k===P.grupo);
  const y = CIC(), lenY = daysBetween(`${y}-01-01`,`${y+1}-01-01`);
  const pos = s => (daysBetween(`${y}-01-01`,s)/lenY*100);
  const dim = m => new Date(Date.UTC(y,m+1,0)).getUTCDate();
  let acc=0; const lineas=[]; for(let m=0;m<11;m++){ acc+=dim(m); lineas.push(acc/lenY*100); }
  const rejilla = `linear-gradient(to right, ${lineas.map(p=>`transparent calc(${p}% - .5px), #D9DDE3 calc(${p}% - .5px), #D9DDE3 calc(${p}% + .5px), transparent calc(${p}% + .5px)`).join(', ')})`;
  const ss = S.semanaSanta;
  const ssBand = (ss.desde && ss.hasta && delAnio(ss.desde,y)) ? `<span class="ss" style="left:${pos(ss.desde)}%;width:${(daysBetween(ss.desde,ss.hasta)+1)/lenY*100}%"></span>` : '';

    <div class="meta">${P.grupo==='all'?'Todos los grupos':esc(nombreGrupo(P.grupo))}<br>Generado el ${fmtL(hoy())}</div></div>`;
  if(!ks.length) return `<div class="inf">${cab}<p>No hay trabajadores en la selección.</p></div>`;
  const secciones = ks.map((k,i)=>{
    const orden = ordenEleccion(k);
    let html = `<h2><span class="barra"></span>${esc(nombreGrupo(k))} <small>${orden.length} personas</small></h2>`;
    if(P.cuadrante){
      html += `<div class="gantt" style="--nw:38mm;--rejilla:${rejilla}">
        <div class="meses">${MESES.map((n,m)=>`<div style="flex:${dim(m)}">${n.slice(0,3)}</div>`).join('')}</div>
        ${orden.map(t=>{const st=statsTrab(t);
          return `<div class="fila"><div class="nom">${esc(t.nombre)}</div><div class="pista">${ssBand}
            ${ceseDe(t).map(c=>{const d=c.desde<`${y}-01-01`?`${y}-01-01`:c.desde, h=c.hasta>`${y}-12-31`?`${y}-12-31`:c.hasta; return h<d?'':`<span class="ces" style="left:${pos(d)}%;width:${(daysBetween(d,h)+1)/lenY*100}%"></span>`}).join('')}
            ${st.periodos.map(p=>`<span class="per ${p.forzado?'forz':''}" style="left:${pos(p.desde)}%;width:${Math.max(.25,(daysBetween(p.desde,p.hasta)+1)/lenY*100)}%"></span>`).join('')}
            ${P.desprog?st.desprog.map(d=>`<span class="dp" style="left:calc(${pos(d.dia)}% - 1px)"></span>`).join(''):''}
          </div></div>`}).join('')}
        <div class="leyenda"><span><i style="background:var(--ctx)"></i>Vacaciones</span><span><i style="background:var(--bad)"></i>Guardadas sin cupo</span>${P.desprog?'<span><i style="background:var(--senal);border:1px solid #9A7A00"></i>Desprogramación</span>':''}<span><i style="background:repeating-linear-gradient(135deg,#B9BFC8 0 2px,#EEF0F3 2px 4px)"></i>Cese</span><span><i style="background:rgba(246,195,0,.3)"></i>Semana Santa</span></div>
      </div>`;
    }
    if(P.tabla){
      html += `<table><tr><th>#</th><th>Nombre</th><th>Skills</th><th>Periodos</th><th class="num">Días</th>${P.desprog?'<th>Desprogramaciones</th>':''}${P.puntos?'<th class="num">Pts año ant.</th><th class="num">Pts ciclo</th>':''}${P.firma?'<th>Conforme</th>':''}</tr>
        ${orden.map((t,j)=>{const st=statsTrab(t);
          return `<tr><td>${j+1}</td><td><b>${esc(t.nombre)}</b></td><td>${esc(skillsTxt(t))}</td>
          <td>${st.periodos.map(p=>`${fmt(p.desde)} – ${fmt(p.hasta)}${p.forzado?' *':''}`).join('<br>')||'—'}</td>
          <td class="num">${st.dias}/${st.derecho}</td>
          ${P.desprog?`<td>${st.desprog.map(d=>fmt(d.dia)).join(', ')||'—'}</td>`:''}
          ${P.puntos?`<td class="num">${nf(t.ptsAnt||0)}</td><td class="num"><b>${nf(st.pts)}</b></td>`:''}
          ${P.firma?'<td><div class="firma"></div></td>':''}</tr>`}).join('')}
      </table>`;
    }
    return `<section class="${i>0?'salto':''}">${html}</section>`;
  }).join('');
  const notas = [
    P.puntos ? (S.ajustes.ponderar ? `Puntos ponderados a ${baseDe({depId:S.ctx.dep})} días.` : 'Puntos sin ponderar.') : '',
    P.tabla && S.periodos.some(p=>p.forzado) ? '* Periodo guardado por encima del cupo.' : '',

  ].filter(Boolean).join(' ');
  return `<div class="inf">${cab}${secciones}<div class="pie-inf">${notas}</div></div>`;
}
function imprimir(){
  const P = UI.pdf;
  imprimirHTML(informeHTML(P), P.orient, `Vacaciones ${CIC()} - ${nombreDep(S.ctx.dep)} - ${nombreProd(S.ctx.prod)}${P.grupo!=='all'?' - '+nombreGrupo(P.grupo):''}`);
}
function restaurar(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.trabajadores||!d.tramos) throw 0; if(!confirm('Esto sustituye todos los datos actuales. ¿Continuar?')) return; S=normalizar(d); save(); go('inicio'); toast('Copia restaurada'); }catch(e){ toast('Ese archivo no es una copia de esta app'); } };
  r.readAsText(f);
}

let avisoActualizacion = false;
const cmpVer = (a,b) => { const pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number);
  for(let i=0;i<3;i++){ const d=(pa[i]||0)-(pb[i]||0); if(d) return d; } return 0; };
const esMasNueva = (a,b) => cmpVer(a,b) > 0;

function bloquear(html){
  let d = document.getElementById('bloqueo');
  if(!d){ d=document.createElement('div'); d.id='bloqueo'; d.className='nuevo'; d.setAttribute('role','alertdialog'); d.setAttribute('aria-modal','true'); document.body.appendChild(d); setTimeout(()=>d.classList.remove('nuevo'),400); }
  d.innerHTML = html;
  document.body.classList.add('bloqueada');
  document.querySelectorAll('header.app, nav.pasos, main, #toast').forEach(e=>e.setAttribute('inert',''));
  d.onkeydown = e => {
    if(e.key==='Escape'){ e.preventDefault(); return; }
    if(e.key!=='Tab') return;
    const f=[...d.querySelectorAll('button:not([disabled])')]; if(!f.length) return;
    const i=f.indexOf(document.activeElement); e.preventDefault();
    f[(i + (e.shiftKey?-1:1) + f.length) % f.length].focus();
  };
  return d;
}
function desbloquear(){
  document.getElementById('bloqueo')?.remove();
  document.body.classList.remove('bloqueada');
  document.querySelectorAll('[inert]').forEach(e=>e.removeAttribute('inert'));
}
async function comprobarVersion(){
  if(avisoActualizacion || !/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const v = await r.json();
    if(v && v.version && esMasNueva(v.version, APP_VERSION)) mostrarActualizacion(v);
  }catch(e){ /* sin conexión: se vuelve a intentar más tarde */ }
}
function mostrarActualizacion(v){
  avisoActualizacion = true;
  const nov = Array.isArray(v.novedades) ? v.novedades : [];
  const d = bloquear(`<div class="act-caja">
    <div class="act-cab"><span class="flecha" aria-hidden="true">↻</span><div class="tit"><div class="ctx">Versión ${esc(v.version)}</div><h2 id="bTit">Hay una versión nueva</h2></div></div>
    <div class="act-cuerpo"><p>Actualiza para seguir usando la app. Tus datos se quedan como están.</p>
      ${nov.length?`<h3>Qué trae</h3><ul>${nov.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}
      <button class="btn primary act-btn" id="actBtn">Actualizar ahora</button>
      <div class="act-pie">Tienes la versión ${APP_VERSION}</div></div></div>`);
  d.setAttribute('aria-labelledby','bTit');
  const b = d.querySelector('#actBtn');
  b.addEventListener('click', ()=>{ b.disabled=true; b.textContent='Actualizando…'; save();
    location.replace(location.pathname + '?v=' + encodeURIComponent(v.version) + '&t=' + Date.now()); });
  b.focus();
}
function novedadesPendientes(){
  const vista = S.versionVista || '0';
  return Object.keys(NOVEDADES).filter(v=>esMasNueva(v,vista) && !esMasNueva(v,APP_VERSION)).sort(cmpVer)
    .flatMap(v=>NOVEDADES[v].map(n=>({...n, version:v})));
}
function mostrarRecorrido(items, i){
  if(avisoActualizacion) return;
  const n = items[i], ultimo = i===items.length-1;
  const d = bloquear(`<div class="act-caja">
    <div class="act-cab"><span class="flecha" aria-hidden="true">${i+1}</span><div class="tit"><div class="ctx">Versión ${esc(n.version)}, novedad ${i+1} de ${items.length}</div><h2 id="bTit">Lo que ha cambiado</h2></div></div>
    <div class="rec-cuerpo">
      <h3>${esc(n.titulo)}</h3>
      <p>${esc(n.texto)}</p>
      ${n.donde?`<span class="rec-donde">Dónde: ${esc(n.donde)}</span>`:''}
      <div class="rec-puntos" aria-hidden="true">${items.map((_,j)=>`<i class="${j===i?'on':j<i?'hecho':''}"></i>`).join('')}</div>
      <div class="rec-nav">${i>0?'<button class="btn" id="recAnt">‹ Anterior</button>':''}
        <button class="btn primary" id="recSig">${ultimo?'Entendido, empezar':'Siguiente ›'}</button></div>
    </div></div>`);
  d.setAttribute('aria-labelledby','bTit');
  d.querySelector('#recAnt')?.addEventListener('click', ()=>mostrarRecorrido(items, i-1));
  d.querySelector('#recSig').addEventListener('click', ()=>{
    if(!ultimo) return mostrarRecorrido(items, i+1);
    S.versionVista = APP_VERSION; save(); desbloquear(); toast(`Ya estás en la versión ${APP_VERSION}`);
  });
  d.querySelector('#recSig').focus();
}
function iniciarActualizaciones(){
  if(/[?&]v=/.test(location.search)) history.replaceState(null,'',location.pathname+location.hash);
  const conDatos = S.trabajadores.length || S.periodos.length || S.grupos.length;
  if(!conDatos && !S.versionVista){ S.versionVista = APP_VERSION; save(); }
  const pend = novedadesPendientes();
  if(pend.length) mostrarRecorrido(pend, 0);
  else if(!S.versionVista || esMasNueva(APP_VERSION, S.versionVista)){ S.versionVista = APP_VERSION; save(); }
  comprobarVersion();
  setInterval(comprobarVersion, 60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) comprobarVersion(); });
  window.addEventListener('focus', comprobarVersion);
  window.addEventListener('online', comprobarVersion);
}
iniciarActualizaciones();
