<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22262E">
<title>Control Planning</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Control Planning">
<meta name="application-name" content="Control Planning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="pageStyle">@page{size:A4 landscape;margin:12mm}</style>
<style>
/* Identidad: señalética de aeropuerto.
   Asfalto y hormigón de plataforma como base; amarillo de cartel para lo que pide acción ahora;
   los departamentos son carteles de ubicación (amarillo sobre negro); cada producto lleva su color.
   Barlow (rótulos de carretera) en versión condensada para titulares y cifras. */
:root{
  --asfalto:#22262E; --hormigon:#ECEEF1; --papel:#FFFFFF; --linea:#D9DDE3; --gris:#5F6775;
  --senal:#F6C300; --senal-soft:#FFF6D1;
  --pista:#1F5FBF; --pista-soft:#E6EEFA;
  --ok:#23864F; --ok-soft:#E2F2E8; --warn:#B86E00; --warn-soft:#FFF1D2; --bad:#C23B30; --bad-soft:#FBE4E1;
  --ctx:#1F5FBF;   /* color del producto en el que se trabaja */
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--text);background:var(--hormigon);color:var(--asfalto);font-size:15px;line-height:1.5;overflow-x:hidden}
:focus-visible{outline:3px solid var(--senal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* cabecera */
header.app{background:var(--asfalto);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;height:58px;position:sticky;top:0;z-index:6}
.marca{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;padding:0;font:inherit}
.logo{width:34px;height:34px;border-radius:7px;background:var(--senal);color:var(--asfalto);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.marca h1{font-family:var(--cond);font-weight:700;font-size:23px;margin:0;white-space:nowrap}
.migas{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.miga{border:0;font:inherit;font-weight:700;font-family:var(--cond);font-size:18px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;background:#363B45;color:var(--senal)}
.miga.prod{background:var(--ctx);color:#fff}
.migas .sep-m{color:#6B7280}
.ciclo{font-family:var(--cond);font-size:15px;color:#B8BEC9;white-space:nowrap}
.ciclo b{color:var(--senal);font-size:22px;font-weight:700;margin-left:4px}
.engranaje{background:#363B45;border:1px solid #4A505C;color:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;flex:0 0 auto}
.engranaje.on{background:var(--senal);color:var(--asfalto);border-color:var(--senal)}

/* pasos */
nav.pasos{display:flex;gap:4px;overflow-x:auto;background:var(--papel);border-bottom:1px solid var(--linea);padding:9px 12px;position:sticky;top:58px;z-index:5;scrollbar-width:none;box-shadow:inset 0 3px 0 var(--ctx)}
nav.pasos::-webkit-scrollbar{display:none}
nav.pasos:empty{display:none}
.step{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px 6px 6px;border-radius:8px;font:inherit;font-size:14px;font-weight:500;color:var(--gris);white-space:nowrap;cursor:pointer}
.step:hover{background:var(--hormigon)}
.step .num{width:24px;height:24px;border-radius:5px;background:var(--hormigon);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--gris)}
.step.done .num{background:var(--ok);color:#fff}
.step.on{background:var(--senal);color:var(--asfalto);font-weight:700}
.step.on .num{background:var(--asfalto);color:var(--senal)}
.step.extra{padding-left:12px}
.sep{width:1px;background:var(--linea);margin:4px 6px;flex:0 0 1px}

main{max-width:1760px;margin:0 auto;padding:24px clamp(18px,2.5vw,40px) 8px}
.intro{margin:0 0 20px;max-width:80ch}
.intro .k{font-size:14px;font-weight:600;color:var(--gris)}
.intro h2{font-family:var(--cond);font-size:38px;line-height:1.05;font-weight:700;margin:2px 0 8px;letter-spacing:-.005em}
.intro p{margin:0;color:var(--gris)}

/* portada: departamentos y productos */
.portada{margin:18px 0 24px}
.portada .k{font-size:15px;font-weight:600;color:var(--gris);margin:0 0 4px}
.portada h2{font-family:var(--cond);font-size:46px;line-height:1.02;font-weight:700;margin:0;max-width:16ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:22px}
.tile{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;text-align:left;border:0;border-radius:14px;padding:22px;cursor:pointer;font:inherit;background:var(--asfalto);color:#fff;min-height:132px;transition:transform .12s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(34,38,46,.7)}
.tile{transition:transform .2s ease,box-shadow .2s ease}
.tile .ini{width:58px;height:58px;border-radius:9px;background:var(--senal);color:var(--asfalto);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:34px}
.tile .nom{font-family:var(--cond);font-weight:700;font-size:40px;line-height:1;display:block;color:var(--senal)}
.tile .dato{display:block;color:#B8BEC9;font-size:14px;margin-top:6px}
.tile .fl{color:var(--senal);line-height:1}
.tile.prod{background:var(--c);min-height:170px}
.tile.prod .nom{color:#fff;font-size:46px}
.tile.prod .dato{color:rgba(255,255,255,.85)}
.tile.prod .fl{color:#fff}
.tile.prod .ini{background:rgba(255,255,255,.18);color:#fff}
/* ---- menú del producto ---- */
.resumen-p{margin:8px 0 0;color:var(--gris);font-size:15px}
.asig{background:var(--senal);color:var(--asfalto);border-radius:16px;padding:18px 20px 16px;margin-bottom:28px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.asig-cab{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.asig-ic{width:52px;height:52px;border-radius:12px;background:var(--asfalto);color:var(--senal);display:grid;place-items:center;flex:0 0 auto}
.asig-ic .ico{width:30px;height:30px;stroke-width:2.4}
.asig-cab>div{flex:1 1 220px}
.asig-t{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.05}
.asig-s{font-size:14px;font-weight:600;opacity:.8;margin-top:2px}
.asig-go .ico{width:18px;height:18px;transition:transform .2s}
.asig-go:hover .ico{transform:translateX(3px)}
.asig-pasos{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.asig-pasos button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.55);font:inherit;color:var(--asfalto);cursor:pointer;transition:background .15s,transform .15s}
.asig-pasos button:hover{background:#fff;transform:translateY(-1px)}
.asig-pasos button.sig{background:#fff;box-shadow:inset 0 0 0 2px var(--asfalto)}
.asig-pasos b{display:block;font-size:14px}
.asig-pasos small{display:block;font-size:12.5px;color:#4B5160}
.ap-n{width:28px;height:28px;border-radius:7px;background:var(--asfalto);color:var(--senal);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:16px;flex:0 0 auto}
.ap-n .ico{width:16px;height:16px;stroke-width:2.6}
.asig-pasos .ok .ap-n{background:var(--ok);color:#fff}
.mbloque{margin-bottom:22px}
.mbt{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--gris);margin:0 0 10px 2px}
.mtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.mtiles{grid-template-columns:repeat(2,minmax(0,1fr))} .grid-vac{grid-template-columns:1fr}}
.mtile{position:relative;display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:14px;padding:16px 18px;cursor:pointer;font:inherit;color:var(--asfalto);transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.mtile:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(34,38,46,.45);border-color:color-mix(in srgb,var(--ctx) 45%,var(--linea))}
.mtile .mi{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--ctx) 11%,#fff);color:var(--ctx);display:grid;place-items:center;flex:0 0 auto;transition:background .18s,color .18s}
.mtile:hover .mi{background:var(--ctx);color:#fff}
.mtile .mi .ico{width:25px;height:25px}
.mtile .mtx{flex:1;min-width:0}
.mtile .mt{display:block;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1;overflow-wrap:break-word}
.mtile .md{display:block;color:var(--gris);font-size:13.5px;margin-top:2px}
.mtile .mfl{color:var(--gris);opacity:0;transform:translateX(-6px);transition:opacity .18s,transform .18s}
.mtile:hover .mfl{opacity:1;transform:none;color:var(--ctx)}
.mtile .mfl .ico{width:20px;height:20px}
.ico{width:20px;height:20px;display:block}
.engranaje .ico{width:20px;height:20px;margin:auto;transition:transform .5s ease}
.engranaje:hover .ico{transform:rotate(60deg)}
.tile .fl .ico{width:34px;height:34px;stroke-width:2.2;transition:transform .2s}
.tile:hover .fl .ico{transform:translateX(4px)}

/* ---- globos del producto ---- */
.globos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.globo{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:28px;padding:26px 26px 24px;min-height:300px;cursor:pointer;font:inherit;color:var(--asfalto);transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.globo:hover{transform:translateY(-4px);box-shadow:0 18px 36px -22px rgba(34,38,46,.55);border-color:color-mix(in srgb,var(--ctx) 40%,var(--linea))}
.globo .gi{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ctx) 12%,#fff);color:var(--ctx);margin-bottom:6px;transition:background .2s,color .2s,transform .3s}
.globo .gi .ico{width:36px;height:36px}
.globo:hover .gi{background:var(--ctx);color:#fff;transform:scale(1.05)}
.globo .gt{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.globo .gp{color:var(--gris);font-size:15px;line-height:1.45;max-width:36ch}
.globo .gd{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:10px}
.globo .gd span{background:#F1F3F6;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.globo .gfl{position:absolute;top:26px;right:24px;color:var(--gris);transition:transform .2s,color .2s}
.globo .gfl .ico{width:24px;height:24px}
.globo:hover .gfl{transform:translateX(4px);color:var(--ctx)}
.globo.principal{background:var(--senal);border-color:var(--senal)}
.globo.principal .gi{background:var(--asfalto);color:var(--senal)}
.globo.principal:hover .gi{background:var(--asfalto);color:var(--senal)}
.globo.principal .gp{color:#3B3F48}
.globo.principal .gd span{background:rgba(255,255,255,.6)}
.globo.principal .gfl,.globo.principal:hover .gfl{color:var(--asfalto)}
/* ---- fichas y pestañas ---- */
.per-cab{padding-bottom:0}
.per-nom{font-size:30px;margin:0;overflow-wrap:anywhere}
.per-mini{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:16px;font-size:13px;color:var(--gris)}
.per-mini b{display:block;font-family:var(--cond);font-size:22px;color:var(--asfalto);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;font:inherit;font-weight:600;font-size:15px;color:var(--gris);padding:12px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--asfalto)}
.tabs button.on{color:var(--asfalto);border-bottom-color:var(--ctx)}
.tabs-sueltas{margin:0 0 16px;border-bottom:1px solid var(--linea)}
.tabs .tn{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:#E6E9EE;font-size:12px;margin-left:4px;color:var(--asfalto)}
.plegable summary{cursor:pointer;list-style:none} .plegable summary::-webkit-details-marker{display:none}
.plegable summary h2{display:inline;margin:0} .plegable summary::after{content:'＋';float:right;color:var(--gris)} .plegable[open] summary::after{content:'－'}
.plegable[open] summary{margin-bottom:12px}
/* ---- vacaciones ---- */
.vac-barra{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.vac-sel{flex:1 1 260px;max-width:420px}
.vac-acc{display:flex;flex-wrap:wrap;gap:8px}
.btn .ico{width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:2px}
.grid-vac{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.lista-per{list-style:none;margin:0;padding:0}
.lista-per li{padding:8px 0;border-bottom:1px solid var(--linea);display:flex;flex-direction:column}
.fd.dp{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}

/* ---- vacaciones: entrada, consultar y editar ---- */
.vbotones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.vboton{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1px solid var(--linea);background:var(--papel);border-radius:22px;padding:22px 24px;cursor:pointer;font:inherit;color:var(--asfalto);transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.vboton:hover{transform:translateY(-3px);box-shadow:0 16px 32px -22px rgba(34,38,46,.55);border-color:color-mix(in srgb,var(--ctx) 40%,var(--linea))}
.vboton .gi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ctx) 12%,#fff);color:var(--ctx);transition:background .2s,color .2s}
.vboton .gi .ico{width:28px;height:28px}
.vboton:hover .gi{background:var(--ctx);color:#fff}
.vb-t{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.05}
.vb-d{color:var(--gris);font-size:14.5px;max-width:44ch}
.vboton .gfl{position:absolute;top:22px;right:22px;color:var(--gris);transition:transform .2s,color .2s}
.vboton .gfl .ico{width:22px;height:22px}
.vboton:hover .gfl{transform:translateX(4px);color:var(--ctx)}
.asig-linea{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--senal);border-radius:14px;padding:12px 16px;font-size:14.5px}
.vac-modos{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vac-modos .volver{margin:0}
.vm-t{font-size:28px;margin:0}
.vac-modos>div{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.cons-barra{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.cons-barra .esp{flex:1}
.cons-barra{padding:10px 16px!important;margin-bottom:10px} .cons-barra input,.cons-barra select{padding-top:7px;padding-bottom:7px} .cons-mes button{padding:6px 7px;font-size:12.5px} .cons-acc{display:flex;gap:6px;align-self:flex-end}
.cg-card .ley-dias{margin-top:8px;padding:8px 14px;gap:6px 26px;font-size:clamp(13px, 1.9vh, 24px)} .cg-card .ley-dias .li b{height:clamp(18px, 2.9vh, 36px);min-width:clamp(22px, 3.4vh, 44px);font-size:clamp(11px, 1.5vh, 18px)} .cg-card .ley-ayuda{font-size:.8em}
.cons-mes{display:flex;flex-wrap:wrap;gap:2px;align-self:flex-end}
.cons-mes button{border:1px solid var(--linea);background:#fff;border-radius:7px;padding:7px 8px;font:inherit;font-size:13px;font-weight:600;text-transform:capitalize;cursor:pointer}
.cons-mes button:hover{border-color:var(--asfalto)}
.cg-card{padding:12px}
.cg-scroll{overflow:auto;max-height:72vh;border:1px solid var(--linea);border-radius:10px;background:#fff}
table.cg{border-collapse:separate;border-spacing:0;width:max-content;font-size:12px}
.cg th,.cg td{padding:0;border-bottom:1px solid #E3E6EB;border-right:1px solid #E3E6EB}
.cg thead th{position:sticky;background:#fff;z-index:2}
.cg thead tr:first-child th{top:0;height:26px}
.cg thead tr:nth-child(2) th{top:26px}
.cg-mes{font-family:var(--cond);font-size:15px;text-align:left;padding-left:8px!important;border-left:2px solid var(--asfalto)}
.cg-d{width:28px;min-width:28px;height:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;color:var(--asfalto);line-height:1.1}
.cg-d small{display:block;font-weight:500;color:var(--gris);font-size:10px}
.cg-d.fs{background:#F3F4F7!important} .cg-d.ss{background:var(--senal-soft)!important} .cg-d.hoy{box-shadow:inset 0 -3px 0 var(--bad)}
.cg .ini{border-left:2px solid var(--asfalto)}
.cg-nom{position:sticky;left:0;z-index:3;background:#fff;text-align:left;min-width:190px;max-width:190px;border-right:2px solid var(--linea)!important}
.cg thead .cg-nom{z-index:4;font-family:var(--cond);font-size:14px;color:var(--gris);padding-left:10px!important;vertical-align:bottom;padding-bottom:6px!important}
.cg-nom button{all:unset;display:block;box-sizing:border-box;width:100%;padding:0 10px;height:30px;line-height:30px;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cg-nom button:hover{color:var(--ctx);text-decoration:underline}
.cg tbody td{cursor:pointer;height:30px;text-align:center;font-weight:700;font-size:11px}
.cg-grp th,.cg-grp td{background:var(--hormigon)!important;height:26px}
.cg-grp th{font-family:var(--cond);font-size:14px;padding-left:10px!important;color:var(--gris)}
.ed-cab{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;padding-top:14px;padding-bottom:14px}
.eg-card{padding:10px 14px} .ley-ayuda{margin-left:auto;font-weight:500;color:var(--gris)}
body.ancho main{padding-top:14px}
.ed-cab{padding:clamp(12px,1.6vh,22px) 20px!important;margin-bottom:12px;align-items:center!important;border-width:2px;transition:background .2s,border-color .2s}
.ed-cab .per-mini b{font-size:clamp(20px, 2.6vh, 32px)} .ed-cab .per-mini{font-size:clamp(12.5px, 1.4vh, 16px);gap:6px 28px}
.ed-cab label{font-size:clamp(13px, 1.4vh, 16px)} .ed-cab select{font-size:clamp(15px, 1.7vh, 20px);padding:10px 12px;font-weight:600}
.ed-sel{flex:0 1 380px!important}
.ed-cab.ok{background:#E3F3E9;border-color:#23864F} .ed-cab.falta{background:#FBE7E5;border-color:#C23B30}
.ed-estado{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:clamp(13px, 1.5vh, 17px);color:#fff;white-space:nowrap}
.ed-estado .ico{width:18px;height:18px;stroke-width:2.6}
.ed-cab.ok .ed-estado{background:#23864F} .ed-cab.falta .ed-estado{background:#C23B30}
.ed-cab .btn{background:#fff}
.vac-modos{margin-bottom:8px} .vm-t{font-size:24px!important}
.eg-card .ley-dias{margin-top:8px;padding:calc(var(--egh,40px) * .2) 14px;gap:6px 28px;font-size:clamp(13px, calc(var(--egh,40px) * .34), 26px)}
.eg-card .ley-dias .li{gap:calc(var(--egh,40px) * .18)}
.eg-card .ley-dias .li b{height:clamp(18px, calc(var(--egh,40px) * .56), 40px);min-width:clamp(22px, calc(var(--egh,40px) * .66), 48px);font-size:clamp(11px, calc(var(--egh,40px) * .28), 20px);border-radius:6px}
.eg-card .ley-ayuda{font-size:.8em}
.ed-sel{flex:0 1 320px}
.ed-acc{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.eg-scroll{overflow-x:auto}
table.eg{border-collapse:separate;border-spacing:2px;width:100%;min-width:900px;table-layout:fixed}
.eg thead th{font-size:11.5px;color:var(--gris);font-weight:600;text-align:center;padding:2px 0}
.eg-mes{width:88px;text-align:left!important;font-family:var(--cond);font-size:14.5px;color:var(--asfalto)!important;position:sticky;left:0;background:var(--papel);z-index:1;padding-right:6px!important}
.eg td{height:42px;border:1px solid #C9CED6;border-radius:5px;text-align:center;cursor:pointer;background:#fff;position:relative;transition:transform .1s,border-color .12s}
.eg td small{position:absolute;top:2px;left:3px;font-size:8.5px;color:var(--gris);font-weight:600}
.eg td b{font-size:12.5px}
.eg td:hover{border-color:var(--asfalto)} .eg td:active{transform:scale(.94)}
.eg td.sel{outline:3px solid var(--asfalto);outline-offset:1px;z-index:1}
.eg td.rsel{box-shadow:inset 0 0 0 3px var(--ctx)}
.eg td.eg-x{border:0;background:none;cursor:default}
.hoja-acc{position:absolute;z-index:30;max-height:min(70vh,520px);overflow:auto;background:var(--papel);border-radius:16px;box-shadow:0 22px 50px -18px rgba(0,0,0,.5),0 0 0 1px var(--linea);padding:16px 18px;transform-origin:var(--fx,50%) 0}
.hoja-acc.arriba{transform-origin:var(--fx,50%) 100%}
.hoja-acc.nueva{animation:pop .18s cubic-bezier(.2,.7,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.hoja-acc.fija{position:fixed;left:50%!important;top:auto!important;bottom:16px;transform:translateX(-50%);width:min(680px,calc(100vw - 24px))!important}
.eg td.arr{box-shadow:inset 0 0 0 3px var(--ctx);background:color-mix(in srgb,var(--ctx) 14%,#fff)}
.eg td.arr.pinta{filter:brightness(1.15)}
.eg{user-select:none}
.hoja-acc h3{margin:0;font-family:var(--cond);font-size:24px}
.hoja-acc label{flex:1 1 150px}
.aviso{margin:8px 0 0;padding:8px 12px;border-radius:8px;font-size:14px}
.aviso.bad{background:#FBE7E5;color:#8C2A20} .aviso.warn{background:#FFF4D6;color:#7A5600} .aviso.ok{background:#E3F3E9;color:#1E6B3E}
.acc-dia .btn{flex:0 1 auto}

/* ---- celdas de días (Consultar y Editar) ---- */
.cg tbody tr[data-w] td:hover{outline:2px solid var(--asfalto);outline-offset:-2px}
.vboton.principal{background:var(--senal);border-color:var(--senal)} .vboton.principal .gi{background:var(--asfalto);color:var(--senal)} .vboton.principal:hover .gi{background:var(--asfalto);color:var(--senal)} .vboton.principal .vb-d{color:#3B3F48} .vboton.principal .gfl,.vboton.principal:hover .gfl{color:var(--asfalto)}
.cg td.pinta,.eg td.pinta{background:var(--cc);color:var(--ct);border-color:var(--cc)}
.cg td.c-bj,.eg td.c-bj{background:repeating-linear-gradient(135deg,#F3C2BD 0 3px,#FBE7E5 3px 7px);color:#8C2A20}
.eg td.pinta small{color:var(--ct);opacity:.85}
/* fin de semana: celda gris y barra oscura arriba, también si tiene algo encima */
.cg td.fs:not(.pinta),.eg td.fs:not(.pinta){background:#DDE1E8}
.eg td.fs{box-shadow:inset 0 4px 0 #22262E}
.eg td.fs small{color:#22262E;font-weight:800}
.cg td.fs{box-shadow:inset 0 3px 0 #22262E}
/* Semana Santa: borde amarillo grueso */
.cg td.ss,.eg td.ss{box-shadow:inset 0 0 0 3px var(--senal)}
.cg td.ss:not(.pinta),.eg td.ss:not(.pinta){background:var(--senal-soft)}
.eg td.fs.ss,.cg td.fs.ss{box-shadow:inset 0 4px 0 #22262E,inset 0 0 0 3px var(--senal)}
.cg-d.ss{box-shadow:inset 0 -4px 0 var(--senal)}
.ley-dias .ley-fs::before{background:#DDE1E8;box-shadow:inset 0 3px 0 #22262E}
.ley-dias .ley-ss::before{background:var(--senal-soft);box-shadow:inset 0 0 0 2px var(--senal)}

/* ---- jornada ---- */
.jo-tabla td.num,.jo-tabla th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.jo-tabla tr.gfil td{background:#F3F4F7;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--gris)}
.jo-tabla tr.clic{cursor:pointer;transition:background .12s} .jo-tabla tr.clic:hover{background:color-mix(in srgb,var(--ctx) 7%,#fff)}
.jo-leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--linea);font-size:13.5px;color:var(--gris)}
.jo-leyenda b{color:var(--asfalto);font-size:16px;margin-right:5px;font-variant-numeric:tabular-nums}
.fd.mk{background:var(--mc);border-color:var(--mc);color:#fff;font-weight:700}
.fd.bj{background:repeating-linear-gradient(135deg,#F3C2BD 0 3px,#FBE7E5 3px 7px);color:#8C2A20}
.fd.sel{outline:2px solid var(--asfalto);outline-offset:1px}
.chip.bad-soft{background:#FBE7E5;color:#8C2A20}
.chip .x{border:0;background:none;color:inherit;font-size:16px;line-height:1;cursor:pointer;padding:0 0 0 6px}

/* ---- movimiento: una entrada escalonada al cambiar de pantalla y respuestas a lo que se toca ---- */
@keyframes subir{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes aparecer{from{opacity:0}to{opacity:1}}
main.entrando .anim{animation:subir .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
main.entrando>.intro,main.entrando>.card,main.entrando>.grid2,main.entrando>.dp-layout,main.entrando>.seg{animation:subir .32s cubic-bezier(.2,.7,.2,1) both}
main.entrando>.card:nth-of-type(2),main.entrando>.grid2{animation-delay:50ms}
main.entrando>.card:nth-of-type(3){animation-delay:90ms}
.btn{transition:background .15s,border-color .15s,box-shadow .15s,transform .08s}
.btn:active:not(:disabled){transform:scale(.97)}
.pill,.seg button,.step{transition:background .15s,color .15s,border-color .15s}
.dlg-fondo{animation:aparecer .15s ease-out}
.dlg{animation:subir .22s cubic-bezier(.2,.7,.2,1)}
.ed,.fd{transition:background .12s,border-color .12s,transform .1s}
.ed.libre:active{transform:scale(.92)}
.preview{animation:aparecer .2s ease-out}
.logo{transition:transform .3s}
.marca:hover .logo{transform:rotate(-12deg)}
.volver{background:none;border:0;font:inherit;font-weight:600;color:var(--pista);cursor:pointer;padding:0;margin-bottom:6px}

.card{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-family:var(--cond);font-size:23px;font-weight:600;margin:0 0 12px;line-height:1.15}
.card h3{font-family:var(--cond);font-size:18px;font-weight:600;margin:18px 0 6px}
.help{font-size:14px;color:var(--gris);margin:0 0 14px;max-width:72ch}
.muted{color:var(--gris);font-size:13px}

.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row>label{flex:1 1 160px}
label{display:block;font-size:13px;color:var(--gris);font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--linea);border-radius:8px;font:inherit;font-weight:400;background:#fff;color:var(--asfalto)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pista);box-shadow:0 0 0 3px var(--pista-soft)}
input[type=checkbox]{display:inline-block;width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;accent-color:var(--pista)}
.chk{flex:0 1 auto!important;min-width:0;font-weight:500;color:var(--asfalto);font-size:15px;padding:6px 0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);background:#fff;color:var(--asfalto);padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#B9C0CA}
.btn.primary{background:var(--pista);border-color:var(--pista);color:#fff}
.btn.primary:hover{background:#184FA1}
.btn.ink{background:var(--asfalto);border-color:var(--asfalto);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pie{display:flex;justify-content:space-between;gap:10px;margin:10px 0 28px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--linea);vertical-align:middle}
th{font-size:13px;color:var(--gris);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--hormigon);font-family:var(--cond);font-weight:600;font-size:16px;padding:7px}
.scroll{overflow-x:auto}

.chip{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12.5px;font-weight:600;background:var(--pista-soft);color:var(--pista);white-space:nowrap}
td .chip{white-space:normal}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.grey{background:var(--hormigon);color:var(--gris)}
.chip.mano{background:var(--senal-soft);color:#7A5B00}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:8px 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--asfalto)}
.pill.on{background:var(--asfalto);color:#fff;border-color:var(--asfalto)}
.pill.sug{border-style:dashed;font-weight:500}
.seg{display:inline-flex;background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-weight:600;padding:8px 14px;border-radius:7px;cursor:pointer;color:var(--gris);white-space:nowrap}
.seg button.on{background:var(--asfalto);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex:0 0 auto}

/* el cartel de turno */
.cartel{display:flex;align-items:stretch;background:var(--senal);color:var(--asfalto);border-radius:12px;overflow:hidden;margin-bottom:18px}
.cartel .flecha{background:var(--asfalto);color:var(--senal);display:grid;place-items:center;font-family:var(--cond);font-size:46px;font-weight:700;padding:0 18px;line-height:1}
.cartel .cuerpo{flex:1;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.cartel .txt{flex:1 1 220px}
.cartel .ctx{font-size:14px;font-weight:600}
.cartel .who{font-family:var(--cond);font-size:36px;font-weight:700;line-height:1.05}
.cartel .sub{font-size:14px}
.cartel .btn{border-color:var(--asfalto)}
.cartel.fin{background:var(--ok-soft)} .cartel.fin .flecha{background:var(--ok);color:#fff}

.preview{border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px;border-left:5px solid}
.preview p{margin:8px 0 0}
.preview.ok{background:var(--ok-soft);border-color:var(--ok)} .preview.bad{background:var(--bad-soft);border-color:var(--bad)} .preview.warn{background:var(--warn-soft);border-color:var(--warn)}
.stats{display:flex;flex-wrap:wrap;gap:22px}
.stats div{font-size:13px;color:var(--gris)}
.stats b{font-family:var(--cond);font-size:30px;font-weight:700;display:block;line-height:1.05;color:var(--asfalto)}
.preview .stats b{font-size:24px}

/* calendario mensual (cupos) */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:12px;color:var(--gris);text-align:center;font-weight:600;padding:4px 0}
.cal .d{min-height:66px;border-radius:7px;border:1px solid var(--linea);padding:5px 6px;font-size:12px;cursor:pointer;background:#fff;display:flex;flex-direction:column}
.cal .d:hover{border-color:var(--pista)}
.cal .d.empty{border:0;background:none;cursor:default}
.cal .d .n{font-family:var(--cond);font-weight:700;font-size:16px;line-height:1}
.cal .d .o{margin-top:auto;font-weight:700;font-family:var(--cond);font-size:15px}
.cal .d .p{font-size:10.5px;color:var(--gris)}
.cal .d.lv1{background:var(--ok-soft)} .cal .d.lv2{background:var(--warn-soft)} .cal .d.lv3{background:var(--bad-soft);border-color:#EBB3AD}
.cal .d.sel{outline:3px solid var(--pista);outline-offset:-1px}
.cal .d.ss .n::after{content:" SS";font-size:10px;color:var(--warn)} .cal .d.pu .n::after{content:" P";font-size:10px;color:var(--pista)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--gris);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* calendario anual */
.an-anio{display:flex;align-items:center;gap:6px}
.an-anio b{font-family:var(--cond);font-size:30px;line-height:1;min-width:64px;text-align:center}
.cese-fila{gap:6px!important}
.cese-fila input{flex:1 1 0;min-width:0}
.cese-fila .muted{flex:0 0 auto}

.rsems{display:flex;flex-direction:column;gap:14px}
.rsem{background:var(--hormigon);border-radius:12px;padding:12px}
.rsem-t{font-family:var(--cond);font-weight:700;font-size:20px;margin:0 0 8px 2px}
.rsem-d{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.rdia{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:104px;padding:8px 4px;border:1px solid var(--linea);border-top:6px solid var(--tc,var(--linea));border-radius:9px;background:#fff;font:inherit;cursor:pointer;color:var(--asfalto)}
.rdia:hover{border-color:var(--asfalto);border-top-color:var(--tc,var(--asfalto))}
.rdia .rd-n{font-size:12px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.03em}
.rdia .rd-c{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;color:var(--tc,#C3C8D0)}
.rdia .rd-t{font-size:12.5px;font-weight:600;color:var(--gris);text-align:center;line-height:1.1}
.rdia.lib{background:color-mix(in srgb,var(--tc) 10%,#fff)}
.rdia.vacio .rd-t{font-weight:500}
.dlg-fondo{position:fixed;inset:0;z-index:60;background:rgba(34,38,46,.55);display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h2{font-family:var(--cond);font-size:28px;margin:0 0 6px}
.dlg-ops{display:flex;flex-direction:column;gap:8px}
.dlg-op{display:flex;align-items:center;gap:14px;border:1px solid var(--linea);border-left:6px solid var(--tc,var(--linea));border-radius:9px;background:#fff;padding:10px 12px;font:inherit;cursor:pointer;text-align:left;color:var(--asfalto)}
.dlg-op:hover{border-color:var(--asfalto);border-left-color:var(--tc,var(--asfalto))}
.dlg-op.on{background:var(--senal-soft);border-color:var(--asfalto)}
.dlg-op b{font-family:var(--cond);font-size:26px;width:40px;text-align:center;color:var(--tc,var(--gris))}
.dlg-op small{color:var(--gris)}
.xchip{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:0 0 0 4px}
.ene{border-collapse:separate;border-spacing:2px;font-size:13px}
.ene th,.ene td{border:0;padding:0;text-align:center}
.ene .ene-n{text-align:left;padding-right:10px;min-width:130px;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1}
.ene .ene-s{min-width:190px;padding-right:10px;text-align:left}
.ene .ene-d{font-size:12px;font-weight:700;width:30px;min-width:30px;color:var(--asfalto)}
.ene .ene-d span{display:block;font-size:10px;color:var(--gris);font-weight:600}
.ene .ene-d.fs{color:var(--gris)}
.ene .ene-c{height:34px;border-radius:5px;border:1px solid var(--linea);border-top:3px solid var(--tc,var(--linea));font-family:var(--cond);font-weight:700;font-size:15px;color:var(--tc,var(--gris));background:#fff}
.ene .ene-c.lib{background:var(--tc);color:#fff;border-color:var(--tc)}
.gl{display:flex;flex-direction:column;max-height:420px;overflow:auto;border:1px solid var(--linea);border-radius:10px}
.gl-i{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--linea);font-weight:400;color:var(--asfalto);font-size:14.5px}
.gl-i:last-child{border-bottom:0}
label.gl-i{cursor:pointer} label.gl-i:hover{background:var(--hormigon)}
.fd.rc{border-top:3px solid var(--tc,var(--linea))}
.fd.rc.rlib{background:var(--tc);border-color:var(--tc);color:#fff;font-weight:700}
.sel-mini{margin:0;padding:6px 8px;font-size:13px;min-width:150px;width:auto}
.sel-mini+.sel-mini{margin-top:4px}
.chip.cat-sup{background:var(--asfalto);color:var(--senal)}
.chip.cat-ag{background:var(--hormigon);color:var(--gris)}
.cupo-cat{display:grid;grid-template-columns:auto 110px 110px 1fr;gap:10px 14px;align-items:end;background:var(--senal-soft);border-radius:10px;padding:12px 14px;margin:0 0 16px}
.cupo-cat .cc-t{font-family:var(--cond);font-weight:700;font-size:18px;align-self:center}
.cupo-cat input{margin-top:4px;font-weight:700}
.cupo-cat .cc-x{font-size:13.5px;color:var(--asfalto);align-self:center}
.dp-layout{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.dp-layout>*{min-width:0}
.dp-lista{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:12px}
.dpl-g{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--gris);margin:10px 4px 4px}
.dpl-i{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;font:inherit;font-weight:600;font-size:14px;padding:8px;border-radius:7px;cursor:pointer;text-align:left;color:var(--asfalto)}
.dpl-i:hover{background:var(--hormigon)}
.dpl-i.on{background:var(--asfalto);color:#fff}
.solo-movil{display:none}
.c-ok{color:var(--ok)!important} .c-bad{color:var(--bad)!important}
.fcal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px}
.fd{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:5px;font-size:12px;background:#fff;border:1px solid var(--linea);font-variant-numeric:tabular-nums}
.fd[role=button]{cursor:pointer} .fd[role=button]:hover{border-color:var(--asfalto)}
.fd.we{background:#F6F7F9} .fd.ss{background:var(--senal-soft)} .fd.lib{background:#EBEFF6}
.fd.vac{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.fd.dp{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.fd.ces{background:repeating-linear-gradient(135deg,#D3D7DE 0 3px,#EEF0F3 3px 7px);color:#8A919D}
.fd.sel{outline:3px solid var(--senal);outline-offset:1px}
.tc{position:absolute;left:2px;bottom:0;font-style:normal;font-size:8.5px;font-weight:800;line-height:1.2}
.selcal{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px 18px;user-select:none;-webkit-user-select:none}
.smes-t{font-family:var(--cond);font-weight:700;font-size:17px;margin-bottom:4px}
.sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.sdow{font-size:10.5px;color:var(--gris);text-align:center;font-weight:600}
.ed{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:5px;font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer;background:#fff;border:1px solid var(--linea)}
.ed.we{background:#F6F7F9}
.ed.ss{background:var(--senal-soft)}
.ed.lib{background:#EBEFF6}
.ed.pu{box-shadow:inset 0 -3px 0 var(--pista-soft)}
.ed.libre:hover{border-color:var(--asfalto)}
.ed.og::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--gris)}
.ed.casi{border-color:var(--warn)}
.ed.hoy{font-weight:800;text-decoration:underline}
.ed.propio{background:var(--ok);color:#fff;border-color:var(--ok);cursor:default}
.ed.rst{background:var(--tcr,#5E6B82);color:var(--tct,#fff);font-weight:700;cursor:not-allowed;border-color:transparent}
.ed.blk{background:repeating-linear-gradient(135deg,#D3D7DE 0 3px,#EEF0F3 3px 7px);color:#8A919D;cursor:not-allowed;border-color:#E1E4E9}

<script>
/* =========================================================
   Control Planning — app personal de vacaciones y jornada
   Reglas base: Convenio Menzies (BOE-A-2023-25956), arts. 32 y 33
   Datos guardados en el navegador (localStorage). Haz copias.
   ========================================================= */
const APP_VERSION = '9.1.4';   // súbela junto con version.json en cada publicación
const LS_KEY = 'vacaciones-agp-v1';
const SIN = '_'; // clave interna para «sin grupo»

/* ---------- fechas (UTC, sin sustos de horario de verano) ---------- */
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = pd(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((pd(b)-pd(a))/86400000);
function* eachDay(a,b){ for(let s=a; s<=b; s=addDays(s,1)) yield s; }
const hoy = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['L','M','X','J','V','S','D'];
const fmt = s => { if(!s) return ''; const d = pd(s); return `${d.getUTCDate()} ${MESES[d.getUTCMonth()].slice(0,3)}`; };
const fmtL = s => { if(!s) return ''; const d = pd(s); return `${d.getUTCDate()} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`; };
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return iso(new Date(Date.UTC(y,mo-1,da)));
}
const semanaSantaDefault = y => { const e = easter(y); return { desde: addDays(e,-7), hasta: e }; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round(n*100)/100;
const nf = n => (Math.round(n*100)/100).toLocaleString('es-ES');
const delAnio = (s,y) => !!s && s.startsWith(String(y));

/* ---------- estado ---------- */
const TRAMOS_CONVENIO = [
  {desde:'01-01',hasta:'01-07',pts:8, nombre:'Enero 1–7'},
  {desde:'01-08',hasta:'01-31',pts:0, nombre:'Enero 8–31'},
  {desde:'02-01',hasta:'02-29',pts:0, nombre:'Febrero'},
  {desde:'03-01',hasta:'03-31',pts:2, nombre:'Marzo'},
  {desde:'04-01',hasta:'04-30',pts:4, nombre:'Abril'},
  {desde:'05-01',hasta:'05-31',pts:5, nombre:'Mayo'},

function normalizar(d){ // también migra datos de versiones anteriores

  if(!d.ctx) d.ctx = {dep:'', prod:''};
  delete d.pasosOk;
  const prod0 = d.productos[0].id;
  d.grupos.forEach(g=>{ if(g.depId===undefined) g.depId=''; if(!g.prodId) g.prodId=prod0; });
  const gDep = w => (w.grupoId && d.grupos.find(g=>g.id===w.grupoId)?.depId) || w.depId || '';
  const gProd = w => (w.grupoId && d.grupos.find(g=>g.id===w.grupoId)?.prodId) || w.prodId || prod0;
  d.trabajadores.forEach(t=>{ if(t.grupoId===undefined) t.grupoId=''; if(t.depId===undefined) t.depId=''; if(!t.prodId) t.prodId=gProd(t); t.depId = gDep(t); });
  if(!d.skills){ // versión 3: los «tipos» eran globales; ahora cada departamento y producto tiene sus skills
    d.skills = [];
    const viejos = d.tipos || [], mapa = {};
    const skillPara = (tipoId, dep, prod) => {
      const k = tipoId+'|'+dep+'|'+prod; if(mapa[k]) return mapa[k];
      const t = viejos.find(x=>x.id===tipoId); if(!t) return null;
      const s = {id:uid(), nombre:t.nombre, color:t.color, depId:dep, prodId:prod}; d.skills.push(s); return mapa[k]=s.id;
    };
    d.trabajadores.forEach(w=>{ const ids = Array.isArray(w.tipos)?w.tipos:(w.tipoId?[w.tipoId]:[]); w.skills = ids.map(id=>skillPara(id,w.depId,w.prodId)).filter(Boolean); delete w.tipos; delete w.tipoId; });
    d.cupos.forEach(c=>{ const ids = c.tipos||[]; c.skills = c.depId ? ids.map(id=>skillPara(id,c.depId,c.prodId||prod0)).filter(Boolean) : []; delete c.tipos; });
    delete d.tipos;
  }
  d.trabajadores.forEach(t=>{ if(!Array.isArray(t.skills)) t.skills=[]; if(!Array.isArray(t.cese)) t.cese=[]; });
  d.rotaciones ||= []; d.transf ||= []; if(!Array.isArray(d.turnosTipos) || !d.turnosTipos.length) d.turnosTipos = TURNOS_DEF.map(t=>({...t}));
  if(d.turnosTipos.map(t=>t.cod).join()==='M,T,N,P,L'){ // tipos de la 5.0: el libre pasa a ser «R» y se añade festivo
    d.rotaciones.forEach(r=>r.semanas.forEach(sem=>sem.forEach((c,k)=>{ if(c==='L') sem[k]='R'; })));
    d.turnosTipos = TURNOS_DEF.map(t=>({...t}));

  d.trabajadores.forEach(t=>{ if(t.rotacionId===undefined) t.rotacionId=''; });
  d.skills.forEach(k=>{ if(k.super===undefined) k.super = /jefe|supervis/i.test(k.nombre); });
  d.grupos.forEach(g=>{ if(g.cupoAg===undefined) g.cupoAg=1; if(g.cupoSup===undefined) g.cupoSup=1; });
  d.cupos.forEach(c=>{ c.skills ||= []; if(c.grupoId===undefined) c.grupoId=''; if(c.depId===undefined) c.depId=''; if(c.prodId===undefined) c.prodId = c.depId ? prod0 : ''; });
  // 7.0: marcas por persona y día (AJ, X), bajas y jornada
  d.marcas ||= []; d.bajas ||= [];
  [{cod:'X',nombre:'Festivo de empresa',color:'#8E2A6B',libre:true},{cod:'AJ',nombre:'Ajuste de jornada',color:'#0E7A8A',libre:true}]
    .forEach(t=>{ if(!d.turnosTipos.some(x=>x.cod===t.cod)) d.turnosTipos.push({...t}); });
  d.turnosTipos.forEach(t=>{ if(t.cod==='F' && t.nombre==='Festivo') t.libre = true; });
  d.trabajadores.forEach(t=>{ if(t.jornadaModo===undefined) t.jornadaModo='horas'; if(t.jornadaValor===undefined) t.jornadaValor=''; });
  if(d.asigAnio !== d.ciclo+1){ d.turnos = {}; d.asigAnio = d.ciclo+1; }   // 9.0: la asignación es del año siguiente al ciclo
  if(!d.paleta9){ const nuevo = {R:['#23864F','#5E6B82'], F:['#C23B30','#F0A35E']};
    d.turnosTipos.forEach(t=>{ const n = nuevo[t.cod]; if(n && String(t.color).toUpperCase()===n[0]) t.color = n[1]; }); d.paleta9 = true; }

}
const factor = w => factorInfo(w).f;
/* El histórico se conserva: el ciclo activo solo mira sus propias fechas. */
const periodosDe = (id, y=CIC()) => S.periodos.filter(p=>p.trabajadorId===id && delAnio(p.desde,y)).sort((a,b)=>a.desde.localeCompare(b.desde));
const desprogDe = (id, y=CIC()) => S.desprog.filter(d=>d.trabajadorId===id && delAnio(d.dia,y)).sort((a,b)=>a.solicitud.localeCompare(b.solicitud) || a.creado-b.creado);
function statsTrab(w){
  const ps = periodosDe(w.id), dps = desprogDe(w.id);
  let diasPer=0, bruto=0, largo=false;
  ps.forEach(p=>{ const st=statsRango(p.desde,p.hasta,w); diasPer+=st.computables; bruto+=st.pts; if(st.naturales>=15) largo=true; });
  if(S.ajustes.desprogPuntua) dps.forEach(d=>{ if(diaVac(w,d.dia)) bruto+=ptsDia(d.dia); });
  const derecho = derechoCiclo(w).n, dias = diasPer + dps.length, pendientes = derecho - dias;
  const reservaPosible = Math.max(0, Number(S.ajustes.maxDesprog) - dps.length);
  const avisos = [];
  if(dias>derecho) avisos.push(`Se pasa ${dias-derecho} día(s) de su derecho`);
  if(ps.length>3) avisos.push(`${ps.length} periodos (el convenio fracciona en 3)`);
  if(ps.length && !largo) avisos.push('Ningún periodo llega a 15 días naturales');
  if(dps.length>Number(S.ajustes.maxDesprog)) avisos.push(`${dps.length} desprogramaciones (máx. ${S.ajustes.maxDesprog})`);
  if(ps.some(p=>solapaCese(w,p.desde,p.hasta))) avisos.push('Tiene vacaciones dentro de su periodo de cese');
  return { periodos:ps, desprog:dps, diasPer, dias, derecho, pendientes, reservaPosible, bruto, f:factor(w), pts:r2(bruto*factor(w)), avisos };
}
function ordenEleccion(k){
  return S.trabajadores.filter(t=>visible(t) && (k===undefined || gk(t)===k)).sort((a,b)=>
    (Number(a.ptsAnt)||0)-(Number(b.ptsAnt)||0) ||
    (Number(a.ptsAnt2)||0)-(Number(b.ptsAnt2)||0) ||
    (a.antig||'9999').localeCompare(b.antig||'9999') ||
    a.nombre.localeCompare(b.nombre,'es'));
}

/* ---------- jornada: horas del año de cada persona ----------
   Jornada garantizada en horas o en % de un tiempo completo (S.ajustes.jornadaBase, 1.700 h).
   x = días de trabajo previstos (sin bajas), b = días de baja que caen en días de trabajo.
   Con bajas, el cómputo se recalcula por regla de tres: h = jornada × (x − b) / x.
   La media diaria es jornada / x, y las horas hechas son los días trabajados hasta hoy por esa media. */
const bajasDe = (id, y=CIC()) => S.bajas.filter(b=>b.trabajadorId===id && b.desde<=`${y}-12-31` && b.hasta>=`${y}-01-01`).sort((a,b)=>a.desde.localeCompare(b.desde));
const enBaja = (w,s) => S.bajas.some(b=>b.trabajadorId===w.id && s>=b.desde && s<=b.hasta);
function jornadaAnual(w){
  const base = Number(S.ajustes.jornadaBase)||1700, v = w.jornadaValor;
  if(v!=='' && v!=null && !isNaN(Number(v))) return { h: w.jornadaModo==='pct' ? base*Number(v)/100 : Number(v), defecto:false };
  return w.modalidad==='completo' ? { h:base, defecto:true } : { h:null, defecto:false };
}
function jornadaInfo(w, y=CIC()){
  const c = {R:0, F:0, X:0, AJ:0, otros:0, H:0, baja:0, trabajo:0, hechos:0, cese:0};
  const vac = new Set();
  S.periodos.forEach(p=>{ if(p.trabajadorId===w.id) for(const d of eachDay(p.desde,p.hasta)) vac.add(d); });
  desprogDe(w.id,y).forEach(d=>vac.add(d.dia));
  const hoyS = hoy();
  for(const s of eachDay(`${y}-01-01`,`${y}-12-31`)){
    const t = turnoDia(w,s);
    if(enCese(w,s)) c.cese++;
    else if(t && t.libre) c[['R','F','X','AJ'].includes(t.cod)?t.cod:'otros']++;
    else if(vac.has(s)) c.H++;
    else if(enBaja(w,s)) c.baja++;
    else { c.trabajo++; if(s<=hoyS) c.hechos++; }
  }
  const x = c.trabajo + c.baja, j = jornadaAnual(w);
  const media = j.h!=null && x>0 ? j.h/x : null;
  const computo = j.h!=null ? (x>0 ? j.h*c.trabajo/x : j.h) : null;
  const hechas = media!=null ? media*c.hechos : null;
  return { ...c, x, dt:c.trabajo, jornada:j.h, defecto:j.defecto, computo, media, hechas, quedan: computo!=null ? computo-hechas : null, sinRot: !rotDe(w) };
}
const fh = n => n==null ? '—' : (Math.round(n*100)/100).toLocaleString('es-ES',{maximumFractionDigits:2,useGrouping:'always'});

/* ---------- cupos ---------- */
function ocupacion(excluirTrab){
  const occ = {};
  S.periodos.forEach(p=>{ if(p.trabajadorId===excluirTrab) return; const t=trabDe(p.trabajadorId); for(const s of eachDay(p.desde,p.hasta)) if(!esDescanso(t,s)) (occ[s] ||= []).push(p.trabajadorId); });
  return occ;
}
const reglaAplica = (c,w) => w && (!c.depId || c.depId===depDe(w)) && (!c.prodId || c.prodId===prodDe(w)) && (!c.grupoId || c.grupoId===w.grupoId) && (!c.skills.length || skillsDe(w).some(id=>c.skills.includes(id)));
const cupoVisible = c => (!c.depId || c.depId===S.ctx.dep) && (!c.prodId || c.prodId===S.ctx.prod);
const usadosCupo = (c, ids) => ids.filter(id=>reglaAplica(c,trabDe(id))).length;
function conflictosCupo(w, desde, hasta){
  const occ = ocupacion(w.id), res = [];
  for(const s of eachDay(desde,hasta)){
    if(esDescanso(w,s)) continue;
    S.cupos.forEach(c=>{
      if(!enRango(s,c) || !reglaAplica(c,w)) return;
      const u = usadosCupo(c, occ[s]||[]);
      if(u+1 > Number(c.max)) res.push({dia:s, cupo:c, usados:u});
    });
  }
  return res;
}
function cuposExcedidos(){
  const occ = ocupacion(null), dias = new Set();
  S.cupos.filter(cupoVisible).forEach(c=>{ for(const s of eachDay(c.desde,c.hasta)) if(usadosCupo(c,occ[s]||[])>c.max) dias.add(s); });
  return dias.size;
}
/* cupo del grupo por categoría: cuántos agentes y cuántos supers del mismo grupo pueden estar fuera a la vez */
const cupoGrupo = (w) => { const g = w.grupoId ? grupoDe(w.grupoId) : null; if(!g) return Infinity; return Number(esSuper(w) ? g.cupoSup : g.cupoAg); };
function companerosDia(w, s, excepto){ // de su grupo y su categoría que ese día están de vacaciones
  const k = gk(w), cat = catDe(w), out = [];
  S.periodos.forEach(p=>{ if(p.id===excepto || p.trabajadorId===w.id || s<p.desde || s>p.hasta) return; const t=trabDe(p.trabajadorId);
    if(t && t.grupoId && t.grupoId===w.grupoId && catDe(t)===cat && !esDescanso(t,s)) out.push(t); });
  return out;
}
function companerosEnFechas(w, desde, hasta, excepto){
  if(!S.ajustes.bloqueoGrupo || !w.grupoId) return [];
  const max = cupoGrupo(w), out = new Set();
  for(const s of eachDay(desde,hasta)){ if(esDescanso(w,s)) continue; const c = companerosDia(w,s,excepto); if(c.length+1 > max) c.forEach(t=>out.add(t.nombre)); }
  return [...out];
}
function quedanDias(w, excepto){ const st=statsTrab(w); let q=st.pendientes; if(excepto){ const p=S.periodos.find(x=>x.id===excepto); if(p && delAnio(p.desde,CIC())) q += statsRango(p.desde,p.hasta,w).computables; } return q; }
const excedeDias = (w,desde,hasta,excepto) => statsRango(desde,hasta,w).computables > quedanDias(w,excepto);
const solapePropio = (w,desde,hasta,excepto) => S.periodos.some(p=>p.id!==excepto && p.trabajadorId===w.id && !(hasta<p.desde || desde>p.hasta));
const ambitoCupo = c => [!c.depId ? 'Todos los departamentos' : '', c.grupoId ? 'Solo '+esc(nombreGrupo(c.grupoId)) : 'Toda la plantilla', c.skills.length ? c.skills.map(t=>esc(skillDe(t)?.nombre)).filter(Boolean).join(', ') : 'todas las skills'].filter(Boolean).join(', ');

/* ---------- desprogramaciones (art. 32) ---------- */
const maxDiaTurno = k => Math.floor(miembros(k).length * Number(S.ajustes.pctTurno) / 100);
function problemasDesprog(d){
  const w = trabDe(d.trabajadorId); if(!w) return [];
  const A = S.ajustes, out = [], y = d.dia.slice(0,4);
  const propias = desprogDe(w.id, y), idx = propias.findIndex(x=>x.id===d.id);
  if(idx >= Number(A.maxDesprog)) out.push({nivel:'bad', txt:`Pasa de ${A.maxDesprog} al año`});
  const ant = daysBetween(d.solicitud, d.dia);
  if(ant < Number(A.preaviso)) out.push({nivel:'bad', txt:`Preaviso de ${ant} día(s) (mín. ${A.preaviso})`});
  const k = gk(w), max = maxDiaTurno(k);
  const mismoDia = S.desprog.filter(x=>x.dia===d.dia && trabDe(x.trabajadorId) && gk(trabDe(x.trabajadorId))===k && visible(trabDe(x.trabajadorId))===visible(w))
    .sort((a,b)=>a.solicitud.localeCompare(b.solicitud) || a.creado-b.creado);
  const pos = mismoDia.findIndex(x=>x.id===d.id);
  if(pos >= max) out.push({nivel:'bad', txt: max===0 ? `En ${nombreGrupo(k)} (${miembros(k).length} pers.) el ${A.pctTurno} % no llega a 1` : `Fuera del ${A.pctTurno} % del turno (máx. ${max} ese día)`});
  if(S.periodos.some(p=>p.trabajadorId===w.id && enRango(d.dia,p))) out.push({nivel:'warn', txt:'Coincide con sus vacaciones'});
  if(propias.some(x=>x.id!==d.id && x.dia===d.dia)) out.push({nivel:'warn', txt:'Día repetido'});
  if(enCese(w,d.dia)) out.push({nivel:'bad', txt:'Cae en su periodo de cese'});
  if(esDescanso(w,d.dia)) out.push({nivel:'bad', txt:`Es ${turnoDia(w,d.dia).nombre.toLowerCase()} según su rotación`});
  if(!delAnio(d.dia,CIC())) out.push({nivel:'warn', txt:`Fuera del ciclo ${CIC()}`});
  return out;
}

/* ---------- turnos por grupo ---------- */
const tState = k => (S.turnos[tKey(k)] ||= {ronda:1, hechos:{}});
const hechosRonda = k => { const t=tState(k); return (t.hechos[t.ronda] ||= []); };
function turnoActual(k){ const h = hechosRonda(k); return ordenEleccion(k).find(w=>!h.includes(w.id)) || null; }
function grupoTerminado(k){ return !turnoActual(k) && tState(k).ronda >= Number(S.ajustes.rondas); }
function terminarTurno(k,id){
  const h = hechosRonda(k); if(!h.includes(id)) h.push(id);
  const t = tState(k);
  if(!turnoActual(k) && t.ronda < Number(S.ajustes.rondas)){ t.ronda++; toast(`${nombreGrupo(k)}: empieza la ronda ${t.ronda}`); }
  UI.trab = turnoActual(k)?.id || UI.trab; UI.desde=''; UI.hasta='';
  save(); render();
}
function deshacerTurno(k){
  const t = tState(k); let h = hechosRonda(k);
  if(!h.length && t.ronda>1){ t.ronda--; h = hechosRonda(k); }
  const id = h.pop(); if(id) UI.trab=id;
  save(); render();
}

function barraVac(modo){
  return modo==='consultar'
    ? `<div class="vac-modos"><div><button class="volver" onclick="UI.vacModo='';UI.ed=null;render()">‹ Vacaciones</button><h2 class="vm-t">Calendario ${CIC()}</h2></div></div>`
    : `<div class="vac-modos"><div><button class="volver" onclick="UI.vacModo='consultar';UI.ed=null;render()">‹ Calendario</button><h2 class="vm-t">Editar ${CIC()}</h2></div></div>`;
}
/* código y estilo de un día para una persona (consultar, editar y PDF usan lo mismo) */
const COD_DIA = e => e.k==='vac' ? 'H' : e.k==='dp' ? 'D' : e.k==='mk' ? e.cod : e.k==='lib' ? e.t.cod : e.k==='bj' ? 'B' : e.k==='ces' ? 'C' : '';
/* colores fijos por letra (fondo, texto): R y F de la rotación muy visibles, sin chocar con las vacaciones */
const PAL_DIA = {H:['#23864F','#FFFFFF'], D:['#C23B30','#FFFFFF'], R:['#5E6B82','#FFFFFF'], F:['#F0A35E','#22262E'], X:['#8E2A6B','#FFFFFF'], AJ:['#0E7A8A','#FFFFFF'], B:['#F6D3CF','#8C2A20'], C:['#D5D8DE','#5F6775']};
const COLOR_DIA = e => { const c = COD_DIA(e); if(!c) return ''; const p = PAL_DIA[c] || [e.t?.color||'#5F6775','#FFFFFF']; return `--cc:${p[0]};--ct:${p[1]}`; };
const claseDia = (e, s) => { const wd = pd(s).getUTCDay(); return [`c-${e.k||'t'}`, COD_DIA(e)?'pinta':'', (wd===0||wd===6)?'fs':'', esSS(s)?'ss':''].filter(Boolean).join(' '); };
function leyendaDias(ayuda=''){
  const m = (c,t) => `<span class="li"><b style="background:${PAL_DIA[c][0]};color:${PAL_DIA[c][1]}">${c}</b>${t}</span>`;
  return `<div class="ley-dias" aria-label="Leyenda">${m('H','Vacaciones')}${m('R','Descanso')}${m('F','Festivo')}${m('X','Festivo de empresa')}${m('AJ','Ajuste de jornada')}${m('D','Desprogramado')}
    <span class="li"><b class="lb-b">B</b>Baja</span><span class="li"><b class="lb-fs"></b>Fin de semana</span><span class="li"><b class="lb-ss"></b>Semana Santa</span>${ayuda?`<span class="ley-ayuda">${ayuda}</span>`:''}</div>`;
}

/* ---------- Consultar: todo el año en celdas, nombres fijos ---------- */

  const y = CIC(), C = UI.cons ||= {grupo:'all', buscar:''};
  if(C.grupo!=='all' && !gruposVis().some(g=>g.id===C.grupo)) C.grupo='all';

  dias.forEach(s=>{ const wd = pd(s).getUTCDay(); cabD += `<th class="cg-d ${wd===0||wd===6?'fs':''} ${s===hoyS?'hoy':''} ${s.endsWith('-01')?'ini':''} ${esSS(s)?'ss':''}"><small>${DOW[(wd+6)%7]}</small>${Number(s.slice(8))}</th>`; });

        return `<td class="${claseDia(e,s)} ${s.endsWith('-01')?'ini':''}"${col?` style="${col}"`:''}>${c}</td>`; }).join('')}</tr>`; }).join('');
  }).join('');
  return `<div class="card cons-barra">
      <label style="flex:0 1 190px">Grupo<select onchange="UI.cons.grupo=this.value;render()">${opts(gruposVis(), C.grupo, ['all','Todos los grupos'])}</select></label>
      <label style="flex:0 1 190px">Buscar<input value="${esc(C.buscar)}" placeholder="Nombre" oninput="UI.cons.buscar=this.value;clearTimeout(window._cb);window._cb=setTimeout(()=>{render();const i=document.querySelector('.cons-barra input');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},250)"></label>
      <div class="cons-mes" role="group" aria-label="Ir al mes">${MESES.map((m,i)=>`<button onclick="irMesCons(${i})">${m.slice(0,3)}</button>`).join('')}</div>
      <span class="esp"></span>
      <div class="cons-acc"><button class="btn small" onclick="descargarZIP()">${ico('descarga')} Fichas (ZIP)</button><button class="btn small" onclick="go('pdf')">Informe</button></div>
    </div>
    <div class="card cg-card"><div class="cg-scroll" id="cgScroll"><table class="cg" onclick="clicCons(event)"><thead><tr>${cabM}</tr><tr>${cabD}</tr></thead><tbody>${filas || `<tr><td class="muted" style="padding:14px">Nadie con ese nombre.</td></tr>`}</tbody></table></div>

function clicCons(ev){
  const td = ev.target.closest('td'), tr = td && td.parentElement; if(!td || !tr.dataset.w) return;
  const s = addDays(`${CIC()}-01-01`, td.cellIndex - 1);
  UI.vacModo='editar'; UI.edTrab=tr.dataset.w; UI.ed={dia:s, accion:''}; render();
}
function irMesCons(m){ const c = document.getElementById('cgScroll'), th = document.getElementById('cgm'+m), nom = c?.querySelector('.cg-esq'); if(c && th) c.scrollTo({left: th.offsetLeft - (nom?nom.offsetWidth:0), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
function colocarConsultar(){
  const c = document.getElementById('cgScroll'); if(!c) return;
  const nom = c.querySelector('.cg-esq')?.offsetWidth || 200, dias = innerWidth < 760 ? 9 : 56;   // unos dos meses a la vista
  c.style.setProperty('--cw', Math.max(28, Math.min(40, Math.floor((c.clientWidth - nom - 2) / dias))) + 'px');
  if(UI.cons._x != null && UI.cons._pintado){ c.scrollLeft = UI.cons._x; }
  else { const h = hoy(); const m = delAnio(h,CIC()) ? Number(h.slice(5,7))-1 : 0; const th = document.getElementById('cgm'+m), nom = c.querySelector('.cg-esq'); if(th) c.scrollLeft = th.offsetLeft - (nom?nom.offsetWidth:0); UI.cons._pintado = true; }
  c.onscroll = () => { UI.cons._x = c.scrollLeft; };
}

/* ---------- Editar: la hoja anual de un trabajador, como en el Excel ---------- */
function vEditar(){
  const ts = trabsVis(), y = CIC();
  if(!UI.edTrab || !trabDe(UI.edTrab) || !visible(trabDe(UI.edTrab))) UI.edTrab = [...ts].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'))[0].id;
  const w = trabDe(UI.edTrab), st = statsTrab(w), j = jornadaInfo(w), {vac, dps} = diasDe(w, y), E = UI.ed;
  const sel = `<select onchange="UI.edTrab=this.value;UI.ed=null;render()" aria-label="Trabajador">${gruposActivos().map(k=>{ const xs=ts.filter(t=>gk(t)===k).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')); return xs.length?`<optgroup label="${esc(nombreGrupo(k))}">${xs.map(t=>`<option value="${t.id}" ${t.id===w.id?'selected':''}>${esc(t.nombre)}</option>`).join('')}</optgroup>`:''; }).join('')}</select>`;
  // rango que se está eligiendo (vacaciones o baja)
  const enRangoSel = s => E && ['vac','baja','rango'].includes(E.accion) && E.desde && s>=E.desde && s<=(E.hasta||E.desde);
  let filas = '';
  for(let m=0;m<12;m++){
    const mm = String(m+1).padStart(2,'0'), dim = new Date(Date.UTC(y,m+1,0)).getUTCDate();
    let celdas = '';
    for(let d=1; d<=31; d++){
      if(d>dim){ celdas += '<td class="eg-x"></td>'; continue; }
      const s = `${y}-${mm}-${String(d).padStart(2,'0')}`, wd = pd(s).getUTCDay(), e = estadoDia(w,s,vac,dps), c = COD_DIA(e), col = COLOR_DIA(e);
      celdas += `<td class="${claseDia(e,s)} ${E&&E.dia===s?'sel':''} ${enRangoSel(s)?'rsel':''}"${col?` style="${col}"`:''} data-d="${s}" onclick="tocarDia('${s}')" role="button" tabindex="0" title="${esc(fmtL(s))}${esSS(s)?', Semana Santa':''}"><small>${DOW[(wd+6)%7]}</small><b>${c}</b></td>`;
    }
    filas += `<tr><th class="eg-mes">${MESES[m][0].toUpperCase()+MESES[m].slice(1)}</th>${celdas}</tr>`;
  }
  const completo = st.derecho>0 && st.pendientes<=0;
  return `<div class="card ed-cab ${completo?'ok':'falta'}">
      <label class="ed-sel">Trabajador${sel}</label>
      <span class="ed-estado">${completo?ico('ok')+' Vacaciones asignadas':`Le ${st.pendientes===1?'falta 1 día':`faltan ${st.pendientes} días`}`}</span>
      <div class="per-mini" style="margin:0">
        <span><b>${st.dias} / ${st.derecho}</b>días de vacaciones</span><span><b>${st.pendientes}</b>pendientes</span><span><b>${nf(st.pts)}</b>puntos</span>
        <span><b>${st.desprog.length} / ${S.ajustes.maxDesprog}</b>desprogramaciones</span><span><b>${j.AJ}</b>AJ</span><span><b>${j.X}</b>X</span><span><b>${j.baja}</b>días de baja</span>
      </div>
      <div class="ed-acc"><button class="btn" onclick="descargarPDFPersona('${w.id}')">${ico('descarga')} Descargar PDF</button><button class="btn" onclick="UI.perTrab='${w.id}';UI.perModo='ficha';UI.perTab='datos';UI.perNuevo=false;go('personal')">Su ficha</button></div>
    </div>
    <div class="card eg-card">
      <div class="eg-scroll" onscroll="colocarHoja()"><table class="eg" onpointerdown="arrIni(event)"><thead><tr><th class="eg-mes"></th>${Array.from({length:31},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead><tbody>${filas}</tbody></table></div>
      ${leyendaDias(E&&E.paso==='fin'?'<b>Ahora toca el último día.</b>':'Toca un día para ver qué hacer, o pincha y arrastra para elegir varios.')}</div>
    ${E ? hojaAcciones(w, E) : ''}`;
}
function tocarDia(s){
  const E = UI.ed;
  if(E && E.paso==='fin'){ // eligiendo el final de un rango
    if(s<E.desde){ E.desde = s; } else E.hasta = s;
    E.paso = 'form'; E.ancla = s; render(); return;
  }
  if(UI._arrastrado){ UI._arrastrado = false; return; }   // el clic que llega al soltar un arrastre
  UI.ed = {dia:s, accion:'', ancla:s}; render();
}
/* pinchar y arrastrar con el ratón para elegir varios días seguidos (en táctil se usa «Elegir el final en la hoja») */
function arrIni(ev){
  if(ev.pointerType!=='mouse' || ev.button!==0) return;
  const td = ev.target.closest('td[data-d]'); if(!td) return;
  ev.preventDefault();
  const A = {ini:td.dataset.d, fin:td.dataset.d}, celdas = [...document.querySelectorAll('.eg td[data-d]')];
  const pinta = () => { const a = A.ini<A.fin?A.ini:A.fin, b = A.ini<A.fin?A.fin:A.ini; celdas.forEach(c=>c.classList.toggle('arr', A.ini!==A.fin && c.dataset.d>=a && c.dataset.d<=b)); };
  const mover = e => { const c = document.elementFromPoint(e.clientX, e.clientY)?.closest('.eg td[data-d]'); if(c && c.dataset.d!==A.fin){ A.fin = c.dataset.d; pinta(); } };
  const soltar = () => {
    document.removeEventListener('pointermove', mover); document.removeEventListener('pointerup', soltar);
    if(A.ini===A.fin) return;   // un solo día: lo resuelve el clic normal
    UI._arrastrado = true; setTimeout(()=>{ UI._arrastrado = false; }, 0);
    const d = A.ini<A.fin?A.ini:A.fin, h = A.ini<A.fin?A.fin:A.ini;
    UI.ed = {dia:A.fin, accion:'rango', desde:d, hasta:h, ancla:A.fin}; render();
  };
  document.addEventListener('pointermove', mover); document.addEventListener('pointerup', soltar);
}
/* el menú del día sale flotando junto al último día tocado */
/* hoja anual y cuadro de consultar: que quepan en el alto de la ventana sin desplazar la página */
function ajustarAltos(){
  if(innerWidth < 760) return;   // en el móvil se desplaza con normalidad
  const main = document.getElementById('main');
  const libre = () => innerHeight - (main.getBoundingClientRect().bottom + scrollY);   // >0 sobra hueco, <0 se sale
  const egT = document.querySelector('.eg'), eg = egT && (egT.closest('.card') || egT), cg = document.getElementById('cgScroll');
  if(eg){   // filas que llenan justo el alto de la ventana
    let h = 36; eg.style.setProperty('--egh', h+'px');
    for(let k=0; k<6; k++){ const d = libre(); if(Math.abs(d) < 6) break; h = Math.max(26, Math.min(96, h + Math.floor(d/12))); eg.style.setProperty('--egh', h+'px'); if(h===26 && d<0) break; }
  }
  if(cg){ let h = 400; cg.style.setProperty('--cgh', h+'px');
    for(let k=0; k<4; k++){ const d = libre(); if(Math.abs(d) < 6) break; h = Math.max(280, h + Math.floor(d)); cg.style.setProperty('--cgh', h+'px'); if(h===280 && d<0) break; } }
}
function colocarHoja(){
  const h = document.querySelector('.hoja-acc'), E = UI.ed; if(!h || !E) return;
  const td = document.querySelector(`.eg td[data-d="${E.ancla||E.hasta||E.dia}"]`);
  if(!td){ h.classList.add('fija'); return; }
  h.classList.remove('fija');
  const r = td.getBoundingClientRect(), W = Math.min(560, innerWidth-24); h.style.width = W+'px';
  const alto = h.offsetHeight, op = h.offsetParent.getBoundingClientRect();
  let left = Math.max(12, Math.min(r.left + r.width/2 - W/2, innerWidth - W - 12));
  let top = r.bottom + 12, arriba = false;
  if(top + alto > innerHeight - 8 && r.top - alto - 12 > 8){ top = r.top - alto - 12; arriba = true; }
  h.style.left = (left - op.left)+'px'; h.style.top = (top - op.top)+'px';
  h.style.setProperty('--fx', Math.max(18, Math.min(W-18, r.left + r.width/2 - left))+'px');
  h.classList.toggle('arriba', arriba);
  if(top + alto > innerHeight) h.scrollIntoView({block:'nearest', behavior:'smooth'});
}
document.fonts && document.fonts.ready.then(()=>{ ajustarAltos(); colocarHoja(); });
window.addEventListener('load', ()=>{ ajustarAltos(); colocarHoja(); });
window.addEventListener('resize', ()=>{ ajustarAltos(); colocarHoja(); if(UI.vista==='vacaciones' && UI.vacModo==='consultar') colocarConsultar(); });

function hojaAcciones(w, E){

  } else if(E.accion==='vac'){

    if(solapaCese(w,d,h)) prob.push(['bad','Cae en su periodo de cese.']);
    if(excedeDias(w,d,h,E.edit)) prob.push(['bad',`No le quedan días suficientes: le quedan ${quedanDias(w,E.edit)}.`]);
    if(!st.computables) prob.push(['bad','Todos esos días son descanso o festivo.']);
    const cc = conflictosCupo(w,d,h), comp = companerosEnFechas(w,d,h,E.edit), conf = [...cc, ...comp];
    if(comp.length) prob.push(['warn', `Coincide con ${comp.join(', ')}, de su grupo, y el cupo de ${catDe(w)==='super'?'supers':'agentes'} es ${cupoGrupo(w)}.`]);
    if(cc.length){ const dias = [...new Set(cc.map(x=>x.dia))]; prob.push(['warn', `Sin cupo de plantilla ${dias.length===1?'el '+fmt(dias[0]):`en ${dias.length} días (del ${fmt(dias[0])} al ${fmt(dias[dias.length-1])})`}: «${esc(cc[0].cupo.nombre||'cupo')}».`]); }
    const bloqueo = prob.some(p=>p[0]==='bad') || (conf.length && !E.forzar);

      <div class="row"><label>Desde<input type="date" value="${d}" min="${CIC()}-01-01" max="${CIC()}-12-31" onchange="UI.ed.desde=this.value;if(UI.ed.hasta&&UI.ed.hasta<this.value)UI.ed.hasta=this.value;render()"></label>
        <label>Hasta<input type="date" value="${h}" min="${d}" max="${CIC()}-12-31" onchange="UI.ed.hasta=this.value;render()"></label>
        <button class="btn" style="align-self:flex-end" onclick="UI.ed.paso='fin';render()">Elegir el final en la hoja</button></div>
      <p style="margin:10px 0 0"><b>${st.computables}</b> día${st.computables===1?'':'s'} de vacaciones${st.descansos?`, sin contar ${st.descansos} de descanso o festivo`:''}. <b>${nf(st.pts*factor(w))}</b> puntos.</p>
      ${prob.map(p=>`<p class="aviso ${p[0]}">${p[1]}</p>`).join('')}
      ${conf.length?`<label class="chk" style="margin-top:8px"><input type="checkbox" ${E.forzar?'checked':''} onchange="UI.ed.forzar=this.checked;render()">Guardar igualmente, aunque no haya cupo</label>`:''}

  } else if(E.accion==='baja'){

        <button class="btn" style="align-self:flex-end" onclick="UI.ed.paso='fin';render()">Elegir el final en la hoja</button></div>

function guardarVacEd(){

  const forz = conflictosCupo(w,d,h).length>0 || companerosEnFechas(w,d,h,E.edit).length>0;

function guardarBajaEd(){
  const E = UI.ed, w = trabDe(UI.edTrab); if(!E||!w) return;
  const d = E.desde, h = E.hasta || E.desde;
  if(S.bajas.some(b=>b.trabajadorId===w.id && d<=b.hasta && h>=b.desde)) return toast('Se solapa con otra baja');

function quitarDiaVac(pid, s){
  const p = S.periodos.find(x=>x.id===pid); if(!p) return;
  if(p.desde===p.hasta) S.periodos = S.periodos.filter(x=>x.id!==pid);
  else if(s===p.desde) p.desde = addDays(s,1);
  else if(s===p.hasta) p.hasta = addDays(s,-1);
  else { S.periodos.push({...p, id:uid(), desde:addDays(s,1)}); p.hasta = addDays(s,-1); }
  UI.ed = null; save(); render(); toast('Día quitado de sus vacaciones');
}
function estadoDia(w, s, vac, dps){
  const t = turnoDia(w, s), mk = marcaDe(w.id, s);
  if(enCese(w,s)) return {k:'ces', t};
  if(dps.has(s)) return {k:'dp', t};
  if(mk) return {k:'mk', t, cod:mk.cod};
  if(t && t.libre) return {k:'lib', t};
  if(vac.has(s)) return {k:'vac', t};
  if(enBaja(w,s)) return {k:'bj', t};
  return {k:'', t};
}
function diasDe(w, y){
  const vac = new Set(), dps = new Set(desprogDe(w.id,y).map(d=>d.dia));

  return {vac, dps};
}

function pdfTexto(str){

function nuevoPDF(){
  const paginas = []; let ops = null;

    pagina(){ ops = []; paginas.push(ops); },
    rect(x,y,w,h,fill,stroke){ if(fill) ops.push(`${hexRGB(fill)} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); if(stroke) ops.push(`${hexRGB(stroke)} RG 0.5 w ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`); },
    texto(x,y,txt,size,{bold=false,color='#22262E',align='left'}={}){
      const w = pdfAncho(txt,size,bold), xx = align==='center' ? x-w/2 : align==='right' ? x-w : x;
      ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${hexRGB(color)} rg ${xx.toFixed(2)} ${y.toFixed(2)} Td (${pdfTexto(txt)}) Tj ET`);
    },
    bytes(W,H){
      const objs = ['<< /Type /Catalog /Pages 2 0 R >>', null,
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
        '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'];
      const kids = [];
      paginas.forEach(p=>{ const cont = p.join('\n'); objs.push(`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`); const c = objs.length;
        objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${c} 0 R >>`); kids.push(objs.length); });
      objs[1] = `<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
      let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const off = [];
      objs.forEach((o,i)=>{ off.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
      out += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      const u8 = new Uint8Array(out.length); for(let i=0;i<out.length;i++) u8[i] = out.charCodeAt(i) & 255; return u8;
    }

}

function cambiarCiclo(v){
  const y = Number(v); if(!(y>2000&&y<2100)) return;
  if(!confirm(`¿Cambiar el ciclo activo a ${y}? Las vacaciones de otros años se conservan. La asignación de vacaciones será la de ${y+1}.`)) return render();
  S.ciclo=y; S.semanaSanta=semanaSantaDefault(y); S.turnos={}; S.asigAnio=y+1; save(); render();
}
function añadirPuente(){
  const nom=document.getElementById('pNom').value.trim(), d=document.getElementById('pDes').value, h=document.getElementById('pHas').value||d;

/* año entero pintado con una rotación: cada día con su turno */
function calendarioRotacion(r, y, ini){
  const cod = s => codEnFecha(r, ini||r.inicio, s);
  const cuenta = {};
  let html = '<div class="fcal">';
  for(let m=0;m<12;m++){
    const mm=String(m+1).padStart(2,'0'), first=`${y}-${mm}-01`, dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(), off=(pd(first).getUTCDay()+6)%7;
    html += `<div class="smes"><div class="smes-t">${MESES[m][0].toUpperCase()+MESES[m].slice(1)}</div><div class="sgrid">${DOW.map(d=>`<span class="sdow">${d}</span>`).join('')}${'<span></span>'.repeat(off)}`;
    for(let d=1; d<=dim; d++){
      const s=`${y}-${mm}-${String(d).padStart(2,'0')}`, c=cod(s), t=tipoTurno(c); if(c) cuenta[c]=(cuenta[c]||0)+1;
      html += `<span class="fd rc ${t&&t.libre?'rlib':''} ${esSS(s)?'ss':''}" style="${t?`--tc:${t.color}`:''}" title="${fmt(s)}: ${t?esc(t.nombre):'trabajo'}${esSS(s)?', Semana Santa':''}${esPuente(s)?', puente':''}">${d}${t?`<i class="tc" style="color:${t.libre?'#fff':t.color}">${esc(t.cod)}</i>`:''}</span>`;
    }
    html += '</div></div>';
  }
  return html + `</div><div class="legend">${S.turnosTipos.filter(t=>cuenta[t.cod]).map(t=>`<span style="--c:${t.color}">${esc(t.cod)} ${esc(t.nombre)}: ${cuenta[t.cod]} días</span>`).join('')}<span style="--c:#fff;outline:1px solid var(--linea)">Sin marcar (trabajo)</span></div>`;
}
function crearGrupoSec(){
  const n=document.getElementById('nGrupo2').value.trim(); if(!n) return toast('Escribe el nombre del grupo');
  const g={id:uid(),nombre:n,depId:S.ctx.dep,prodId:S.ctx.prod,cupoAg:1,cupoSup:1,color:COLORES[S.grupos.length%COLORES.length],rotacionId:rotacionesVis().length===1?rotacionesVis()[0].id:''};
  S.grupos.push(g); UI.gSel=g.id; save(); render(); toast('Grupo creado');
}
function moverAGrupo(ids, gid){
  if(!ids.length) return toast('Marca a alguien en la lista');
  ids.forEach(id=>{ const w=trabDe(id); if(!w || w.grupoId===gid) return;
    Object.values(S.turnos).forEach(t=>Object.values(t.hechos).forEach(a=>{ const i=a.indexOf(id); if(i>=0) a.splice(i,1); }));
    w.grupoId = gid; });
  save(); render(); toast(gid ? `${ids.length} persona(s) en ${nombreGrupo(gid)}` : 'Sacado del grupo');
}
function añadirGrupo(){ const n=document.getElementById('nGrupo').value.trim(); if(!n) return; S.grupos.push({id:uid(),nombre:n,depId:S.ctx.dep,prodId:S.ctx.prod,cupoAg:1,cupoSup:1,color:COLORES[S.grupos.length%COLORES.length]}); save(); render(); document.getElementById('nGrupo')?.focus(); }
function borrarGrupo(id){
  const n = miembros(id).length;
  if(n) return toast(`Hay ${n} persona(s) en este grupo. Muévelas a otro antes de borrarlo.`);
  if(S.cupos.some(c=>c.grupoId===id) && !confirm('Este grupo tiene cupos. Se borrarán también. ¿Seguir?')) return;
  S.grupos=S.grupos.filter(g=>g.id!==id); S.cupos=S.cupos.filter(c=>c.grupoId!==id); delete S.turnos[id]; save(); render();
}

function guardarTrab(){
  const g = id => document.getElementById(id).value;
  const nombre = g('fNombre').trim(); if(!nombre) return toast('Escribe el nombre');
  const datos = { nombre, grupoId:g('fGrupo'), rotacionId:g('fRot'), depId:S.ctx.dep, prodId:S.ctx.prod, skills:[...document.querySelectorAll('.fSkill:checked')].map(x=>x.value), modalidad:g('fMod'), diasContratados:g('fDC'), diasDerecho:Number(g('fDer'))||0, ptsAnt:Number(g('fP1'))||0, ptsAnt2:Number(g('fP2'))||0, antig:g('fAnt') };
  const filas = [...document.querySelectorAll('#fCese .cese-fila')].map(f=>({desde:f.querySelector('.ceD').value, hasta:f.querySelector('.ceH').value})).filter(c=>c.desde||c.hasta);
  if(filas.some(c=>!c.desde||!c.hasta)) return toast('Cada periodo de cese necesita fecha de inicio y de fin');
  if(filas.some(c=>c.hasta<c.desde)) return toast('En un periodo de cese, la fecha de fin es anterior a la de inicio');
  datos.cese = datos.modalidad==='discontinuo' ? filas.sort((a,b)=>a.desde.localeCompare(b.desde)) : [];
  if(UI.editTrab){
    const w = trabDe(UI.editTrab);
    if(w.grupoId!==datos.grupoId) Object.values(S.turnos).forEach(t=>Object.values(t.hechos).forEach(a=>{const i=a.indexOf(w.id); if(i>=0) a.splice(i,1);}));
    Object.assign(w, datos);
  } else S.trabajadores.push({id:uid(), ...datos});
  const id = UI.editTrab; UI.editTrab=null;
  const w2 = id ? trabDe(id) : S.trabajadores[S.trabajadores.length-1];
  if(UI.vista==='personal'){ UI.perNuevo=false; UI.perTrab=w2.id; UI.perModo='ficha'; }
  save(); render();
  toast(ceseDe(w2).length && periodosDe(w2.id).some(p=>solapaCese(w2,p.desde,p.hasta)) ? 'Guardado. Ojo: tiene vacaciones dentro del cese' : 'Trabajador guardado');
}
function borrarTrab(id){
  const t=trabDe(id); if(!confirm(`¿Borrar a ${t.nombre} con sus vacaciones y desprogramaciones de todos los años?`)) return;
  S.marcas = S.marcas.filter(m=>m.trabajadorId!==id); S.bajas = S.bajas.filter(b=>b.trabajadorId!==id); S.transf = S.transf.filter(x=>x.trabajadorId!==id);
  if(UI.perTrab===id) UI.perTrab='';
  S.trabajadores = S.trabajadores.filter(x=>x.id!==id); S.periodos = S.periodos.filter(p=>p.trabajadorId!==id); S.desprog = S.desprog.filter(d=>d.trabajadorId!==id);
  Object.values(S.turnos).forEach(t=>Object.values(t.hechos).forEach(a=>{ const i=a.indexOf(id); if(i>=0) a.splice(i,1); }));
  save(); render();
}
function importarPegado(){
  const txt = document.getElementById('fPega').value.trim(); if(!txt) return;

    const c = l.split(/\t|;/).map(x=>x.trim()); if(!c[0]) return;
    let g = c[1] ? gruposVis().find(x=>x.nombre.toLowerCase()===c[1].toLowerCase()) : null;
    if(c[1] && !g){ g={id:uid(),nombre:c[1],depId:S.ctx.dep,prodId:S.ctx.prod,color:COLORES[S.grupos.length%COLORES.length]}; S.grupos.push(g); }
    const sk = (c[2]||'').split(/[\/+]/).map(x=>x.trim()).filter(Boolean).map(x=>buscaSkill(x)||nuevaSkill(x));
    S.trabajadores.push({id:uid(), nombre:c[0], grupoId:g?.id||'', depId:S.ctx.dep, prodId:S.ctx.prod, skills:sk.map(x=>x.id), modalidad:'completo', diasContratados:'',
      diasDerecho: c[3] ? num(c[3]) : S.ajustes.diasDefecto, ptsAnt:num(c[4]), ptsAnt2:num(c[5]), antig:''});
    n++;

  save(); render(); toast(`${n} trabajador(es) importados`);
}
